openapi: 3.1.0
info:
  title: Salary service V1_1 — Transactional API (prototype A)
  version: V1_1
  description: |-
    Rendering prototype: SOAP operations described as OpenAPI POST operations.

    Every operation of a service version is a POST to the same endpoint URL. The operation is selected by the
    `SOAPAction` header and by the root element inside the SOAP body. The part after `#` in the paths below only
    names the operation; HTTP clients do not send it.

    SOAP 1.1: send `Content-Type: text/xml; charset=utf-8`. The token from the Security service's GetToken goes in
    the SOAP body as the operation's `token` element, not in an HTTP header.

    > **Not yet documented:** example responses (no recorded responses exist yet).
servers:
- url: https://app{server-number}.timelog.com/{account}
  description: 'Your TimeLog site, as in the browser address bar when you are signed in: `https://app[X].timelog.com/[account
    name]`. `server-number` is the number after `app` (for example `3` in `app3.timelog.com`), `account` is the account name
    you use to log in. If your browser shows `https://app.timelog.com`, find your site URL in System Administration > Integrations
    and API > Reporting API settings, under Your TimeLog API URL.'
  variables:
    server-number:
      default: '3'
    account:
      default: your-account
paths:
  /WebServices/Salary/V1_1/SalaryServiceSecure.svc#GetAllowances:
    post:
      operationId: salary-v1_1-getallowances
      summary: List allowance (per-diem) legislations
      description: |-
        Returns the tenant's allowance (per-diem) legislations (ID and name).

        The legislations are the country rule sets used for employees' travel allowances. Only the ID and name are
        returned, ordered by ID; the country code, legislation type and allowance rates are not. The list is not paged.
        When the tenant has no legislations, `ResponseState` is `Success` and `Return` is empty.

        Use it to pick the allowance legislation ID for employees created from an HR system.
      parameters:
      - name: SOAPAction
        in: header
        required: true
        description: Selects the operation.
        schema:
          type: string
          enum:
          - http://www.timelog.com/api/tlp/v1_1/SalaryService/GetAllowances
      requestBody:
        required: true
        description: A SOAP 1.1 envelope whose body holds a `GetAllowances` element with the `token` from GetToken.
        content:
          text/xml:
            schema:
              type: string
            example: |-
              <soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/"
                                xmlns:v1_1="http://www.timelog.com/api/tlp/v1_1"
                                xmlns:v1_3="http://www.timelog.com/api/tlp/v1_3">
                <soapenv:Body>
                  <v1_1:GetAllowances>
                    <v1_1:token>
                      <v1_3:Initials>{Initials from GetToken}</v1_3:Initials>
                      <v1_3:Expires>{Expires from GetToken, unchanged}</v1_3:Expires>
                      <v1_3:Hash>{Hash from GetToken}</v1_3:Hash>
                    </v1_1:token>
                  </v1_1:GetAllowances>
                </soapenv:Body>
              </soapenv:Envelope>
      responses:
        '200':
          description: |-
            A SOAP envelope whose body holds `GetAllowancesResponse` / `GetAllowancesResult`. Errors are also
            returned with HTTP 200: check `ResponseState` first, then `ErrorCode`.
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/ResponseOfAllowance'
  /WebServices/Salary/V1_1/SalaryServiceSecure.svc#GetAllSalaryCodes:
    post:
      operationId: salary-v1_1-getallsalarycodes
      summary: List salary codes
      description: |-
        Returns every salary code of the tenant (active and inactive) with its salary-account posting rules.

        Salary codes are the codes that time is posted under on the salary accounts: the system codes for normal
        working time and project time, and the tenant's supplement and paid-out codes. Each code carries its name,
        salary account, posting factor and sign, time-tracking format and specification type. Factors are
        multipliers, not money. The list is not paged and is ordered by code, shorter codes first.

        On V1_1 the `salaryCodeStatus` value is not applied: every call returns active and inactive codes. Filter on
        `IsActive` yourself, and send `All` so the request states what the response contains.

        Use it to map TimeLog salary codes to the wage types of a payroll system.
      parameters:
      - name: SOAPAction
        in: header
        required: true
        description: Selects the operation.
        schema:
          type: string
          enum:
          - http://www.timelog.com/api/tlp/v1_1/SalaryService/GetAllSalaryCodes
      requestBody:
        required: true
        description: |-
          A SOAP 1.1 envelope whose body holds a `GetAllSalaryCodes` element with `salaryCodeStatus`
          (`All`, `Active` or `Inactive`; not applied on V1_1) and the `token` from GetToken.
        content:
          text/xml:
            schema:
              type: string
            example: |-
              <soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/"
                                xmlns:v1_1="http://www.timelog.com/api/tlp/v1_1"
                                xmlns:v1_3="http://www.timelog.com/api/tlp/v1_3">
                <soapenv:Body>
                  <v1_1:GetAllSalaryCodes>
                    <v1_1:salaryCodeStatus>All</v1_1:salaryCodeStatus>
                    <v1_1:token>
                      <v1_3:Initials>{Initials from GetToken}</v1_3:Initials>
                      <v1_3:Expires>{Expires from GetToken, unchanged}</v1_3:Expires>
                      <v1_3:Hash>{Hash from GetToken}</v1_3:Hash>
                    </v1_1:token>
                  </v1_1:GetAllSalaryCodes>
                </soapenv:Body>
              </soapenv:Envelope>
      responses:
        '200':
          description: |-
            A SOAP envelope whose body holds `GetAllSalaryCodesResponse` / `GetAllSalaryCodesResult`. Errors are also
            returned with HTTP 200: check `ResponseState` first, then `ErrorCode`.
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/ResponseOfSalary'
components:
  schemas:
    ExecutionStatus:
      type: string
      description: Outcome of the call. Branch on this first, then on `ErrorCode`.
      enum: [NotSet, Success, Invalid, Error]
    ResponseFields:
      type: object
      properties:
        ReturnTypeDescription:
          type: string
          description: Name of the payload type, as a label. Informational.
        ResponseState:
          $ref: '#/components/schemas/ExecutionStatus'
        ErrorCode:
          type: integer
          description: Error code when `ResponseState` is not `Success`.
        IsReturnPaged:
          type: boolean
          description: '`true` when the operation paged the result; `false` here.'
    Allowance:
      type: object
      xml:
        name: Allowance
      properties:
        Id:
          type: integer
          description: Allowance legislation ID — the value for an employee's allowance legislation.
        Name:
          type: string
          description: Description of the legislation.
    ResponseOfAllowance:
      allOf:
      - $ref: '#/components/schemas/ResponseFields'
      - type: object
        properties:
          Return:
            type: array
            description: The legislations. Empty on error.
            xml:
              wrapped: true
            items:
              $ref: '#/components/schemas/Allowance'
    Salary:
      type: object
      xml:
        name: Salary
      properties:
        SalaryCodeID:
          type: integer
        SalaryCodeGuid:
          type: string
          format: uuid
        Code:
          type: string
        Name:
          type: string
        Description:
          type: string
        IsActive:
          type: boolean
        IsSystemSalaryCode:
          type: boolean
        SalaryCodeSystemType:
          type: string
          enum: [NormalWorkingTime, ProjectTime]
        SalaryAccountID:
          type: integer
        SalaryAccountFactor:
          type: number
          description: Posting factor (a multiplier, not money).
        SalaryAccountFactorEffect:
          type: string
          enum: [Substract, Add]
          description: Posting sign. The value `Substract` is spelled this way on the wire.
        FlexPositiveFactor:
          type: number
        TimeTrackingFormat:
          type: string
          enum: [Hours, FullDay, HalfDay, YesNo, Count]
        SalarySpecificationType:
          type: string
          enum: [SalaryTime, Supplement, PaidOut]
    ResponseOfSalary:
      allOf:
      - $ref: '#/components/schemas/ResponseFields'
      - type: object
        properties:
          Return:
            type: array
            description: The salary codes. Empty on error.
            xml:
              wrapped: true
            items:
              $ref: '#/components/schemas/Salary'
