                properties:
                  Properties:
                    $ref: '#/components/schemas/ProjectExpenseRead'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
                  Actions:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafAction'
        '400':
          description: |-
            - **Code 200** — The request body or parameters failed input validation. — When: Body validator: ProjectID / PaymentMethodID / ExpenseTypeID / ProjectSubContractID ≤ 0, invalid PurchaseDate, empty ExpenseCurrencyISO, both ProfitRatio and SalesPriceAmountProjectCurrency, too many decimals (captured with an empty body). — Fix: Fix every item listed in Details and resend.

            - **Code 400** — ProjectExpenseExchangeRate was omitted (or 0) and the currency matrix has no intercompany rate for PurchaseDate between the purchase currency and the caller's (first message) or the project's (second message) legal-entity currency. Not raised by the validate route. — Fix: Send ProjectExpenseExchangeRate, or maintain the intercompany exchange rate for the date.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '500':
          description: |-
            - **Code 100** — Unhandled server error.

            - **Code 37014** — The projectID in the path (update, update-status) or ProjectID in the payment body does not exist (0 and negative included). Not a 404. — When: ProjectID does not exist (adapter, first business rule). — Fix: Use a ProjectID from `GET /v1/project/get-all`.

            - **Code 30020** — ExpenseCurrencyISO is not a currency abbreviation known to the tenant. Raised by the adapter before any other business rule. — Fix: Send a CurrencyABB from GET /v1/currency.

            - **Code 37019** — ExpenseTypeID does not exist. — Fix: Use an expense type ID of the owner's legal entity.

            - **Code 37689** — The project is inactive. — Fix: Use an active project.

            - **Code 31140** — The contract the expense is booked on is fixed-price and IsBillable is false. — Fix: Send IsBillable true for fixed-price contracts.

            - **Code 37021** — SupplierID (> 0) is not an existing CRM customer. — Fix: Send 0 / null, or a customer ID with a supplier status.

            - **Code 37940** — SupplierID is a CRM customer whose status is not shown in suppliers. — Fix: Give the customer a supplier status, or choose another supplier.

            - **Code 37018** — PaymentMethodID does not exist. — Fix: Use an existing payment method ID.

            - **Code 37042** — ProjectSubContractID (> 0) is not a contract of ProjectID (or does not exist). — Fix: Send a contract of the same project, or 0 / omit it to use the project's default contract.

            - **Code 37699** — Date falls in a closed accounting period of the owner's employee projection. — When: PurchaseDate in a closed accounting period of the CALLER. — Fix: Use a date in an open period.

            - **Code 37806** — The resolved contract is closed. — Fix: Book on an open contract.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: Null body (captured)
                  value:
                    Code: 100
                    Details: []
                    Message: Unknown error occur in system, please contact system administrator.
                    Parameters: 'createModel: null'
                    Url: https://{your-timelog-host}/{tlp-virtual-directory}/api/v1/project-expense
