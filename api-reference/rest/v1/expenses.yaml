    post:
      operationId: createProjectExpense
      summary: Create a project expense
      description: |-
        Books a company cost (supplier invoice, purchase, subcontractor) on a project contract, with its cost and the price to re-invoice, and returns it.

        Creates a PROJECT expense: a cost the company paid on a project — typically one line of a supplier invoice — as opposed to an employee's out-of-pocket expense. You send the cost INCLUDING VAT and the VAT in the purchase currency, the project and contract (no default contract is chosen for you), the expense type and payment method, and either a sales price in project currency or a profit ratio (neither = sold at cost). TimeLog stores the net cost in purchase, project and system currency, derives the sales price, and — when IsBillable is true — makes it available for invoicing on the contract. The expense is always registered as the CALLER's (no UserID); the response is the stored expense (ProjectExpenseRead). Attach the supplier-invoice PDF in a second call.

        **Use it to:**
        - BPP / purchase-invoice automation (e.g. a document-capture or AP add-on for Business Central) posting each project-related supplier-invoice line as a project cost, then attaching the invoice PDF
        - ERP purchase-order receipt booked as a billable project cost with a mark-up (ProfitRatio) or a fixed resale price (SalesPriceAmountProjectCurrency)
        - Re-invoicing a third-party cost to the customer at a negotiated price (amount 0 + sales price = pure resale line)

        **Not for:**
        - An employee's own outlay to be reimbursed — `POST /v1/employee-expense`
        - Mileage — `POST /v1/mileage-registration`
        - Pre-checking without saving — `POST /v1/project-expense/validate-project-expense` (which skips the licence and exchange-rate checks)

        **Rules across fields:**
        - R1: Send at most one of ProfitRatio and SalesPriceAmountProjectCurrency.
        - R2: ProjectSubContractID must be an open contract of ProjectID.
        - R3: IsBillable must be true when the contract is fixed-price.
        - R4: Without ProjectExpenseExchangeRate, the currency matrix must hold an intercompany rate for PurchaseDate (purchase currency → caller's and project's legal-entity currency).
        - R5: PurchaseDate must not be in a closed accounting period of the CALLER's employee projection.

        **Behaviour:**
        - Not idempotent.
        - Not safe to retry blindly. Each call creates a new expense with a new GUID; ExternalID is not deduplicated. After a lost response, list the project's expenses and match ExternalID before retrying.
        - Side effect: Recalculates the project's estimation figures for the expense (TSP_EstimationRecalculate_Expense).
        - Side effect: Writes registration currency data for the expense, raises the ProjectExpenseCreated event and invalidates the project and expense caches.
        - Side effect: When the payment method is the employee's own money, the cost is also recorded as a reimbursement to the caller.
        - On failure: No transaction wraps the insert and the follow-up writes; a failure after the insert (currency data, read-back) returns 500 while the expense row stays (src_only).
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v1/contract`, `GET /v1/expense-type/all/list`, `GET /v1/currency/{status}`, `POST /v1/project-expense/validate-project-expense`

        **Next:** `GET /v1/project-expense/{expenseID}`

        **See also:** `POST /v1/employee-expense`

        > **Not yet documented:** errors; examples.
      tags:
      - Expenses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectExpenseCreate'
      responses:
        '200':
          description: |-
            The object, wrapped in the TAF envelope (`Properties`). The created expense, read back through GET /v1/project-expense/{id} (no attachments yet).

            Order: none

            Empty result: none
          content:
            application/json:
