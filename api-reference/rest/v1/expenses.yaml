    post:
      operationId: attachEmployeeExpenseImage
      summary: Attach receipt images to an employee expense
      description: |-
        Uploads one or more receipt images (JPEG, PNG, GIF, BMP, TIFF …) to an existing employee expense.

        The receipt write path for images. Send multipart/form-data with one part per image; every part is treated as a file (no form fields). Each part must decode as an image, else the whole call fails and nothing is stored. The files go to TimeLog's Azure blob storage under a random name and are appended to the expense's attachment list; the response is JSON null — GET the expense to obtain the (15-minute) download URLs in ImageUrls. PDFs go to the file endpoint. The expense must already exist: create it first, then attach.

        **Use it to:**
        - Receipt-capture / OCR app uploading the photographed receipt right after creating the expense
        - ERP or card-provider integration (e.g. a Business Central expense add-on) pushing the receipt image of a card transaction it booked on behalf of the employee

        **Not for:**
        - PDF receipts — `POST /v1/employee-expense/{employeeExpenseID}/file`
        - Replacing a receipt — delete it (deleteimage) and attach the new one; attach only appends

        **Behaviour:**
        - Not idempotent.
        - Not safe to retry blindly. Each call appends new blobs under new random names; a retried upload stores the receipt twice. After a lost response, GET the expense and compare ImageUrls before retrying.
        - Duplicates: Not deduplicated: the same image uploaded twice becomes two attachments.
        - Side effect: Uploads each image to the tenant blob container (tlp-<CustomerProductId>) as EmployeeExpense-<random GUID>.<format>; no Content-Type is set on image blobs.
        - Side effect: Rewrites the expense's attachment list (ImageAsJson) with the new private URLs; refreshes the cached expense.
        - On failure: All parts are decoded before any upload, so an invalid part stores nothing. A storage or DB failure after some uploads leaves orphan blobs that are not in the attachment list (src_only).
        - Changes are visible to the next read immediately.
        - Batch: For validation: one bad part rejects the call. Not transactional for storage failures (see side_effects_on_failure).

        **Call first:** `POST /v1/employee-expense`

        **Next:** `GET /v1/employee-expense/{employeeExpenseID}`

        **See also:** `POST /v1/employee-expense/{employeeExpenseID}/file`, `DELETE /v1/employee-expense/{employeeExpenseID}/image`

        > **Not yet documented:** behaviour → side effects on failure; examples; request → body → multipart → formats.
