        - Not idempotent.
        - A second delete of the same ID fails with 500 Code 100 (row gone).
        - Safe to retry only under a condition. Safe in effect — a retry after success fails with Code 100 but changes nothing.
        - Side effect: Deletes the registration, its financial data, invoicing potential and employee reimbursement postings; recalculates the contract's estimated values; clears the cache.
        - Side effect: Path (b): deletes the linked travel-time registration in the same transaction.
        - Changes are visible to the next read immediately.
        - Path (a) runs in one transaction scope; path (b) inside the time-registration delete transaction.

