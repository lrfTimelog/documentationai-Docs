        Project:
          $ref: '#/components/schemas/ProjectHeaderRead'
          readOnly: true
          description: The project header with its customer. Filled only with $expand=project; null otherwise.
        Car:
          $ref: '#/components/schemas/CarRead'
          readOnly: true
          description: The car. Filled only with $expand=car on GET /{id}; null otherwise (the list procedure cannot expand
            it).
        MileageRate:
          $ref: '#/components/schemas/MileageRateRead'
          readOnly: true
          description: The mileage rate (incl. UnitType and ReimbursementCurrencyID). Filled only with $expand=mileageRate
            on GET /{id}; null otherwise.
        TravelTimeRegistration:
          $ref: '#/components/schemas/TravelTimeRegistrationRead'
          readOnly: true
          description: The linked travel-time registration (task, hours, minutes), always joined when TimeRegistrationID is
            set — no $expand needed; null when there is none.
      description: 'A mileage (car travel) registration: the trip (date, purpose, addresses, one-way distance, round-trip
        flag, odometer readings), the project and contract it is booked on, the owner (UserID), car and mileage rate, approval
        / invoicing state, and the optional linked travel-time registration. Money is not on this object — the reimbursement
        and invoice amounts are derived from TotalDistance and the mileage rate''s period rates. Nested Project, Car and MileageRate
        are filled only on $expand. Each entity carries a self link to GET /v1/mileage-registration/{id} and the mileage TAF
        actions.'
    MileageRegistrationUpdate:
      type: object
      properties:
        MileageRegistrationID:
          type: integer
          format: int32
          x-timelog-identity:
            role: primary_id
            unique_scope: tenant
            id_format: int
          description: |-
            The registration to update.

            Identifier of this object, unique per TimeLog site.

            - 0 — 400, Code 200.

            - unknown or negative — 500, Code 100.
        Date:
          type: string
          format: date-time
          description: |-
            The trip date.

            Time zone: not yet documented.

            - in a closed accounting period of the owner — 37827.

            - no rate period of MileageRateID covers it — 37845.

            > **Not yet documented:** constraints → timezone.
        Purpose:
          type: string
          maxLength: 255
          description: |-
            Why the trip was made.

            - omitted, empty or whitespace — Not checked by the 400 validator; the domain raises 60107 (HTTP 500, Code 102).
        OdometerStart:
          type:
          - integer
          - 'null'
          format: int32
          description: |-
            Odometer reading at the start (km). Omitting it clears the stored value.

            Null: null / omitted = cleared

            Unit: km
        OdometerEnd:
          type:
          - integer
          - 'null'
          format: int32
          description: |-
            Odometer reading at the end (km). Omitting it clears the stored value.

            Null: null / omitted = cleared

            Unit: km

            - both odometers sent, ShowOdometer and OdometerIsRequired on, and Distance × (IsRoundtrip ? 2 : 1) ≠ OdometerEnd − OdometerStart — 60100.
        Distance:
          type: integer
          format: int32
          minimum: 1
          description: |-
            One-way distance in whole km. TotalDistance is recalculated (× 2 when IsRoundtrip).

            Unit: km

            - ≤ 0 or omitted — The update validator's NotNull on an int never fires; the domain raises 60103 (HTTP 500, Code 102), not 400 as on create.

            Range: min 1.
        StartAddress:
          type: string
          maxLength: 255
          description: Where the trip started.
        EndAddress:
          type: string
          maxLength: 255
          description: Where the trip ended.
        ProjectID:
          type: integer
          format: int32
          x-timelog-identity:
            role: reference
          description: |-
            The project. Changeable, but the stored contract is NOT re-resolved.

            Refers to `ProjectHeaderRead.ProjectID`. Look up valid values with `GET /v1/project-header/search-for-expense-travel-registration-order-by-recent-registration`.

            - changed to another project — ProjectSubContractID keeps the old project's contract; the contract rule only checks that contract is not closed (37846).

            Valid values come from `GET /v1/project-header/search-for-expense-travel-registration-order-by-recent-registration`.
        CarID:
          type: integer
          format: int32
          x-timelog-identity:
            role: reference
          description: |-
            The car used. A personal car must belong to the registration's owner.

            Refers to `CarRead.CarID`. Look up valid values with `GET /v1/car`.

            - personal car of another employee — 37932.

            Valid values come from `GET /v1/car`.
        MileageRateID:
          type: integer
          format: int32
          x-timelog-identity:
            role: reference
          description: |-
            The mileage rate (returned as MileageRatesID on reads). Must have a rate period covering Date.

            Refers to `MileageRateRead.MileageRateID`. Look up valid values with `GET /v1/mileage-rate`.
        IsRoundtrip:
          type: boolean
          default: false
          description: true = there and back (TotalDistance = Distance × 2).
        IsBillable:
          type: boolean
          default: false
          description: Whether the mileage is invoiced to the customer.
        TravelTimeRegistration:
          $ref: '#/components/schemas/TravelTimeRegistrationWrite'
          description: |-
            Optional travel time to create or update together with the mileage.

            - sent and the mileage already has a travel-time registration — That time registration is updated (task, hours, date, comment) BEFORE the mileage is validated; on a mileage failure it is re-saved with its previous values.

            - sent and the mileage has none — A new travel-time registration is created and linked; deleted again if the mileage save fails.

            - sent together with ?deleteTravelTimeRegistration=true — The body wins; the query flag is ignored.

            - omitted — An existing travel-time registration is left unchanged (unless ?deleteTravelTimeRegistration=true).
      description: 'The new state of an existing, unapproved, uninvoiced mileage registration addressed by MileageRegistrationID.
        Send every field (read the registration first): this is a replacement, not a patch.'
    PaymentMethodRead:
      type: object
      properties:
        PaymentMethodID:
          type: integer
          format: int32
          readOnly: true
          x-timelog-identity:
            role: primary_id
            unique_scope: tenant
            uniqueness_enforced: true
            id_format: int
          description: |-
            Integer identifier. Send it as PaymentMethodID on employee and project expenses.

            Identifier of this object, unique per TimeLog site.
        Name:
          type: string
          readOnly: true
          description: Display name as entered by the administrator (not localized). The list is ordered by it. Empty string
            when null.
        IsPaidByEmployee:
          type: boolean
          readOnly: true
          description: '"Reimburse employee": the employee paid out of pocket and is reimbursed. false = paid by the company
            (company card, supplier invoice, …).'
        IsDefaultForEmployeeExpense:
          type: boolean
          readOnly: true
          description: Preselected payment method for new employee expenses.
        IsDefaultForProjectExpense:
          type: boolean
          readOnly: true
          description: Preselected payment method for new project expenses.
        IsActive:
          type: boolean
          readOnly: true
          description: |-
            Whether the method can be chosen on new expenses. A default method cannot be deactivated in the UI. Filter with the {status} segment.

            Filterable via `status (path)` (eq).
        IsDefaultForImport:
          type: boolean
          readOnly: true
          description: |-
            Default payment method for imported expenses.

            > **Not yet documented:** description.
        IsPersonalCreditCard:
          type: boolean
          readOnly: true
          description: '"Personal credit card": the method is a company card assigned to one user (CreditCardEmployeeUserID).'
        CreditCardEmployeeUserID:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          x-timelog-identity:
            role: reference
          description: |-
            User the personal credit card belongs to; null for shared methods. The list only returns cards of the caller.

            Refers to `UserRead.UserID`. Look up valid values with `GET /v1/user`.
      description: 'A payment method: how an expense was paid. It decides whether the employee is reimbursed (IsPaidByEmployee)
        and which method is preselected for employee expenses, project expenses and expense import. A method can be a PERSONAL
        credit card assigned to one user; those are only listed to that user.'
    ProductNumberRead:
      type: object
      properties:
        ProductNumberID:
          type: integer
          format: int32
          readOnly: true
          x-timelog-identity:
            role: primary_id
            unique_scope: tenant
            uniqueness_enforced: true
            id_format: int
          description: |-
            Integer identifier of the product number.

            Identifier of this object, unique per TimeLog site.

            The list is ordered by this ID, descending.
        ProductNumber:
          type: string
          readOnly: true
          maxLength: 50
          description: |-
            The product number code as used in the finance system (free text, up to 50 characters).

            > **Not yet documented:** identity.
        ProductName:
          type: string
          readOnly: true
          maxLength: 255
          description: Display name. Empty string when null.
        Description:
          type: string
          readOnly: true
          maxLength: 255
          description: Free-text description. Empty string when null.
        UseVAT:
          type: boolean
          readOnly: true
          description: Whether VAT applies to lines with this product number.
        VATPercentage:
          type: number
          format: double
          readOnly: true
          description: |-
            VAT rate in PERCENT (25.0 = 25 %). 0 when UseVAT is false (captured).

            Unit: percent

            > **Not yet documented:** constraints → unit.
        IsActive:
          type: boolean
          readOnly: true
          description: Whether the product number can be used. The list returns active and inactive numbers (no filter).
        ProductNumberGuid:
          type: string
          format: uuid
          readOnly: true
          x-timelog-identity:
            role: alternate_key
            unique_scope: tenant
            uniqueness_enforced: unknown
            id_format: guid
          description: |-
            GUID of the product number. Not used by other REST v1 operations.

            Alternate key, unique per TimeLog site.

            > **Not yet documented:** identity → uniqueness enforced.
        LegalEntityID:
          type: integer
          format: int32
          readOnly: true
          x-timelog-identity:
            role: reference
          description: |-
            Legal entity the product number belongs to (default 1).

            Refers to `LegalEntityRead.LegalEntityID`. Look up valid values with `GET /v1/legal-entity`.
      description: 'A product number: a finance / invoicing code with a name, a VAT setting and a legal entity. Invoice lines
        and catalogue products (ProjectProductRead.ProductNumberID) reference it. It carries no price.'
    ProjectExpenseCreate:
      type: object
      properties:
        ProjectID:
          type: integer
          format: int32
          x-timelog-identity:
            role: reference
          description: |-
            The project the cost is booked on. Must exist (37014) and be active (37689).

            Refers to `ProjectRead.ProjectID`.

            - ≤ 0 — 400 Code 200 "'Project ID' must be greater than '0'."

            - unknown ID — 37014 (adapter, before any other business rule).

            - inactive project — 37689.

            > **Not yet documented:** values → lookup op.
        ProjectSubContractID:
          type: integer
          format: int32
          x-timelog-identity:
            role: reference
          description: |-
            The contract of ProjectID the cost is booked on. Required — there is NO default-contract resolution for project expenses.

            Refers to `ContractRead.ContractID`. Look up valid values with `GET /v1/contract`.

            - ≤ 0 — 400 Code 200.

            - not a contract of ProjectID — 37042.

            - contract closed — 37806.

            - fixed-price contract and IsBillable false — 31140.

            Unlike employee expenses, a project expense is NOT checked for an inactive (non-closed) or prepaid-services contract, and the project's default-for-expenses contract is never used: the adapter marks the expense as a data import, which sends ExpenseProjectIsValid down the explicit-contract branch.

            Valid values come from `GET /v1/contract`.
        PurchaseDate:
          type: string
          format: date-time
          description: |-
            The purchase / supplier-invoice date.

            Date only — no time component.

            - omitted or outside SQL datetime range — 400 "Purchase date is not valid date."

            - a time component is sent — NOT truncated: stored in a SMALLDATETIME (minute precision). Send a date without time — the per-day expense totals match on the exact value.

            Must not fall in a closed accounting period of the CALLER's employee projection (37699) — the caller, because the caller is the expense's employee.
        PaymentMethodID:
          type: integer
          format: int32
          x-timelog-identity:
            role: reference
          description: |-
            How the cost was paid. A payment method flagged as the employee's own money makes the expense reimbursable to the caller.

            Refers to `PaymentMethodRead.PaymentMethodID`.

            - ≤ 0 — 400 Code 200.

            - unknown ID — 37018.

            > **Not yet documented:** values → lookup op.
        ExpenseTypeID:
          type: integer
          format: int32
          x-timelog-identity:
            role: reference
          description: |-
            The expense type (cost category). Drives the product number on the invoice line when product numbers are active.

