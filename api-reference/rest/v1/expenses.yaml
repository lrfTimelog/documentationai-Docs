  /v1/employee-expense/{employeeExpenseID}:
    delete:
      operationId: deleteEmployeeExpense
      summary: Delete an employee expense
      description: |-
        Deletes an unapproved, uninvoiced employee expense together with all its receipt files.

        Permanently removes the expense and deletes every attached receipt from blob storage. Only the expense's employee, or a user with the 'all registrations' privilege, may delete it. Approved, invoiced, closed-period and completed-project / completed-contract expenses are refused, and all violated rules are reported together.

        **Use it to:**
        - Expense app withdrawing a draft expense
        - Integration rolling back an expense it created in error before approval

        **Not for:**
        - Removing only a receipt — `DELETE /v1/employee-expense/{employeeExpenseID}/image` / deletefile

        **Behaviour:**
        - Not idempotent.
        - A second delete of the same ID fails with 500 Code 100 (the expense no longer exists).
        - Safe to retry only under a condition. Retry after a lost response only after checking with GET that the expense still exists (a 500 Code 100 on retry means the first call succeeded).
        - Duplicates: n/a
        - Side effect: Deletes every receipt blob of the expense, then the expense row; invalidates the expense and project caches.
        - On failure: Blobs are deleted one by one BEFORE the row: a failure mid-way (storage or SQL) returns 500 with some or all receipt files already gone while the expense remains, its attachment list still pointing at them (src_only).
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v1/employee-expense`, `GET /v1/employee-expense/{employeeExpenseID}`

        **See also:** `DELETE /v1/employee-expense/{employeeExpenseID}/image`, `DELETE /v1/employee-expense/{employeeExpenseID}/file`

        > **Not yet documented:** examples.
      tags:
      - Expenses
      parameters:
      - name: employeeExpenseID
        in: path
        required: true
        schema:
          type: integer
          format: int32
        description: The expense's integer ID.
      responses:
        '200':
          description: |-
            Success without content: HTTP 200 with the literal JSON body `null`. Body is the JSON literal null.

            Order: none

            Empty result: none
          content:
            application/json:
              schema:
                type: 'null'
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '404':
          description: '- The URL did not match any route (including a route constraint such as {id:int} receiving a non-integer).
            — When: employeeExpenseID is not an integer (captured).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '500':
          description: |-
            - **Code 100** — Unhandled server error.

            - **Code 37681** — The caller is not the expense's employee and lacks the privilege RegistrationAllRegistrations. Department / legal-entity registration privileges are NOT enough here (unlike create and get). — Fix: Delete as the owner, or with a user holding 'all registrations'.

            - **Code 37703** — The expense is approved (Status = Approved).

            - **Code 37701** — The expense has been invoiced or vouchered.

            - **Code 37702** — The expense date lies in a closed accounting period of the owner's employment.

            - **Code 38004** — The expense's project has order status Completed.

            - **Code 38005** — The expense's contract has status Completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: Approved expense — captured on the v2 route, identical controller code
                  value:
                    Code: 102
                    Details:
                    - Message: This expense is approved by the manager.
                      ErrorCode: 37703
                    Message: Business rules exception.
                    Parameters: 'employeeExpenseID: 1'
                    Url: https://{your-timelog-host}/{tlp-virtual-directory}/api/v2/employee-expense/1
