        ProjectID:
          type: integer
          format: int32
          readOnly: true
          x-timelog-identity:
            role: reference
          description: |-
            The project the cost is booked on.

            Refers to `ProjectRead.ProjectID`.

            Filterable via `projectID (list-by-project only)` (eq).
        EmployeeID:
          type: integer
          format: int32
          readOnly: true
          x-timelog-identity:
            role: reference
          description: |-
            EMPLOYEE ID, not a UserID, of the user who registered the cost — through the API always the caller.

            Refers to `UserRead.UserID`.

            Contains personal data.

            > **Not yet documented:** identity → references.
