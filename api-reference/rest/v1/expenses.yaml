      summary: Delete a mileage registration
      description: |-
        Deletes an unapproved, uninvoiced mileage registration — by default together with its linked travel-time registration.

        Deletes the registration, its financial data, invoicing potential and employee reimbursement posting. When a travel-time registration is linked, it is deleted too unless ?ignoreTravelTimeRegistration=true (then only the mileage goes; the time registration stays). Answers 200 with a JSON null body.

