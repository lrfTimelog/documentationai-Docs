  /v1/employee-expense/{employeeExpenseID}/image:
    delete:
      operationId: deleteEmployeeExpenseImage
      summary: Delete receipt images from an employee expense
      description: |-
        Removes one or more receipt attachments from an employee expense and deletes the files from storage.

        Pass each attachment to remove as an imageUrl query parameter (repeat it for several). Use the URLs exactly as returned in ImageUrls / FileUrls of the expense — the SAS query string may stay on, it is stripped before matching. URLs are processed one at a time: each is deleted from blob storage and the attachment list is saved before the next, so a failure part-way keeps the earlier deletions. Despite the name, this route also deletes PDFs.

        **Use it to:**
        - Expense app letting the employee remove a wrong receipt photo before submitting
        - Receipt integration replacing a receipt: delete the old URL, then attach the new image

        **Not for:**
        - Deleting the whole expense — `DELETE /v1/employee-expense/{employeeExpenseID}` (also removes every receipt)

        **Behaviour:**
        - Not idempotent.
        - Repeating a successful call fails with 37684 (the URL is no longer on the expense).
        - Safe to retry only under a condition. After a lost response, GET the expense: a URL that is gone was deleted.
        - Duplicates: A URL repeated in one call fails on its second occurrence (37684) after the first was deleted.
        - Side effect: Deletes the blob (DeleteIfExists) and rewrites the expense's attachment list without it, per URL; refreshes the cached expense.
        - On failure: URLs before the failing one stay deleted (each is saved separately).
        - On failure: The blob is deleted before the list is saved: if the DB update fails the list still points at a deleted file (src_only).
        - Changes are visible to the next read immediately.
        - Batch: partial

        **Call first:** `GET /v1/employee-expense/{employeeExpenseID}`

        **Next:** `POST /v1/employee-expense/{employeeExpenseID}/image`

        **See also:** `DELETE /v1/employee-expense/{employeeExpenseID}/file`

        > **Not yet documented:** examples.
      tags:
      - Expenses
      parameters:
      - name: employeeExpenseID
        in: path
        required: true
        schema:
          type: integer
          format: int32
        description: The expense.
      - name: imageUrl
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            format: uri
        description: |-
          An attachment URL of this expense (from ImageUrls or FileUrls), URL-encoded. Repeat the parameter for several. Matched on scheme + host + path; the query string (SAS) is ignored.

          Default: none — the call then does nothing and returns 200
      responses:
        '200':
          description: |-
            Success without content: HTTP 200 with the literal JSON body `null`. Body is the JSON literal null.

            Order: none

            Empty result: none
          content:
            application/json:
              schema:
                type: 'null'
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '404':
          description: '- The URL did not match any route (including a route constraint such as {id:int} receiving a non-integer).
            — When: employeeExpenseID is not an integer (captured).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '500':
          description: |-
            - **Code 37684** — A fileUrl / imageUrl (compared without its query string) is not in the expense's attachment list. — When: An imageUrl is not an attachment of this expense — or any storage / DB failure during its deletion. — Fix: Send a URL taken from the expense's ImageUrls / FileUrls (GET /v1/employee-expense/{id}); the SAS query string may stay on.

            - **Code 100** — Unhandled server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
