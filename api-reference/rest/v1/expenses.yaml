    post:
      operationId: attachEmployeeExpenseFile
      summary: Attach PDF receipts to an employee expense
      description: |-
        Uploads one or more PDF receipts to an existing employee expense.

        The receipt write path for PDFs (e.g. e-mailed invoices or receipts). Send multipart/form-data with one part per PDF; every part is treated as a file. Each part must carry a PDF signature, else the whole call fails and nothing is stored. Files are stored in TimeLog's Azure blob storage under a random name with Content-Type application/pdf and appended to the expense's attachment list; the response is JSON null — GET the expense for the (15-minute) download URLs in FileUrls.

        **Use it to:**
        - Integration forwarding a supplier's PDF invoice as the receipt of an expense it created
        - Expense app attaching an e-mailed PDF receipt

        **Not for:**
        - Images — `POST /v1/employee-expense/{employeeExpenseID}/image`

        **Behaviour:**
        - Not idempotent.
        - Not safe to retry blindly. Each call appends new blobs; a retry stores the PDF twice. GET the expense and compare FileUrls before retrying.
        - Duplicates: Not deduplicated.
        - Side effect: Uploads each PDF to the tenant blob container as EmployeeExpense-<random GUID>.pdf with Content-Type application/pdf.
        - Side effect: Rewrites the expense's attachment list (ImageAsJson) with the new private URLs; refreshes the cached expense.
        - On failure: All parts are checked before any upload, so an invalid part stores nothing. A storage or DB failure after some uploads leaves orphan blobs (src_only).
        - Changes are visible to the next read immediately.
        - Batch: For validation only; not transactional for storage failures.

        **Call first:** `POST /v1/employee-expense`

        **Next:** `GET /v1/employee-expense/{employeeExpenseID}`

        **See also:** `POST /v1/employee-expense/{employeeExpenseID}/image`, `DELETE /v1/employee-expense/{employeeExpenseID}/file`

        > **Not yet documented:** examples; request → body → multipart → formats.
      tags:
      - Expenses
      parameters:
      - name: employeeExpenseID
        in: path
        required: true
        schema:
          type: integer
          format: int32
        description: The expense to attach to.
      responses:
        '200':
          description: |-
            Success without content: HTTP 200 with the literal JSON body `null`. Body is the JSON literal null. The new files appear in FileUrls of GET /v1/employee-expense/{id}.

            Order: none

            Empty result: none
          content:
            application/json:
              schema:
                type: 'null'
        '400':
          description: '- **Code 400** — The multipart body has no parts. — Fix: Add at least one part carrying the file bytes.'
