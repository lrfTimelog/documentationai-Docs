openapi: 3.1.0
info:
  title: Expenses — REST API v1
  version: v1
  description: |-
    Employee expenses (out-of-pocket costs to reimburse) with their receipts, project expenses (company costs such as supplier invoices booked on projects), mileage (car travel) registrations, expense types, the caller's expense totals, the address helpers of the mobile mileage form, and the lookups behind them (mileage rates, payment methods, product numbers, the product catalogue).

    Enums are integers in v1.

    **Conventions that apply to every operation in this file:**
    - Property names are PascalCase.
    - Successful bodies use the TAF envelope: one object in `Properties`, lists in `Entities[].Properties`.
    - Some operations succeed without content: HTTP 200 with the literal body `null`, or HTTP 204.
    - `PUT` replaces the whole object: omitted fields are reset.
    - Treat error `Code` 102 as a business-rule violation, whether the HTTP status is 422 or 500.

    > **Not yet documented:** rate limits.
servers:
- url: https://{your-timelog-host}/{tlp-virtual-directory}/api
  description: Your TimeLog site.
  variables:
    your-timelog-host:
      default: your-timelog-host
      description: 'The host of your TimeLog site. Not yet documented: the production host pattern.'
    tlp-virtual-directory:
      default: your-virtual-directory
      description: The virtual directory your TimeLog site is hosted under.
security:
- bearer: []
tags:
- name: Expenses
  description: Employee expenses (out-of-pocket costs to reimburse) with their receipts, project expenses (company costs such
    as supplier invoices booked on projects), mileage (car travel) registrations, expense types, the caller's expense totals,
    the address helpers of the mobile mileage form, and the lookups behind them (mileage rates, payment methods, product numbers,
    the product catalogue).
paths:
  /v1/address/home-work:
    get:
      operationId: getHomeAndWorkAddresses
      summary: Get my home and work addresses
      description: |-
        Returns the caller's own home address and the company's address, as one-tap start / end addresses for a trip.

        Two suggestions: the CALLER's home address from their user profile (Type 2 Home — always returned, with empty fields when no home address is stored) and the tenant's own company address (Type 0 Internal — the CRM customer configured as the company itself; absent when that customer has no country). Use FullDetailAddress as the mileage StartAddress / EndAddress. Personal data: the response contains the caller's home address and is scoped to the caller.

        **Use it to:**
        - Mobile mileage form: prefill 'from home' / 'to office' for a commute-style trip

        **Not for:**
        - Another employee's address — not available through this API
        - Customer or project addresses — `GET /v1/address/search`

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **Next:** `POST /v1/mileage-registration`

        **See also:** `GET /v1/address/search`
      tags:
      - Expenses
      responses:
        '200':
          description: |-
            A list, wrapped in the TAF list envelope (`Entities[].Properties`). Usually two entities, Home then Internal (UNION — order not guaranteed by SQL). A self link; no paging properties.

            Order: unspecified (captured: Home, Internal)

            Empty result: Never empty for an existing user: the Home row is always present.
          content:
            application/json:
              schema:
                type: object
                description: 'TAF list envelope: each item is in `Entities[].Properties`.'
                properties:
                  Entities:
                    type: array
                    description: Omitted (not `[]`) when the list is empty.
                    items:
                      type: object
                      properties:
                        Properties:
                          $ref: '#/components/schemas/AddressRead'
                        Links:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafLink'
                        Actions:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafAction'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
              examples:
                example1:
                  summary: Caller without a stored home address (captured, v1)
                  value:
                    Entities:
                    - Properties:
                        TypeName: Home
                        Name: null
                        Address: ''
                        Address2: ''
                        Address3: null
                        Postcode: ''
                        City: ''
                        State: null
                        CountryName: null
                        Type: 2
                        FullAddress: ''
                        FullDetailAddress: ''
                    - Properties:
                        TypeName: Internal
                        Name: Name_Customer140
                        Address: Adresse
                        Address2: Adresse2
                        Address3: Adresse3
                        Postcode: PostCode
                        City: City
                        State: State
                        CountryName: Storbritannien
                        Type: 0
                        FullAddress: Adresse, Adresse2, Adresse3, PostCode, City, State, Storbritannien
                        FullDetailAddress: Name_Customer140, Adresse, Adresse2, Adresse3, PostCode, City, State, Storbritannien
                    Links:
                    - Href: https://{your-timelog-host}/{tlp-virtual-directory}/api/v1/address/home-work
                      Rel: self
        '401':
          description: '- Missing, invalid or expired bearer token. — When: No or invalid token (captured). — Fix: Obtain
            a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
              examples:
                example1:
                  summary: No token (captured)
                  value:
                    Message: Authorization has been denied for this request.
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v1.expenses.address.gethomeandwork
  /v1/address/search:
    get:
      operationId: searchAddress
      summary: Search addresses (TimeLog data)
      description: |-
        Suggests addresses TimeLog already holds — for a project (home, own company, the project's customer) or by a search phrase over CRM customers.

        Address suggestions for a trip's start / end address without calling Google. With projectId: the caller's own home address (Type 2 Home, returned even when empty), the tenant's own company address (Type 0 Internal) and the address of the project's customer (Type 1 Project). With addressPhrase: CRM customers whose name or any address part or country contains the phrase (Type 3 Customer), paged. Store FullDetailAddress.

        **Use it to:**
        - Mobile mileage form: offer 'home', 'office' and 'customer of this project' as one-tap start / end addresses

        **Not for:**
        - Only the caller's home and company address — `GET /v1/address/home-work`
        - CRM customer master data — the CRM customer operations

        **Rules across fields:**
        - R1: Send exactly one of projectId and addressPhrase; neither → 404 (captured).

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **Next:** `POST /v1/mileage-registration`

        **See also:** `GET /v1/address/home-work`

        > **Not yet documented:** examples; request → cross field rules; response → variants.
      tags:
      - Expenses
      parameters:
      - name: projectId
        in: query
        required: false
        schema:
          type: integer
          format: int32
        description: |-
          Project whose customer address to include. An unknown ID just drops the Project row.

          **Conditional.** Exactly one of projectId / addressPhrase selects the variant.
      - name: addressPhrase
        in: query
        required: false
        schema:
          type: string
        description: |-
          Text searched with LIKE '%phrase%' (trimmed) in customer name, address lines, postcode, city, state and country. '%' and '_' act as SQL wildcards (not escaped). Max 200 characters (procedure parameter).

          **Conditional.** Exactly one of projectId / addressPhrase selects the variant.
      - name: $page
        in: query
        required: false
        schema:
          type: integer
          default: 1
        description: 'addressPhrase variant only: page number.'
      - name: $pagesize
        in: query
        required: false
        schema:
          type: integer
          default: 10
        description: 'addressPhrase variant only: page size. No maximum enforced in the API layer.'
      responses:
        '200':
          description: |-
            **When `projectId` is sent:** A list, wrapped in the TAF list envelope (`Entities[].Properties`). Up to three entities (UNION removes exact duplicates): Home (caller), Internal (own company — absent when it has no country), Project (project's customer — absent for an unknown project or a customer without country). Unpaged; order not guaranteed.

            **When `addressPhrase` is sent:** A list, wrapped in the TAF list envelope (`Entities[].Properties`). One page of Type 3 Customer entities, ordered by Name DESCENDING, with TotalRecord / TotalPage / PageNumber.

            Paged with `$page` (default 1) and `$pagesize` (default 10).

            Order: addressPhrase: customer name descending (Z → A); projectId: unspecified

            Empty result: 200 with no Entities (projectId always returns at least the Home row).
          content:
            application/json:
              schema:
                type: object
                description: 'TAF list envelope: each item is in `Entities[].Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/TafListPaging'
                  Entities:
                    type: array
                    description: Omitted (not `[]`) when the list is empty.
                    items:
                      type: object
                      properties:
                        Properties:
                          $ref: '#/components/schemas/AddressRead'
                        Links:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafLink'
                        Actions:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafAction'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '404':
          description: '- The route matched a controller, but no action accepts the supplied query parameters — typically
            a required (non-nullable) simple parameter such as a DateTime was omitted. It is a missing-parameter error that
            looks like a 404. — When: Neither projectId nor addressPhrase (captured: every scenario, also unauthenticated).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: No parameter (captured)
                  value:
                    Message: No HTTP resource was found that matches the request URI 'https://{your-timelog-host}/{tlp-virtual-directory}/api/v1/address/search'.
                    MessageDetail: No action was found on the controller 'Address' that matches the request.
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v1.expenses.address.search
  /v1/employee-expense:
    get:
      operationId: listEmployeeExpenses
      summary: List employee expenses
      description: |-
        Lists employee expenses, newest first, optionally for one user and a date range, one page at a time.

        Returns employee expenses (not project expenses) ordered by date descending, with the receipt download URLs (15-minute SAS) of each one. Filter with userID (a user ID) and an inclusive startDate / endDate on the expense date. Without userID the list spans the whole tenant — see the access note: the call does not restrict the result to the caller.

        **Use it to:**
        - Finance / payroll integration pulling the expenses of a period for reimbursement or posting (filter by date, then by Status = Approved on your side)
        - Expense app showing the signed-in user's recent expenses (pass the caller's own userID)

        **Not for:**
        - One expense by ID — `GET /v1/employee-expense/{employeeExpenseID}` (it enforces the owner check)
        - Filtering by approval status, project or expense type — not supported; filter client-side

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Side effect: Each call mints new 15-minute SAS read URLs for every listed attachment (no state change).
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v1/user`

        **Next:** `GET /v1/employee-expense/{employeeExpenseID}`, `PUT /v1/employee-expense`

        > **Not yet documented:** request → query params → $expand.
      tags:
      - Expenses
      parameters:
      - name: userID
        in: query
        required: false
        schema:
          type: integer
          format: int32
          x-timelog-filter:
            operators:
            - eq
        description: |-
          Only expenses of this user (a USER ID). Omitted = all employees. Not checked against the caller.

          Filters on `EmployeeExpenseRead.EmployeeUserID` (eq).
      - name: startDate
        in: query
        required: false
        schema:
          type: string
          format: date-time
          x-timelog-filter:
            operators:
            - gte
        description: |-
          Inclusive lower bound on the expense date. Stored dates have no time part, so send a date.

          Filters on `EmployeeExpenseRead.Date` (gte).
      - name: endDate
        in: query
        required: false
        schema:
          type: string
          format: date-time
          x-timelog-filter:
            operators:
            - lte
        description: |-
          Inclusive upper bound on the expense date. Send a date without time: a time part still matches the whole stored day (stored values are midnight).

          Filters on `EmployeeExpenseRead.Date` (lte).
      - name: $page
        in: query
        required: false
        schema:
          type: integer
          default: 1
        description: Page number.
      - name: $pagesize
        in: query
        required: false
        schema:
          type: integer
          default: 10
        description: Page size. No maximum enforced in the API layer.
      - name: $expand
        in: query
        required: false
        schema:
          type: string
          enum:
          - project
          - currency
          - expenseType
          - paymentMethod
          x-enum-descriptions:
          - Fill Project (and its customer).
          - Fill Currency.
          - Fill ExpenseType.
          - Fill PaymentMethod.
        description: |-
          Comma-separated list of nested objects to embed.

          Several values: one string, separated by `,`.

          Allowed values:

          | Value | Name | Meaning |
          |---|---|---|
          | `project` | project | Fill Project (and its customer). |
          | `currency` | currency | Fill Currency. |
          | `expenseType` | expenseType | Fill ExpenseType. |
          | `paymentMethod` | paymentMethod | Fill PaymentMethod. |
      responses:
        '200':
          description: |-
            A list, wrapped in the TAF list envelope (`Entities[].Properties`). One page of expenses. Properties carry TotalRecord, TotalPage, PageNumber; each entity has a self link and the expense TAF actions.

            Paged with `$page` (default 1) and `$pagesize` (default 10).

            Order: Date descending, then EmployeeExpenseID descending (stable)

            Empty result: 200 with no Entities
          content:
            application/json:
              schema:
                type: object
                description: 'TAF list envelope: each item is in `Entities[].Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/TafListPaging'
                  Entities:
                    type: array
                    description: Omitted (not `[]`) when the list is empty.
                    items:
                      type: object
                      properties:
                        Properties:
                          $ref: '#/components/schemas/EmployeeExpenseRead'
                        Links:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafLink'
                        Actions:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafAction'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v1.expenses.employeeexpense.list
    post:
      operationId: createEmployeeExpense
      summary: Create an employee expense
      description: |-
        Creates an employee expense (out-of-pocket cost to be reimbursed) for the caller or on behalf of another user, and returns it.

        Registers an expense an employee paid — amount and VAT in the receipt currency, the exchange rate to the employee's legal-entity currency, expense type, payment method — on a project, optionally billable to its customer. The contract is the one you send, or the project's default expense contract. The response is the stored expense (EmployeeExpenseRead) with its new EmployeeExpenseID and assigned Number. Receipts are attached in a second call (POST …/{id}/image or …/{id}/file), so a receipt-capture integration is always create → attach.

        **Use it to:**
        - Expense or receipt-capture app (e.g. a scan-and-submit flow) booking a receipt line, then uploading the receipt image/PDF to the returned ID
        - Corporate-card or ERP integration (e.g. receipt flows from a Business Central add-on) creating card transactions on behalf of employees with UserID

        **Rules across fields:**
        - R1: ProjectSubContractID, when > 0, must belong to ProjectID, be Active and not be prepaid services.
        - R2: ExpenseTypeID must belong to the owner's (UserID or caller) legal entity.
        - R3: IsBillable must be true when the resolved contract is fixed-price.
        - R4: Date must be inside the owner's employment and not in a closed accounting period.

        **Behaviour:**
        - Not idempotent.
        - Not safe to retry blindly. Each call creates a new expense with a new GUID; nothing deduplicates. After a lost response, list the owner's expenses for the date (GET /v1/employee-expense?userID=&startDate=&endDate=) before retrying.
        - Duplicates: Not deduplicated.
        - Side effect: Creates the employee expense (category Employee, interface WebApi) with the conversion rates to the project's and the owner's legal-entity currencies.
        - Side effect: Writes registration currency data for the expense; invalidates the expense cache.
        - On failure: No transaction wraps the insert and the follow-up writes. A failure after the insert — e.g. in the currency-data notification or the read-back — returns 500 while the expense row stays (src_only).
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v1/project-header/search-for-expense-travel-registration-order-by-recent-registration`, `GET /v1/currency/{status}`, `GET /v1/user`

        **Next:** `POST /v1/employee-expense/{employeeExpenseID}/image`, `POST /v1/employee-expense/{employeeExpenseID}/file`, `GET /v1/employee-expense/{employeeExpenseID}`

        **See also:** `POST /v1/project-header/employee-expense`

        > **Not yet documented:** examples.
      tags:
      - Expenses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeExpenseCreate'
      responses:
        '200':
          description: |-
            The object, wrapped in the TAF envelope (`Properties`). The created expense, read back through GET /v1/employee-expense/{id} (attachment lists empty).

            Order: none

            Empty result: none
          content:
            application/json:
              schema:
                type: object
                description: 'TAF envelope: the object is in `Properties`. Null members are omitted; a null result is `{"Links":
                  [self]}` without `Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/EmployeeExpenseRead'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
                  Actions:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafAction'
        '400':
          description: '- **Code 200** — The request body or parameters failed input validation. — When: Body validator: Date
            missing; ExchangeRate ≤ 0; CurrencyID / ExpenseTypeID / PaymentMethodID / ProjectID ≤ 0; UserID ≤ 0. — Fix: Fix
            every item listed in Details and resend.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '403':
          description: '- **Code 103** — The authenticated user lacks a privilege the operation requires. On time registrations
            this is raised when the caller is not the registration''s owner and has no registration privilege that covers
            the owner. — When: UserID is another user and the caller is not covered by the on-behalf rule.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '500':
          description: |-
            - **Code 100** — Unhandled server error.

            - **Code 37040** — UserID is set, differs from the caller and is not an existing user ID. — Fix: Send a user ID (GET /v1/user), not an employee ID — or omit UserID to register for yourself.

            - **Code 37931** — UserID exists but the user is deactivated. New registrations cannot be created for inactive users. — Fix: Register for an active user.

            - **Code 37042** — ProjectSubContractID (> 0) is not a contract of ProjectID (or does not exist). — Fix: Send a contract of the same project, or 0 / omit it to use the project's default contract.

            - **Code 31132** — The explicitly supplied ProjectSubContractID is not in status Active. — Fix: Choose an active contract of the project.

            - **Code 31134** — The explicitly supplied ProjectSubContractID is a prepaid-services contract. — Fix: Choose a non-prepaid contract, or omit ProjectSubContractID.

            - **Code 37806** — The resolved contract is closed. — Fix: Book on an open contract.

            - **Code 37019** — ExpenseTypeID does not exist. — Fix: Use an expense type ID of the owner's legal entity.

            - **Code 37998** — Fix: Use an expense type of the owner's legal entity anyway; the API will not stop you.

            - **Code 37014** — ProjectID does not exist. — Fix: Use a ProjectID from a project-header search.

            - **Code 37689** — The project is inactive. — Fix: Use an active project.

            - **Code 37691** — The project's default-for-expenses contract (or, when there is none, its main contract) is closed. — Fix: Reopen the contract or send an explicit active ProjectSubContractID.

            - **Code 37690** — The project has no default-for-expenses contract and its main contract is prepaid services. — Fix: Send an explicit non-prepaid ProjectSubContractID.

            - **Code 31140** — The contract the expense is booked on is fixed-price and IsBillable is false. — Fix: Send IsBillable true for fixed-price contracts.

            - **Code 37018** — PaymentMethodID does not exist. — Fix: Use an existing payment method ID.

            - **Code 37699** — Date falls in a closed accounting period of the owner's employee projection. — Fix: Use a date in an open period.

            - **Code 38022** — The owner has no employee projection on Date (for example a date before the employment start). — Fix: Use a date inside the owner's employment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v1.expenses.employeeexpense.create
    put:
      operationId: updateEmployeeExpense
      summary: Update an employee expense
      description: |-
        Replaces the amounts, date, currency, type, payment method, billability, comment and project of an unapproved employee expense.

        A full replacement (PUT) of the expense's ten writable fields, addressed by EmployeeExpenseID in the body. Read the expense first and send every field back — an omitted Comment is cleared and an omitted Amount becomes 0. The owner and the contract cannot be changed; changing ProjectID fails when the expense has a contract. Approved, invoiced, closed-period and completed-project expenses are refused. The response body is JSON null: GET the expense to see the result.

        **Use it to:**
        - Expense app letting an employee correct an expense before approval
        - Receipt-capture integration filling in amount / VAT / currency after OCR of the uploaded receipt

        **Not for:**
        - Changing the owner or contract — delete and re-create the expense
        - Changing receipts — the attach / delete image and file operations

        **Rules across fields:**
        - R1: When the expense has a contract, ProjectID must be a project that contract belongs to — i.e. ProjectID cannot be changed.
        - R2: ExpenseTypeID must belong to the owner's legal entity.
        - R3: Date must be inside the owner's employment and not in a closed accounting period.

        **Behaviour:**
        - Idempotent.
        - Same body → same stored values; last write wins (no concurrency token).
        - Safe to retry.
        - Duplicates: n/a
        - Side effect: Overwrites the expense and recalculates its conversion rates; invalidates the expense cache.
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v1/employee-expense/{employeeExpenseID}`

        **Next:** `GET /v1/employee-expense/{employeeExpenseID}`

        **See also:** `DELETE /v1/employee-expense/{employeeExpenseID}`

        > **Not yet documented:** behaviour → side effects; examples.
      tags:
      - Expenses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeExpenseUpdate'
      responses:
        '200':
          description: |-
            Success without content: HTTP 200 with the literal JSON body `null`. Body is the JSON literal null.

            Order: none

            Empty result: none
          content:
            application/json:
              schema:
                type: 'null'
        '400':
          description: '- **Code 200** — The request body or parameters failed input validation. — When: EmployeeExpenseID
            ≤ 0; Date missing; ExchangeRate ≤ 0; CurrencyID / ExpenseTypeID / PaymentMethodID / ProjectID ≤ 0 (captured).
            — Fix: Fix every item listed in Details and resend.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '500':
          description: |-
            - **Code 100** — Unhandled server error.

            - **Code 37700** — The expense is approved (Status = Approved) and can no longer be changed.

            - **Code 37698** — The expense has been invoiced or vouchered.

            - **Code 38006** — The (new) ProjectID's project has order status Completed.

            - **Code 38007** — The expense's contract has status Completed.

            - **Code 37042** — ProjectSubContractID (> 0) is not a contract of ProjectID (or does not exist). — When: ProjectID changed on an expense that has a contract. — Fix: Send a contract of the same project, or 0 / omit it to use the project's default contract.

            - **Code 37019** — ExpenseTypeID does not exist. — Fix: Use an expense type ID of the owner's legal entity.

            - **Code 37998** — Fix: Use an expense type of the owner's legal entity anyway; the API will not stop you.

            - **Code 37014** — ProjectID does not exist. — Fix: Use a ProjectID from a project-header search.

            - **Code 37689** — The project is inactive. — Fix: Use an active project.

            - **Code 37018** — PaymentMethodID does not exist. — Fix: Use an existing payment method ID.

            - **Code 37699** — Date falls in a closed accounting period of the owner's employee projection. — Fix: Use a date in an open period.

            - **Code 38022** — The owner has no employee projection on Date (for example a date before the employment start). — Fix: Use a date inside the owner's employment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v1.expenses.employeeexpense.update
  /v1/employee-expense-financial-data/get-all-time-total:
    get:
      operationId: getEmployeeExpenseFinancialDataAllTimeTotal
