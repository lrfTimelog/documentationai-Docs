          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '500':
          description: |-
            - **Code 37683** — A multipart part could not be decoded as an image (System.Drawing Image.FromStream failed). Every part is treated as a file, so a plain form field (e.g. a name or description part) also triggers this. — When: Any part is not a decodable image — including a text form field. — Fix: Send only image parts; send PDFs to POST /v1/employee-expense/{id}/file.

