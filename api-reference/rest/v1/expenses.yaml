        description: The expense to attach to.
      responses:
        '200':
          description: |-
            Success without content: HTTP 200 with the literal JSON body `null`. Body is the JSON literal null. The new files appear in ImageUrls of GET /v1/employee-expense/{id}.

            Order: none

            Empty result: none
          content:
            application/json:
              schema:
                type: 'null'
        '400':
