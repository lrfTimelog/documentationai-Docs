    post:
      operationId: createMileageRegistration
      summary: Create a mileage registration
      description: |-
        Registers a car trip (mileage) on a project for the caller or on behalf of another user, optionally with its travel time.

        Creates a mileage registration that is reimbursed to the employee and, when billable, invoiced to the customer at the mileage rate. Distance is one-way whole kilometres; IsRoundtrip doubles it. The contract is the one you send or the project's default mileage contract. With TravelTimeRegistration the same call also creates a TravelTime time registration on a travel-time task of the project and links it. Returns the created registration (same shape as GET /v1/mileage-registration/{id}).

        **Use it to:**
        - Fleet / travel integration registering trips for employees (UserID, on-behalf privileges)

        **Not for:**
        - Travel time without a trip — create a time registration (GroupType TravelTime)
        - Out-of-pocket costs — `POST /v1/employee-expense`

        **Rules across fields:**
        - R1: ProjectSubContractID, when > 0, must belong to ProjectID (and be neither prepaid-services nor closed).
        - R2: When ShowOdometer is on and either odometer is sent, OdometerEnd > OdometerStart (400). With OdometerIsRequired also on and both sent, Distance × (IsRoundtrip ? 2 : 1) must equal OdometerEnd − OdometerStart.
        - R3: A personal CarID must belong to the owner (UserID or caller).
        - R4: MileageRateID must have a rate period covering Date.
        - R5: TravelTimeRegistration.TaskID must be a task of ProjectID.
        - R6: With TravelTimeRegistration, a body TimeRegistrationID is overwritten by the new travel-time registration's ID.

        **Behaviour:**
        - Not idempotent.
        - Not safe to retry blindly. Every call creates a new registration (new GUID); nothing deduplicates. After a lost response, list your registrations (or the owner's, via GET by ID) before retrying.
        - Duplicates: Not deduplicated (except one mileage registration per TimeRegistrationID, 37825).
        - Side effect: Creates the registration (source interface WebApi) with expense number (auto-number), travel product number and system text "<Mileage> (<owner name>) <start> » <end> <TotalDistance> km.".
        - Side effect: Creates mileage financial data and invoicing potential, recalculates the contract's estimated values, creates the employee reimbursement posting.
        - Side effect: With TravelTimeRegistration: creates a TravelTime time registration (owner, Date, Purpose as comment, billable hours = Hours when the task is billable) and links it.
        - On failure: With TravelTimeRegistration: the time registration is created first and deleted again if the mileage save throws (compensation, not one transaction).
        - Changes are visible to the next read immediately.
        - The mileage insert and its side effects run in one transaction scope; the response is read back after commit.

        **Call first:** `GET /v1/project-header/search-for-expense-travel-registration-order-by-recent-registration`, `GET /v1/task/travel-time-task-for-time-tracking`

        **Next:** `GET /v1/mileage-registration/{mileageRegistrationID}`, `PUT /v1/mileage-registration`

        **See also:** `POST /v1/project-header/mileage-registration`

        > **Not yet documented:** behaviour → side effects on failure; examples.
