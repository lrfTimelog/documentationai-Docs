  /v1/project-product:
    get:
      operationId: listProjectProducts
      summary: List products (catalogue)
      description: |-
        Lists ALL products of the tenant's product catalogue (Settings → Products) with cost and sales price, newest first — despite the route name, not the products of a project.

        A product is a sellable item or service with a unit (pieces, hours, km, …), a COST in the product's own currency (CurrencyID), a SALES PRICE in the tenant's system (base) currency, and the defaults used when it is added to a project or posted as an expense (product number, expense type, payment method, supplier). Every legal entity's products and inactive ones are returned; there is no project, legal-entity or status parameter. Prices are per unit; no VAT field is returned (VAT comes from the product number — `GET /v1/product`). The products actually added to a project (quantities, project prices, recurring sales) are NOT exposed by this operation.

        **Use it to:**
        - Syncing the product catalogue to an ERP / CPQ system (one-way read)
        - Resolving defaults (ProductNumberID, ExpenseTypeID) before booking product sales as project expenses

        **Not for:**
        - Products on a specific project — no REST v1 operation
        - Product numbers / VAT — `GET /v1/product`

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **See also:** `GET /v1/product`, `GET /v1/expense-type/all/list`, `GET /v1/payment-method/{status}`
