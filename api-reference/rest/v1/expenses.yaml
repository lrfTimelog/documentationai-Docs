    put:
      operationId: updateMileageRegistration
      summary: Update a mileage registration
      description: |-
        Replaces the trip details of an unapproved, uninvoiced mileage registration, optionally updating or removing its travel time.

        A full replacement (PUT) addressed by MileageRegistrationID in the body: every field of the body overwrites the stored value, so read the registration first and send everything back. Owner and contract cannot be changed; a project change keeps the old contract. Send TravelTimeRegistration to update the linked travel time (or create one), or ?deleteTravelTimeRegistration=true to unlink and delete it. Returns the updated registration.

        **Use it to:**
        - Employee correcting a trip (distance, addresses, purpose) before approval
        - Adding travel time to an existing trip

        **Not for:**
        - Changing the owner or the contract — delete and re-create
        - Approving — not available in this API

        **Rules across fields:**
        - R1: TravelTimeRegistration.TaskID must be a task of ProjectID.
        - R2: When ShowOdometer is on and either odometer is sent, OdometerEnd ≥ OdometerStart (400); with OdometerIsRequired also on, Distance × (IsRoundtrip ? 2 : 1) = OdometerEnd − OdometerStart.
        - R3: MileageRateID must have a rate period covering Date.
        - R4: A personal CarID must belong to the registration's owner.

        **Behaviour:**
        - Idempotent.
        - Same body → same stored values (last write wins, no concurrency token). With TravelTimeRegistration on a mileage that has none, the FIRST call creates a time registration and later calls update it.
        - Safe to retry.
        - Duplicates: n/a
        - Side effect: Overwrites the registration; regenerates product number and system text; updates financial data, invoicing potential and the employee reimbursement posting; recalculates the old contract's estimates if the contract changed; refreshes the cache.
        - Side effect: With TravelTimeRegistration: updates (or creates and links) the travel-time registration — task, hours, date, Purpose as comment.
        - Side effect: With ?deleteTravelTimeRegistration=true: unlinks the travel-time registration, saves the mileage, then deletes the time registration.
        - On failure: Travel-time changes are compensated, not transactional: the previous time registration is re-saved (or the new one deleted) when the mileage save throws; if time-registration delete fails after unlinking, the mileage is re-saved with the link.
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v1/mileage-registration/{mileageRegistrationID}`

        **Next:** `GET /v1/mileage-registration/{mileageRegistrationID}`

        **See also:** `DELETE /v1/mileage-registration/{mileageRegistrationID}`

