openapi: 3.1.0
info:
  title: Customers — REST API v1
  version: v1
  description: |-
    Create, read, search and change customers, and read the customer-status and industry value sets.

    Enums are integers in v1.

    **Conventions that apply to every operation in this file:**
    - Property names are PascalCase.
    - Successful bodies use the TAF envelope: one object in `Properties`, lists in `Entities[].Properties`.
    - Some operations succeed without content: HTTP 200 with the literal body `null`, or HTTP 204.
    - `PUT` replaces the whole object: omitted fields are reset.
    - Treat error `Code` 102 as a business-rule violation, whether the HTTP status is 422 or 500.

    > **Not yet documented:** rate limits.
servers:
- url: https://{region-node}.timelog.com/{account}/api
  description: 'Your TimeLog site. Copy both values from the address bar when you are signed in to TimeLog: `region-node`
    is the first part of the host name (for example `app3` in `app3.timelog.com`), `account` is the first path segment after
    it.'
  variables:
    region-node:
      default: app3
    account:
      default: your-account
security:
- bearer: []
tags:
- name: Customers
  description: Create, read, search and change customers, and read the customer-status and industry value sets.
paths:
  /v1/contact:
    get:
      operationId: listContactPersons
      summary: List contact persons
      description: |-
        Returns every contact person of the tenant in one response.

        Returns all contacts of all customers — active and inactive alike, with no way to tell them apart — ordered by ID, in ONE response: no paging is applied and the TAF paging properties read TotalRecord "0" / TotalPage "0". There are no filters (by customer, name or e-mail). ShownName on this operation is the full name of the contact's OWNER, not of the contact; Address3 is always null.

        **Use it to:**
        - Build a ContactID map (by name / e-mail + CustomerID) before setting project or invoice contacts

        **Not for:**
        - Contacts of one customer only — no filter exists; filter CustomerID client-side.

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **Next:** `POST /v1/customer/create`, `PUT /v1/project/{projectID}`

        **See also:** `POST /v1/contact/create`

        > **Not yet documented:** response → pagination.
      tags:
      - Customers
      responses:
        '200':
          description: |-
            A list, wrapped in the TAF list envelope (`Entities[].Properties`). All contacts; entities carry no links.

            Order: ID ascending (then last name, first name)

            Empty result: 200 with no Entities
          content:
            application/json:
              schema:
                type: object
                description: 'TAF list envelope: each item is in `Entities[].Properties`.'
                properties:
                  Entities:
                    type: array
                    description: Omitted (not `[]`) when the list is empty.
                    items:
                      type: object
                      properties:
                        Properties:
                          $ref: '#/components/schemas/ContactRead'
                        Links:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafLink'
                        Actions:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafAction'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v1.crm.contactperson.list
  /v1/contact/create:
    post:
      operationId: createContactPerson
      summary: Create a contact person
      description: |-
        Creates a contact person, optionally on a customer and with an owner, and returns it.

        Creates a row in the tenant's contact list. The contact can then be used as a customer contact, project contact or invoice recipient (ContactID on CustomerCreate / ProjectCreate). Only FirstName, LastName and a valid CountryID are required; without CustomerID the contact belongs to no customer. The response is the stored contact (ContactRead); its ShownName is the contact's own full name. Failure reporting is weak: a create that the manager refuses — missing customer privilege, or a database error — is NOT reported with its reason. The controller ignores the manager's result and re-reads contact 0, which fails with a generic 500 (Code 100).

        **Use it to:**
        - Create the contact persons of a customer synchronised from a CRM

        **Not for:**
        - Updating or deleting contacts — REST v1 has no contact update / delete operation.

        **Behaviour:**
        - Not idempotent.
        - Not safe to retry blindly.
        - Duplicates: Not deduplicated — the same names on the same customer create a second contact.
        - Side effect: Inserts the contact, stamped with the caller as creator.
        - Side effect: Flushes the per-customer contact caches.
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v1/customer`, `GET /v1/country/get-all`, `GET /v1/user`

        **Next:** `POST /v1/customer/create`, `POST /v1/project/create-from-template`

        **See also:** `POST /v1/contact/validate-new-contact`, `GET /v1/contact`

        > **Not yet documented:** examples (success).
      tags:
      - Customers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactCreate.create'
      responses:
        '200':
          description: The object, wrapped in the TAF envelope (`Properties`). The stored contact, mapped from the domain
            object (ShownName = the contact's full name; Address3 null).
          content:
            application/json:
              schema:
                type: object
                description: 'TAF envelope: the object is in `Properties`. Null members are omitted; a null result is `{"Links":
                  [self]}` without `Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/ContactRead'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
                  Actions:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafAction'
        '400':
          description: '- **Code 200** — The request body or parameters failed input validation. — When: FirstName / LastName
            empty, CountryID <= 0 (see ContactCreate) — Fix: Fix every item listed in Details and resend.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '500':
          description: |-
            - **Code 30017** — CountryID or InvoicingAddressCountryID does not exist. The template says 'ISO code' but the value is the country ID. — When: CountryID > 0 but unknown (Code 102)

            - **Code 100** — Unhandled server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v1.crm.contactperson.create
  /v1/contact/validate-new-contact:
    post:
      operationId: validateNewContactPerson
      summary: Validate a new contact person
      description: |-
        Runs the contact create validations on a body without saving anything.

        Runs model validation (FirstName, LastName, CountryID > 0), the adapter's customer lookup and the country rule of `POST /v1/contact/create`, then returns 200 with the body `null`.

        **Use it to:**
        - Validate a contact form before submitting, to show TimeLog's errors early

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v1/country/get-all`

        **Next:** `POST /v1/contact/create`

        > **Not yet documented:** examples (success).
      tags:
      - Customers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactCreate.create'
      responses:
        '200':
          description: 'Success without content: HTTP 200 with the literal JSON body `null`. Literal JSON `null` — the body
            is valid.'
          content:
            application/json:
              schema:
                type: 'null'
        '400':
          description: '- **Code 200** — The request body or parameters failed input validation. — When: FirstName / LastName
            empty, CountryID <= 0 (captured for {}) — Fix: Fix every item listed in Details and resend.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: Empty body
                  value:
                    Code: 200
                    Details:
                    - '''First Name'' must not be empty.'
                    - '''Last Name'' must not be empty.'
                    - '''Country ID'' must be greater than 0.'
                    Message: Invalid model state error.
                    Parameters: 'contact: {...}'
                    Url: https://{region-node}.timelog.com/{account}/api/v1/contact/validate-new-contact
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '500':
          description: |-
            - **Code 30017** — CountryID or InvoicingAddressCountryID does not exist. The template says 'ISO code' but the value is the country ID. — When: CountryID > 0 but unknown (Code 102)

            - **Code 100** — Unhandled server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v1.crm.contactperson.validatenew
  /v1/customer:
    get:
      operationId: listCustomers
      summary: List customers
      description: |-
        Lists every customer row of the tenant, newest first, one page at a time.

        Returns all rows of the customer table, whatever their status: customers, suppliers, partners, the tenant's own company and the system "Multi customer project" row. There is no filter or search parameter; use the search-for-* operations to search by name or number, and by-number for an exact number match. The model carries only identifiers, name, number, status and tax numbers.

        **Use it to:**
        - Initial sync of the customer register into an ERP or CRM
        - Resolve CustomerID ↔ customer number before writing projects or invoices

        **Not for:**
        - Find a customer by number → `GET /v1/customer/by-number/{customerNumber}`
        - Customers the user can register time on → `GET /v1/customer/search-for-time-tracking`

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.
        - Reads the customer table directly (no read model or cache).

        **Next:** `GET /v1/customer/{customerID}`, `PUT /v1/customer/update`, `GET /v1/customerstatus`

        **See also:** `GET /v1/customer/by-number/{customerNumber}`, `GET /v1/customer/search-for-time-tracking`
      tags:
      - Customers
      parameters:
      - name: $page
        in: query
        required: false
        schema:
          type: integer
          default: 1
        description: Page number.
      - name: $pagesize
        in: query
        required: false
        schema:
          type: integer
          default: 10
        description: Page size. No maximum enforced in the API layer.
      responses:
        '200':
          description: |-
            A list, wrapped in the TAF list envelope (`Entities[].Properties`). One page of customers. Each entity has a self link to GET /v1/customer/{CustomerID}.

            Paged with `$page` (default 1) and `$pagesize` (default 10).

            Order: CustomerID descending (newest first)

            Empty result: 200 with TotalRecord "0" and no Entities
          content:
            application/json:
              schema:
                type: object
                description: 'TAF list envelope: each item is in `Entities[].Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/TafListPaging'
                  Entities:
                    type: array
                    description: Omitted (not `[]`) when the list is empty.
                    items:
                      type: object
                      properties:
                        Properties:
                          $ref: '#/components/schemas/CustomerRead'
                        Links:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafLink'
                        Actions:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafAction'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v1.crm.customer.list
  /v1/customer/by-number/{customerNumber}:
    get:
      operationId: getCustomersByNumber
      summary: Get customers by customer number
      description: |-
        Returns every customer whose customer number equals the given value.

        Exact match on the customer number. Returns a LIST, because customer numbers are unique only when the tenant feature UniqueCustomerNumber is on. No match is a 404, not an empty list.

        **Use it to:**
        - Look up the TimeLog CustomerID for a customer number held in an ERP

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **Next:** `GET /v1/customer/{customerID}`, `PUT /v1/customer/update`

        **See also:** `GET /v1/customer`

        > **Not yet documented:** examples (success); request → path params; response → default ordering.
      tags:
      - Customers
      parameters:
      - name: customerNumber
        in: path
        required: true
        schema:
          type: string
        description: Customer number, matched exactly (database collation decides case sensitivity).
      responses:
        '200':
          description: |-
            A list, wrapped in the TAF list envelope (`Entities[].Properties`). All customers with this number (normally one).

            Order: not yet documented.

            Empty result: 404, Code 404, Message "No customer found with customer number: {n}"
          content:
            application/json:
              schema:
                type: object
                description: 'TAF list envelope: each item is in `Entities[].Properties`.'
                properties:
                  Entities:
                    type: array
                    description: Omitted (not `[]`) when the list is empty.
                    items:
                      type: object
                      properties:
                        Properties:
                          $ref: '#/components/schemas/CustomerRead'
                        Links:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafLink'
                        Actions:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafAction'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '404':
          description: |-
            - **Code 404** — The addressed resource does not exist. — When: No customer has this number

            - The URL did not match any route (including a route constraint such as {id:int} receiving a non-integer). — When: Empty number (/by-number/)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: Number not found
                  value:
                    Code: 404
                    Details: []
                    Message: 'No customer found with customer number: test'
                    Parameters: 'customerNumber: "test"'
                    Url: https://{region-node}.timelog.com/{account}/api/v1/customer/by-number/test
      x-timelog-key: rest.v1.crm.customer.getbynumber
  /v1/customer/create:
    post:
      operationId: createCustomer
      summary: Create a customer
      description: |-
        Creates a customer together with its invoice settings and returns it.

        Creates a customer row and its invoice settings in one call. The response is the created customer in the short read representation (CustomerRead), including the new CustomerID. Address, owners, currency, industry and invoice settings are stored but cannot be read back through the REST v1 API.

        **Use it to:**
        - Create customers in TimeLog from a CRM or ERP master record

        **Not for:**
        - Dry-run validation → `POST /v1/customer/validate-new-customer`

        **Rules across fields:**
        - R1: UseInvoicingAddress true → InvoicingAddressCountryID required; invoicing-address fields are ignored when it is false.
        - R2: UseEanNo true → OIOXML feature on (37697), Address + ZipCode + City set (60063), VatNo set (60064).
        - R3: Name + CustomerNo must not equal an existing customer's pair (case-insensitive).

        **Behaviour:**
        - Not idempotent.
        - Safe to retry only under a condition. A retry with the same Name and CustomerNo fails with 38017 when the first attempt created the customer (and the caller can see it). With an empty CustomerNo and a number series active, each attempt gets a new number, so the pair differs and a duplicate is created.
        - Duplicates: Only the exact Name + CustomerNo pair is rejected (and the number alone when UniqueCustomerNumber is on). No external-key deduplication.
        - Side effect: Inserts the customer (CustomerGUID generated server-side) and its invoice settings.
        - Side effect: Assigns the next customer number from the series when CustomerNo is blank and the series is active.
        - Side effect: Raises the TLP event CustomerCreate (consumed by the finance integrations: e-conomic, Uniconta, Fortnox, Dinero, Business Central, Exact Online, Bjørn Lunden, Danløn, generic).
        - Side effect: Clears the customer caches.
        - On failure: If saving the invoice settings fails after the customer row is inserted, the customer exists without invoice settings and the call still returns 500 (src_only).
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v1/customerstatus`, `GET /v1/industry/get-all`

        **Next:** `GET /v1/customer/{customerID}`, `PUT /v1/customer/update`

        **See also:** `POST /v1/customer/validate-new-customer`

        > **Not yet documented:** examples (success).
      tags:
      - Customers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreate.create'
      responses:
        '200':
          description: The object, wrapped in the TAF envelope (`Properties`). The created customer, read back with GET /v1/customer/{id}
            (same representation).
          content:
            application/json:
              schema:
                type: object
                description: 'TAF envelope: the object is in `Properties`. Null members are omitted; a null result is `{"Links":
                  [self]}` without `Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/CustomerRead'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
                  Actions:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafAction'
        '400':
          description: '- **Code 200** — The request body or parameters failed input validation. — When: Name, CurrencyID,
            CustomerStatusID or CountryID missing/zero; R1; invalid e-mail; KAM/industry ID <= 0; EanNo length; LanguageID
            outside the list — Fix: Fix every item listed in Details and resend.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '403':
          description: |-
            - **Code 103** — The authenticated user lacks a privilege the operation requires. On time registrations this is raised when the caller is not the registration's owner and has no registration privilege that covers the owner. — When: Missing customer privilege (20012 text), OR duplicate customer number with UniqueCustomerNumber on

            - **Code 20012** — The caller has neither the 'all customers' privilege nor the 'customers where I am account manager' privilege covering this customer (the owner after the request is applied). — Fix: Use a user with the customer privilege.

            - **Code 30169** — Feature UniqueCustomerNumber is on and another customer has this CustomerNo. — Fix: Use another number, or omit it to take the next number of the series.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '500':
          description: |-
            - **Code 102** — The request is well-formed but violates a TimeLog business rule.

            - **Code 30018** — CustomerStatusID does not exist. — Fix: Use a CustomerStatusID from GET /v1/customerstatus.

            - **Code 30019** — IndustryID does not exist (inactive industries are accepted). — Fix: Use an IndustryID from GET /v1/industry/get-all.

            - **Code 37040** — PrimaryKAMID or SecondaryKAMID is not an existing user ID. — Fix: Send a user ID (not an employee ID).

            - **Code 37931** — The owner user exists but is inactive. — Fix: Choose an active user as owner.

            - **Code 38017** — Another customer has the same name AND number (case-insensitive). Checked only against the customers the caller may see. — Fix: Change the name or the number.

            - **Code 37697** — UseEanNo is true on a tenant without the OIOXML feature. — Fix: Send UseEanNo false, or enable OIOXML.

            - **Code 60063** — UseEanNo is true but Address, ZipCode or City is blank.

            - **Code 60064** — UseEanNo is true and VatNo is blank.

            - **Code 37011** — ContactID or CustomerReferenceID (> 0) is not an existing contact.

            - **Code 30014** — InternalReferenceID (> 0) is not an existing employee ID.

            - **Code 37022** — PaymentTermID (> 0) does not exist.

            - **Code 100** — Unhandled server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v1.crm.customer.create
  /v1/customer/search-for-expense-travel-registration-order-by-recent-registration:
    get:
      operationId: searchCustomersForExpenseTravelRegistration
      summary: Search customers for expense and travel registration (recent first)
      description: |-
        Customer search for expense and mileage clients; returns the same result as search-for-time-tracking-order-by-recent-registration.

        Despite its name, this operation runs exactly the query of `GET /v1/customer/search-for-time-tracking-order-by-recent-registration` (customers with tasks the caller is allocated to, recent project-time registrations first). Only the gate on searchAll differs: here searchAll=true requires the tenant feature EnableAllEmployeesRegisterOnAllActiveProjects instead of a user privilege. No expense- or mileage-specific rule is applied.

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Consistency: eventual
        - Same query as searchfortimetrackingrecent (denormalised search tables).

        **See also:** `GET /v1/customer/search-for-time-tracking-order-by-recent-registration`

        > **Not yet documented:** behaviour → consistency.
      tags:
      - Customers
      parameters:
      - name: searchText
        in: query
        required: false
        schema:
          type: string
          default: '""'
          x-timelog-filter:
            operators:
            - contains
        description: |-
          Substring matched against name, nickname and customer number.

          Filters on `CustomerRead.Name | NickName | CustomerRead.No` (contains).
      - name: searchAll
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: true = all customers with tasks. Needs tenant feature EnableAllEmployeesRegisterOnAllActiveProjects.
      - name: $page
        in: query
        required: false
        schema:
          type: integer
          default: 1
        description: Page number.
      - name: $pagesize
        in: query
        required: false
        schema:
          type: integer
          default: 10
        description: Page size. No maximum enforced in the API layer.
      responses:
        '200':
          description: |-
            A list, wrapped in the TAF list envelope (`Entities[].Properties`).

            Paged with `$page` (default 1) and `$pagesize` (default 10).

            Order: As `GET /v1/customer/search-for-time-tracking-order-by-recent-registration`: caller's latest project-time registration first

            Empty result: 200 with TotalRecord "0" and no Entities
          content:
            application/json:
              schema:
                type: object
                description: 'TAF list envelope: each item is in `Entities[].Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/TafListPaging'
                  Entities:
                    type: array
                    description: Omitted (not `[]`) when the list is empty.
                    items:
                      type: object
                      properties:
                        Properties:
                          $ref: '#/components/schemas/CustomerRead'
                        Links:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafLink'
                        Actions:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafAction'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '403':
          description: '- **Code 103** — The authenticated user lacks a privilege the operation requires. On time registrations
            this is raised when the caller is not the registration''s owner and has no registration privilege that covers
            the owner. — When: searchAll=true while feature EnableAllEmployeesRegisterOnAllActiveProjects is off'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v1.crm.customer.searchforexpensetravel
  /v1/customer/search-for-time-tracking:
    get:
      operationId: searchCustomersForTimeTracking
      summary: Search customers for time tracking
      description: |-
        Searches the customers that have tasks the calling user is allocated to (or all customers with tasks, with searchAll).

        The customer picker of time registration. By default it returns customers that have at least one task the CALLER is allocated to, matched by name, nickname or number. With searchAll=true it returns every customer that has any task — this needs the 'register on all tasks' privilege. Results are ordered by CustomerID, newest first; for "most recently used first" use `GET /v1/customer/search-for-time-tracking-order-by-recent-registration`.

        **Use it to:**
        - Customer drop-down in a time-tracking client, before choosing project and task

        **Not for:**
        - Full customer register → `GET /v1/customer`

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Consistency: eventual

        **Next:** `POST /v1/time-registration`

        **See also:** `GET /v1/customer/search-for-time-tracking-order-by-recent-registration`, `GET /v1/customer/search-for-expense-travel-registration-order-by-recent-registration`

        > **Not yet documented:** behaviour → consistency; request → query params.
      tags:
      - Customers
      parameters:
      - name: searchText
