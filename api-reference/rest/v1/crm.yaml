          description: Company registration number.
      description: 'A customer as the REST v1 API returns it: the identifiers, name, number, status and tax numbers only.
        Every row of the customer table is a "customer" here, whatever its status: suppliers, partners, the tenant''s own
        company and the system "Multi customer project" row are included (see CustomerStatusID).'
    CustomerStatusRead:
      type: object
      properties:
        CustomerStatusID:
          type: integer
          readOnly: true
          x-timelog-identity:
            role: primary_id
            unique_scope: tenant
            uniqueness_enforced: true
            id_format: int
          description: |-
            Integer identifier. The value to send as CustomerStatusID on customer create/update.

            Identifier of this object, unique per TimeLog site.
        ID:
          type: string
          format: uuid
          readOnly: true
          x-timelog-identity:
            role: alternate_key
            unique_scope: tenant
            uniqueness_enforced: false
            id_format: guid
          description: |-
            The status GUID (CustomerStatusGUID). Not accepted as input by any REST v1 operation.

            Alternate key, unique per TimeLog site.
        Name:
          type: string
          readOnly: true
          maxLength: 255
          description: Status name as shown in TimeLog.
        IsDefault:
          type: boolean
          readOnly: true
          description: |-
            The tenant's default status flag.

            > **Not yet documented:** description.
        IsActive:
          type: boolean
          readOnly: true
          description: Active flag. Inactive statuses are listed too.
        CustomerStatusType:
          type: integer
          readOnly: true
          description: |-
            Which groups the status belongs to. Bit flags; a status can be in several groups.

            Value 4 (IsShownInSupport) was retired with the Helpdesk module and is reserved. Seed data: Customer = 1, Supplier = 2, Partner = 3 (customer + supplier).

            Bit flags — values combine.

            | Value | Name | Meaning |
            |---|---|---|
            | `0` | None | In no group. Seed status 'Import' has this value. |
            | `1` | IsShownInCustomers | Customer status: offered when a customer is created in TimeLog, and the only kind the tenant's own company may hold (business rule 31115). |
            | `2` | IsShownInSuppliers | Supplier status: suppliers are customers with such a status; creating a supplier uses the first status with this flag. |
            | `8` | IsShownInLeads | Offered for leads (the 'Leads' checkbox on the customer-status settings page). |
            | `16` | IsMultiCustomerProjects | System status of the 'Multi customer project' pseudo-customer. Never returned by this API (filtered out). |
      description: 'A tenant-defined customer status: the values a customer''s CustomerStatusID can take. Each status belongs
        to one or more groups (CustomerStatusType) that decide where it is offered — customers, suppliers, leads.'
