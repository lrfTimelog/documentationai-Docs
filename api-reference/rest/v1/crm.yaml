            > **Not yet documented:** constraints → unit.
        CustomerStatusID:
          type: integer
          readOnly: true
          x-timelog-identity:
            role: reference
          description: |-
            The customer's status. Statuses are tenant-defined; their group (customer, supplier, lead, multi-customer project) is CustomerStatusRead.CustomerStatusType. There is no status filter: list and get return suppliers and partners too.

            Refers to `CustomerStatusRead.CustomerStatusID`. Look up valid values with `GET /v1/customerstatus`.

            The "Multi customer project" pseudo-customer carries a status (AssociationFlags 16) that GET /v1/customerstatus does not list, so its CustomerStatusID cannot be resolved through the API. A NULL status in the database is returned as 0.

            Valid values come from `GET /v1/customerstatus`.
        VATNo:
          type: string
          readOnly: true
          maxLength: 200
          description: VAT number. Sent as VatNo on create/update.
