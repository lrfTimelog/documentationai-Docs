components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: |-
        OAuth 2.0 bearer token, sent as `Authorization: Bearer <token>`. JWT and reference tokens are both accepted. The token must carry the required scope (default `tlp`).

        The token's `sub` claim is the acting user. A token WITHOUT `sub` (client-credentials) acts as the system service user. If the `sub` user cannot log in (inactive, locked, deleted), the request is rejected with 401 — it is no longer let through without a user.

        > **Not yet documented:** how to obtain a token.

        > **Not yet documented:** token lifetime.
  schemas:
    ContactCreate.create:
      type: object
      properties:
        FirstName:
          type: string
          maxLength: 255
          description: |-
            First name of the contact.

            Can be set on create only.

            Contains personal data.

            - null, empty or whitespace — 400 "'First Name' must not be empty."

            - longer than 255 characters — Silently truncated to 255 by the insert procedure.
        LastName:
          type: string
          maxLength: 255
          description: |-
            Last name of the contact.

            Can be set on create only.

            Contains personal data.

            - null, empty or whitespace — 400 "'Last Name' must not be empty."
        CountryID:
          type: integer
          format: int32
          x-timelog-identity:
            role: reference
          description: |-
            Country of the contact's address.

            Can be set on create only.

            Refers to `CountryRead.CountryID`. Look up valid values with `GET /v1/country/get-all`.

            - 0, negative or omitted — 400 "'Country ID' must be greater than 0."

            - positive but unknown — 500 Code 102, ErrorCode 30017 (rest.crm.country-unknown).

            Valid values come from `GET /v1/country/get-all`.
        CustomerID:
          type: integer
          format: int32
          x-timelog-identity:
            role: reference
          default: 0
          description: |-
            The customer the contact belongs to.

            Can be set on create only.

            Refers to `CustomerRead.CustomerID`. Look up valid values with `GET /v1/customer`.

            - 0 or omitted — The contact is created WITHOUT a customer (KundeId 0); CustomerID 0 in the response.

            - The business rule CustomerExist never runs — it is gated on a change flag that is never set for CustomerID.

            Valid values come from `GET /v1/customer`.
        OwnerID:
          type: integer
          format: int32
          writeOnly: true
          x-timelog-identity:
            role: reference
          default: 0
          description: |-
            UserID of the TimeLog user who owns the contact. It also decides access for callers whose customer privilege is "customers where I am account manager": such a caller may create a contact only when they name themselves as owner.

            Refers to `UserRead.UserID`. Look up valid values with `GET /v1/user`.

            - 0 or omitted — No owner.

            - unknown UserID — The lookup exception is swallowed and the contact is created without an owner — no error.

            Valid values come from `GET /v1/user`.
        Phone:
          type: string
          maxLength: 255
          default: '""'
          description: |-
            Work phone.

            Can be set on create only.

            Contains personal data.
        PrivatePhone:
