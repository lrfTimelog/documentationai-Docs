  /v1/customer/update:
    put:
      operationId: updateCustomer
      summary: Update a customer
      description: |-
        Changes an existing customer's master data, addressed by CustomerID in the body.

        Updates name, number, contact data, owners, status, industry and addresses. Invoice settings cannot be changed here. The update is neither a full replace nor a patch: eleven text fields are CLEARED when omitted, the rest are left unchanged (see CustomerUpdate). Send the current value of every text field you do not want to lose. There is no validation of the body.

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Side effect: Saves the customer and its (unchanged) invoice settings; saves its external keys.
        - Side effect: Refreshes the owner copy on invoicing-potential rows and the customer name/number copy in the task search table.
        - Side effect: A changed CustomerStatusID: an extra save of the customer before the main save (CMGR.ChangeCustomerStatus → UpdatePrivate).
        - On failure: When CustomerStatusID changes, the status AND every group-A field and CurrencyID already mapped (Name, CustomerNo, NickName, OrganizationNo, Phone, Fax, Email, Website, VatNo, CreditorID, InvoicingName) are saved even if the main update then fails with 403 or 500. That save raises no CustomerUpdate event (src_only).
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v1/customer/{customerID}`, `GET /v1/customer`

        **Next:** `GET /v1/customer/{customerID}`

        **See also:** `POST /v1/customer/create`

        > **Not yet documented:** examples (success).
      tags:
      - Customers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerUpdate.update'
      responses:
        '200':
          description: The object, wrapped in the TAF envelope (`Properties`). The updated customer (GET /v1/customer/{id}
            representation).
          content:
            application/json:
              schema:
                type: object
                description: 'TAF envelope: the object is in `Properties`. Null members are omitted; a null result is `{"Links":
                  [self]}` without `Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/CustomerRead'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
                  Actions:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafAction'
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '403':
          description: |-
            - **Code 103** — The authenticated user lacks a privilege the operation requires. On time registrations this is raised when the caller is not the registration's owner and has no registration privilege that covers the owner. — When: Missing customer privilege; duplicate customer number; internal customer to a non-customer status (31115 text)

            - **Code 20012** — The caller has neither the 'all customers' privilege nor the 'customers where I am account manager' privilege covering this customer (the owner after the request is applied). — Fix: Use a user with the customer privilege.

            - **Code 30169** — Feature UniqueCustomerNumber is on and another customer has this CustomerNo. — Fix: Use another number, or omit it to take the next number of the series.

            - **Code 31115** — The tenant's own company (the internal customer) must keep a status flagged as a customer status. — Fix: Pick a status whose CustomerStatusType includes 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '500':
          description: |-
            - **Code 100** — Unhandled server error.

            - **Code 102** — The request is well-formed but violates a TimeLog business rule.

            - **Code 30018** — CustomerStatusID does not exist. — Fix: Use a CustomerStatusID from GET /v1/customerstatus.

            - **Code 30019** — IndustryID does not exist (inactive industries are accepted). — Fix: Use an IndustryID from GET /v1/industry/get-all.

            - **Code 37040** — PrimaryKAMID or SecondaryKAMID is not an existing user ID. — Fix: Send a user ID (not an employee ID).

            - **Code 37931** — The owner user exists but is inactive. — Fix: Choose an active user as owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: Empty body
                  value:
                    Code: 100
                    Details: []
                    Message: Unknown error occur in system, please contact system administrator.
                    Parameters: 'customer: {"CustomerID":0,"Name":null, ...}'
                    Url: https://{region-node}.timelog.com/{account}/api/v1/customer/update
      x-timelog-key: rest.v1.crm.customer.update
  /v1/customer/validate-new-customer:
    post:
      operationId: validateNewCustomer
      summary: Validate a new customer
      description: |-
        Runs the create validations on a customer body without saving anything.

        Runs model validation, the reference checks, the customer business rules and the invoice-setting rules of `POST /v1/customer/create`, then returns 200 with the body `null`.

        **Use it to:**
        - Validate a form before submitting, to show TimeLog's errors early

        **Rules across fields:**
        - R1: As `POST /v1/customer/create` R1–R3.

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **Next:** `POST /v1/customer/create`

        > **Not yet documented:** examples (success).
      tags:
      - Customers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreate.create'
      responses:
        '200':
          description: 'Success without content: HTTP 200 with the literal JSON body `null`. Literal JSON `null` — the body
            is valid.'
          content:
            application/json:
              schema:
                type: 'null'
        '400':
          description: '- **Code 200** — The request body or parameters failed input validation. — When: Model validation
            (see CustomerCreate) — Fix: Fix every item listed in Details and resend.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: Empty body
                  value:
                    Code: 200
                    Details:
                    - '''Name'' must not be empty.'
                    - '''Currency ID'' must not be empty.'
                    - '''Customer Status ID'' must not be empty.'
                    - '''Country ID'' must not be empty.'
                    Message: Invalid model state error.
                    Parameters: 'customer: {...}'
                    Url: https://{region-node}.timelog.com/{account}/api/v1/customer/validate-new-customer
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '500':
          description: |-
            - **Code 102** — The request is well-formed but violates a TimeLog business rule. — When: Reference checks, 38017, invoice-setting rules

            - **Code 30018** — CustomerStatusID does not exist. — Fix: Use a CustomerStatusID from GET /v1/customerstatus.

            - **Code 30019** — IndustryID does not exist (inactive industries are accepted). — Fix: Use an IndustryID from GET /v1/industry/get-all.

            - **Code 37040** — PrimaryKAMID or SecondaryKAMID is not an existing user ID. — Fix: Send a user ID (not an employee ID).

            - **Code 37931** — The owner user exists but is inactive. — Fix: Choose an active user as owner.

            - **Code 38017** — Another customer has the same name AND number (case-insensitive). Checked only against the customers the caller may see. — Fix: Change the name or the number.

            - **Code 37697** — UseEanNo is true on a tenant without the OIOXML feature. — Fix: Send UseEanNo false, or enable OIOXML.

            - **Code 60063** — UseEanNo is true but Address, ZipCode or City is blank.

            - **Code 60064** — UseEanNo is true and VatNo is blank.

            - **Code 37011** — ContactID or CustomerReferenceID (> 0) is not an existing contact.

            - **Code 30014** — InternalReferenceID (> 0) is not an existing employee ID.

            - **Code 37022** — PaymentTermID (> 0) does not exist.

            - **Code 100** — Unhandled server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
