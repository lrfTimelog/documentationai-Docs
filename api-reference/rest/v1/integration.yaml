    IntegrationConflictCreate.create:
      type: object
      properties:
        ErrorCode:
          type: integer
          description: |-
            The TimeLog error code the external change ran into. Must be a code that has a conflict type: at this commit only 37886 ("Task in completed task driven revenue contract cannot be deleted"), which yields ConflictType 2. Stored as OriginalErrorCode.

            Can be set on create only.

            - 0, negative or missing — 400 "'Error Code' must not be empty." / "must be greater than '0'."

            - any code other than 37886 — 500 Code 102, ErrorCode 37985 (no conflict type for that code).
        ErrorMessage:
          type: string
          minLength: 1
          description: |-
            The error message to show for the conflict. Stored unchanged as OriginalErrorMessage; TimeLog does not check that it matches ErrorCode.

            Can be set on create only.

            - null, empty or whitespace-only — 400 "'Error Message' must not be empty."
        ExternalSystemID:
          type: integer
          x-timelog-identity:
            role: reference
          description: |-
            The external system the conflicting change came from.

            Can be set on create only.

            Refers to `ExternalSystemRead.ID`. Look up valid values with `GET /v1/external-systems`.

            - 0, negative or missing — 400 "'External System ID' must not be empty." / "must be greater than '0'."

            - not an existing external system — 500 Code 102, ErrorCode 37045.

            Valid values come from `GET /v1/external-systems`.
      required:
      - ErrorCode
      - ErrorMessage
      - ExternalSystemID
      description: Reports that a change from an external system was refused by a TimeLog business rule. TimeLog derives the
        conflict type from ErrorCode and stores the conflict as Active.
    IntegrationConflictRead:
      type: object
      properties:
        ConflictID:
          type: integer
          format: int32
          readOnly: true
          x-timelog-identity:
            role: primary_id
            unique_scope: tenant
            uniqueness_enforced: true
            id_format: int
          description: |-
