            Alternate key, unique per TimeLog site.
        ConflictDateTime:
          type: string
          format: date-time
          readOnly: true
          description: |-
            When TimeLog recorded the conflict (the create call), not when the change happened in the external system.

            Time zone: server local time (DateTime.Now on the TimeLog web server), no offset in the value

            > **Not yet documented:** constraints → timezone.
        ConflictType:
          type: integer
          enum:
          - 1
          - 2
          x-enum-descriptions:
          - 'A task could not be moved because of invoicing. Declared but NOT creatable: no conflict model maps an error code
            to it at this commit.'
          - A task could not be deleted because it is in a completed task-driven revenue contract. Created when ErrorCode
            = 37886.
          readOnly: true
          description: |-
            What kind of conflict this is. Derived by TimeLog from the ErrorCode sent on create.

            Allowed values:

            | Value | Name | Meaning |
            |---|---|---|
            | `1` | TaskCannotBeMovedDueToInvoicing | A task could not be moved because of invoicing. Declared but NOT creatable: no conflict model maps an error code to it at this commit. |
            | `2` | TaskCannotBeDeletedDueToInvoicing | A task could not be deleted because it is in a completed task-driven revenue contract. Created when ErrorCode = 37886. |
        ConflictStatusType:
          type: integer
          enum:
          - 1
          - 2
          - 3
          x-enum-descriptions:
          - Open; no decision taken yet. Set on create.
          - Someone decided not to act on it.
          - Someone resolved it; ResolvedByUserID is then set.
          readOnly: true
          description: |-
            Where the conflict is in its life cycle. Always 1 (Active) when created through the API.

            Filterable via `conflictStatusType` (eq).

            Allowed values:

            | Value | Name | Meaning |
            |---|---|---|
            | `1` | Active | Open; no decision taken yet. Set on create. |
            | `2` | Ignored | Someone decided not to act on it. |
            | `3` | Resolved | Someone resolved it; ResolvedByUserID is then set. |

            > **Not yet documented:** values → members.
        ResolveOptionTypes:
          type: array
          items:
            enum:
            - 0
            - 1
            - 2
          readOnly: true
          description: |-
            The ways TimeLog offers to resolve a conflict of this ConflictType. Computed from the type on every read, not stored.

            - ConflictType = 2 — [1, 2]

            A stored ConflictType 1 row has no conflict model; mapping it would dereference a missing model (not reachable through POST).

            Allowed values:

            | Value | Name | Meaning |
            |---|---|---|
            | `0` | NotChosen | No option chosen (only appears in ResolveOptionTypeUsed). |
            | `1` | CloseOriginalTaskAndCreateACopyOfTask | Close the original task and create a copy of it. |
            | `2` | DeleteOriginalTaskAndCreateACopyOfTask | Delete the original task and create a copy of it. |
        ResolveOptionTypeUsed:
          type: integer
          enum:
          - 0
          - 1
          - 2
          x-enum-descriptions:
          - No option applied yet. Set on create.
          - The original task was closed and copied.
          - The original task was deleted and copied.
          readOnly: true
          description: |-
            The resolve option that was applied. 0 (NotChosen) until a resolution is recorded.

            Allowed values:

            | Value | Name | Meaning |
            |---|---|---|
            | `0` | NotChosen | No option applied yet. Set on create. |
            | `1` | CloseOriginalTaskAndCreateACopyOfTask | The original task was closed and copied. |
            | `2` | DeleteOriginalTaskAndCreateACopyOfTask | The original task was deleted and copied. |
        ResolvedByUserID:
          type:
          - integer
          - 'null'
          readOnly: true
          x-timelog-identity:
            role: reference
          description: |-
            The user who set the conflict to Resolved; null otherwise.

            Refers to `UserRead.UserID`. Look up valid values with `GET /v1/user`.

            Null: null = not resolved (or resolved before the field was set).

            Valid values come from `GET /v1/user`.
        OriginalErrorCode:
          type: integer
          readOnly: true
          description: The TimeLog error code that caused the conflict, as sent on create (ErrorCode). 37886 for every conflict
            creatable at this commit.
        OriginalErrorMessage:
          type: string
          readOnly: true
          description: The error message sent on create (ErrorMessage), stored as-is.
        ExternalSystemID:
          type: integer
          readOnly: true
          x-timelog-identity:
            role: reference
          description: |-
            The external system whose change caused the conflict.

            Refers to `ExternalSystemRead.ID`. Look up valid values with `GET /v1/external-systems`.

            Checked on create only; there is no foreign key, so after the external system is deleted the conflict keeps pointing at a missing ID.

            Valid values come from `GET /v1/external-systems`.
      description: 'A record that a change coming from an external system could not be applied in TimeLog because of a TimeLog
        business rule, kept so that someone can decide how to resolve it. At this commit exactly one kind is supported: a
        task that cannot be deleted because it sits in a completed task-driven revenue contract (TimeLog error 37886). Conflicts
        are created Active and carry the resolve options TimeLog offers for their type; REST v1 has no operation to change
        their status.'
