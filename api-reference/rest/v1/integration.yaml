openapi: 3.1.0
info:
  title: Integrations — REST API v1
  version: v1
  description: |-
    Register the external systems your keys belong to, and record sync conflicts TimeLog cannot resolve on its own.

    Enums are integers in v1.

    **Conventions that apply to every operation in this file:**
    - Property names are PascalCase.
    - Successful bodies use the TAF envelope: one object in `Properties`, lists in `Entities[].Properties`.
    - Some operations succeed without content: HTTP 200 with the literal body `null`, or HTTP 204.
    - `PUT` replaces the whole object: omitted fields are reset.
    - Treat error `Code` 102 as a business-rule violation, whether the HTTP status is 422 or 500.

    > **Not yet documented:** rate limits.
servers:
- url: https://app{server-number}.timelog.com/{account}/api
  description: 'Your TimeLog site, as in the browser address bar when you are signed in: `https://app[X].timelog.com/[account
    name]`. `server-number` is the number after `app` (for example `3` in `app3.timelog.com`), `account` is the account name
    you use to log in. If your browser shows `https://app.timelog.com`, find your site URL in System Administration > Integrations
    and API > Reporting API settings, under Your TimeLog API URL.'
  variables:
    server-number:
      default: '3'
    account:
      default: your-account
security:
- bearer: []
paths:
  /v1/external-systems:
    get:
      operationId: getAllExternalSystems
      summary: List external systems
      description: |-
        Lists the external systems registered in the tenant, ordered by name.

        Returns every external system of the tenant — the ones TimeLog's built-in integrations created (one per integration handler, e.g. "e-conomic &lt;site>_v1", "Microsoft Dynamics 365 Business Central &lt;site>_v1") and any an integrator registered itself. This is the lookup for the ExternalSystemID used by the external-key endpoints of time registrations, projects and tasks, and by integration conflicts.

        **Use it to:**
        - At integration start-up: find the ExternalSystemID your integration registered earlier (match on the ID you stored, not on the name — names are not unique).
        - Check whether your system is already registered before calling create, so a restart does not register a duplicate.
        - Build an admin view of which systems hold keys in this tenant.

        **Not for:**
        - Reading the key mappings themselves → the external-keys endpoints of time registrations, projects and tasks.

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Duplicates: Several systems may share a name (four 'Microsoft Outlook Calendar …' rows in the capture).
        - Changes are visible to the next read immediately.

        **Next:** `GET /v1/external-systems/{externalSystemID}`, `POST /v1/external-systems`

        **See also:** `PUT /v1/time-registration/{timeRegistrationID}/external-keys`, `PUT /v1/project/{projectID}/external-keys`, `PUT /v1/task/{taskID}/external-keys`
      parameters:
      - name: $page
        in: query
        required: false
        schema:
          type: integer
          default: 1
        description: Page number.
      - name: $pagesize
        in: query
        required: false
        schema:
          type: integer
          default: 10
        description: Page size. No maximum enforced in the API layer; with more than 10 systems, raise it or page.
      responses:
        '200':
          description: |-
            A list, wrapped in the TAF list envelope (`Entities[].Properties`). External systems, each with a self link and the create / update / delete TAF actions.

            Paged with `$page` (default 1) and `$pagesize` (default 10).

            Order: Name ascending (no sort parameter)

            Empty result: 200 with TotalRecord "0" and no Entities
          content:
            application/json:
              schema:
                type: object
                description: 'TAF list envelope: each item is in `Entities[].Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/TafListPaging'
                  Entities:
                    type: array
                    description: Omitted (not `[]`) when the list is empty.
                    items:
                      type: object
                      properties:
                        Properties:
                          $ref: '#/components/schemas/ExternalSystemRead'
                        Links:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafLink'
                        Actions:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafAction'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
        '401':
          description: '- Missing, invalid or expired bearer token. — When: No or invalid bearer token — Fix: Obtain a new
            token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
      x-timelog-key: rest.v1.integration.externalsystem.list
    post:
      operationId: createExternalSystem
      summary: Register an external system
      description: |-
        Registers a new external system and returns it with its new ID.

        Creates the "other side" an integration links TimeLog objects to. Do this once per integration (per tenant), store the returned ID, and use it as ExternalSystemID when you write external keys on time registrations, projects and tasks. TimeLog does not deduplicate: every call creates a new system, even with a name that already exists.

        **Use it to:**
        - First run of a new integration: register your system, persist Properties.ID in your own configuration.
        - One system per counterpart: an integration syncing two ERPs registers two systems so their keys never collide.

        **Not for:**
        - Setting up a TimeLog built-in finance/payroll integration — creating its integration handler registers the system automatically.

        **Behaviour:**
        - Not idempotent.
        - Not safe to retry blindly. A retry after a timeout registers a second system. List first and match on the ID you stored (or, failing that, on name + description) before retrying.
        - Duplicates: None — names are not unique and are not checked.
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v1/external-systems`

        **Next:** `PUT /v1/time-registration/{timeRegistrationID}/external-keys`, `PUT /v1/project/{projectID}/external-keys`, `PUT /v1/task/{taskID}/external-keys`

        **See also:** `PUT /v1/external-systems/{externalSystemID}`

        > **Not yet documented:** examples (success).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalSystemWrite.create'
      responses:
        '200':
          description: The object, wrapped in the TAF envelope (`Properties`). The created external system, read back with
            GET /v1/external-systems/{id} (same representation). IsSystemExternalSystem is always false.
          content:
            application/json:
              schema:
                type: object
                description: 'TAF envelope: the object is in `Properties`. Null members are omitted; a null result is `{"Links":
                  [self]}` without `Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/ExternalSystemRead'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
                  Actions:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafAction'
        '400':
          description: '- **Code 200** — The request body or parameters failed input validation. — When: Name or Description
            null, empty or whitespace-only — Fix: Fix every item listed in Details and resend.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: Missing Name and Description
                  value:
                    Code: 200
                    Details:
                    - '''Name'' must not be empty.'
                    - '''Description'' must not be empty.'
                    Message: Invalid model state error.
                    Parameters: 'externalSystemCreateModel: {"Name":null,"Description":null}'
                    Url: https://app{server-number}.timelog.com/{account}/api/v1/external-systems
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: No body
                  value:
                    Code: 100
                    Details: []
                    Message: Unknown error occur in system, please contact system administrator.
                    Parameters: 'externalSystemCreateModel: null'
                    Url: https://app{server-number}.timelog.com/{account}/api/v1/external-systems
      x-timelog-key: rest.v1.integration.externalsystem.create
  /v1/external-systems/{externalSystemID}:
    get:
      operationId: getExternalSystemById
      summary: Get an external system
      description: |-
        Returns one external system by its integer ID.

        Reads a single external system. Create and update answer with this same representation. Use it to confirm that the ExternalSystemID your integration stored still exists before writing external keys against it.

        **Use it to:**
        - Verify a stored ExternalSystemID at integration start-up (an unknown ID returns 500 / ErrorCode 37045, not 404).

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v1/external-systems`

        **Next:** `PUT /v1/external-systems/{externalSystemID}`

        > **Not yet documented:** examples (success).
      parameters:
      - name: externalSystemID
        in: path
        required: true
        schema:
          type: integer
          format: int32
        description: The external system's integer ID.
      responses:
        '200':
          description: |-
            The object, wrapped in the TAF envelope (`Properties`). The external system, with a self link and the create / update / delete TAF actions.

            Empty result: Unknown ID → 500 Code 102 with ErrorCode 37045, not 404
          content:
            application/json:
              schema:
                type: object
                description: 'TAF envelope: the object is in `Properties`. Null members are omitted; a null result is `{"Links":
                  [self]}` without `Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/ExternalSystemRead'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
                  Actions:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafAction'
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '404':
          description: '- The URL did not match any route (including a route constraint such as {id:int} receiving a non-integer).
            — When: externalSystemID is not an integer (route constraint)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '500':
          description: '- **Code 37045** — externalSystemID (query) or ExternalSystemID (body) is not an external system of
            the tenant. Checked before the project / task exists. — Fix: Use an ExternalSystemID from the external-systems
            list (not curated yet), or create the external system first.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: Unknown external system ID
                  value:
                    Code: 102
                    Details:
                    - Message: 'No external system with ExternalSystemID: 1 exist'
                      ErrorCode: 37045
                    Message: Business rules exception.
                    Parameters: 'externalSystemID: 1'
                    Url: https://app{server-number}.timelog.com/{account}/api/v1/external-systems/1
      x-timelog-key: rest.v1.integration.externalsystem.get
    put:
      operationId: updateExternalSystem
      summary: Update an external system
      description: |-
        Replaces the name and description of an external system.

        Overwrites both text fields of an existing external system; the ID, and every external key and conflict attached to it, stay as they are. Both fields are required — send the current value of the one you do not want to change.

        **Use it to:**
        - Rename your integration's system after a product rename, keeping all its external keys.

        **Not for:**
        - Renaming a system created by a built-in TimeLog integration — those integrations resolve mappings by name; keep their names unique (see ExternalSystemRead.Name).

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Side effect: Updates ExternalSystemName and ExternalSystemDescription of the row. External keys and conflicts reference the ID and are untouched.
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v1/external-systems/{externalSystemID}`

        **See also:** `POST /v1/external-systems`

        > **Not yet documented:** examples (success).
      parameters:
      - name: externalSystemID
        in: path
        required: true
        schema:
          type: integer
          format: int32
        description: The external system to update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalSystemWrite.update'
      responses:
        '200':
          description: The object, wrapped in the TAF envelope (`Properties`). The updated external system, read back with
            GET /v1/external-systems/{id}.
          content:
            application/json:
              schema:
                type: object
                description: 'TAF envelope: the object is in `Properties`. Null members are omitted; a null result is `{"Links":
                  [self]}` without `Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/ExternalSystemRead'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
                  Actions:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafAction'
        '400':
          description: '- **Code 200** — The request body or parameters failed input validation. — When: Name or Description
            null, empty or whitespace-only (checked before the ID) — Fix: Fix every item listed in Details and resend.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: Empty body
                  value:
                    Code: 200
                    Details:
                    - '''Name'' must not be empty.'
                    - '''Description'' must not be empty.'
                    Message: Invalid model state error.
                    Parameters: 'externalSystemUpdateModel: {"Name":null,"Description":null}'
                    Url: https://app{server-number}.timelog.com/{account}/api/v1/external-systems/1
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '404':
          description: '- The URL did not match any route (including a route constraint such as {id:int} receiving a non-integer).
            — When: externalSystemID is not an integer (route constraint)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '500':
          description: |-
            - **Code 37045** — externalSystemID (query) or ExternalSystemID (body) is not an external system of the tenant. Checked before the project / task exists. — When: externalSystemID does not exist — Fix: Use an ExternalSystemID from the external-systems list (not curated yet), or create the external system first.

            - **Code 100** — Unhandled server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: No body, unknown ID
                  value:
                    Code: 102
                    Details:
                    - Message: 'No external system with ExternalSystemID: 1 exist'
                      ErrorCode: 37045
                    Message: Business rules exception.
                    Parameters: 'externalSystemUpdateModel: null'
                    Url: https://app{server-number}.timelog.com/{account}/api/v1/external-systems/1
      x-timelog-key: rest.v1.integration.externalsystem.update
  /v1/integration-conflicts:
    get:
      operationId: getAllIntegrationConflicts
      summary: List integration conflicts
      description: |-
        Lists integration conflicts, newest first, optionally only those in one status.

        Returns the conflicts recorded in the tenant — changes from an external system that TimeLog refused on a business rule and parked for a decision — with the resolve options TimeLog offers for each. Filter on conflictStatusType=1 to get the open (Active) ones.

        **Use it to:**
        - Poll for open conflicts (conflictStatusType=1) and surface them in your integration's monitoring.
        - Check whether a conflict your integration reported earlier is still Active before reporting it again.

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **Next:** `GET /v1/integration-conflicts/{integrationConflictID}`

        **See also:** `POST /v1/integration-conflicts`

        > **Not yet documented:** errors.
      parameters:
      - name: conflictStatusType
        in: query
        required: false
        schema:
          type: integer
          x-timelog-filter:
            operators:
            - eq
        description: |-
          1 = Active, 2 = Ignored, 3 = Resolved. Omitted = conflicts in every status.

          Filters on `IntegrationConflictRead.ConflictStatusType` (eq).
      - name: $page
        in: query
        required: false
        schema:
          type: integer
          default: 1
        description: Page number.
      - name: $pagesize
        in: query
        required: false
        schema:
          type: integer
          default: 10
        description: Page size. No maximum enforced in the API layer.
      responses:
        '200':
          description: |-
            A list, wrapped in the TAF list envelope (`Entities[].Properties`). Conflicts, each with a self link.

            Paged with `$page` (default 1) and `$pagesize` (default 10).

            Order: ConflictID descending (newest first; no sort parameter)

            Empty result: 200 with TotalRecord "0", TotalPage "0" and no Entities
          content:
            application/json:
              schema:
                type: object
                description: 'TAF list envelope: each item is in `Entities[].Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/TafListPaging'
                  Entities:
                    type: array
                    description: Omitted (not `[]`) when the list is empty.
                    items:
                      type: object
                      properties:
                        Properties:
                          $ref: '#/components/schemas/IntegrationConflictRead'
                        Links:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafLink'
                        Actions:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafAction'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
        '400':
          description: '- **Code 200** — The request body or parameters failed input validation. — When: conflictStatusType
            is not a member name or number of the enum (model binding) — not captured — Fix: Fix every item listed in Details
            and resend.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
      x-timelog-key: rest.v1.integration.integrationconflict.list
    post:
      operationId: createIntegrationConflict
      summary: Report an integration conflict
      description: |-
        Records that a change from an external system was refused by a TimeLog business rule, as an Active conflict.

        Lets an integration hand a refusal back to TimeLog instead of retrying forever or dropping it: the conflict is stored as Active with the resolve options TimeLog offers for its type, so a person can decide what to do. Only one kind can be reported at this commit — ErrorCode 37886 (a task in a completed task-driven revenue contract cannot be deleted), offering "close and copy" or "delete and copy" the task. Any other code is refused with 37985.

        **Use it to:**
        - Your ERP deleted a task that TimeLog refuses to delete (37886): report it here instead of retrying the delete.

        **Not for:**
        - Logging arbitrary sync errors — only error codes with a registered conflict type are accepted.

        **Behaviour:**
        - Not idempotent.
        - Not safe to retry blindly. Every call inserts a new conflict; there is no deduplication on ErrorCode / ExternalSystemID / message. List Active conflicts before retrying.
        - Duplicates: None.
        - Side effect: Clears the IntegrationConflict cache.
        - Side effect: Raises the TLP event IntegrationConflictCreated (event type 594), with the conflict as JSON.
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v1/external-systems`

        **Next:** `GET /v1/integration-conflicts/{integrationConflictID}`

        **See also:** `GET /v1/integration-conflicts`

        > **Not yet documented:** behaviour → events emitted; examples (success).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationConflictCreate.create'
      responses:
        '200':
          description: The object, wrapped in the TAF envelope (`Properties`). The created conflict (ConflictStatusType 1,
            ResolveOptionTypeUsed 0), read back with GET /v1/integration-conflicts/{id}.
          content:
            application/json:
              schema:
                type: object
                description: 'TAF envelope: the object is in `Properties`. Null members are omitted; a null result is `{"Links":
                  [self]}` without `Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/IntegrationConflictRead'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
                  Actions:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafAction'
        '400':
          description: '- **Code 200** — The request body or parameters failed input validation. — When: ErrorCode or ExternalSystemID
            missing / <= 0; ErrorMessage empty — Fix: Fix every item listed in Details and resend.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '500':
          description: |-
            - **Code 37985** — ErrorCode is not a code TimeLog can turn into a conflict. At this commit only 37886 is accepted. — When: ErrorCode is not 37886 — Fix: Send ErrorCode 37886 (task in a completed task-driven revenue contract cannot be deleted); other refusals cannot be recorded as conflicts.

            - **Code 37045** — externalSystemID (query) or ExternalSystemID (body) is not an external system of the tenant. Checked before the project / task exists. — When: ExternalSystemID does not exist — Fix: Use an ExternalSystemID from the external-systems list (not curated yet), or create the external system first.

            - **Code 100** — Unhandled server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v1.integration.integrationconflict.create
  /v1/integration-conflicts/{integrationConflictID}:
    get:
      operationId: getIntegrationConflictById
      summary: Get an integration conflict
      description: |-
        Returns one integration conflict by its integer ConflictID.

        Reads a single conflict, including its current status and the resolve options for its type. Create answers with this same representation.

        **Use it to:**
        - Follow up a conflict your integration reported: has someone resolved or ignored it yet?

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v1/integration-conflicts`

        **See also:** `POST /v1/integration-conflicts`

        > **Not yet documented:** examples (success).
      parameters:
      - name: integrationConflictID
        in: path
        required: true
        schema:
          type: integer
          format: int32
        description: The conflict's integer ID.
      responses:
        '200':
          description: |-
            The object, wrapped in the TAF envelope (`Properties`). The conflict, with a self link and the create-integration-conflict TAF action.

            Empty result: Unknown ID → 500 Code 102 with ErrorCode 37048, not 404
          content:
            application/json:
              schema:
                type: object
                description: 'TAF envelope: the object is in `Properties`. Null members are omitted; a null result is `{"Links":
                  [self]}` without `Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/IntegrationConflictRead'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
                  Actions:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafAction'
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '404':
          description: '- The URL did not match any route (including a route constraint such as {id:int} receiving a non-integer).
            — When: integrationConflictID is not an integer (route constraint)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '500':
          description: '- **Code 37048** — integrationConflictID is not a conflict of the tenant (also 0 and negative values).
            Not a 404. — Fix: Use a ConflictID from GET /v1/integration-conflicts.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: Unknown conflict ID
                  value:
                    Code: 102
                    Details:
                    - Message: 'No integration conflict with ConflictID: 1 exist'
                      ErrorCode: 37048
                    Message: Business rules exception.
                    Parameters: 'integrationConflictID: 1'
                    Url: https://app{server-number}.timelog.com/{account}/api/v1/integration-conflicts/1
      x-timelog-key: rest.v1.integration.integrationconflict.get
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: |-
        OAuth 2.0 bearer token, sent as `Authorization: Bearer <token>`. JWT and reference tokens are both accepted. The token must carry the required scope (default `tlp`).

        The token's `sub` claim is the acting user. A token WITHOUT `sub` (client-credentials) acts as the system service user. If the `sub` user cannot log in (inactive, locked, deleted), the request is rejected with 401 — it is no longer let through without a user.

        > **Not yet documented:** how to obtain a token.

        > **Not yet documented:** token lifetime.
  schemas:
    ExternalSystemRead:
      type: object
      properties:
        ID:
          type: integer
          format: int32
          readOnly: true
          x-timelog-identity:
            role: primary_id
            unique_scope: tenant
            uniqueness_enforced: true
            id_format: int
          description: |-
            Integer identifier of the external system. Send it as ExternalSystemID on the external-key endpoints and on POST /v1/integration-conflicts.

            Identifier of this object, unique per TimeLog site.
        Name:
          type: string
          readOnly: true
          maxLength: 200
          description: |-
            Display name of the external system. For systems created by TimeLog's built-in integrations it is the integration handler's name. Those integrations resolve their key mappings by THIS NAME (not by ID) in several stored procedures, so two systems with the same name can make such a lookup land on the other system's keys.

            Always store the ID, never the name.
        Description:
          type: string
          readOnly: true
          maxLength: 255
          description: Free-text description. Required on create/update, so normally non-empty; a NULL in the table is returned
            as an empty string.
        IsSystemExternalSystem:
          type: boolean
          readOnly: true
          description: |-
