            - **Code 400** — A business rule of the update rejected it: ParentTaskID unknown (37001 text), hourly rate not on the contract (37944 text), task save / Validate / update rules, WBS depth, move rules (other project, own sub-task 37662, recurring mix, receiver cannot be parent, contract-sub-group WBS rule, project-level rules), status rules (NotStarted with registrations 30027, planning task 37576), or a violation from the status change itself (Update only). — Fix: Read Message; fix the field it names. On Update a rejected status change may leave an earlier move saved.
          content:
