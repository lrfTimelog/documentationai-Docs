    post:
      operationId: createPayment
      summary: Create a payment on a contract
      description: |-
        Adds an instalment to a contract's billing plan and returns it.

        Adds a payment (instalment to invoice) to a fixed-price, time-and-material account-end-balancing, prepaid-services or task-driven-revenue contract of the project, then saves the project's billing plan. Answers 200 with the new payment (PaymentRead). On task-driven-revenue contracts a payment can be linked to a task and flagged as the task's fixed-price instalment — which unlinks the task's other instalments (see side effects).

        **Use it to:**
        - Import a payment plan from an ERP or quote tool

        **Rules across fields:**
        - R1: ProjectSubContractID must be a contract of ProjectID (checked during body validation).
        - R2: The contract must be FixedPriceBasic, TimeMaterialAccountEndBalancing, PrepaidServices or TaskDrivenRevenue (400).
        - R3: TaskID and IsFixedPricePayment only on a TaskDrivenRevenue contract (400); a TaskID must be on the contract.

        **Behaviour:**
        - Not idempotent.
        - Not safe to retry blindly. Every call adds a new instalment; nothing deduplicates. After a lost response, list the contract's payments before retrying.
        - Side effect: Adds the instalment (InstallmentType 1 for fixed-price contracts, else 3; product number defaulted when the feature is on) and saves the whole billing plan through ProjectManager.Save.
        - Side effect: IsFixedPricePayment = true: every OTHER instalment of the project with the same TaskID loses its task link (TaskID → null) and its fixed-price flag.
        - Side effect: Per saved payment: payment budget periods (recurrence contracts), contract payment-plan amount sync (fixed-price / task-driven), invoicing-potential and registration-currency notifications, contract pending-booking status refresh.
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v1/project/get-all`, `POST /v1/payment/validate-new-payment`

        **Next:** `GET /v1/payment/{paymentID}`, `GET /v1/payment`

        > **Not yet documented:** behaviour → events emitted; behaviour → side effects on failure; examples; request → body.
