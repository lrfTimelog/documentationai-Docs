  /v1/contract/create-fixed-price-basic-contract:
    post:
      operationId: createFixedPriceBasicContract
      summary: Create a fixed-price contract
      description: |-
        Adds a FixedPriceBasic contract (model 2) to an existing project and returns it.

        Creates a fixed-price (standard agreement) contract, on ProjectID, with the fields of ContractCreate that this type accepts (the others are ignored — see the overrides). Answers 200 with the new contract as ContractRead, which carries no budgets: read them in the TimeLog UI or trust what you sent, keeping in mind the server-side derivations on ContractCreate's fields. Also creates the contract's hourly rates and customers from the project, and possibly a first instalment (see side effects). Not idempotent and not atomic. No project privilege is checked.

        **Use it to:**
        - Add a fixed-price agreement (with its payment-plan amount) to an existing project
        - Import a quote accepted in a CRM as a fixed-price contract

        **Not for:**
        - A dry run: `POST /v1/contract/validate-fixed-price-basic-contract`
        - Recurring contracts (periodic balancing, continuous service, FPVI) — no REST v1 create

        **Rules across fields:**
        - R1: BudgetWorkAmount and TargetHourlyRate are mutually exclusive: at most one may be non-zero (400).
        - R2: Send BudgetWorkHour > 0 whenever BudgetWorkAmount or TargetHourlyRate is sent; with 0 hours both are stored as 0.

        **Behaviour:**
        - Not idempotent.
        - Not safe to retry blindly. Every call inserts a new contract; there is no external key or dedup. After a timeout or a 500, list the project contracts (newest first) before retrying.
        - Side effect: Inserts the contract (model 2 FixedPriceBasic, the sent status and owner) and writes a contract-history entry.
        - Side effect: Budget link: the project's FIRST contract is budget-linked (the project's budget hours / work amount are set from it); any later contract is not, and adding it clears the budget link of every other contract of the project.
        - Side effect: IsDefaultExpenses true clears the flag on the project's other contracts.
        - Side effect: Creates the contract's hourly rates and contract customers from the project; notifies the project (may activate an inactive project when the contract is active).
        - Side effect: First instalment: PaymentPlanAmount (when not 0): one instalment of the fixed price, invoice date = server 'now'.
        - Side effect: Tasks on the contract whose hourly-rate model is not Allocated get TargetHourlyRate (none exist on a new contract).
        - Side effect: Re-saves the project after the contract.
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v1/project/get-all`, `GET /v1/user`, `GET /v1/ContractModel`

        **Next:** `GET /v1/contract/{contractID}`, `GET /v1/contract`, `POST /v1/payment`

        > **Not yet documented:** behaviour → side effects; examples.
      tags:
      - Projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractCreate.create.createFixedPriceBasicContract'
      responses:
        '200':
          description: The object, wrapped in the TAF envelope (`Properties`). The new contract, read back through GET /v1/contract/{ContractID}.
          content:
            application/json:
              schema:
                type: object
                description: 'TAF envelope: the object is in `Properties`. Null members are omitted; a null result is `{"Links":
                  [self]}` without `Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/ContractRead'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
                  Actions:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafAction'
        '400':
          description: '- **Code 200** — The request body or parameters failed input validation. — When: Body validation (see
            ContractCreate): ProjectID > 0, ContractName, ContractStatus 1–4, decimals, type rules (captured for an empty
            body). — Fix: Fix every item listed in Details and resend.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: Empty body
                  value:
                    Code: 200
                    Details:
                    - '''Project ID'' must be greater than ''0''.'
                    - '''Contract Name'' must not be empty.'
                    - '''Contract Status'' has a range of values which does not include ''0''.'
                    Message: Invalid model state error.
                    Parameters: 'contractModel: {...}'
                    Url: https://{region-node}.timelog.com/{account}/api/v1/contract/create-fixed-price-basic-contract
        '401':
          description: '- Missing, invalid or expired bearer token. — When: Captured. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '500':
          description: |-
            - **Code 100** — Unhandled server error.

            - **Code 37014** — The projectID in the path (update, update-status) or ProjectID in the payment body does not exist (0 and negative included). Not a 404. — When: ProjectID does not exist (checked after body validation). — Fix: Use a ProjectID from `GET /v1/project/get-all`.

            - **Code 37040** — ContractOwnerUserID is not an existing USER ID — including 0, which the body validator accepts. Checked after the project. — When: Also for ContractOwnerUserID 0. — Fix: Send a user ID (`GET /v1/user`), not an employee ID; 0 is not a 'default to project manager' here.

            - **Code 37931** — ContractOwnerUserID is a deactivated user. — Fix: Choose an active user as contract owner.

            - **Code 37957** — The tenant feature ContractTypeIsRequired is on and ContractTypeID is 0 or negative. Checked after project and owner, before the contract is built. — Fix: Send the ContractTypeID of one of the tenant's contract types.

            - **Code 37958** — ContractTypeID > 0 is not a contract type of the tenant. Raised by the contract's save business rules before the insert, so nothing is written. — Fix: Use an existing contract type ID, or 0 when the feature ContractTypeIsRequired is off.

            - **Code 102** — The request is well-formed but violates a TimeLog business rule. — When: Other save rules of the contract (ValidateSaveBusinessRules, contract customers) or of the project save.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v1.projectmanagement.contract.createfixedpricebasic
