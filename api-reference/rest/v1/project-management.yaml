            - **Code 200** — The request body or parameters failed input validation. — When: Body rules of TaskUpdate (empty TaskName, negative numbers, TaskTypeID 0, Status not a member, invalid dates, R1). — Fix: Fix every item listed in Details and resend.

            - **Code 400** — The body was empty or JSON null. — When: Empty or JSON null body. — Fix: Send a JSON object with at least the fields to change (an empty object {} is accepted and changes nothing).

