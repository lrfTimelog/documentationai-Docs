  /v1/task/registration:
    post:
      operationId: createTaskRegistration
      summary: Register time on a task (for yourself)
      description: |-
        Registers project time for the authenticated user on one task and date.

        The short form of time registration used by the TAF action add-registration on every task entity: no ID, no UserID, no GroupType. The registration is always for the caller, always project time (GroupType 1) in hours; the server generates its GUID. Unlike POST /v1/time-registration, the response body is the literal JSON `null` — the new registration's ID is not returned, so the only way to find it is to list your registrations afterwards. If the caller is not yet allocated to the task, TimeLog creates the allocation first.

        **Use it to:**
        - Quick registration from a task picker (search-for-time-tracking → add-registration)

        **Not for:**
        - Registering for another user, absence or travel-time group type, or when you need the created ID → `POST /v1/time-registration`
        - Import with project/contract and an hourly-rate override → `POST /v1/time-registration/import`

        **Rules across fields:**
        - R1: StartTime and EndTime both sent → EndTime > StartTime and whole minutes between them = round(Hours × 60).

        **Behaviour:**
        - Not idempotent.
        - Not safe to retry blindly. Each call generates a new GUID: a retry after a timeout creates a second registration. List the caller's registrations before retrying.
        - Duplicates: Never deduplicated: the GUID is server-generated per call.
        - Side effect: If the caller is not allocated to the task: adds the caller to the project's resource group and contract team and creates a 0-hour allocation — BEFORE business-rule validation and outside the save transaction, so it persists when the registration is rejected.
        - Side effect: Creates the work unit; updates invoicing potential, salary posting and mileage links; recalculates financial data after commit (pilot trace).
        - Read-after-write consistency: not yet documented.

        **Call first:** `GET /v1/task/search-for-time-tracking`, `GET /v1/task/get-recently-registered`

        **See also:** `POST /v1/time-registration`

        > **Not yet documented:** behaviour → consistency; examples; request → body.
