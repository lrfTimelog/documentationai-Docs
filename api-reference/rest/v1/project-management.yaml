        '400':
          description: |-
            - **Code 200** — The request body or parameters failed input validation. — When: Body rules of TaskUpdate and R1. — Fix: Fix every item listed in Details and resend.

            - **Code 400** — The body was empty or JSON null. — Fix: Send a JSON object with at least the fields to change (an empty object {} is accepted and changes nothing).

            - **Code 400** — Both budget fields were sent and the task's budget follows an hourly rate: time & material contract or Allocated rate model with HourlyRateID > 0, or fixed price with Calculated rate model and a task hourly rate > 0 (judged after a HourlyRateID in the same body is applied). — Fix: Send only one of BudgetHours / BudgetAmount.

