    post:
      operationId: createTask
      summary: Create a task on a project
      description: |-
        Adds a root task to a project's plan and returns it.

        Creates a task at the next top-level position of the project's work breakdown structure, on the contract you name (default: the project's main contract), with its budget and hourly rate; for task-driven-revenue (TDR) contracts also its payment settings. Answers 200 with the new task as TaskRead. Not idempotent and not atomic. No project privilege is checked. An empty or half-filled body answers 500 Code 100 instead of a 400 field list: always send ProjectID, TaskName, StartDate, EndDate, BudgetHours, BudgetAmount and HourlyRateID.

        **Use it to:**
        - Create the task structure of a project created from an external system (ERP / CRM project sync)
        - Add a task for a new deliverable before people register time on it

        **Not for:**
        - A task under an existing task → `POST /v1/task/create-sub-task`
        - A dry run → `POST /v1/task/validate-new-task`

        **Rules across fields:**
        - R1: Time & material contract: BudgetHours, BudgetAmount and HourlyRateID may not ALL be non-zero (one is derived from the other two). 400 with one message per field.
