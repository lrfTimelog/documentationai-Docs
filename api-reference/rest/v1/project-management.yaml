        required: true
        schema:
          type: integer
          format: int32
        description: The task to check. Route constraint :int.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdate.update'
      responses:
        '200':
          description: 'Success without content: HTTP 200 with the literal JSON body `null`. The literal `null` (TafSuccessResult):
