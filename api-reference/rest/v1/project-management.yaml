      - Projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCreate.create'
      responses:
        '200':
          description: The object, wrapped in the TAF envelope (`Properties`). The created payment, read back through GET
            /v1/payment/{paymentID}.
          content:
            application/json:
              schema:
                type: object
                description: 'TAF envelope: the object is in `Properties`. Null members are omitted; a null result is `{"Links":
                  [self]}` without `Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/PaymentRead'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
                  Actions:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafAction'
        '400':
          description: '- **Code 200** — The request body or parameters failed input validation. — When: Body validation (see
            PaymentCreate) once the contract resolves: Name, InvoiceDate, ProjectID, TaskID, ProjectSubContractID, DiscountPercentage
            0–100, UnitType, contract type (R2), TaskID / IsFixedPricePayment (R3). — Fix: Fix every item listed in Details
            and resend.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '403':
          description: '- **Code 103** — The authenticated user lacks a privilege the operation requires. On time registrations
            this is raised when the caller is not the registration''s owner and has no registration privilege that covers
            the owner. — When: The caller''s project privileges do not cover ProjectID.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '500':
          description: |-
            - **Code 37042** — ProjectSubContractID does not exist or is not a contract of ProjectID. Raised INSIDE body validation (the validator loads the contract), so it replaces the 400 field list — an empty body gets this error. — When: Also for an empty body — replaces the 400 list. — Fix: Send a contract of the project (both IDs > 0).

            - **Code 37014** — The projectID in the path (update, update-status) or ProjectID in the payment body does not exist (0 and negative included). Not a 404. — Fix: Use a ProjectID from `GET /v1/project/get-all`.

            - **Code 37949** — TaskID (> 0) is not a task on ProjectSubContractID. — Fix: Use a task of the contract, or 0.

            - **Code 37939** — ProductNumber is supplied, the product-number feature is on, and no such product number exists in the project's legal entity. — Fix: Use an existing product number of the legal entity, or omit it for the default.

            - **Code 100** — Unhandled server error.

            - **Code 102** — The request is well-formed but violates a TimeLog business rule. — When: Billing-plan save rules (ValidateSaveBusinessRules).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: Empty body — contract check runs inside validation
                  value:
                    Code: 102
