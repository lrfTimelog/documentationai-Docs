            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '403':
          description: '- **Code 103** — The caller has no project-area privilege ViewCreateEditDelete covering the task''s
            project and, for a template project, not the system-administration project-templates page. Read access alone is
            not enough — this also applies to GET .../allocation. — Fix: Use a user with project privileges on the project
            (or make the integration user project manager / give it an ''all projects'' role).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '404':
          description: '- **Code 404** — allocationID in the path is not an allocation. — Fix: Use an AllocationID from `GET
            /v1/task/{taskID}/allocation`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
