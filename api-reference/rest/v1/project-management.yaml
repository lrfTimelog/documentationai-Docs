        - R4: TDR contract: PaymentRecognitionModel must be 1 or 2; with 2, PaymentProductNo, PaymentName and PaymentInvoiceDate are required (400).
        - R5: EndDate must be on or after StartDate (400).
        - R6: ParentTaskID must be a task of ProjectID. Not checked as such: the parent is matched by WBS number inside ProjectID.

        **Behaviour:**
        - Not idempotent.
        - Not safe to retry blindly. Every call inserts a new sub-task. After a timeout or a 500, list the project's tasks before retrying.
        - Side effect: The parent becomes a parent task: its parent properties are recalculated and every instalment linked to the parent is DELETED from the billing plan (unless the parent is a contract sub-group task).
        - Side effect: Billing plan notification, TDR / TMB instalment update and project re-save as on `POST /v1/task`.
        - On failure: As on create: the task, the parent's instalment deletion and the project re-save are committed before MapTDRTaskWithPayment.
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v1/task`, `POST /v1/task`

