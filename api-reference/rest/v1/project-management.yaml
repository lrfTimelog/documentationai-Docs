  /v1/project/{projectID}/status:
    put:
      operationId: updateProjectStatus
      summary: Change a project's status
      description: |-
        Moves a project to another status (Quote … Cancelled) and sets whether time can be registered on it.

        Sets the project status and its status date (today), opens or closes the project for time registration (InProgress opens, OnHold / Completed / Archived / Cancelled close, Quote / Approved follow AllowTimeTracking), and when closing (Completed, Archived, Cancelled) also completes the open milestones and moves every contract to Completed (Cancelled for Cancelled). Re-opening the project does NOT re-open contracts. Always send ProjectStatus: an omitted value is 0 = Quote. Answers 200 with `null`.

        **Use it to:**
        - Close a project from an ERP when the engagement ends
        - Open a won quote for time registration (Approved + AllowTimeTracking, or InProgress)

        **Rules across fields:**
        - R1: AllowTimeTracking is used only with ProjectStatus 0 (Quote) or 1 (Approved).

        **Behaviour:**
        - Idempotent.
        - Safe to retry. Same body → same status; the status date is reset to today and ProjectStatusChanged is raised again.
        - Side effect: Saves the project status units (status date = today), writes the status (DAO.UpdateOrderStatus) and notifies running time trackers of the status change.
        - Side effect: Sets OpenForTimeRegistration; on Completed / Archived / Cancelled completes open milestones and changes every open contract to Completed / Cancelled.
        - On failure: The status write happens inside ChangeOrderStatus, before the project save; a failure in the save leaves the new status written.
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v1/project/{projectID}`

        **See also:** `PUT /v1/project/{projectID}`

        > **Not yet documented:** errors.
