        '400':
          description: |-
            - **Code 200** — The request body or parameters failed input validation. — When: UserID 0, AllocatedHours null / negative, HourlyRateID <= 0, dates with the feature off, EndDate < StartDate. — Fix: Fix every item listed in Details and resend.

            - **Code 400** — Empty or JSON null body (it bypasses the property rules). Checked before the task. — Fix: Send at least UserID and AllocatedHours.

            - **Code 400** — Dates were sent for a recurring task, or the effective period (a missing date taken from the task) ends before it starts. — Fix: Omit the dates on recurring tasks; otherwise send a consistent period (or both dates).

            - **Code 400** — The task has sub-tasks, or its status is Completed / Cancelled. — Fix: Allocate on a leaf task; reopen the task first (PUT /v1/task/{taskID} Status).

            - **Code 400** — HourlyRateID is not a rate of the task's contract or is inactive; or HourlyRateID was omitted and no default rate can be resolved (contract without rates, fixed-price Calculated task, or a time & material / Allocated task without task rate on a project with a standard rate). — Fix: Send an active HourlyRateID of the task's contract.

