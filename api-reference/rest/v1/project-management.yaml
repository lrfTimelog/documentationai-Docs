  /v1/project/create-from-template:
    post:
      operationId: createProjectFromTemplate
      summary: Create a project from a template
      description: |-
        Creates a new project by copying a project template, and returns it.

        Copies the template's task plan, milestones, resource group, contracts and payment plan into a new project and overrides name, customer, people, dates, type, category, currency and legal entity from the body. The project manager (and the milestone assignee, when the template has milestones) is added as a project resource. The status and time-registration flag come from the template. Answers 200 with the new project (ProjectRead). Only available when the tenant's ProjectManagerToolbox business process is on.

        **Use it to:**
        - CRM / quote-to-project integration: create the delivery project when a deal is won

        **Not for:**
        - Creating a project without a template — no such REST v1 operation

        **Rules across fields:**
        - R1: The legal entity (LegalEntityID, or the default one) must have a standard price group in CurrencyID.

        **Behaviour:**
        - Not idempotent.
        - Not safe to retry blindly. Every call creates a new project; nothing deduplicates (not even ProjectNo was established as unique). After a lost response or a 403, look the project up before retrying.
        - Duplicates: Not deduplicated.
        - Side effect: Creates the project row, then the resource group and the project-manager (and milestone-assignee) resources, the invoice settings, the template status, and batch-creates tasks, milestones, contracts, allocations and payment plan from the template.
        - On failure: Not transactional: a failure after the project row is inserted leaves a partially created project.
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v1/customer`, `GET /v1/user`, `GET /v1/currency/{status}`, `POST /v1/project/validate-create-from-template`

        **Next:** `GET /v1/project/{projectID}`, `PUT /v1/project/{projectID}/status`

        > **Not yet documented:** errors; examples.
      tags:
      - Projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate.create'
      responses:
        '200':
          description: The object, wrapped in the TAF envelope (`Properties`). The created project, read back through GET
            /v1/project/{projectID} (self link + TAF actions).
          content:
            application/json:
              schema:
                type: object
                description: 'TAF envelope: the object is in `Properties`. Null members are omitted; a null result is `{"Links":
                  [self]}` without `Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/ProjectRead'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
                  Actions:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafAction'
        '400':
          description: '- **Code 200** — The request body or parameters failed input validation. — When: Body validation (see
            ProjectCreate): Name, CustomerID, ProjectTemplateID, ProjectManagerID, ProjectTypeID, CurrencyID, the two dates,
            LanguageID. — Fix: Fix every item listed in Details and resend.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '403':
          description: '- **Code 103** — The authenticated user lacks a privilege the operation requires. On time registrations
            this is raised when the caller is not the registration''s owner and has no registration privilege that covers
            the owner. — When: ProjectManagerToolbox business process off (non-ResponseError body); or, AFTER creation, the
            caller cannot see the new project.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '500':
          description: |-
            - **Code 100** — Unhandled server error.

            - **Code 37040** — ProjectManagerID, AccountManagerID or PartnerID is not an existing user ID (AccountManagerID / PartnerID only when their feature is on). — Fix: Send user IDs (`GET /v1/user`), not employee IDs.

            - **Code 37931** — ProjectManagerID, AccountManagerID or PartnerID is a deactivated user. — Fix: Choose an active user.

            - **Code 30097** — The (resolved) legal entity has no standard price group in CurrencyID. — Fix: Use a currency the legal entity has a standard price list for, or set one up.

            - **Code 102** — The request is well-formed but violates a TimeLog business rule. — When: ProjectManager.ValidateBusinessRules on the new project: customer, contact, currency, exchange rate, legal entity, price list, project number, …
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v1.projectmanagement.project.createfromtemplate
