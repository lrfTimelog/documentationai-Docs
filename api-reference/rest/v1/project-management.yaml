          - 2
          - 3
          - 4
          - 5
          - 6
          - 7
          - 8
          x-enum-descriptions:
          - 'Time and material, standard agreement: hours are invoiced as registered.'
          - Fixed price, standard agreement.
          - Time and material on account, balanced at the end.
          - Time and material on account, balanced periodically (recurring contract).
          - Prepaid hours (time and material).
          - Fixed price with revenue requested per task (TDR).
          - Fixed price with revenue requested per period (continuous service, recurring contract).
          - Fixed price volume invoicing (FPVI, recurring contract).
          readOnly: true
          x-timelog-identity:
            role: primary_id
            unique_scope: global
            uniqueness_enforced: true
            id_format: int
          description: |-
            The contract model (ContractModelType value).

            Identifier of this object, globally unique.

            Allowed values:

            | Value | Name | Meaning |
            |---|---|---|
            | `1` | TimeMaterialBasic | Time and material, standard agreement: hours are invoiced as registered. |
            | `2` | FixedPriceBasic | Fixed price, standard agreement. |
            | `3` | TimeMaterialAccountEndBalancing | Time and material on account, balanced at the end. |
            | `4` | TimeMaterialAccountPeriodicBalancing | Time and material on account, balanced periodically (recurring contract). |
            | `5` | PrepaidServices | Prepaid hours (time and material). |
            | `6` | TaskDrivenRevenue | Fixed price with revenue requested per task (TDR). |
            | `7` | ContinuousService | Fixed price with revenue requested per period (continuous service, recurring contract). |
            | `8` | ContinuousItemInvoicing | Fixed price volume invoicing (FPVI, recurring contract). |
        Name:
          type: string
          readOnly: true
          description: The enum member name, e.g. "TimeMaterialBasic". Not localised and not the UI title.
      description: 'A contract (payment) model: how a contract on a project is invoiced. The list is code-defined (enum ContractModelType),
        filtered to the models whose tenant feature is on. ContractModelID is the enum value and Name is the enum member name
        (not a translated title).'
    ContractPaymentPlanAmountUpdate.update:
      type: object
      properties:
        ProjectId:
          type: integer
          format: int32
          writeOnly: true
          x-timelog-identity:
            role: reference
          description: |-
            The project the contract belongs to. Used only as the save context (budget sync, multi-customer handling, recalculation); it is NOT checked against the contract's own project. An unknown or 0 value fails with a 500 (captured for 0).

            Refers to `ProjectRead.ProjectID`. Look up valid values with `GET /v1/project/get-all`.

