      summary: Create a sub-task under an existing task
      description: |-
        Adds a task under an existing task of the same project and returns it.

        Creates a task one level below ParentTaskID, at the parent's next sub-WBS number, on the contract you name (default: the parent's contract). Everything else — body rules, TDR payment handling, project re-save, events, response — is as on `POST /v1/task`. The parent must be a task of ProjectID: it is matched by WBS number inside ProjectID, so a parent from another project silently resolves to a different task. Turning a task into a parent DELETES the parent's own instalments (non-contract-sub-group tasks). No project privilege is checked.

        **Use it to:**
        - Build a multi-level task structure (phase → task) from an external project plan

