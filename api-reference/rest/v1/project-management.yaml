  /v1/task/validate-new-task:
    post:
      operationId: validateNewTask
      summary: Validate a new task (dry run)
      description: |-
        Checks whether a root task with this body could be created on the project, without creating it.

        Same body as `POST /v1/task`. Runs the body rules, the project / contract / hourly-rate / TDR product-number checks and the task save rules (contract valid for the project, hourly rate on the contract, parent may take sub-tasks), then answers 200 with `null`. It writes nothing. It is weaker than create: it does not check that TaskTypeID exists, the WBS depth or task.Validate(), and it ignores ParentTaskID (always a root task) — so a 200 does not guarantee that create or create-sub-task succeeds.

        **Use it to:**
        - Pre-check a task import row before calling `POST /v1/task`

        **Not for:**
        - Validating a sub-task placement — not supported

        **Rules across fields:**
        - R1: Time & material contract: BudgetHours, BudgetAmount and HourlyRateID may not ALL be non-zero (400).
        - R2: TDR contract: BudgetHours, BudgetAmount and TaskHourlyRate may not ALL be non-zero (400).
        - R3: TDR contract: TaskHourlyRate must be 0 when HourlyRateID is not 0 (400).
        - R4: TDR contract: PaymentRecognitionModel must be 1 or 2; with 2, PaymentProductNo, PaymentName and PaymentInvoiceDate are required (400).
        - R5: EndDate must be on or after StartDate (400).

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - On failure: A failing save rule invalidates the application's project cache; no data is written.
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v1/project/get-all`, `GET /v1/contract`

        **Next:** `POST /v1/task`

        **See also:** `POST /v1/task/create-sub-task`

        > **Not yet documented:** examples.
