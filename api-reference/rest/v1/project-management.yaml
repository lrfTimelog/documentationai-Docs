openapi: 3.1.0
info:
  title: Projects — REST API v1
  version: v1
  description: |-
    Find the projects a user can register on, and register expenses and mileage on a project.

    Enums are integers in v1.

    **Conventions that apply to every operation in this file:**
    - Property names are PascalCase.
    - Successful bodies use the TAF envelope: one object in `Properties`, lists in `Entities[].Properties`.
    - Some operations succeed without content: HTTP 200 with the literal body `null`, or HTTP 204.
    - `PUT` replaces the whole object: omitted fields are reset.
    - Treat error `Code` 102 as a business-rule violation, whether the HTTP status is 422 or 500.

    > **Not yet documented:** rate limits.
servers:
- url: https://{region-node}.timelog.com/{account}/api
  description: 'Your TimeLog site. Copy both values from the address bar when you are signed in to TimeLog: `region-node`
    is the first part of the host name (for example `app3` in `app3.timelog.com`), `account` is the first path segment after
    it.'
  variables:
    region-node:
      default: app3
    account:
      default: your-account
security:
- bearer: []
tags:
- name: Projects
  description: Find the projects a user can register on, and register expenses and mileage on a project.
paths:
  /v1/ContractModel:
    get:
      operationId: listContractModels
      summary: List contract models
      description: |-
        Lists the contract (payment) models enabled in the tenant.

        The value set for a contract's model. The models are fixed in code (ContractModelType); the list contains the ones whose tenant feature is on (for example ContractModelPrepaidServices). Names are enum member names, not UI titles. No paging: the whole list (at most 8 entries) is returned.

        **Use it to:**
        - Check which contract models the tenant has enabled before creating contracts

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **See also:** `POST /v1/payment`

        > **Not yet documented:** related → next.
      tags:
      - Projects
      responses:
        '200':
          description: |-
            A list, wrapped in the TAF list envelope (`Entities[].Properties`). All enabled models, without per-entity links and without paging properties.

            Order: Invoicing type, then the model's sort sequence (captured: 1, 3, 5, 4, 2, 7, 6, 8)

            Empty result: 200 with an empty Entities list when no contract-model feature is on (not observed)
          content:
            application/json:
              schema:
                type: object
                description: 'TAF list envelope: each item is in `Entities[].Properties`.'
                properties:
                  Entities:
                    type: array
                    description: Omitted (not `[]`) when the list is empty.
                    items:
                      type: object
                      properties:
                        Properties:
                          $ref: '#/components/schemas/ContractModelRead'
                        Links:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafLink'
                        Actions:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafAction'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
              examples:
                example1:
                  summary: Example
                  value:
                    Entities:
                    - Properties:
                        ContractModelID: 1
                        Name: TimeMaterialBasic
                    - Properties:
                        ContractModelID: 3
                        Name: TimeMaterialAccountEndBalancing
                    - Properties:
                        ContractModelID: 5
                        Name: PrepaidServices
                    - Properties:
                        ContractModelID: 4
                        Name: TimeMaterialAccountPeriodicBalancing
                    - Properties:
                        ContractModelID: 2
                        Name: FixedPriceBasic
                    - Properties:
                        ContractModelID: 7
                        Name: ContinuousService
                    - Properties:
                        ContractModelID: 6
                        Name: TaskDrivenRevenue
                    - Properties:
                        ContractModelID: 8
                        Name: ContinuousItemInvoicing
                    Links:
                    - Href: https://{region-node}.timelog.com/{account}/api/v1/ContractModel
                      Rel: self
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
      x-timelog-key: rest.v1.projectmanagement.contractmodel.list
  /v1/ProjectCategory:
    get:
      operationId: listProjectCategories
      summary: List project categories
      description: |-
        Lists the tenant's project categories, by name.

        The value set for ProjectCategoryID on project create and update. Active and inactive categories are both returned. The list is not gated by the ProjectCategory feature; that feature only decides whether project create / update write the field (see ProjectCreate).

        **Use it to:**
        - Build a name -> ProjectCategoryID map before creating projects from templates

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **Next:** `POST /v1/project/create-from-template`, `PUT /v1/project/{projectID}`
      tags:
      - Projects
      parameters:
      - name: $page
        in: query
        required: false
        schema:
          type: integer
          default: 1
        description: Page number.
      - name: $pagesize
        in: query
        required: false
        schema:
          type: integer
          default: 10
        description: Page size. No maximum in the API layer.
      responses:
        '200':
          description: |-
            A list, wrapped in the TAF list envelope (`Entities[].Properties`). Categories without per-entity links.

            Paged with `$page` (default 1) and `$pagesize` (default 10).

            Order: Name ascending

            Empty result: 200 with TotalRecord "0" and no Entities
          content:
            application/json:
              schema:
                type: object
                description: 'TAF list envelope: each item is in `Entities[].Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/TafListPaging'
                  Entities:
                    type: array
                    description: Omitted (not `[]`) when the list is empty.
                    items:
                      type: object
                      properties:
                        Properties:
                          $ref: '#/components/schemas/ProjectCategoryRead'
                        Links:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafLink'
                        Actions:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafAction'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
              examples:
                example1:
                  summary: Example
                  value:
                    Properties:
                      TotalRecord: '2'
                      TotalPage: '1'
                      PageNumber: '1'
                    Entities:
                    - Properties:
                        ProjectCategoryID: 4
                        Name: Selection 1
                        IsActive: true
                        ProductNo: ''
                        ID: ea03d68d-5afb-48d2-908f-56bd12b232e6
                    - Properties:
                        ProjectCategoryID: 5
                        Name: Selection 2
                        IsActive: true
                        ProductNo: ''
                        ID: 7805fec2-67b9-41be-a1ad-4cc0e990c130
                    Links:
                    - Href: https://{region-node}.timelog.com/{account}/api/v1/ProjectCategory
                      Rel: self
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v1.projectmanagement.projectcategory.list
