  /v1/task/filter:
    get:
      operationId: getTasksByFilter
      summary: Search tasks by filter
      description: |-
        Searches all tasks of the tenant by project, task, status, active / billable flag and plan dates.

        A paged task search over EVERY task of the tenant, returning the extended task model (status, dates, project number, parent). Filter semantics worth knowing: - startDate / endDate select tasks that lie INSIDE the window (start >= startDate, end <= endDate) — not tasks that overlap it. Tasks without a start (or end) date never match a startDate (endDate) filter. - isBillable filters the task's NonBillable column (inverted); the response shows default_billable as IsDefaultBillable — a different column. - taskStatus takes the INTEGER 0-4; the response returns the status NAME.

        **Use it to:**
        - Incremental task sync by project: ?projectId=… (each page re-read with $page)
        - Resolve a task by GUID: ?taskGuid=…
        - List open tasks of a period for a planning integration: ?taskStatus=1&startDate=…&endDate=…

        **Not for:**
        - Tasks the caller may register time on → `GET /v1/task/search-for-time-tracking`
        - One task by integer ID with its project object → `GET /v1/task/{taskID}`

        **Rules across fields:**
        - R1: All supplied filters combine with AND. projectId, taskId or taskGuid switch the procedure to its selective strategy; the result is the same.

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v1/project/get-all`

        **Next:** `GET /v1/task/{taskID}`, `PUT /v1/task/{taskID}`

        **See also:** `GET /v1/task`, `GET /v1/TaskType`

        > **Not yet documented:** request → query params.
      tags:
      - Projects
      parameters:
      - name: projectId
        in: query
        required: false
        schema:
          type: integer
          format: int32
          x-timelog-filter:
            operators:
            - eq
        description: |-
          Only tasks of this project. Must be > 0 (400 "Project ID must be greater than 0."). An unknown project gives an empty page.

          Filters on `TaskExtendedRead.ProjectID` (eq).
      - name: taskId
        in: query
        required: false
        schema:
          type: integer
          format: int32
          x-timelog-filter:
            operators:
            - eq
        description: |-
          Only this task. Must be > 0 (400 "Task ID must be greater than 0.").

          Filters on `TaskExtendedRead.TaskID` (eq).
      - name: taskGuid
        in: query
        required: false
        schema:
          type: string
          format: uuid
          x-timelog-filter:
            operators:
            - eq
        description: |-
          Only the task with this GUID. The empty GUID is rejected with 400.

          Filters on `TaskExtendedRead.ID` (eq).
      - name: isActive
        in: query
        required: false
        schema:
          type: boolean
          x-timelog-filter:
            operators:
            - eq
        description: |-
          true = active tasks only, false = inactive only; omitted = both.

          Filters on `TaskExtendedRead.IsActive` (eq).
      - name: taskStatus
        in: query
        required: false
        schema:
          type: integer
          format: int32
          x-timelog-filter:
            operators:
            - eq
        description: |-
          Status as an INTEGER: 0 NotStarted, 1 InProgress, 2 OnHold, 3 Completed, 4 Cancelled. Outside 0-4: 400.

          Filters on `TaskExtendedRead.TaskStatus` (eq).
      - name: isBillable
        in: query
        required: false
        schema:
          type: boolean
          x-timelog-filter:
            operators:
            - eq
        description: |-
          true = tasks whose NonBillable flag is 0, false = NonBillable 1; omitted = both. Filters the NonBillable column, NOT the IsDefaultBillable value returned.

          Filters on `TaskExtendedRead.IsDefaultBillable` (eq).
      - name: startDate
        in: query
        required: false
        schema:
          type: string
          format: date-time
          x-timelog-filter:
            operators:
            - gte
        description: |-
          Only tasks whose start date is on or after this value. Must pass the date validity check (400 "Start Date is not a valid date.").

          Filters on `TaskExtendedRead.StartDate` (gte).
      - name: endDate
