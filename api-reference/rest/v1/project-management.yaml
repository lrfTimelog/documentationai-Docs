components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: |-
        OAuth 2.0 bearer token, sent as `Authorization: Bearer <token>`. JWT and reference tokens are both accepted. The token must carry the required scope (default `tlp`).

        The token's `sub` claim is the acting user. A token WITHOUT `sub` (client-credentials) acts as the system service user. If the `sub` user cannot log in (inactive, locked, deleted), the request is rejected with 401 — it is no longer let through without a user.

        > **Not yet documented:** how to obtain a token.

        > **Not yet documented:** token lifetime.
  schemas:
    AllocationRead:
      type: object
      properties:
        AllocationID:
          type: integer
          format: int32
          readOnly: true
          x-timelog-identity:
            role: primary_id
            unique_scope: tenant
            uniqueness_enforced: unknown
            id_format: int
          description: |-
            Integer identifier of the allocation.

            Identifier of this object, unique per TimeLog site.

            > **Not yet documented:** identity → uniqueness enforced.
        TaskID:
          type: integer
          format: int32
          readOnly: true
          x-timelog-identity:
            role: reference
          description: |-
            The task the allocation is on.

            Refers to `TaskRead.TaskID`. Look up valid values with `GET /v1/task/{taskID}`.
        UserID:
          type: integer
          format: int32
          readOnly: true
          x-timelog-identity:
            role: reference
          description: |-
            The allocated USER (user ID, resolved from the allocation's employee).

            Refers to `UserRead.UserID`. Look up valid values with `GET /v1/user`.

            Contains personal data.
        AllocatedHours:
          type: number
          format: double
          readOnly: true
          description: |-
            Planned hours of the user on the task.

            Unit: hours
        RegisteredHours:
          type: number
          format: double
          readOnly: true
          description: |-
            Hours the user has registered on the task under this allocation (the allocation's actual hours).

            Unit: hours

            > **Not yet documented:** description.
        HourlyRateID:
          type: integer
          format: int32
          readOnly: true
          x-timelog-identity:
            role: reference
          description: |-
            The contract hourly rate of the allocation (0 when none is set).

            Refers to `ContractHourlyRateRead.ContractHourlyRateID`. Look up valid values with `GET /v1/contract-hourly-rate`.
        HourlyRateName:
          type:
          - string
          - 'null'
          readOnly: true
          description: Name of that hourly rate; null when HourlyRateID is 0 or the rate no longer exists.
        HourlyRateAmount:
          type: number
          format: double
          readOnly: true
          description: |-
            Amount of that hourly rate per hour; 0 when there is no (loadable) rate.

            Unit: HourlyRateCurrencyAbb per hour
        HourlyRateCurrencyAbb:
          type: string
          readOnly: true
          description: Currency abbreviation of the task's PROJECT (not read from the rate itself).
        StartDate:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
          description: |-
            First day of the allocation period; null for a recurring allocation.

            Time zone: none — stored as whole days
        EndDate:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
          description: |-
            Last day of the allocation period; null for a recurring allocation.

            Time zone: none — stored as whole days
        IsRecurring:
          type: boolean
          readOnly: true
          description: True when the allocation is on a recurring task (it then has no period).
        IsCompleted:
          type: boolean
          readOnly: true
          description: True when the allocation's status is Completed (e.g. after the task was completed).
      description: 'One user''s allocation on a task: planned (allocated) hours, hours already registered, the contract hourly
        rate with its name, amount and currency, the allocation period, and whether it is recurring or completed.'
    AllocationUpdate.update:
      type: object
      properties:
        AllocatedHours:
          type:
          - number
          - 'null'
          format: double
          description: |-
            New planned hours of the user on the task.

            Null: null / omitted = unchanged.

            Unit: hours

            - Negative — 400 Code 200 (FluentValidation GreaterThanOrEqualTo(0)).
        HourlyRateID:
          type:
          - integer
          - 'null'
          format: int32
          x-timelog-identity:
            role: reference
          description: |-
            New contract hourly rate of the allocation (a rate of the task's contract).

            Refers to `ContractHourlyRateRead.ContractHourlyRateID`. Look up valid values with `GET /v1/contract-hourly-rate`.

            Null: null / omitted = unchanged. 0 is rejected by the body validator; there is no way to clear the rate.

            - 0 or negative — 400 Code 200 (GreaterThan(0)).

            - Different from the current rate and not a rate of the task's contract, or an inactive rate — 400 (rest.projectmanagement.allocation-update-rate-invalid).

            - Equal to the current rate — Not re-validated, so GET-modify-PUT keeps working on a rate that was deactivated since.

            Valid values come from `GET /v1/contract-hourly-rate`.
        StartDate:
          type:
          - string
          - 'null'
          format: date-time
          x-timelog-condition: Accepted only when the tenant feature AllocationDates ('Enable start and end date on allocations')
            is on, and never for an allocation on a recurring task (it has no period).
          description: |-
            New first day of the allocation period.

            **Conditional.** Accepted only when the tenant feature AllocationDates ('Enable start and end date on allocations') is on, and never for an allocation on a recurring task (it has no period).

            Null: null / omitted = unchanged.

            Time zone: none — the time part is dropped (stored as whole days)

            - AllocationDates feature off — 400 Code 200 'StartDate cannot be set because the feature ...'

            - Allocation on a recurring task — 400 (rest.projectmanagement.allocation-update-period-invalid).

            - Effective EndDate (sent or stored) before it — 400 (allocation-update-period-invalid); both sent → 400 Code 200.

            - Any time of day — Truncated to the date (.Date).
        EndDate:
          type:
          - string
          - 'null'
          format: date-time
          x-timelog-condition: 'Same as StartDate: AllocationDates feature on, and not a recurring-task allocation.'
          description: |-
            New last day of the allocation period.

            **Conditional.** Same as StartDate: AllocationDates feature on, and not a recurring-task allocation.

            Null: null / omitted = unchanged.

            Time zone: none — the time part is dropped (stored as whole days)

            - AllocationDates feature off — 400 Code 200 'EndDate cannot be set because the feature ...'

            - Both dates sent and EndDate < StartDate — 400 Code 200 (GreaterThanOrEqualTo).

            - Any time of day — Truncated to the date (.Date).
      description: 'The fields of an existing allocation that can be changed: planned hours, contract hourly rate and (with
        the tenant feature ''Enable start and end date on allocations'') the allocation period. Only the fields you send are
        changed; null or omitted fields keep their current value. An object with none of the four fields is refused (400).'
    ContractCreate.create.createFixedPriceBasicContract:
      type: object
      properties:
        ProjectID:
          type: integer
          format: int32
          x-timelog-identity:
            role: reference
          description: |-
            The project to add the contract to. Must be > 0 (400) and exist (37014, 500).

            Can be set on create only.

            Refers to `ProjectRead.ProjectID`. Look up valid values with `GET /v1/project/get-all`.

            Valid values come from `GET /v1/project/get-all`.
        ContractName:
          type: string
          description: |-
            Display name of the new contract. Kept as sent (the server generates a name only when it is empty, which the validator already forbids).

            Can be set on create only.

            > **Not yet documented:** constraints → max length.
        ContractStatus:
          type: integer
          format: int32
          enum:
          - 1
          - 2
          - 3
          - 4
          x-enum-descriptions:
          - Create the contract in quote stage (not yet running).
          - Create a running contract.
          - Create the contract already closed as finished.
          - Create the contract already closed as cancelled.
          description: |-
            Initial status of the contract. 0 or an undefined value is rejected (400 "'Contract Status' has a range of values which does not include '0'.").

            Can be set on create only.

            - All five types — Set on the new contract through ProjectSubContract.ChangeStatus before the first save.

            Allowed values:

            | Value | Name | Meaning |
            |---|---|---|
            | `1` | Quotation | Create the contract in quote stage (not yet running). |
            | `2` | Active | Create a running contract. |
            | `3` | Completed | Create the contract already closed as finished. |
            | `4` | Cancelled | Create the contract already closed as cancelled. |

            > **Not yet documented:** values → members.
        ContractOwnerUserID:
          type: integer
          format: int32
          x-timelog-identity:
            role: reference
          description: |-
            USER ID (not employee ID) of the contract owner. Must be an existing (37040) and active (37931) user. In practice required: the validator accepts 0 and the save logic would default 0 to the project manager, but the controller validates the owner before that and rejects 0 with 37040.

            Can be set on create only.

            Refers to `UserRead.UserID`. Look up valid values with `GET /v1/user`.

            Valid values come from `GET /v1/user`.

            > **Not yet documented:** behaviour.
        BudgetWorkAmount:
          type: number
          format: double
          default: 0
          description: |-
            Budgeted revenue for work (hours × rate) on the contract, in project currency. Its handling differs by type — see behaviour.

            Can be set on create only.

            Unit: project currency

            - TMB, TMAEB — Stored as sent. TMAEB: also part of the first instalment (BudgetWorkAmount + BudgetExpensesAmount + BudgetTravelAmount).

            - FPB, TDR — together with a non-zero TargetHourlyRate — 400 "BudgetWorkAmount must be 0 when TargetHourlyRate is added." (and the mirror message on TargetHourlyRate).

            - FPB, TDR — BudgetWorkHour > 0 — Stored as BudgetWorkHour × (BudgetWorkAmount / BudgetWorkHour), rounded — equal to the sent value up to rounding; TargetHourlyRate is derived from it.

            - FPB, TDR — BudgetWorkHour = 0 — Stored as 0: the derived target rate is 0 when there are no hours, so the amount is lost.

            - PS — IsFixedHourlyRate false — Stored as sent; it is also the amount of the first instalment.

            - PS — IsFixedHourlyRate true, together with a non-zero BudgetWorkHour — 400 "BudgetWorkAmount must be 0 when BudgetWorkHour is added."

            - PS — IsFixedHourlyRate true, 0 and BudgetWorkHour > 0 — Derived as BudgetWorkHour × HourlyRatePrice on the second save. The first instalment is created from the SENT value (0 → no instalment).

            - More decimals than InvoiceSetting_NumberOfDecimals — 400; the message names AmountIncludingVatExpenseCurrency instead of this field.
        BudgetWorkHour:
          type: number
          format: double
          default: 0
          description: |-
            Budgeted work hours on the contract.

            Can be set on create only.

            Unit: hours

            - TMB, TMAEB, FPB, TDR — Stored as sent. FPB / TDR: it is the divisor of the target-rate derivation — send it whenever you send BudgetWorkAmount or TargetHourlyRate.

            - PS — IsFixedHourlyRate false — applied

            - PS — IsFixedHourlyRate true, together with a non-zero BudgetWorkAmount — 400 "BudgetWorkHour must be 0 when BudgetWorkAmount is added."

            - PS — IsFixedHourlyRate true, 0 and BudgetWorkAmount > 0 — Derived as BudgetWorkAmount / HourlyRatePrice. With HourlyRatePrice 0 this divides by zero.
        HasCompletionNotification:
          type: boolean
          default: false
          description: |-
            Turn on the contract's completion notification, which fires at CompletionNotificationPercentage.

            Can be set on create only.

            - All five types — applied

            > **Not yet documented:** description.
        CompletionNotificationPercentage:
          type: number
          format: double
          default: 0
          description: |-
            Threshold in percent for the completion notification.

            Can be set on create only.

            Unit: percent

            - All five types — applied

            - Outside 0–100 — 400 (InclusiveBetween).
        IsMileageBillable:
          type: boolean
          default: false
          description: |-
            Default billable flag for mileage registered on this contract.

            Can be set on create only.

            - All five types — applied
        IsDefaultExpenses:
          type: boolean
          default: false
          description: |-
            Make this the project's default contract for expenses.

            Can be set on create only.

            - true (all five types) — Clears IsDefaultExpenses on every other contract of the project (at most one default per project).
        ContractTypeID:
          type: integer
          format: int32
          x-timelog-condition: Required (>= 1) when the tenant feature ContractTypeIsRequired is active; otherwise optional
            (0 = none).
          x-timelog-identity:
            role: reference
          default: 0
          description: |-
            Tenant-defined contract type (a classification independent of the contract model). 0 = none. When > 0 it must exist (37958). When the tenant feature ContractTypeIsRequired is on, a value >= 1 is required (37957).

            **Conditional.** Required (>= 1) when the tenant feature ContractTypeIsRequired is active; otherwise optional (0 = none).

            Can be set on create only.

            Refers to `ContractTypeRead.ContractTypeID`.

            - Feature ContractTypeIsRequired on and value < 1 — 37957, 500 (controller, before the contract is built).

            - Value > 0 that is not a contract type — 37958, 500 (save business rules, before the insert).

            - 37958 is still checked.

            > **Not yet documented:** values → lookup op.
        BudgetExpensesAmount:
          type: number
          format: double
          default: 0
          description: |-
            Budgeted expenses on the contract, in project currency.

            Can be set on create only.

            Unit: project currency

            - TMB, TMAEB — TMAEB: part of the first instalment.

            - FPB, TDR — When IsExpensesLinked is true it is ALSO written as RevenueExprAmount.

            - PS — Not part of the prepaid body.
        BudgetTravelAmount:
          type: number
          format: double
          default: 0
          description: |-
            Budgeted travel (mileage / travel expenses) on the contract, in project currency.

            Can be set on create only.

            Unit: project currency

            - TMB, TMAEB — TMAEB: part of the first instalment.

            - FPB, TDR — When IsTravelLinked is true it is ALSO written as RevenueTravelAmount.

            - PS — Not part of the prepaid body.
        HasBudgetOverrunNotification:
          type:
          - boolean
          - 'null'
          default: false
          description: |-
            Turn on the budget-overrun notification of a time-and-material contract.

            Can be set on create only.

            Null: null = false.

            - TMB, TMAEB — null is stored as false.

            - FPB, PS, TDR — Not part of those bodies.

            > **Not yet documented:** description.
        TargetHourlyRate:
          type: number
          format: double
          default: 0
          description: |-
            Fixed price contracts: the hourly rate the fixed price is expected to yield, in project currency per hour. Alternative to BudgetWorkAmount — send one of them, together with BudgetWorkHour.

            Can be set on create only.

            Unit: project currency per hour

            - FPB, TDR — together with a non-zero BudgetWorkAmount — 400 "TargetHourlyRate must be 0 when BudgetWorkAmount is added."

            - FPB, TDR — BudgetWorkHour > 0 — Kept (rounded); BudgetWorkAmount becomes BudgetWorkHour × TargetHourlyRate. When 0 it is derived as BudgetWorkAmount / BudgetWorkHour.

            - FPB, TDR — BudgetWorkHour = 0 — Stored as 0.

            - FPB (not TDR) — After the save, every task on this contract whose hourly-rate model is not Allocated gets this rate (none exist yet on a new contract).

            - TMB, TMAEB, PS — Not part of those bodies.
        PaymentPlanAmount:
          type: number
          format: double
          default: 0
          description: |-
            The contract's fixed price, in project currency. When not 0, the create also adds a first instalment of this amount to the billing plan, dated today.

            Can be set on create only.

            Unit: project currency

            - FPB, TDR — Stored; != 0 → one instalment of PaymentPlanAmount named by the default payment name, invoice date = server 'now' (not on multi-customer projects).

            - TMB, TMAEB, PS — Not part of those bodies.
        RevenueExprAmount:
          type: number
          format: double
          default: 0
          description: |-
            Fixed price contracts: expected revenue from expenses, in project currency.

            Can be set on create only.

            Unit: project currency

            - FPB, TDR — IsExpensesLinked false — applied

            - FPB, TDR — IsExpensesLinked true — Replaced by BudgetExpensesAmount.

            - TMB, TMAEB, PS — Not part of those bodies.

            > **Not yet documented:** description.
        RevenueTravelAmount:
          type: number
          format: double
          default: 0
          description: |-
            Fixed price contracts: expected revenue from travel, in project currency.

            Can be set on create only.

            Unit: project currency

            - FPB, TDR — IsTravelLinked false — applied

            - FPB, TDR — IsTravelLinked true — Replaced by BudgetTravelAmount.

            - TMB, TMAEB, PS — Not part of those bodies.
        IsExpensesLinked:
          type: boolean
          default: false
          description: |-
            Fixed price contracts: when true, expense revenue (RevenueExprAmount) follows the expense budget (BudgetExpensesAmount).

            Can be set on create only.

            - FPB, TDR — applied

            - TMB, TMAEB — Not part of those bodies; the adapter forces false.

            - PS — Not part of the prepaid body.
        IsTravelLinked:
          type: boolean
          default: false
          description: |-
            Fixed price contracts: when true, travel revenue (RevenueTravelAmount) follows the travel budget (BudgetTravelAmount).

            Can be set on create only.

            - FPB, TDR — applied

            - TMB, TMAEB — Not part of those bodies; the adapter forces false.

            - PS — Not part of the prepaid body.
        IsFixedHourlyRate:
          type: boolean
          default: false
          description: |-
            Prepaid contracts: when true, the budget is kept consistent with HourlyRatePrice — send EITHER BudgetWorkHour OR BudgetWorkAmount (400 if both) and the other is derived. When false, both are stored as sent.

            Can be set on create only.

            - PS — Set through ChangeIsFixedHourlyRate; drives the derivation in UpdatePrepaidContractCreatedFromApi.

            - TMB, FPB, TMAEB, TDR — Not part of those bodies.

            > **Not yet documented:** description.
        HourlyRatePrice:
          type: number
          format: double
          default: 0
          description: |-
            Prepaid contracts: price of the project-specific contract hourly rate that the create adds to the new contract, in the project's price-list currency.

            Can be set on create only.

            Unit: project currency per hour

            - PS — After the first save a contract hourly rate (HourlyRateName, this price, project CurrencyListID) is created and set as the contract's hourly rate.

            - Negative — 400 (GreaterThanOrEqualTo 0).

            - TMB, FPB, TMAEB, TDR — Not part of those bodies.
        HourlyRateName:
          type: string
          description: |-
            Prepaid contracts: name of the contract hourly rate created with HourlyRatePrice.

            Can be set on create only.

            - PS — applied

            - TMB, FPB, TMAEB, TDR — Not part of those bodies.
      required:
      - ProjectID
      - ContractName
      - ContractStatus
      - ContractOwnerUserID
      description: 'A new contract on an existing project. The contract MODEL is chosen by the route, not by a field: each
        of the five create operations builds one model and accepts only its own subset of the fields below. Field applicability
        (R = required, o = optional, · = not part of that type''s body — sent values are ignored): | Field | TMB | FPB | TMAEB
