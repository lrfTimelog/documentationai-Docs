          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '500':
          description: '- **Code 37001** — The taskID in the path (external keys) or TaskId in the body (allocation) is not
            an existing task. Not a 404. — When: taskID is not a task (37001). — Fix: Use an existing task ID.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
