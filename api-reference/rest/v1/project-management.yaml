  /v1/project-header/employee-expense:
    post:
      operationId: createProjectEmployeeExpense
      summary: Create an employee expense on a project
      description: |-
        Creates an employee expense (out-of-pocket cost to be reimbursed) on a project, for the caller or on behalf of another user.

        Registers an expense an employee paid — amount, VAT, currency, expense type, payment method — on a project, optionally billable to its customer. The contract is the one you send, or the project's default expense contract. On success the API does not return the expense: it answers 302 with a Location header pointing to GET /v1/employee-expense/{id}. Receipts cannot be attached here.

        **Use it to:**
        - Expense app submitting a receipt line after the user picked a project from search-for-expense-travel-registration-…
        - Importing card transactions from a corporate-card provider on behalf of employees (UserID)

        **Not for:**
        - Expenses paid by the company on a project (project expenses) — a different Expenses operation (not curated)

        **Rules across fields:**
        - R1: ProjectSubContractID, when > 0, must belong to ProjectID, be Active and not be prepaid services.
        - R2: ExpenseTypeID must belong to the owner's (UserID or caller) legal entity.
        - R3: IsBillable must be true when the resolved contract is fixed-price.
        - R4: Date must be inside the owner's employment and not in a closed accounting period.

        **Behaviour:**
        - Not idempotent.
        - Not safe to retry blindly. Each call creates a new expense with a new GUID; nothing deduplicates. After a lost response, check the owner's expenses before retrying.
        - Duplicates: Not deduplicated.
        - Side effect: Creates the employee expense (category Employee, interface WebApi) with the currency conversion rates to the project's and the owner's legal-entity currencies.
        - Side effect: Writes registration currency data for the expense.
        - On failure: No transaction scope wraps the insert and the follow-up writes. A failure after the insert — e.g. in the currency-data notification or the read-back — returns 500 while the expense row stays (src_only).
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v1/project-header/search-for-expense-travel-registration-order-by-recent-registration`, `GET /v1/currency/{status}`

        **See also:** `POST /v1/project-header/mileage-registration`

        > **Not yet documented:** examples; response → success.
      tags:
      - Projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeExpenseCreate'
      responses:
        '302':
          description: |-
            Success without content: HTTP 204 with an empty body. Found. Location = the URL of GET /v1/employee-expense/{employeeExpenseID} (route EmployeeExpenseGetByID) for the new expense; no body. Read the new ID from the Location path. A client that follows the redirect receives the expense (EmployeeExpenseRead, not curated yet) — provided it re-sends the Authorization header.

            Order: none

            Empty result: none
        '400':
          description: '- **Code 200** — The request body or parameters failed input validation. — When: Body validator: Date
            missing; ExchangeRate ≤ 0; CurrencyID / ExpenseTypeID / PaymentMethodID / ProjectID ≤ 0; UserID ≤ 0. — Fix: Fix
            every item listed in Details and resend.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '403':
          description: '- **Code 103** — The authenticated user lacks a privilege the operation requires. On time registrations
            this is raised when the caller is not the registration''s owner and has no registration privilege that covers
            the owner. — When: UserID is another user and the caller is not covered by the on-behalf rule.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '500':
          description: |-
            - **Code 100** — Unhandled server error.

            - **Code 37040** — UserID is set, differs from the caller and is not an existing user ID. — Fix: Send a user ID (GET /v1/user), not an employee ID — or omit UserID to register for yourself.

            - **Code 37931** — UserID exists but the user is deactivated. New registrations cannot be created for inactive users. — Fix: Register for an active user.

            - **Code 37042** — ProjectSubContractID (> 0) is not a contract of ProjectID (or does not exist). — Fix: Send a contract of the same project, or 0 / omit it to use the project's default contract.

            - **Code 31132** — The explicitly supplied ProjectSubContractID is not in status Active. — Fix: Choose an active contract of the project.

            - **Code 31134** — The explicitly supplied ProjectSubContractID is a prepaid-services contract. — Fix: Choose a non-prepaid contract, or omit ProjectSubContractID.

            - **Code 37806** — The resolved contract is closed. — Fix: Book on an open contract.

            - **Code 37019** — ExpenseTypeID does not exist. — Fix: Use an expense type ID of the owner's legal entity.

            - **Code 37998** — Fix: Use an expense type of the owner's legal entity anyway; the API will not stop you.

            - **Code 37014** — ProjectID does not exist. — Fix: Use a ProjectID from a project-header search.

            - **Code 37689** — The project is inactive. — Fix: Use an active project.

            - **Code 37691** — The project's default-for-expenses contract (or, when there is none, its main contract) is closed. — Fix: Reopen the contract or send an explicit active ProjectSubContractID.

            - **Code 37690** — The project has no default-for-expenses contract and its main contract is prepaid services. — Fix: Send an explicit non-prepaid ProjectSubContractID.

            - **Code 31140** — The contract the expense is booked on is fixed-price and IsBillable is false. — Fix: Send IsBillable true for fixed-price contracts.

