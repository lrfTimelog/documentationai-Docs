  /v1/allocation/{allocationID}:
    delete:
      operationId: deleteAllocation
      summary: Delete an allocation
      description: |-
        Deletes an allocation that has no time registrations.

        Removes a user's allocation from a task, through the same path as every UI delete: the allocation and its ETC rows go, the task's HasAllocations flag is cleared when it was the last allocation, the task dates are re-synced to the remaining allocations when the tenant uses that, and the project is re-saved. Allocations with time registrations or a running time tracker are refused (400). Answers 200 with `null`. Requires project privileges on the task's project. Not atomic.

        **Use it to:**
        - Un-staff a user who never registered on the task (resource-planning sync)

        **Not for:**
        - Allocations with registrations — they cannot be deleted; complete them in TimeLog
        - A dry run → `POST /v1/allocation/{allocationID}/validate-delete`

        **Behaviour:**
        - Not idempotent.
        - A second DELETE of the same ID answers 404.
        - Safe to retry only under a condition. Treat a 404 on retry as 'already deleted'.
        - Side effect: Raises the allocation-deleted event with EventAction BothAuditLogAndEmail (audit log + notification e-mail).
        - Side effect: When it was the task's last allocation (any status), refreshes the task's HasAllocations flag without a task event.
        - Side effect: With ChangeTaskDateBasedAllocation on, marks the task dirty so its dates follow the remaining allocations in the project save.
        - Side effect: Re-saves the project and evicts it from the application cache.
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v1/task/{taskID}/allocation`, `POST /v1/allocation/{allocationID}/validate-delete`

        **See also:** `PUT /v1/allocation/{allocationID}`

        > **Not yet documented:** behaviour → consistency; examples.
      tags:
      - Projects
      parameters:
      - name: allocationID
        in: path
        required: true
        schema:
          type: integer
          format: int32
        description: The allocation to delete. Route constraint :int.
      responses:
        '200':
          description: 'Success without content: HTTP 200 with the literal JSON body `null`. The literal `null`: the allocation
            was deleted.'
          content:
            application/json:
              schema:
                type: 'null'
        '400':
          description: |-
            - **Code 400** — The allocation has time registrations or an active time tracker (AllocationCanBeDeleted). Nothing is deleted and — despite the message — nothing is set to completed. — Fix: Keep the allocation. Allocations with registrations cannot be deleted through the API; complete it in TimeLog instead.

            - **Code 400** — Update: Allocation.Validate, a violation returned by the allocation save, or one returned by the project save that follows. Delete: a violation returned by the project save after the allocation row was deleted. The project-save cases answer 400 AFTER the allocation was written / deleted. — When: The project save after the delete returned a violation. — Fix: Read Message. Re-read the allocation (GET /v1/allocation/{allocationID}) before retrying — the change may already be stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '403':
          description: '- **Code 103** — The caller has no project-area privilege ViewCreateEditDelete covering the task''s
            project and, for a template project, not the system-administration project-templates page. Read access alone is
            not enough — this also applies to GET .../allocation. — Fix: Use a user with project privileges on the project
            (or make the integration user project manager / give it an ''all projects'' role).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '404':
          description: '- **Code 404** — allocationID in the path is not an allocation. — Fix: Use an AllocationID from `GET
            /v1/task/{taskID}/allocation`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v1.projectmanagement.allocation.delete
    get:
      operationId: getAllocationById
      summary: Get an allocation
      description: |-
        Returns one allocation (a user's planned hours, rate and period on a task) by its AllocationID.

        Reads one allocation as AllocationRead — the same shape as the task-scoped allocation list. Unknown IDs answer 404. The caller needs project privileges on the allocation's task's project (the same gate as the task allocation routes); read access alone is not enough.

        **Use it to:**
        - Read back an allocation before changing it (GET-modify-PUT)
        - Resolve the AllocationID returned in a 409 from POST /v1/task/{taskID}/allocation

        **Not for:**
        - All allocations of a task → `GET /v1/task/{taskID}/allocation`

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v1/task/{taskID}/allocation`

        **Next:** `PUT /v1/allocation/{allocationID}`, `POST /v1/allocation/{allocationID}/validate-delete`

        **See also:** `POST /v1/task/{taskID}/allocation`

        > **Not yet documented:** examples.
      tags:
      - Projects
      parameters:
      - name: allocationID
        in: path
        required: true
        schema:
          type: integer
          format: int32
        description: The allocation to read. Route constraint :int.
      responses:
        '200':
          description: |-
            The object, wrapped in the TAF envelope (`Properties`). The allocation, with a self link and the update-allocation / delete-allocation TAF actions.

            Empty result: Unknown ID → 404.
          content:
            application/json:
              schema:
                type: object
                description: 'TAF envelope: the object is in `Properties`. Null members are omitted; a null result is `{"Links":
                  [self]}` without `Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/AllocationRead'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
                  Actions:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafAction'
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '403':
          description: '- **Code 103** — The caller has no project-area privilege ViewCreateEditDelete covering the task''s
            project and, for a template project, not the system-administration project-templates page. Read access alone is
            not enough — this also applies to GET .../allocation. — Fix: Use a user with project privileges on the project
            (or make the integration user project manager / give it an ''all projects'' role).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '404':
          description: |-
            - **Code 404** — allocationID in the path is not an allocation. — Fix: Use an AllocationID from `GET /v1/task/{taskID}/allocation`.

            - The URL did not match any route (including a route constraint such as {id:int} receiving a non-integer). — When: allocationID is not an integer (route constraint).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v1.projectmanagement.allocation.get
    put:
      operationId: updateAllocation
      summary: Update an allocation
      description: |-
        Changes the planned hours, hourly rate and/or period of an existing allocation and returns it.

        Partial update (AllocationUpdate): only AllocatedHours, HourlyRateID, StartDate and EndDate can change, and at least one must be sent. Dates need the tenant feature 'Enable start and end date on allocations' and are refused on allocations of recurring tasks. A changed HourlyRateID must be an active rate of the task's contract; an unchanged one is not re-checked. Runs the same follow-up as the project-plan save: the task's dates may follow the allocation span, the project is re-saved, subscribed project managers are e-mailed. Answers 200 with the allocation as stored (AllocationRead). Requires project privileges on the task's project. Not atomic.

        **Use it to:**
        - Re-plan hours of a staffed user from a resource-planning or PSA tool
        - Move an allocation's period (AllocationDates feature)
        - Resolve a 409 from POST /v1/task/{taskID}/allocation by updating the existing allocation

        **Not for:**
        - Allocating a new user → `POST /v1/task/{taskID}/allocation`
        - Completing / re-opening an allocation — the status cannot be changed here

        **Rules across fields:**
        - R1: At least one of AllocatedHours, HourlyRateID, StartDate, EndDate must be sent (400).
        - R2: Both dates sent: EndDate >= StartDate (400 Code 200). One date sent: the effective period (other date from the stored allocation) must not end before it starts (400).

        **Behaviour:**
        - Idempotent.
        - Sending the same values again stores the same state; it still runs a full save (audit / e-mail event, project save).
        - Safe to retry only under a condition. Safe after a 2xx or a timeout. After a 400 from the project save (allocation-save-violation) or a 500, the allocation may already be updated — re-read it first.
        - Side effect: Updates the allocation row with an audit-log + e-mail event (EventAction BothAuditLogAndEmail, like the project-plan UI save), so subscribed project managers are mailed.
        - Side effect: With ChangeTaskDateBasedAllocation on and an allocation span that differs from the task dates, the task is marked dirty so its dates follow the allocations in the project save.
        - Side effect: With AutomaticallyCloseTaskWhenLastAllocationIsClosed on: if the task is In progress and has no active (not completed) allocation, the task is set to Completed, the project saved and close notifications sent — called on every update, whatever changed.
        - Side effect: Re-saves the project.
        - Side effect: Dates changed, no task date sync, AllocationDates on: sends the 'allocation exceeds task dates' notification when the period goes beyond the task.
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v1/allocation/{allocationID}`, `GET /v1/task/{taskID}/allocation`

        **Next:** `GET /v1/allocation/{allocationID}`

        **See also:** `POST /v1/task/{taskID}/allocation`, `DELETE /v1/allocation/{allocationID}`

        > **Not yet documented:** behaviour → consistency; behaviour → side effects; examples.
      tags:
      - Projects
      parameters:
      - name: allocationID
        in: path
        required: true
        schema:
          type: integer
          format: int32
        description: The allocation to change. Route constraint :int.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllocationUpdate.update'
      responses:
        '200':
          description: The object, wrapped in the TAF envelope (`Properties`). The allocation mapped from the saved domain
            object (a re-read would hit the per-request cache). HourlyRateCurrencyAbb is the project's currency.
          content:
            application/json:
              schema:
                type: object
                description: 'TAF envelope: the object is in `Properties`. Null members are omitted; a null result is `{"Links":
                  [self]}` without `Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/AllocationRead'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
                  Actions:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafAction'
        '400':
          description: |-
            - **Code 200** — The request body or parameters failed input validation. — When: AllocatedHours < 0, HourlyRateID <= 0, a date sent with the AllocationDates feature off, or both dates sent with EndDate < StartDate. — Fix: Fix every item listed in Details and resend.

            - **Code 400** — The body was empty / JSON null, or none of the four fields was supplied (an empty object would otherwise run a full save with audit and notification events). Checked before the allocation is looked up. — Fix: Send at least one of AllocatedHours, HourlyRateID, StartDate, EndDate.

            - **Code 400** — Dates were sent for an allocation on a recurring task, or the effective period (an omitted date taken from the stored allocation) ends before it starts. When BOTH dates are sent and EndDate < StartDate the body validator answers first (400 Code 200). — Fix: Omit the dates on recurring allocations; otherwise send a consistent period (or both dates).

            - **Code 400** — A CHANGED HourlyRateID is not a rate of the task's contract or is inactive (an unchanged one is not re-checked); or the allocation save's default-rate resolution (SetDefaultValues, before the write) raised one of its two pre-write rate violations. — Fix: Send an active HourlyRateID of the task's contract.

            - **Code 400** — Update: Allocation.Validate, a violation returned by the allocation save, or one returned by the project save that follows. Delete: a violation returned by the project save after the allocation row was deleted. The project-save cases answer 400 AFTER the allocation was written / deleted. — Fix: Read Message. Re-read the allocation (GET /v1/allocation/{allocationID}) before retrying — the change may already be stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '403':
          description: '- **Code 103** — The caller has no project-area privilege ViewCreateEditDelete covering the task''s
            project and, for a template project, not the system-administration project-templates page. Read access alone is
            not enough — this also applies to GET .../allocation. — Fix: Use a user with project privileges on the project
            (or make the integration user project manager / give it an ''all projects'' role).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '404':
          description: '- **Code 404** — allocationID in the path is not an allocation. — Fix: Use an AllocationID from `GET
            /v1/task/{taskID}/allocation`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '500':
          description: |-
            - **Code 102** — The request is well-formed but violates a TimeLog business rule.

            - **Code 100** — Unhandled server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v1.projectmanagement.allocation.update
  /v1/allocation/{allocationID}/validate-delete:
    post:
      operationId: validateDeleteAllocation
      summary: Validate an allocation delete (dry run)
      description: |-
        Checks whether an allocation could be deleted, without deleting it.

        Runs the checks of `DELETE /v1/allocation/{allocationID}` before its first write — the allocation exists, the caller has project privileges, and it has no time registrations or running time tracker — and answers 200 with `null`.

        **Use it to:**
        - Ask before offering 'remove from task' in a staffing UI

        **Not for:**
        - Deleting → `DELETE /v1/allocation/{allocationID}`

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v1/task/{taskID}/allocation`

        **Next:** `DELETE /v1/allocation/{allocationID}`

        > **Not yet documented:** examples.
      tags:
      - Projects
      parameters:
      - name: allocationID
        in: path
        required: true
        schema:
          type: integer
          format: int32
        description: The allocation to check. Route constraint :int.
      responses:
        '200':
          description: 'Success without content: HTTP 200 with the literal JSON body `null`. The literal `null`: the delete
            rule passes.'
          content:
            application/json:
              schema:
                type: 'null'
        '400':
          description: '- **Code 400** — The allocation has time registrations or an active time tracker (AllocationCanBeDeleted).
