            - An existing project that is not the contract's project — Accepted; the save runs with that project as context.

            Valid values come from `GET /v1/project/get-all`.
        ProjectSubContractId:
          type: integer
          format: int32
          writeOnly: true
          x-timelog-identity:
            role: reference
          description: |-
            The contract to update (ContractID in ContractRead). Unknown or 0 fails with a 500.

            Refers to `ContractRead.ContractID`. Look up valid values with `GET /v1/contract`.

            - 0 / omitted / unknown — 500 Code 100.

            - A contract that is not model 4, 7 or 8 (not recurring) — Nothing changes; 200.

            Valid values come from `GET /v1/contract`.
        PaymentPlanAmount:
          type: number
          format: double
          writeOnly: true
          description: |-
            The contract's new payment-plan amount (the fixed price per recurrence period), in the project currency. The server also sets the contract's BudgetWorkAmount = round(PaymentPlanAmount / RecurrenceMonth, 2, away from zero) — the per-month work budget. No range, sign or decimal check.

            Unit: project currency, per recurrence period

            - Model 7 or 8 — PaymentPlanAmount stored; BudgetWorkAmount derived.

            - Model 7 (continuous service) — 37633 when round(amount / months, 2) differs from the contract's allocated budget amount — 'You must allocate all revenue amount to proceed.'

            - Omitted — 0 is applied (non-nullable).

            > **Not yet documented:** constraints → unit.
      required:
