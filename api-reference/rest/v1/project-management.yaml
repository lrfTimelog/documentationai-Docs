        - Not safe to retry blindly. Every call inserts a new task; there is no external key or dedup. After a timeout or a 500, list the project's tasks (`GET /v1/task`) before retrying.
        - Side effect: Inserts the task at the project's next root WBS number; writes its row in the task search table in the same request.
        - Side effect: TDR + FixedPricePayment, or a time-and-material-basic contract: if the task then has exactly one instalment, sets its name / invoice date / product number / amount (TDR: PaymentAmount; TMB: the task budget amount) and IsReadyForInvoicing, and saves the billing plan.
