  /v1/contract/update-recurring-contract-payment-plan-amount:
    post:
      operationId: updateRecurringContractPaymentPlanAmount
      summary: Update the payment-plan amount of a recurring contract
      description: |-
        Sets a new payment-plan amount on a continuous-service or continuous item-invoicing contract and returns the contract.

        Changes the per-period fixed price (PaymentPlanAmount) of an existing recurring contract and derives its monthly work budget (BudgetWorkAmount = round(amount / RecurrenceMonth, 2)). Only models 7 (ContinuousService) and 8 (ContinuousItemInvoicing) are changed. Saving the contract regenerates its recurring instalments in the billing plan. A non-recurring contract is left unchanged and still answers 200; model 4 answers 500. Answers 200 with the contract as ContractRead (which shows neither amount — keep what you sent). There is no body validation: every bad input is a 500. No project privilege is checked.

        **Use it to:**
        - Index or renegotiate the periodic fee of a continuous-service (subscription-like) contract from a billing or CRM system

        **Not for:**
        - A dry run: `POST /v1/contract/validate-update-recurring-contract-payment-plan-amount` (same body, writes nothing)
        - Non-recurring contracts (models 1, 2, 3, 5, 6): the call is a silent no-op

        **Rules across fields:**
        - R1: ProjectSubContractId should be a contract of ProjectId. Not enforced: any existing project is accepted and used as the save context.

        **Behaviour:**
        - Idempotent.
        - The same amount sent twice leaves the same contract state; each call still re-saves the contract and regenerates its recurring instalments.
        - Safe to retry only under a condition. Safe to repeat with the same amount. After a 500 the amount may already be stored while the instalments were not regenerated: retry with the same amount.
        - Side effect: Models 7 / 8: stores PaymentPlanAmount and the derived BudgetWorkAmount.
        - Side effect: Writes a contract-history entry (NotifyProjectSubContractUpdated) and notifies invoicing potential.
        - Side effect: Saves the contract's recurrence and regenerates its recurring instalments in the billing plan (GeneratePaymentsForRecurrenceAdvanceContract with overwriteExistingData = true).
        - Side effect: Recalculates the contract's estimated values (PaymentPlanAmount / BudgetWorkAmount changed).
        - Side effect: Other models: nothing is written.
        - On failure: Not atomic: the contract row is updated before the contract-customer save and the recurrence save; a failure there answers 500 and the new amount stays (only new contracts are deleted on failure).
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v1/project/get-all`, `GET /v1/contract`

        **Next:** `GET /v1/payment`

        **See also:** `POST /v1/contract/validate-update-recurring-contract-payment-plan-amount`

        > **Not yet documented:** behaviour → side effects; errors; examples.
      tags:
      - Projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractPaymentPlanAmountUpdate.update'
      responses:
        '200':
          description: The object, wrapped in the TAF envelope (`Properties`). The contract, read back through GET /v1/contract/{ContractID}
            — also when nothing was changed.
          content:
            application/json:
              schema:
                type: object
                description: 'TAF envelope: the object is in `Properties`. Null members are omitted; a null result is `{"Links":
                  [self]}` without `Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/ContractRead'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
                  Actions:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafAction'
        '401':
          description: '- Missing, invalid or expired bearer token. — When: Captured. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '500':
          description: |-
            - **Code 100** — Unhandled server error.

            - **Code 37633** — Continuous-service contract (model 7): the per-month revenue (PaymentPlanAmount / recurrence months, rounded to 2 decimals) differs from the contract's allocated budget amount. Raised by the contract save rules before the row is written. — When: Model 7 only. — Fix: Send an amount whose per-month value matches the contract's allocated budget, or adjust the allocation in TimeLog first.

            - **Code 37722** — The existing recurring (fixed-price recurrence) contract has no start date; any save of it is rejected. — When: The existing contract has no start date. — Fix: Give the contract a start date in TimeLog, then retry.

            - **Code 102** — The request is well-formed but violates a TimeLog business rule. — When: Other save rules of the existing contract (end before start 37723, company-paid payment method 37693 on model 8) or a failure of the recurrence save.
          content:
