  /v1/project-header/mileage-registration:
    post:
      operationId: createProjectMileageRegistration
      summary: Create a mileage registration on a project
      description: |-
        Creates a mileage (car travel) registration on a project, for the caller or on behalf of another user.

        Registers a trip by car on a project so it is reimbursed to the employee and, when billable, invoiced to the customer at the mileage rate. The contract is the one you send, or the project's default mileage contract. On success the API does not return the registration: it answers 302 with a Location header pointing to GET /v1/mileage-registration/{id}.

        **Use it to:**
        - Mobile or expense app posting a trip after the user picked a project from search-for-expense-travel-registration-…
        - An assistant or admin system registering mileage for other employees (UserID)

        **Not for:**
        - Travel TIME (hours) — use a time registration; the Expenses route POST /v1/mileage-registration can create both together (not curated yet)

        **Rules across fields:**
        - R1: ProjectSubContractID, when > 0, must belong to ProjectID.
        - R2: When ShowOdometer is on and either odometer is sent, OdometerEnd > OdometerStart (400). With OdometerIsRequired also on and both sent, Distance × (IsRoundtrip ? 2 : 1) must equal OdometerEnd − OdometerStart.
        - R3: A personal CarID must belong to the owner (UserID or caller).
        - R4: MileageRateID must have a rate period covering Date.

        **Behaviour:**
        - Not idempotent.
        - Not safe to retry blindly. Each call creates a new registration with a new GUID; nothing deduplicates. After a lost response, check the owner's mileage registrations before retrying.
        - Duplicates: Not deduplicated (except: one mileage registration per TimeRegistrationID, 37825).
        - Side effect: Creates the mileage registration (source interface WebApi), with an expense number when the auto-number series is on, the travel product number and a generated system text.
        - Side effect: Creates mileage financial data and invoicing potential, recalculates the contract's estimated values, and creates the employee reimbursement posting.
        - Changes are visible to the next read immediately.
        - The insert and the side effects run in one transaction scope; the redirect target reads the new row.

        **Call first:** `GET /v1/project-header/search-for-expense-travel-registration-order-by-recent-registration`

        **See also:** `POST /v1/project-header/employee-expense`

        > **Not yet documented:** examples; response → success.
      tags:
      - Projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MileageRegistrationCreate'
      responses:
        '302':
          description: |-
            Success without content: HTTP 204 with an empty body. Found. Location = the URL of GET /v1/mileage-registration/{mileageRegistrationID} (route MileageRegistrationGetByID) for the new registration; no body. Read the new ID from the Location path. A client that follows the redirect issues a GET and receives the mileage registration (MileageRegistrationRead, not curated yet) — provided it re-sends the Authorization header.

            Order: none

            Empty result: none
        '400':
          description: '- **Code 200** — The request body or parameters failed input validation. — When: Body validator: Date
            missing; Distance ≤ 0; ProjectID / CarID / MileageRateID ≤ 0; StartAddress / EndAddress empty; UserID ≤ 0; odometer
            rules of R2 / OdometerIsRequired. — Fix: Fix every item listed in Details and resend.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '403':
          description: '- **Code 103** — The authenticated user lacks a privilege the operation requires. On time registrations
            this is raised when the caller is not the registration''s owner and has no registration privilege that covers
            the owner. — When: UserID is another user and the caller is not covered by the on-behalf rule.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '500':
          description: |-
            - **Code 100** — Unhandled server error.

            - **Code 37040** — UserID is set, differs from the caller and is not an existing user ID. — Fix: Send a user ID (GET /v1/user), not an employee ID — or omit UserID to register for yourself.

            - **Code 37931** — UserID exists but the user is deactivated. New registrations cannot be created for inactive users. — Fix: Register for an active user.

            - **Code 37042** — ProjectSubContractID (> 0) is not a contract of ProjectID (or does not exist). — Fix: Send a contract of the same project, or 0 / omit it to use the project's default contract.

            - **Code 37847** — The explicitly supplied ProjectSubContractID is a prepaid-services contract; mileage cannot be booked on it. — Fix: Choose a non-prepaid contract, or omit ProjectSubContractID.

            - **Code 37854** — ProjectSubContractID omitted/0 and the project has no usable mileage contract: neither a default-for-expenses contract nor a main contract that is not prepaid services. — Fix: Send an explicit ProjectSubContractID, or give the project a non-prepaid default/main contract.

            - **Code 37846** — The resolved contract (explicit or default) is closed. — Fix: Book on an open contract.

            - **Code 60107** — Purpose is empty or whitespace. Not caught by the 400 body validation; raised by the domain object. — Fix: Send a non-empty Purpose.

            - **Code 60100** — Both odometer values are sent, both odometer features are on, and the total distance (Distance, ×2 when IsRoundtrip) is not OdometerEnd − OdometerStart. — Fix: Send Distance = OdometerEnd − OdometerStart (and IsRoundtrip false), or omit the odometer values.

            - **Code 60067** — OdometerStart or OdometerEnd is 0 while OdometerIsRequired is on (negative values are already rejected with 400). — Fix: Send odometer readings greater than 0.

            - **Code 37825** — TimeRegistrationID is set and another mileage registration is already linked to that time registration. — Fix: Link to a different time registration, or omit TimeRegistrationID.

            - **Code 37827** — Date falls in a closed accounting period of the owner's employee projection. — Fix: Use a date in an open period, or ask finance to reopen the period.

            - **Code 37845** — MileageRateID has no rate period covering Date. — Fix: Choose a mileage rate that is valid on the date.

            - **Code 37932** — CarID is a personal car assigned to an employee other than the registration's owner. Shared cars (no employee) are accepted. — Fix: Use the owner's car or a shared car.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v1.projectmanagement.projectheader.create
