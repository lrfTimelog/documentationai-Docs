            not enough — this also applies to GET .../allocation. — Fix: Use a user with project privileges on the project
            (or make the integration user project manager / give it an ''all projects'' role).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '500':
          description: |-
            - **Code 37001** — The taskID in the path (external keys) or TaskId in the body (allocation) is not an existing task. Not a 404. — When: taskID is not a task (37001), checked before access. — Fix: Use an existing task ID.

            - **Code 100** — Unhandled server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
