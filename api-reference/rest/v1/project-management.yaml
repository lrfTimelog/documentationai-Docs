        | o | · | · | | TargetHourlyRate, PaymentPlanAmount, RevenueExprAmount, RevenueTravelAmount, IsExpensesLinked, IsTravelLinked
        | · | o | · | · | o | | IsFixedHourlyRate, HourlyRatePrice | · | · | · | o | · | | HourlyRateName | · | · | · | R
