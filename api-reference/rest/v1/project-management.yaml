    put:
      operationId: updatePayment
      summary: Update a payment
      description: |-
        Changes the name, amount, invoice date and/or quantity of a contract payment (billing-plan instalment) and returns it.

        Partial update (PaymentUpdate): only the fields you send change; an empty object is accepted and changes nothing. Quantity recalculates the amount from the unit rate; Amount recalculates the unit rate (and wins when both are sent); a new invoice date refreshes the exchange rate to system currency. Refused (400) for payments without a contract, booked or on a draft invoice, on contract models that do not allow editing payments, for an amount that cannot be derived (quantity 0, discount 100 %), and for an invoice-date change on a Time & Material Basic contract. Answers 200 with the payment re-read as PaymentRead. Requires access to the payment's project (same gate as GET /v1/payment/{paymentID}).

        **Use it to:**
        - Re-schedule an instalment (InvoiceDate) or change its amount from an ERP / PSA billing plan
        - Rename an instalment so it reads correctly on the invoice

        **Not for:**
        - Creating instalments → `POST /v1/payment`
        - Changing a continuous contract's periodic fee → `POST /v1/contract/update-recurring-contract-payment-plan-amount`
        - Discount, unit, task, product number or fixed-price flag — not in the body

        **Rules across fields:**
        - R1: Amount needs a non-zero effective Quantity (sent or stored) and a stored Discount below 100 % (400).
        - R2: Applied in the order InvoiceDate, Quantity, Amount: when Quantity and Amount are both sent, Amount is kept and the rate derived from it.

        **Behaviour:**
        - Idempotent.
        - Same body → same stored values. An empty object saves nothing (the payment is not dirty).
        - Safe to retry.
        - Side effect: Updates the instalment row and its budget periods (recurrence contracts).
        - Side effect: Recalculates dependants by contract type: fixed-price recurrence (rate / quantity changes), task-driven revenue (task + contract), fixed-price basic (contract), multi-customer split, continuous item invoicing (disbursements), contract payment-plan sync, invoicing potential, registration currency data, pending-booking status.
        - Side effect: A changed invoice date refreshes the instalment's exchange rate to system currency for that date.
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v1/payment`, `GET /v1/payment/{paymentID}`

        **Next:** `GET /v1/payment/{paymentID}`

        **See also:** `POST /v1/payment/{paymentID}/validate-update-payment`, `DELETE /v1/payment/{paymentID}`

        > **Not yet documented:** behaviour → events emitted; examples.
