        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.
        - Reads the project through GetDetachedByProjectID, so the preview never reaches the application cache.

        **Call first:** `GET /v1/task`

        **Next:** `PUT /v1/task/{taskID}`

