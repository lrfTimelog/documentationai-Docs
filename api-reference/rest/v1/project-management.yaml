    put:
      operationId: updateTask
      summary: Update a task
      description: |-
        Changes the fields, status or plan position of an existing task and returns it.

        A partial update (TaskUpdate): only the fields you send change. It can rename the task, change its dates, budget, hourly rate, task type and additional-text flag, change its status (Completed / Cancelled close it for registration), and move it under another task of the same project (ParentTaskID, 0 = root). The task's contract cannot be changed. All field, move and up-front status rules are checked on a detached copy before anything is saved, but the call is not atomic: a move is saved on its own first, and a status change does its own writes before the final project save. Answers 200 with the task read back as TaskRead — which has no dates, budget or status, so the response cannot confirm what changed.

        **Use it to:**
        - Keep task names, dates and budgets in sync from a PSA / ERP project plan
        - Close a task for registration when the deliverable is done (Status 3) or cancelled (Status 4)
        - Restructure a plan: move a task under another task, or back to the root

        **Not for:**
        - Changing the task's contract — not supported; a move into a contract sub-group is rejected
        - A dry run → `POST /v1/task/{taskID}/validate-update-task`

        **Rules across fields:**
        - R1: When both dates are sent, EndDate must be on or after StartDate (400 Code 200).
        - R2: BudgetHours and BudgetAmount may not both be sent when an hourly rate drives the task's budget (400).

        **Behaviour:**
        - Not idempotent.
        - Re-sending the same field values is a no-op for those fields (the adapter only marks changed values dirty) and the same ParentTaskID is skipped; a status already reached is skipped. The project is still re-saved.
        - Safe to retry only under a condition. Safe after a 4xx from the dry-run stage (nothing written). After a 500 or a timeout, GET the task (and list the project's tasks) before retrying: the move and status writes may have happened.
        - Side effect: ParentTaskID: the task (with its sub-tree) is moved and the project saved immediately; WBS numbers are renumbered; the old parent's payment is rebuilt when it lost its last child. The task keeps its contract.
        - Side effect: Status: closing / reopening runs TimeLog's task status processing — allocations set completed / not completed, the contract reopened when a closed task is reopened, vouchers reopened when leaving Completed, completion processing ('causes invoicing') when completing, the status pushed to sub-tasks of a parent; recurring tasks notify hard bookings.
        - On failure: A rejected status change (400) or a later 500 leaves an earlier move saved; status-change writes done before a failure stay. The cached project is invalidated so unsaved in-memory changes do not leak into later saves.
        - Changes are visible to the next read immediately.
        - The response is read through the task read model in the same request.

        **Call first:** `GET /v1/task`, `GET /v1/task/{taskID}`

        **Next:** `GET /v1/task/{taskID}`

        **See also:** `POST /v1/task/{taskID}/validate-update-task`, `POST /v1/task`, `DELETE /v1/task/{taskID}`

