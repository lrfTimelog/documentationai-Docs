      type: object
      properties:
        TaskID:
          type: integer
          format: int32
          x-timelog-identity:
            role: reference
          description: |-
            The task the time is registered on.

            Refers to `TaskRead.TaskID`. Look up valid values with `GET /v1/task/search-for-time-tracking`.

            - The caller is not allocated to the task — TimeLog CREATES the allocation (adds the caller to the project resource group and contract team, 0-hour allocation) before the registration's business rules run; it persists even if the registration is then rejected.

            Valid values come from `GET /v1/task/search-for-time-tracking`.
        Date:
          type: string
          format: date-time
          description: |-
            The date the time is registered on.

            Time zone: not yet documented.

            Stored as sent. Send midnight (YYYY-MM-DDT00:00:00). The default 0001-01-01 counts as empty (400).

            > **Not yet documented:** constraints → timezone.
        Hours:
          type: number
          format: double
          description: |-
            Duration in decimal hours (e.g. 1.5 = 1 h 30 min).

            Unit: hours (decimal)

            Must be > 0 (stricter than the pilot create, which only rejects 0).

            Range: min > 0, unit hours (decimal).
        Minutes:
          type: integer
          format: int32
          description: |-
            Duration in minutes.

            Unit: minutes

            - always — Hours is always passed (and must be > 0), and Hours wins over Minutes for project time — Minutes is never applied.
        Billable:
          type: boolean
          default: false
          description: |-
            Whether the time is billable to the customer.

            - Feature BillableOnTime is OFF — Set to the task's billable flag.

            - Task is fixed-price and the resulting Billable is false — Fails with 37620 (rest.timeregistration.fixed-price-non-billable).
        BillableHours:
          type: number
          format: double
          default: 0
          description: |-
            Billable duration in decimal hours.

            Unit: hours (decimal)

            - The registration ends up non-billable — ignored

            - Task is fixed-price and feature BillableHoursIsEditableOnFixedPrice is OFF — Set to Hours.

            - Feature BillableHoursIsEditable is OFF — Set to the actual Hours (pilot trace).

            - Billable and the field is omitted (other cases) — 0 billable hours is stored.

            - Feature RoundingOfBillableTime is ON — A mismatch raises 30168.
        BillableMinutes:
          type: integer
          format: int32
          description: |-
            Billable duration in minutes.

            Unit: minutes

            - always — BillableHours is always passed (0 when omitted), so BillableMinutes is never applied.
        Factor:
          type: number
          format: double
          description: |-
            Registration factor in percent (100 = normal).

            Unit: percent

            Default: 0 on the wire → stored as 100

            - Feature OvertimeFactor is OFF, or the task is fixed-price — Always 100.

            - OvertimeFactor ON and value is in the setting RoundingFactorOptionOfTimeRegistrations — applied

            - OvertimeFactor ON, value not in the list — Stored as 100.
        Comment:
          type:
          - string
          - 'null'
          description: |-
            Free-text comment on the registration.

            - Feature MandatoryComment is ON and comment is empty — Fails with 300116.

            > **Not yet documented:** constraints → max length.
        AdditionalComment:
          type: string
          x-timelog-condition: Required when the site configures the additional field as mandatory (30048).
          description: |-
            Second free-text field; its title and validation are site settings (captured title "Support ticket number", validation Number).

            **Conditional.** Required when the site configures the additional field as mandatory (30048).
        MonthlyPeriod:
          type: string
          description: |-
            Salary month the registration belongs to, as MMyyyy.

            - Feature TempTreatAllTimeRegistrationAsRecurringTask is OFF — ignored

            - Value outside ±MonthlyPeriodDropdownRange months of today, or malformed — Returns 500 (Code 100), not 400.
        StartTime:
          type: string
          format: date-time
          description: |-
            Start time of the work.

            Time zone: none applied — sent value stored as-is

            - The caller does not have timestamps enabled — StartTime/EndTime are cleared.

            - Timestamps enabled, StartTime sent — Seconds dropped; no timezone conversion; the stored end = StartTime + Hours.

            - Timestamps enabled, no StartTime — End = the caller's current time on that date, start = end − Hours (midnight-anchored if that crosses the previous day).
        EndTime:
          type: string
          format: date-time
          description: |-
            End time of the work — used only to cross-check StartTime and Hours.

            Time zone: none applied — only compared with StartTime

            - StartTime and EndTime both sent — 400 unless EndTime > StartTime and the whole minutes between them equal round(Hours × 60).

            - always — Never passed to the save: the stored end time is computed from StartTime + Hours.
