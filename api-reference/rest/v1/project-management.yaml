            Unit: project currency

            - Sent — Applied last (after Quantity); the unit Rate is then recalculated from the amount.

            - Effective Quantity (sent or stored) is 0 — 400 — the rate derivation would silently reset the amount to 0.

            - The payment's Discount is 100 % or more — 400 — same reason.
        InvoiceDate:
          type:
          - string
          - 'null'
