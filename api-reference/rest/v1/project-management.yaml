                    $ref: '#/components/schemas/PaymentRead'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
                  Actions:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafAction'
        '400':
          description: |-
            - **Code 200** — The request body or parameters failed input validation. — When: Name sent as empty string, or InvoiceDate not a valid date. — Fix: Fix every item listed in Details and resend.

            - **Code 400** — The body was empty or JSON null. Checked before the payment is looked up. An empty object {} is accepted (and changes nothing). — Fix: Send a JSON object with the fields to change.

            - **Code 400** — The payment has no contract (ProjectSubContractID), is booked (BookedDate set), or its contract model does not allow editing payments. Checked before any field is applied. — Fix: Booked instalments cannot be changed; credit the invoice in TimeLog first. For other contract models change the payment plan in TimeLog.

            - **Code 400** — Amount was sent but the effective Quantity is 0, or the stored Discount is >= 100 %: the unit rate is derived from amount / quantity / (1 - discount), which would silently reset the amount to 0. — Fix: Send a non-zero Quantity with the Amount; for a 100 % discount change the discount in TimeLog first.

            - **Code 400** — The billing-plan save rules rejected the change: the payment is on a draft invoice (37710), the invoice date changed on a Time & Material Basic contract (37526), or the budget-period share ratios of a fixed-price recurrence no longer match the amount (37602). — Fix: Read Message. Draft-invoice payments: remove the line from the draft invoice first.
          content:
