        Creates an allocation of one user on a task, with planned hours, hourly rate and optional period, and returns it.

        Plans a user on a task: AllocatedHours, the contract hourly rate (omit HourlyRateID to let TimeLog resolve the user's default rate) and, when the tenant feature 'Enable start and end date on allocations' is on, a period (a missing date defaults to the task's). One allocation per user and task: a second one is refused with 409, pointing to the existing allocation ID. The user is added to the project's resource group when missing. Answers 200 with the new allocation as AllocationRead. Requires project privileges on the task's project. Not idempotent and not atomic.

        **Use it to:**
        - Staff a project from a resource-planning or PSA tool: allocate people with planned hours
        - Give a user access to register time on a task, with an explicit hourly rate

        **Not for:**
        - A dry run → `POST /v1/task/{taskID}/allocation/validate-new-allocation`

        **Rules across fields:**
        - R1: Effective period: StartDate (or the task's StartDate) must not be after EndDate (or the task's EndDate) (400).
        - R2: At most one allocation per (user, task), any status (409).

        **Behaviour:**
        - Not idempotent.
        - Safe to retry only under a condition. A retry after success answers 409 with the existing allocation ID — treat that 409 as 'already done'.
        - Duplicates: Refused with 409 (pre-check on employee + task).
        - Side effect: Inserts the allocation (status NotCompleted; recurring tasks get a recurring allocation without period) with an audit-log + e-mail event, and sets the task's HasAllocations flag.
        - Side effect: Adds the user's employee to the project's resource group when missing (resource hourly rate 0).
        - Side effect: Notifies the allocation search table, so the task appears in the user's caller-scoped task / project searches.
        - Side effect: With ChangeTaskDateBasedAllocation on (non-recurring task) and an allocation span that differs from the task dates, the task is marked dirty so its dates follow the allocations in the project save.
        - Side effect: Re-saves the project.
        - Side effect: Dates sent, no task date sync, not recurring: sends the 'allocation exceeds task dates' notification when the period goes beyond the task.
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v1/task`, `GET /v1/user`

        **Next:** `GET /v1/task/{taskID}/allocation`, `POST /v1/time-registration`

        **See also:** `POST /v1/task/{taskID}/allocation/validate-new-allocation`

