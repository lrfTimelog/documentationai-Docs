  /v1/project/{projectID}/raise-created-events:
    post:
      operationId: raiseProjectCreatedEvents
      summary: Re-raise the project-created events
      description: |-
        Raises TimeLog's "project created" domain events again for an existing project, so integrations pick the project up.

        Re-emits EventTypes.ProjectCreate for the project — the event the TimeLog project create normally raises — and, when the project is available in Resource Planner, IsAvailableInResourcePlannerChecked. Everything subscribed to those events reacts as if the project had just been created: the audit log (when project audit logging is on), notification subscribers, the financial integrations that transfer projects (e-conomic, Business Central, generic financial, Fortnox, Uniconta, Björn Lundén, and the integration-service mediator), and the Resource Planner export. Answers 200 with `null`. It checks only that the project exists: NO project privilege and no guard against raising the events more than once.

        **Not for:**
        - Integrators: this is an internal platform hook, not a 'resync project to ERP' operation — repeated calls replay the create to every subscriber
        - Creating a project → `POST /v1/project/create-from-template`

        **Behaviour:**
        - Not idempotent.
        - Every call raises the events again; there is no record of a previous raise and no dedup.
        - Not safe to retry blindly. Each retry replays the create to every subscriber (audit log, notifications, financial project transfer, Resource Planner export).
        - Duplicates: None in TLP.
        - Side effect: Logs a ProjectCreate event and, with the AuditLogProject setting, an audit-log entry 'project created' — again for an existing project.
        - Side effect: Financial integrations: the integration-service mediator publishes a project-transfer notification for tenants whose integration supports and has activated project transfer, then sleeps 2 s in the request thread; the legacy integration services (e-conomic, Business Central, generic financial, Fortnox, Uniconta, Björn Lundén) handle ProjectCreate with the same SaveProject path as ProjectUpdate when UseTransferProject is set.
        - Consistency: eventual
        - Mediator publish and Resource Planner export are started in the request; how fast the external systems apply them is not measured.

        **Call first:** `GET /v1/project/{projectID}`

        **See also:** `POST /v1/project/create-from-template`

