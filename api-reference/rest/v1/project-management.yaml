      - Projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate.create.validateNewTask'
      responses:
        '200':
          description: 'Success without content: HTTP 200 with the literal JSON body `null`. The literal `null` (TafSuccessResult):
            the task could be built and passed the save rules.'
          content:
            application/json:
              schema:
                type: 'null'
        '400':
          description: '- **Code 200** — The request body or parameters failed input validation. — When: Body rules and R1–R5
            — reached only when the validator''s conditional rules do not crash first. — Fix: Fix every item listed in Details
            and resend.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '401':
          description: '- Missing, invalid or expired bearer token. — When: Captured. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '500':
          description: |-
            - **Code 100** — Unhandled server error.

            - **Code 37014** — The projectID in the path (update, update-status) or ProjectID in the payment body does not exist (0 and negative included). Not a 404. — When: ProjectID does not exist. — Fix: Use a ProjectID from `GET /v1/project/get-all`.

            - **Code 37042** — ProjectSubContractID (> 0) does not exist or is not a contract of ProjectID. Raised by the controller, or earlier INSIDE body validation when the validator's contract rules load the contract (then it replaces the 400 field list). — Fix: Send a contract of the project (`GET /v1/contract`), or omit it for the default (project main contract / parent's contract).

            - **Code 37944** — HourlyRateID (> 0) is not one of the hourly rates of the task's contract. Checked by the adapter (time-and-material contracts, or fixed price on an Allocated-rate project) and by the task save rules. — Fix: Use a contract hourly rate of the chosen contract, or 0 for the employee's default rate.

            - **Code 37043** — HourlyRateID is listed on the contract but the rate itself cannot be loaded (data access failure). Rare; normally 37944 is raised first. — Fix: Use another hourly rate of the contract; report persistent cases.

            - **Code 37939** — The task's contract is task-driven revenue and PaymentProductNo is not a product number of the project's legal entity. Not checked on other contract models. — When: TDR contract and PaymentProductNo is unknown in the project's legal entity. — Fix: Use an existing product number of the project's legal entity.

