    get:
      operationId: getContract
      summary: Get a contract
      description: |-
        Returns one contract of a project — model, status, type and expense/mileage defaults.

        Reads one contract by its integer ID and returns it as ContractRead with a self link and the ten contract TAF actions. The read model is thin: it has no budgets, amounts, dates or owner. An unknown ID is a 500 with Code 100 and no detail, not a 404.

        **Use it to:**
        - Resolve the ProjectSubContractID of a payment, expense or mileage registration to its contract model and status
        - Read back a contract after one of the create-*-contract operations

        **Not for:**
        - All contracts of a project → `GET /v1/contract`
        - Budgets, amounts or the payment plan of a contract — not exposed by this read model; instalments → `GET /v1/payment`

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v1/contract`, `GET /v1/payment/{paymentID}`

        **Next:** `GET /v1/payment`

        **See also:** `GET /v1/ContractModel`
      tags:
      - Projects
      parameters:
      - name: contractID
        in: path
        required: true
        schema:
          type: integer
          format: int32
        description: The contract. A non-integer does not match the route (404 Page Not Found).
      responses:
        '200':
          description: The object, wrapped in the TAF envelope (`Properties`). The contract, with a self link and the contract
            TAF actions (create / validate per model).
          content:
            application/json:
              schema:
                type: object
                description: 'TAF envelope: the object is in `Properties`. Null members are omitted; a null result is `{"Links":
                  [self]}` without `Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/ContractRead'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
                  Actions:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafAction'
        '401':
          description: '- Missing, invalid or expired bearer token. — When: Captured. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '404':
          description: '- The URL did not match any route (including a route constraint such as {id:int} receiving a non-integer).
            — When: contractID is not an integer (captured: /contract/not_an_integer).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: Unknown contract ID
                  value:
                    Code: 100
                    Details: []
                    Message: Unknown error occur in system, please contact system administrator.
                    Parameters: 'contractID: 99999999'
                    Url: https://{region-node}.timelog.com/{account}/api/v1/contract/99999999
