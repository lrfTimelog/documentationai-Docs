              examples:
                example1:
                  summary: Empty body
                  value:
                    Code: 100
                    Details: []
                    Message: Unknown error occur in system, please contact system administrator.
                    Parameters: 'model: {"ProjectId":0,"ProjectSubContractId":0,"PaymentPlanAmount":0.0}'
                    Url: https://{region-node}.timelog.com/{account}/api/v1/contract/update-recurring-contract-payment-plan-amount
