      summary: Delete a payment
      description: |-
        Deletes a contract payment (billing-plan instalment) that is not on an invoice.

        Removes one instalment from its project's billing plan and re-saves the project. Refused (400) when the contract model does not allow deleting payments, or when the instalment is booked, on a draft invoice, or (unbooked) has auto expenses on a draft invoice. Deleting a task's fixed-price instalment switches that task's payment recognition to the overall payment plan. Answers 200 with `null`. Requires access to the payment's project (same gate as GET /v1/payment/{paymentID}).

        **Use it to:**
        - Remove an instalment that was created by mistake or is no longer agreed

        **Not for:**
        - Invoiced instalments — credit the invoice in TimeLog first
        - A dry run → `POST /v1/payment/{paymentID}/validate-delete-payment`

        **Behaviour:**
        - Not idempotent.
        - A second DELETE of the same ID answers 404.
        - Safe to retry only under a condition. Treat a 404 on retry as 'already deleted'. After a 400 from the project save (payment-delete-rule-violation) re-read the payment first.
        - Side effect: Removes the instalment from the project's billing plan and saves the project.
        - Side effect: If the instalment belongs to a task, sets that task's PaymentRecognitionModel to OverallPaymentPlan (the fixed-price task model is dropped).
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v1/payment`, `POST /v1/payment/{paymentID}/validate-delete-payment`

