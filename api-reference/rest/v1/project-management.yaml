  /v1/task/{taskID}:
    delete:
      operationId: deleteTask
      summary: Delete a task
      description: |-
        Deletes a leaf task that has no time registrations, together with its allocations and instalments.

        Removes the task from its project plan. Refused (400) when the task has sub-tasks or milestones, time registrations, an invoiced or booked payment, revenue vouchers, is a customer's standard travel task, or is a TDR task in a completed contract with vouchers. On success the task's allocations are deleted, its instalments removed (time-and-material-basic tasks and TDR fixed-price-payment tasks), the remaining tasks are renumbered and the project is re-saved. Baselines, help-desk cases and forecast lines that point at the task are left as they are. Answers 200 with `null`. Not atomic.

        **Use it to:**
        - Remove a task created by mistake (e.g. by a sync) before anyone registered time on it

        **Not for:**
        - Tasks with registrations — close them instead: `PUT /v1/task/{taskID}` with Status 3 (Completed) or 4 (Cancelled)
        - A dry run → `POST /v1/task/{taskID}/validate-delete-task`

        **Behaviour:**
        - Not idempotent.
        - Safe to retry only under a condition. A second DELETE answers 500 / 37001. After a 500 or a timeout, GET /v1/task/{taskID}: a 500 / 37001 there means the task is gone.
        - Side effect: Deletes every allocation on the task (audit log + e-mail event per allocation) and clears the task's HasAllocations flag.
        - Side effect: Time-and-material-basic tasks (not fixed price) and TDR fixed-price-payment tasks: deletes the task's instalments from the billing plan. TDR overall-payment-plan tasks: releases the payment linked to the task.
        - Side effect: Deletes the task row and its task search row; notifies invoicing; deletes Task external-ID mappings.
        - Side effect: Renumbers the project plan (RemoveTaskOnProject). When the parent has no children left, rebuilds the parent's payment; when the task was the last child of a contract sub-group, the group flag is cleared.
        - Side effect: Re-saves the project (SourceInterface.WebApi): project dates may be re-aligned to the plan, invoicing potential recalculated, billing plan saved.
        - Side effect: Left untouched (by design, XML remark): baselines, help-desk cases and forecast lines pointing at the task.
        - On failure: If the project save after the delete throws, the task is deleted, the remaining tasks keep their old WBS numbers and the call answers 500 (logged as a warning).
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v1/task`, `POST /v1/task/{taskID}/validate-delete-task`

        **Next:** `GET /v1/task`

        **See also:** `PUT /v1/task/{taskID}`

        > **Not yet documented:** behaviour → side effects; examples.
      tags:
      - Projects
      parameters:
      - name: taskID
        in: path
        required: true
        schema:
          type: integer
          format: int32
        description: The task to delete. Route constraint :int.
      responses:
        '200':
          description: 'Success without content: HTTP 200 with the literal JSON body `null`. The literal `null`: the task
            was deleted and the project re-saved.'
          content:
            application/json:
              schema:
                type: 'null'
        '400':
          description: |-
            - **Code 400** — The task is a parent (has sub-tasks or milestones). The API refuses because the delete procedure removes only this row and would orphan the children. — Fix: Delete the sub-tasks / milestones first (bottom-up).

            - **Code 400** — A payment (instalment) of the task fails the billing-plan delete rules (invoiced or booked). — Fix: Credit the invoice in TimeLog first, or keep the task (set Status Cancelled with PUT).

            - **Code 400** — The delete would remove revenue vouchers of the task (booked ones included) and credit their registrations, so the API refuses. — Fix: Keep the task; cancel it instead.

            - **Code 400** — A customer's standard travel setup points at this task. — Fix: Change the customer's standard travel task in TimeLog first.

            - **Code 400** — TaskCanBeDeleted rejected the delete: the task has time registrations (30035), a fixed-price instalment locked by an invoice (37578), it is a TDR task in a completed contract with vouchers (37886), or (parent) a child cannot be deleted (30034). Delete returns the single violation; validate-delete-task joins all. — When: Registrations, invoiced fixed-price instalment, TDR task in a completed contract with vouchers. Also the fallback 'Task with the ID {0} could not be deleted' when the row delete reports false. — Fix: Tasks with registrations cannot be deleted — set Status Cancelled or Completed instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '403':
          description: '- **Code 103** — The caller has no project-area privilege ViewCreateEditDelete covering the task''s
            project and, for a template project, not the system-administration project-templates page. Read access alone is
            not enough — this also applies to GET .../allocation. — Fix: Use a user with project privileges on the project
            (or make the integration user project manager / give it an ''all projects'' role).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '500':
          description: |-
            - **Code 37001** — The taskID in the path (external keys) or TaskId in the body (allocation) is not an existing task. Not a 404. — When: taskID is not a task (37001) — also on a repeated DELETE. — Fix: Use an existing task ID.

            - **Code 100** — Unhandled server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
