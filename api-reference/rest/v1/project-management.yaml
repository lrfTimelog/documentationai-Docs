      - Projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskRegistrationCreate.create'
      responses:
        '200':
          description: 'Success without content: HTTP 200 with the literal JSON body `null`. Body is the literal JSON `null`
            (TafSuccessResult). No ID, no Location header.'
          content:
            application/json:
