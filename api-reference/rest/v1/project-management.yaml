          type:
          - integer
          - 'null'
          format: int32
          x-timelog-identity:
            role: reference
          description: |-
            The contract hourly rate of the allocation. Omit it to let TimeLog resolve the default rate for the user.

            Refers to `ContractHourlyRateID`.

            - 0 or negative — 400 Code 200 (> 0 when present).

            - > 0 and not a rate of the task's contract, or inactive — 400 with the violation message (37944 text) or 'The contract hourly rate with ID {0} is not active'.

            - Omitted — Resolved on save: fixed-price task on a Calculated project → the system hourly rate; time & material / Allocated → the task's rate, else the employee's resource-group rate, else the project's standard rate, else the employee's standard rate.

