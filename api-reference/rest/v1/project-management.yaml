        - Pick the ProjectSubContractID for a payment, expense or mileage registration
        - Find the main contract (IsMainContract) or the default expense contract (IsDefaultExpenses) of a project
        - Reconcile after a create-*-contract call whose response was lost (the newest contract is first)

        **Not for:**
        - Budgets / amounts of a contract — not in ContractRead

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v1/project/get-all`

        **Next:** `GET /v1/contract/{contractID}`, `GET /v1/payment`, `POST /v1/payment`

        **See also:** `GET /v1/ContractModel`

        > **Not yet documented:** examples; request → query params.
      tags:
      - Projects
      parameters:
      - name: projectID
        in: query
        required: true
        schema:
          type: integer
          format: int32
          x-timelog-filter:
            operators:
            - eq
        description: |-
          The project. Required: omitted → 404 rest.action-not-matched. Not validated: an unknown ID gives an empty page.

          Filters on `ContractRead.ProjectID` (eq).
      - name: $page
        in: query
        required: false
        schema:
          type: integer
          default: 1
        description: Page number.
      - name: $pagesize
        in: query
        required: false
        schema:
          type: integer
          default: 10
        description: Page size. No maximum in the API layer.
      responses:
        '200':
          description: |-
            A list, wrapped in the TAF list envelope (`Entities[].Properties`). One page of the project's contracts; TotalRecord counts all contracts of the project.

            Paged with `$page` (default 1) and `$pagesize` (default 10).

            Order: ContractID descending (newest first).

            Empty result: 200 with empty Entities — also for a projectID that does not exist (the procedure always returns both result sets).
