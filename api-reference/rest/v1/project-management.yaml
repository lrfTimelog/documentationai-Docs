  /v1/task/{taskID}/validate-delete-task:
    post:
      operationId: validateDeleteTask
      summary: Validate a task delete (dry run)
      description: |-
        Checks whether a task could be deleted, without deleting it.

        Runs the same checks as `DELETE /v1/task/{taskID}` before its first write — access, the API refusals (sub-tasks or milestones, invoiced / booked payment, revenue vouchers, customer standard travel task) and the TimeLog delete rules (registrations, invoiced fixed-price instalment, TDR task in a completed contract) — and answers 200 with `null`. Where the delete reports only one rule violation, the dry run joins all of them into the message.

        **Use it to:**
        - Ask before offering 'delete' in a sync UI; fall back to closing the task when it has registrations

        **Not for:**
        - Deleting → `DELETE /v1/task/{taskID}`

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v1/task`

        **Next:** `DELETE /v1/task/{taskID}`

        **See also:** `PUT /v1/task/{taskID}`

        > **Not yet documented:** examples.
      tags:
      - Projects
      parameters:
      - name: taskID
        in: path
        required: true
        schema:
          type: integer
          format: int32
        description: The task to check. Route constraint :int.
      responses:
        '200':
          description: 'Success without content: HTTP 200 with the literal JSON body `null`. The literal `null`: no refusal
            and no delete-rule violation.'
          content:
            application/json:
              schema:
                type: 'null'
        '400':
          description: |-
            - **Code 400** — The task is a parent (has sub-tasks or milestones). The API refuses because the delete procedure removes only this row and would orphan the children. — Fix: Delete the sub-tasks / milestones first (bottom-up).

            - **Code 400** — A payment (instalment) of the task fails the billing-plan delete rules (invoiced or booked). — Fix: Credit the invoice in TimeLog first, or keep the task (set Status Cancelled with PUT).

            - **Code 400** — The delete would remove revenue vouchers of the task (booked ones included) and credit their registrations, so the API refuses. — Fix: Keep the task; cancel it instead.

            - **Code 400** — A customer's standard travel setup points at this task. — Fix: Change the customer's standard travel task in TimeLog first.

            - **Code 400** — TaskCanBeDeleted rejected the delete: the task has time registrations (30035), a fixed-price instalment locked by an invoice (37578), it is a TDR task in a completed contract with vouchers (37886), or (parent) a child cannot be deleted (30034). Delete returns the single violation; validate-delete-task joins all. — Fix: Tasks with registrations cannot be deleted — set Status Cancelled or Completed instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '403':
          description: '- **Code 103** — The caller has no project-area privilege ViewCreateEditDelete covering the task''s
            project and, for a template project, not the system-administration project-templates page. Read access alone is
            not enough — this also applies to GET .../allocation. — Fix: Use a user with project privileges on the project
