openapi: 3.1.0
info:
  title: Invoicing — REST API v1
  version: v1
  description: |-
    Enums are integers in v1.

    **Conventions that apply to every operation in this file:**
    - Property names are PascalCase.
    - Successful bodies use the TAF envelope: one object in `Properties`, lists in `Entities[].Properties`.
    - Some operations succeed without content: HTTP 200 with the literal body `null`, or HTTP 204.
    - `PUT` replaces the whole object: omitted fields are reset.
    - Treat error `Code` 102 as a business-rule violation, whether the HTTP status is 422 or 500.

    > **Not yet documented:** rate limits.
servers:
- url: https://{region-node}.timelog.com/{account}/api
  description: 'Your TimeLog site. Copy both values from the address bar when you are signed in to TimeLog: `region-node`
    is the first part of the host name (for example `app3` in `app3.timelog.com`), `account` is the first path segment after
    it.'
  variables:
    region-node:
      default: app3
    account:
      default: your-account
security:
- bearer: []
paths:
  /v1/contract-hourly-rate:
    get:
      operationId: getContractHourlyRatesByContract
      summary: List contract hourly rates
      description: |-
        Lists the current hourly rates of one contract, newest first.

        Returns the hourly rates a contract (ProjectSubContract) can charge: active and inactive, but only the CURRENT version of each rate — a rate that was re-priced (indexed) is replaced by its new row and the old row is not listed. Use it to find the ContractHourlyRateID to set on tasks and allocations. An unknown contractID gives an empty list, not an error. ContractHourlyRateGUID is always the all-zero GUID on this list; call get-by-id when you need the GUID.

        **Use it to:**
        - Find the HourlyRateID for `POST /v1/task` / allocation updates
        - Check whether a contract already has a rate before calling create-hourly-rate (which matches by name)

        **Not for:**
        - Price-list rates of the tenant (use `GET /v1/hourly-rate`)
        - Rate history / which rate was valid on a past date (indexed rows are hidden; no dates exposed)

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v1/contract`

        **Next:** `GET /v1/contract-hourly-rate/get-by-id`

        **See also:** `GET /v1/hourly-rate`

        > **Not yet documented:** examples.
      parameters:
      - name: contractID
        in: query
        required: true
        schema:
          type: integer
          format: int32
          x-timelog-filter:
            operators:
            - eq
        description: |-
          The contract (ProjectSubContractID). Omitted → 404 action-not-matched (captured). Unknown → 200 with no entities.

          Filters on `ProjectSubContractID` (eq).

          Refers to `ContractRead.ContractID`. Look up valid values with `GET /v1/contract`.
      - name: $page
        in: query
        required: false
        schema:
          type: integer
          default: 1
        description: Page number (1-based).
      - name: $pagesize
        in: query
        required: false
        schema:
          type: integer
          default: 10
        description: Page size. No maximum enforced in the API layer.
      - name: $expand
        in: query
        required: false
        schema:
          type: string
        description: 'Not supported: forwarded to the procedure, which declares no Expand parameter.'
      responses:
        '200':
          description: |-
            A list, wrapped in the TAF list envelope (`Entities[].Properties`). One page. Properties: TotalRecord, TotalPage, PageNumber (strings). Excludes indexed (superseded) rows; includes inactive ones.

            Paged with `$page` (default 1) and `$pagesize` (default 10).

            Order: ContractHourlyRateID descending (fixed) — newest rate first

            Empty result: 200 with no Entities (also for an unknown contractID)
          content:
            application/json:
              schema:
                type: object
                description: 'TAF list envelope: each item is in `Entities[].Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/TafListPaging'
                  Entities:
                    type: array
                    description: Omitted (not `[]`) when the list is empty.
                    items:
                      type: object
                      properties:
                        Properties:
                          $ref: '#/components/schemas/ContractHourlyRateRead'
                        Links:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafLink'
                        Actions:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafAction'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
        '401':
          description: '- Missing, invalid or expired bearer token. — When: No or invalid bearer token with contractID present
            (not captured). — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '404':
          description: '- The route matched a controller, but no action accepts the supplied query parameters — typically
            a required (non-nullable) simple parameter such as a DateTime was omitted. It is a missing-parameter error that
            looks like a 404. — When: contractID omitted — also WITHOUT a token: action selection fails before authentication
            (captured, 9 scenarios).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: contractID omitted (captured)
                  value:
                    Message: No HTTP resource was found that matches the request URI 'https://{region-node}.timelog.com/{account}/api/v1/contract-hourly-rate'.
                    MessageDetail: No action was found on the controller 'ContractHourlyRate' that matches the request.
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v1.invoicing.contracthourlyrate.list
  /v1/contract-hourly-rate/get-by-id:
    get:
      operationId: getContractHourlyRateById
      summary: Get a contract hourly rate
      description: |-
        Returns one contract hourly rate by its integer ID, including superseded (indexed) versions.

        Reads a single rate row. Unlike the list, it also returns rows that were superseded by an indexation (re-pricing) — nothing in the response says the row is no longer current, so do not use this to read "the current price" of an ID you stored earlier: after an indexation the current rate has a NEW ContractHourlyRateID (find it with the list). An unknown ID is a 500, not a 404.

        **Use it to:**
        - Resolve the HourlyRateID of a task or allocation to its name, amount and currency

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v1/contract-hourly-rate`

        > **Not yet documented:** examples.
      parameters:
      - name: contractHourlyRateID
        in: query
        required: true
        schema:
          type: integer
          format: int32
        description: |-
          The rate's ContractHourlyRateID. Omitted → 404 action-not-matched (captured). Unknown → 500 Code 100.

          Refers to `ContractHourlyRateRead.ContractHourlyRateID`. Look up valid values with `GET /v1/contract-hourly-rate`.
      responses:
        '200':
          description: |-
            The object, wrapped in the TAF envelope (`Properties`). The rate row (current or superseded). ContractHourlyRateGUID is the real GUID here.

            Order: none

            Empty result: none
          content:
            application/json:
              schema:
                type: object
                description: 'TAF envelope: the object is in `Properties`. Null members are omitted; a null result is `{"Links":
                  [self]}` without `Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/ContractHourlyRateRead'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
                  Actions:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafAction'
        '401':
          description: '- Missing, invalid or expired bearer token. — When: No or invalid bearer token with the parameter
            present (not captured). — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '404':
          description: '- The route matched a controller, but no action accepts the supplied query parameters — typically
            a required (non-nullable) simple parameter such as a DateTime was omitted. It is a missing-parameter error that
            looks like a 404. — When: contractHourlyRateID omitted — also without a token (captured).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: contractHourlyRateID omitted (captured)
                  value:
                    Message: No HTTP resource was found that matches the request URI 'https://{region-node}.timelog.com/{account}/api/v1/contract-hourly-rate/get-by-id'.
                    MessageDetail: No action was found on the controller 'ContractHourlyRate' that matches the request.
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v1.invoicing.contracthourlyrate.get
  /v1/contract-hourly-rate/validate-hourly-rate:
    post:
      operationId: validateContractHourlyRate
      summary: Validate a contract hourly rate
      description: |-
        Checks a contract-hourly-rate create body without writing anything.

        A dry run of create-hourly-rate, but with DIFFERENT rules: it additionally refuses fixed-price-style contracts (38003) and unknown product numbers (37939, looked up in the tenant's default legal entity), and its "existing Standard rate" match requires the same name AND amount, so it does not warn that create would re-price a Standard rate with the same name. When an existing rate matches, no further rule is checked. Success is 200 with the literal body null.

        **Use it to:**
        - Pre-flight a data import before calling create-hourly-rate

        **Not for:**
        - Predicting create's outcome exactly

        **Rules across fields:**
        - R1: ProjectSubContractId must be a contract of ProjectId (37042).
        - R2: If an active Standard rate with the same name and amount exists, or (category 1 / 3) a Project / Customer rate with the same name and amount, the call succeeds without checking the contract model or the category.

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v1/contract`

        **See also:** `GET /v1/contract-hourly-rate`

        > **Not yet documented:** examples.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractHourlyRateCreate'
      responses:
        '200':
          description: |-
            Success without content: HTTP 200 with the literal JSON body `null`. Literal JSON `null` (TafSuccessResult).

            Order: none

            Empty result: none
          content:
            application/json:
              schema:
                type: 'null'
        '401':
          description: '- Missing, invalid or expired bearer token. — When: No or invalid bearer token (captured). — Fix:
            Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '500':
          description: |-
            - **Code 37014** — The projectID in the path (update, update-status) or ProjectID in the payment body does not exist (0 and negative included). Not a 404. — When: ProjectId omitted / 0 / unknown (captured). — Fix: Use a ProjectID from `GET /v1/project/get-all`.

            - **Code 37042** — ProjectSubContractID (> 0) is not a contract of ProjectID (or does not exist). — When: ProjectSubContractId is not a contract of ProjectId. — Fix: Send a contract of the same project, or 0 / omit it to use the project's default contract.

            - **Code 37939** — ProductNo is not blank and is not a product number of the tenant's DEFAULT legal entity — the project's legal entity is not used. create-hourly-rate does not check ProductNo at all. — When: ProductNo not blank and not in the default legal entity. — Fix: Use a product number that exists in the default legal entity, or omit ProductNo.

            - **Code 38003** — The contract's model is FixedPriceBasic, ContinuousItemInvoicing, RecurringProductContract or TaskDrivenRevenue — hourly rates are refused for them by the dry run. Only reached when no existing rate matched first. create-hourly-rate does NOT apply this rule. — When: No existing rate matched and the contract model does not take hourly rates. — Fix: Add hourly rates only to time-and-material style contracts.

            - **Code 300132** — ContractHourlyRateCreateCategory is omitted, 0 or not 1 / 2 / 3. The message talks about privileges, but no privilege is involved. On create the same input is a 500 Code 100 instead. — When: No existing rate matched and the category is omitted / 0 / unknown. — Fix: Send ContractHourlyRateCreateCategory 1 (contract only), 2 (standard price list) or 3 (customer price list).

            - **Code 100** — Unhandled server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: Empty body (captured)
                  value:
                    Code: 102
                    Details:
                    - Message: 'No Project with ProjectID: 0 exist'
                      ErrorCode: 37014
                    Message: Business rules exception.
                    Parameters: 'contractHourlyRateModel: {"ContractHourlyRateCreateCategory":0,"ProjectId":0,"ProjectSubContractId":0,"ContractHourlyRateName":null,"ContractHourlyRateValue":0.0,"ProductNo":null}'
                    Url: https://{region-node}.timelog.com/{account}/api/v1/contract-hourly-rate/validate-hourly-rate
      x-timelog-key: rest.v1.invoicing.contracthourlyrate.validate
  /v1/cost-price:
    get:
      operationId: getCostPrices
      summary: List cost prices
      description: |-
        Lists every cost price group of every legal entity, active and inactive.

        Cost price groups are the internal cost levels employees are assigned to (UserCreate.CostPriceID) — the employer's cost of an employee's time, in the legal entity's currency. The list has no filter: all legal entities, active and inactive groups, newest first. Use it to pick a CostPriceID of the new user's legal entity.

        **Use it to:**
        - Pick CostPriceID for `POST /v1/user/create` (LegalEntityId = the user's legal entity, IsActive true)

        **Not for:**
        - An employee's actual cost history (cost price drill-down is not in REST v1)

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **Next:** `POST /v1/user/create`

        **See also:** `GET /v1/project-product`
      parameters:
      - name: $page
        in: query
        required: false
        schema:
          type: integer
          default: 1
        description: Page number (1-based).
      - name: $pagesize
        in: query
        required: false
        schema:
          type: integer
          default: 10
        description: Page size. No maximum enforced in the API layer.
      responses:
        '200':
          description: |-
            A list, wrapped in the TAF list envelope (`Entities[].Properties`). One page. Properties: TotalRecord, TotalPage, PageNumber (strings); a list-level self link.

            Paged with `$page` (default 1) and `$pagesize` (default 10).

            Order: CostPriceID descending (fixed)

            Empty result: 200 with no Entities
          content:
            application/json:
              schema:
                type: object
                description: 'TAF list envelope: each item is in `Entities[].Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/TafListPaging'
                  Entities:
                    type: array
                    description: Omitted (not `[]`) when the list is empty.
                    items:
                      type: object
                      properties:
                        Properties:
                          $ref: '#/components/schemas/CostPriceRead'
                        Links:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafLink'
                        Actions:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafAction'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
        '401':
          description: '- Missing, invalid or expired bearer token. — When: No or invalid bearer token (captured). — Fix:
            Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v1.invoicing.costprice.list
  /v1/hourly-rate:
    get:
      operationId: getHourlyRates
      summary: List hourly rates
      description: |-
        Lists every active price-list hourly rate of the tenant — all legal entities, all currencies, standard and customer-specific lists.

        Returns the price-list entries (service × price group) that contracts copy their rates from. There is no filter: the list mixes every legal entity, every price group / currency and both the standard price lists (CustomerID null) and customer-specific negotiated lists. Filter client-side by LegalEntityID, CustomerID and CurrencyISO. Inactive entries are not returned. Changing a price-list rate does not change rates already copied to contracts (see `GET /v1/contract-hourly-rate`).

        **Use it to:**
        - Pick StandardHourlyRateID for `POST /v1/user/create` (CustomerID null, user's legal entity)
        - Mirror the price lists into a CRM / quoting tool

        **Not for:**
        - The rates a specific contract charges (use `GET /v1/contract-hourly-rate`)

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **Next:** `POST /v1/user/create`

        **See also:** `GET /v1/hourly-rate/default`, `GET /v1/contract-hourly-rate`
      parameters:
      - name: $page
        in: query
        required: false
        schema:
          type: integer
          default: 1
        description: Page number (1-based).
      - name: $pagesize
        in: query
        required: false
        schema:
          type: integer
          default: 10
        description: Page size. No maximum enforced in the API layer.
      responses:
        '200':
          description: |-
            A list, wrapped in the TAF list envelope (`Entities[].Properties`). One page. Properties: TotalRecord, TotalPage, PageNumber (strings); a list-level self link; no per-entity links.

            Paged with `$page` (default 1) and `$pagesize` (default 10).

            Order: HourlyRateID descending (fixed)

            Empty result: 200 with no Entities
          content:
            application/json:
              schema:
                type: object
                description: 'TAF list envelope: each item is in `Entities[].Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/TafListPaging'
                  Entities:
                    type: array
                    description: Omitted (not `[]`) when the list is empty.
                    items:
                      type: object
                      properties:
                        Properties:
                          $ref: '#/components/schemas/HourlyRateRead'
                        Links:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafLink'
                        Actions:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafAction'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
        '401':
          description: '- Missing, invalid or expired bearer token. — When: No or invalid bearer token (captured). — Fix:
            Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v1.invoicing.hourlyrate.list
  /v1/hourly-rate/default:
    get:
      operationId: getDefaultHourlyRates
      summary: List default-currency hourly rates
      description: |-
        Lists the active price-list rates of every price group that is its price list's DEFAULT currency.

        The same entries as `GET /v1/hourly-rate`, restricted to price groups flagged as the price list's default currency — i.e. one currency per price list, so each service appears once per price list instead of once per currency. "Default" refers to the CURRENCY of the price group, not to the entry's IsDefault flag (which is false on every captured row). Customer-specific lists are included when their price group is a default-currency group.

        **Use it to:**
        - Show one rate per service and price list without the currency copies

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **See also:** `GET /v1/hourly-rate`
      parameters:
      - name: $page
        in: query
        required: false
        schema:
          type: integer
          default: 1
        description: Page number (1-based).
      - name: $pagesize
        in: query
        required: false
        schema:
          type: integer
          default: 10
        description: Page size. No maximum enforced in the API layer.
      responses:
        '200':
          description: |-
            A list, wrapped in the TAF list envelope (`Entities[].Properties`). One page. Properties: TotalRecord, TotalPage, PageNumber (strings); a list-level self link.

            Paged with `$page` (default 1) and `$pagesize` (default 10).

            Order: HourlyRateID descending (fixed)

            Empty result: 200 with no Entities
          content:
            application/json:
              schema:
                type: object
                description: 'TAF list envelope: each item is in `Entities[].Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/TafListPaging'
                  Entities:
                    type: array
                    description: Omitted (not `[]`) when the list is empty.
                    items:
                      type: object
                      properties:
                        Properties:
                          $ref: '#/components/schemas/HourlyRateRead'
                        Links:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafLink'
                        Actions:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafAction'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
        '401':
          description: '- Missing, invalid or expired bearer token. — When: No or invalid bearer token (captured). — Fix:
            Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v1.invoicing.hourlyrate.listdefault
  /v1/payment-term:
    get:
      operationId: getPaymentTerms
      summary: List payment terms
      description: |-
        Lists the tenant's payment terms (due-date rule, interest, reminder fee).

        Returns every payment term that is visible in the system (hidden ones are excluded; inactive ones are included), ordered by ID. Use it to pick PaymentTermID for a customer. The procedure also returns the term's legal entity, but the API drops it, so terms of different legal entities cannot be told apart.

        **Use it to:**
        - Pick PaymentTermID for `POST /v1/customer/create`
        - Compute an invoice's due date client-side (CreditTerm + DaysOfCredit)

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **Next:** `POST /v1/customer/create`
      parameters:
      - name: $page
        in: query
        required: false
        schema:
          type: integer
          default: 1
        description: Page number (1-based).
      - name: $pagesize
        in: query
        required: false
        schema:
          type: integer
          default: 10
        description: Page size. No maximum enforced in the API layer.
      responses:
        '200':
          description: |-
            A list, wrapped in the TAF list envelope (`Entities[].Properties`). One page. Properties: TotalRecord, TotalPage, PageNumber (strings); a list-level self link.

            Paged with `$page` (default 1) and `$pagesize` (default 10).

            Order: ID ascending (fixed)

            Empty result: 200 with no Entities
          content:
            application/json:
              schema:
                type: object
                description: 'TAF list envelope: each item is in `Entities[].Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/TafListPaging'
                  Entities:
                    type: array
                    description: Omitted (not `[]`) when the list is empty.
                    items:
                      type: object
                      properties:
                        Properties:
                          $ref: '#/components/schemas/PaymentTermRead'
                        Links:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafLink'
                        Actions:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafAction'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
              examples:
                example1:
                  summary: All terms (captured, v1)
                  value:
                    Properties:
                      TotalRecord: '1'
                      TotalPage: '1'
                      PageNumber: '1'
                    Entities:
                    - Properties:
                        ID: 2
                        Name: Net 30 days
                        TermMessage: "Payment terms: 30 days net \nIf you miss a due date interests pursuant to applicable\
                          \ laws are added."
                        CreditTerm: NET
                        DaysOfCredit: 30
                        InterestRate: 3.0
                        InterestPeriod: FourteenDays
                        ReminderFee: 100.0
                        IsDefaultTerm: true
                        IsActive: true
                        CurrencyID: 9
                        PaymentTermGuid: 6b218693-3f85-4430-87a8-7cdb930b126a
                    Links:
                    - Href: https://{region-node}.timelog.com/{account}/api/v1/payment-term
                      Rel: self
        '401':
          description: '- Missing, invalid or expired bearer token. — When: No or invalid bearer token (captured). — Fix:
            Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v1.invoicing.paymentterm.list
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: |-
        OAuth 2.0 bearer token, sent as `Authorization: Bearer <token>`. JWT and reference tokens are both accepted. The token must carry the required scope (default `tlp`).

        The token's `sub` claim is the acting user. A token WITHOUT `sub` (client-credentials) acts as the system service user. If the `sub` user cannot log in (inactive, locked, deleted), the request is rejected with 401 — it is no longer let through without a user.

        > **Not yet documented:** how to obtain a token.

        > **Not yet documented:** token lifetime.
  schemas:
    ContractHourlyRateCreate:
      type: object
      properties:
