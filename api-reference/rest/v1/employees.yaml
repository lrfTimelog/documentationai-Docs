  /v1/normal-working-time/assign-to-employee:
    post:
      operationId: assignNormalWorkingTimeToEmployee
      summary: Assign a normal working time to an employee
      description: |-
        Puts an employee on a normal working time (working-hour norm) from a given date, past or future.

        Adds an entry to the employee's working-norm history: "from StartsAt, this employee works NormalWorkingTimeId". It is the API equivalent of changing the norm on the employee card in TimeLog. Effective-date semantics (the integrator-critical part): - Only the date of StartsAt counts. The entry runs from that date until the day before the next entry. - The new entry REPLACES every history entry that starts on or after the same date: those entries are marked obsolete (kept in the table, no longer in force). Assigning norm C from 1 March to an employee who had A since January and a scheduled change to B from 1 May leaves A (Jan - 28 Feb) and C (from 1 March) — the May change to B is gone. There is never an overlap; the latest call wins for its date onwards. - Backdating is allowed without limit and without any check against submitted, approved or payroll-exported periods. The employee's daily expected hours (projection) and flex norm postings are regenerated from the effective date (or the employment / calculation start date, if later), so flex balances of past weeks change retroactively. - StartsAt today or earlier: the employee's current norm switches immediately. StartsAt in the future: only the history entry is stored now; the nightly user update switches the current norm on that date. - There is no delete: to undo, assign the previous norm again with the same StartsAt.

        **Use it to:**
        - HR system pushes a contract change (e.g. 37 h to 30 h per week) with its effective date.
        - Schedule a future reduction of working hours (parental leave, part-time arrangement).

        **Not for:**
        - Correcting a past norm when the affected weeks have been paid — the API recalculates flex silently; agree a process with payroll first.
        - Reading an employee's norm history — no REST v1 operation returns it.

        **Behaviour:**
        - Idempotent.
        - Same effective state on a repeat, but each call writes a new history row, obsoletes the previous identical one, raises the events and triggers the recalculation again.
        - Safe to retry.
        - Duplicates: A repeat call supersedes the previous identical entry (see idempotent_detail).
        - Side effect: If StartsAt <= today: the employee's profile norm is switched now; otherwise on StartsAt by the nightly user update.
        - Side effect: Background (after the response): the employee projection (expected hours per day) and flex norm postings are regenerated from StartsAt (not before the employment / calculation start date); the salary-account posting aggregation is re-run.
        - Side effect: Resource Planner capacity of the employee is updated (EmployeeCapacitiesUpdated events from the projection regeneration).
        - On failure: None expected: both checks run before the first write. If a later history update or the profile update fails, rows already written stay (no transaction around the loop).
        - Consistency: eventual — the response returns before the projection, flex postings and aggregations are regenerated (background work item); the profile norm itself is immediate when StartsAt <= today

        **Call first:** `GET /v1/normal-working-time`, `GET /v1/user`

        **Next:** `GET /v1/employee-projection/get-in-period`

        **See also:** `PUT /v1/user`

        > **Not yet documented:** behaviour → side effects; behaviour → side effects on failure; examples (success).
      tags:
      - Employees
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NormalWorkingTimeAssign.create'
      responses:
        '200':
          description: 'Success without content: HTTP 204 with an empty body. HTTP 200 with an empty body (Ok()). Nothing
            to read back: no REST v1 operation returns an employee''s norm history.'
        '401':
          description: '- Missing, invalid or expired bearer token. — When: Captured (no / malformed token). — Fix: Obtain
            a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '500':
          description: |-
            - **Code 37040** — UserId is 0, omitted or not an existing user. The check has no active-flag test of its own. — When: UserId 0 / omitted / unknown (captured for every malformed body) — Fix: Send the UserID of an existing user (`GET /v1/user`).

            - **Code 37922** — NormalWorkingTimeId refers to a normal working time that is inactive (or, presumably, does not exist). — When: NormalWorkingTimeId is an inactive norm — Fix: Pick an active norm from GET /v1/normal-working-time (IsActive true).

            - **Code 100** — Unhandled server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: Empty body
                  value:
                    Code: 102
                    Details:
                    - Message: 'No user with UserID: 0 exist'
                      ErrorCode: 37040
                    Message: Business rules exception.
                    Parameters: 'assignment: {"UserId":0,"NormalWorkingTimeId":0,"StartsAt":"0001-01-01T00:00:00"}'
                    Url: https://{region-node}.timelog.com/{account}/api/v1/normal-working-time/assign-to-employee
                example2:
                  summary: No body
                  value:
                    Code: 100
                    Details: []
                    Message: Unknown error occur in system, please contact system administrator.
                    Parameters: 'assignment: null'
                    Url: https://{region-node}.timelog.com/{account}/api/v1/normal-working-time/assign-to-employee
      x-timelog-key: rest.v1.employees.normalworkingtime.assigntoemployee
  /v1/timesheet-status/weekly:
    get:
      operationId: getWeeklyTimesheetStatus
      summary: Get the weekly timesheet status of employees
      description: |-
        Lists, per employee the caller may see, the timesheet status (Empty / Open / Closed / Approved) of each week in a date range.

        The API form of TimeLog's timesheet status report: a manager's or payroll's overview of who has not submitted or not been approved yet. Each employee comes back once per page with their current approval manager and department and a Details list of weeks. The statuses are read from the pre-computed timesheet-status aggregation (refreshed in the background after registrations / approvals change), not computed live like `GET /v1/approval/timesheets/get-status-by-period`, and they are coarser: rejected weeks show as Open (or Empty), and every "submitted but not fully approved by the employee manager" state shows as Closed. Paging is per employee-WEEK row, not per employee: with the default page size of 10 a four-week range returns only two or three employees per page, an employee can be split across two pages, and TotalRecord counts rows. Ask for a large $pagesize (no maximum is enforced) and merge Details by EmployeeUserID.

        **Use it to:**
        - Payroll cut-off dashboard: which employees still have Open or Closed weeks in the pay period.
        - Weekly reminder bot: employees with Open weeks, grouped by approval manager.

        **Not for:**
        - Exact, real-time per-day status before exporting time — use `GET /v1/approval/timesheets/get-status-by-period` (live, per day, distinguishes Rejected).

        **Behaviour:**
        - Idempotent.
        - Safe to retry.

        **Call first:** `GET /v1/user`

        **Next:** `GET /v1/approval/timesheets/get-status-by-period`

        **See also:** `GET /v1/approval/timesheets/get-status-range-by-nearby-week-of-year`

        > **Not yet documented:** behaviour → consistency; examples (success); request → query params → description.
      tags:
      - Employees
      parameters:
      - name: startDate
        in: query
        required: true
        schema:
          type: string
          format: date
        description: |-
          First day of the range (time part dropped). Weeks overlapping the range are returned whole. Omitted -> 404 action-not-matched.

          Date only — no time component.
      - name: endDate
        in: query
        required: true
        schema:
          type: string
          format: date
        description: |-
          Last day of the range (time part dropped). Not checked against startDate.

          Date only — no time component.
      - name: legalEntityId
        in: query
        required: false
        schema:
          type: integer
          format: int32
          x-timelog-filter:
            operators:
            - eq
        description: |-
          Only employees of this legal entity. 0 / omitted = no filter.

          Filters on `employee's legal entity` (eq).
      - name: departmentId
        in: query
        required: false
        schema:
          type: integer
          format: int32
          x-timelog-filter:
            operators:
            - eq
        description: |-
          Only employees of this department OR any of its sub-departments. 0 / omitted = no filter.

          Filters on `employee's department` (eq).
      - name: approverId
        in: query
        required: false
        schema:
          type: integer
          format: int32
          x-timelog-filter:
            operators:
            - eq
        description: |-
          Only employees whose current approval manager has this EMPLOYEE ID — not a user ID, unlike userId. 0 / omitted = no filter.

          Filters on `employee's current approval manager` (eq).
      - name: userId
        in: query
        required: false
        schema:
          type: integer
          format: int32
          x-timelog-filter:
            operators:
            - eq
        description: |-
          Only this employee (user ID). 0 / omitted = no filter.

          Filters on `TimesheetStatusRead.EmployeeUserID` (eq).
      - name: $page
        in: query
        required: false
        schema:
          type: integer
          default: 1
        description: Page number — of employee-week rows.
      - name: $pagesize
        in: query
        required: false
        schema:
          type: integer
          default: 10
        description: Employee-week ROWS per page, not employees. No maximum enforced.
      responses:
        '200':
          description: |-
            A list, wrapped in the TAF list envelope (`Entities[].Properties`). One TimesheetStatusRead per employee present on this page, each with that page's weeks in Details.

            Paged with `$page` (default 1) and `$pagesize` (default 10).

            Order: Employees by EmployeeUserID ascending; Details by WeekNumber (rows are paged in EmployeeUserID, week StartDate order)

            Empty result: 200 with TotalRecord "0" and no Entities
          content:
            application/json:
              schema:
                type: object
                description: 'TAF list envelope: each item is in `Entities[].Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/TafListPaging'
                  Entities:
                    type: array
                    description: Omitted (not `[]`) when the list is empty.
                    items:
                      type: object
                      properties:
                        Properties:
                          $ref: '#/components/schemas/TimesheetStatusRead'
                        Links:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafLink'
                        Actions:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafAction'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
        '400':
          description: '- **Code 200** — The request body or parameters failed input validation. — When: A parameter that
            cannot be parsed (Web API model binding) — Fix: Fix every item listed in Details and resend.'
          content:
