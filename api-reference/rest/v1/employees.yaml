  /v1/workload/book:
    post:
      operationId: bookWorkload
      summary: Book workload for an employee on a task
      description: |-
        Asks Resource Planner to book (plan) a number of hours for an employee on a task over a date range.

        TimeLog itself stores nothing; there is no booking ID in the response and no REST v1 operation to read, change or delete the booking afterwards. What Resource Planner does with it — how Hours is spread over the days, whether an existing booking for the same employee / task / period is replaced or added to, whether the employee is added to the project team (a TimeLog allocation) — is decided in that service and is not established here (see gaps). Note EmployeeId is an EMPLOYEE ID, not the user ID used by the other Employees operations.

        **Use it to:**
        - A staffing or PSA tool pushes planned hours for a person on a task into TimeLog Resource Planner.

        **Not for:**
        - Registering actual time — use the TimeRegistration service.

        **Rules across fields:**
        - R1: EndDate must be on or after StartDate.

        **Behaviour:**
        - Side effect: TimeLog: none — validations are reads; the only action is the HTTP PUT to Resource Planner.
        - Side effect: Resource Planner: a workload booking for EmployeeId on TaskId / its project over StartDate..EndDate with Hours (semantics owned by RP, see gaps).
        - On failure: On a 500 caused by an RP timeout or dropped connection the booking may or may not have been stored by RP — and there is no read operation to check.
        - Consistency: Visibility of the booking in Resource Planner views is RP-side and not established.

        **Call first:** `GET /v1/task/{taskID}`

        **See also:** `POST /v1/task/{taskID}/allocation`

        > **Not yet documented:** behaviour → duplicate handling; behaviour → idempotent; behaviour → safe to retry; behaviour → side effects; examples (success).
      tags:
      - Employees
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkloadBook.create'
      responses:
        '202':
          description: 'Success without content: HTTP 204 with an empty body. 202 Accepted, empty body: Resource Planner answered
            with a success status. No booking ID or result is returned.'
        '400':
          description: '- **Code 200** — The request body or parameters failed input validation. — When: Missing / non-positive
            EmployeeId, TaskId or Hours; invalid dates; EndDate before StartDate (captured: all eight messages for an empty
            body) — Fix: Fix every item listed in Details and resend.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: Empty body
                  value:
                    Code: 200
                    Details:
                    - '''Employee Id'' must not be empty.'
                    - '''Employee Id'' must be greater than ''0''.'
                    - '''Task Id'' must not be empty.'
                    - '''Task Id'' must be greater than ''0''.'
                    - '''Hours'' must not be empty.'
                    - '''Hours'' must be greater than ''0''.'
                    - StartDate is not a valid date.
                    - EndDate is not a valid date.
                    Message: Invalid model state error.
                    Parameters: 'model: {"StartDate":"0001-01-01T00:00:00","EndDate":"0001-01-01T00:00:00","Hours":0.0,"EmployeeId":0,"TaskId":0}'
                    Url: https://{region-node}.timelog.com/{account}/api/v1/workload/book
        '401':
          description: '- Missing, invalid or expired bearer token. — When: Captured (no / malformed token). — Fix: Obtain
            a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '500':
          description: |-
            - **Code 37001** — The taskID in the path (external keys) or TaskId in the body (allocation) is not an existing task. Not a 404. — When: TaskId is not an existing task — Fix: Use an existing task ID.

            - **Code 37968** — The task's project does not have 'available in Resource Planner' switched on. — When: The task's project is not enabled for Resource Planner — Fix: Enable the project for Resource Planner in TimeLog, or book on a task of an enabled project.

            - **Code 37040** — EmployeeId is not an existing employee — OR the employee's user is inactive: the inactive check (37931) is raised inside a try whose catch-all replaces it with 37040. {0} is the EmployeeId, although the message says UserID. — When: EmployeeId unknown or the employee is inactive — Fix: Send the EMPLOYEE ID of an active employee.

            - **Code 100** — Unhandled server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: No body
                  value:
                    Code: 100
                    Details: []
                    Message: Unknown error occur in system, please contact system administrator.
                    Parameters: 'model: null'
                    Url: https://{region-node}.timelog.com/{account}/api/v1/workload/book
      x-timelog-key: rest.v1.employees.workload.bookworkload
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: |-
        OAuth 2.0 bearer token, sent as `Authorization: Bearer <token>`. JWT and reference tokens are both accepted. The token must carry the required scope (default `tlp`).

        The token's `sub` claim is the acting user. A token WITHOUT `sub` (client-credentials) acts as the system service user. If the `sub` user cannot log in (inactive, locked, deleted), the request is rejected with 401 — it is no longer let through without a user.

        > **Not yet documented:** how to obtain a token.

        > **Not yet documented:** token lifetime.
