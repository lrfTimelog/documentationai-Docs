            | `0` | NotSpecified | Open: not submitted and not in any approval state. |
            | `1` | EmployeeManagerRejected | Rejected by the employee manager; the employee must correct and resubmit. |
            | `2` | EmployeeManagerRejectedAndResolved | Rejected by the employee manager, then edited; the timesheet is still open (not yet resubmitted). |
            | `3` | EmployeeManagerApproved | Approved by the employee manager. |
            | `4` | ProjectManagerRejected | Rejected by a project manager. |
            | `5` | ProjectManagerRejectedAndResolved | Rejected by a project manager, then edited; the timesheet is still open. |
            | `6` | ProjectManagerApproved | Approved by the project manager. Depending on the tenant's approval setup the employee manager may still have to approve. |
            | `7` | Submitted | Closed / pending approval: submitted, no approval decision yet. Never stored — derived from Status = closed. |
            | `8` | EmployeeManagerRejectedAndResubmitted | Rejected by the employee manager, corrected and submitted again (stored value 7). |
            | `9` | ProjectManagerRejectedAndResubmitted | Rejected by a project manager, corrected and submitted again (stored value 8). |
        TimeTrackingFormat:
          type: integer
          format: int32
          enum:
          - 0
          - 1
          - 2
          - 3
          - 4
          x-enum-descriptions:
          - Duration in hours/minutes.
          - Absence for a full day (hours from normal working time).
          - Absence for half a day (hours from normal working time).
          - 'Salary-code (supplement) format: a registration posts a count of 1.'
          - 'Salary-code (supplement) format: a registration posts the entered number as a count.'
          readOnly: true
          description: |-
            How the duration was entered: hours, full day, half day, or a salary-code count format.

            Allowed values:

            | Value | Name | Meaning |
            |---|---|---|
            | `0` | Hours | Duration in hours/minutes. |
            | `1` | FullDay | Absence for a full day (hours from normal working time). |
            | `2` | HalfDay | Absence for half a day (hours from normal working time). |
            | `3` | YesNo | Salary-code (supplement) format: a registration posts a count of 1. |
            | `4` | Count | Salary-code (supplement) format: a registration posts the entered number as a count. |
        Minutes:
          type: integer
          format: int32
          readOnly: true
          description: |-
            The registered duration in whole minutes (the same duration as Hours, stored separately).

            Unit: minutes

            Contains personal data.
        BillableHours:
          type: number
          format: double
          readOnly: true
          description: |-
            Billable duration of the registration in decimal hours (stored; may differ from Hours, e.g. after billable rounding or a non-billable registration).

            Unit: hours

            > **Not yet documented:** description.
        BillableMinutes:
          type: integer
          format: int32
          readOnly: true
          description: |-
            Billable duration in whole minutes (stored).

            Unit: minutes
        IsFavourite:
          type: boolean
          readOnly: true
          description: Whether the task / absence code is marked as a favourite in the timesheet (toggled with POST /v1/time-tracking-item/save-favourite).
            For ABSENCE rows it is the owner's own favourite. For PROJECT rows it is true when ANY user has favourited the
            task.
        StartTime:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
          description: |-
            Clock time the work started, when timestamps are used (the registration's timestamp). null when the registration has no timestamp.

            Time zone: not yet documented.

            > **Not yet documented:** constraints → timezone.
        EndTime:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
          description: |-
            Clock time the work ended. null when the registration has no timestamp.

            Time zone: not yet documented.

            > **Not yet documented:** constraints → timezone.
        IsTimestampOverlapping:
          type: boolean
          readOnly: true
          description: |-
            COMPUTED warning flag: true when this registration's StartTime–EndTime interval overlaps another registration's (or both have identical timestamps). Only computed when timestamps are active for the employee (feature TimeRegistrationTimestamp + setting 'for all' or the employee's own timestamp flags) AND feature ShowWarningWhenTimestampOverlap is on; false otherwise. On the list operations the comparison is made only against the registrations IN THE SAME RESPONSE PAGE; on get-by-ID it is checked against all the employee's registrations.

            - timestamps not active for the owner, or feature ShowWarningWhenTimestampOverlap off — Always false.
      description: 'One time registration (project time or absence) of an employee, flattened together with the customer,
        project, task (or absence code) it is registered on, the employee''s allocation on that task, and the registration''s
        approval / invoicing state. It is the row model of TimeLog''s timesheet grid: everything a time-tracking client needs
        to render a registration line without further lookups. Identified by TimeRegistrationID. Absence rows carry the absence
        fields and NULL customer / project / task fields; project rows the reverse.'
    TimesheetStatusRead:
      type: object
      properties:
        EmployeeUserID:
          type: integer
          format: int32
          readOnly: true
          x-timelog-identity:
            role: reference
          description: |-
            User ID of the employee. Unique within ONE page of the response only — an employee whose weeks straddle a page boundary appears on both pages.

            Refers to `UserRead.UserID`. Look up valid values with `GET /v1/user`.

            Filterable via `userId` (eq).
        Initials:
          type: string
          readOnly: true
          description: |-
            The employee's initials.

            Contains personal data.
        DisplayName:
          type: string
          readOnly: true
          description: |-
            "<Initials> (<FirstName> <LastName>)", composed by the server.

            Contains personal data.
        ManagerInitials:
          type: string
          readOnly: true
          description: |-
            Initials of the employee's CURRENT approval manager (not the manager at the time of each week). Empty string when the employee has none.

            Contains personal data.
        ManagerDisplayName:
          type: string
          readOnly: true
          description: |-
            "<Initials> (<FullName>)" of the current approval manager, or an empty string when there is none.

            Contains personal data.
        EmployeeDepartmentName:
          type: string
          readOnly: true
          description: Name of the employee's current department; empty string when none.
        AggregationType:
          type: integer
          enum:
          - 1
          - 2
          - 3
          - 4
          x-enum-descriptions:
          - Details are weeks. The only value this operation returns.
          - Details are months (used by the monthly report in the UI; not returned here).
          - Quarters (aggregation framework value; not returned here).
          - Years (aggregation framework value; not returned here).
          readOnly: true
          description: |-
            Granularity of Details. Always 1 (Weekly) on this operation: the controller requests weekly grouping.

            Allowed values:

            | Value | Name | Meaning |
            |---|---|---|
            | `1` | Weekly | Details are weeks. The only value this operation returns. |
            | `2` | Monthly | Details are months (used by the monthly report in the UI; not returned here). |
            | `3` | Quarterly | Quarters (aggregation framework value; not returned here). |
            | `4` | Yearly | Years (aggregation framework value; not returned here). |
        ShowSendEmailRequest:
          type: boolean
          readOnly: true
          description: 'Always false on this operation: the API data path never sets it (the UI report sets it itself).'
        Details:
          type: array
          items:
            $ref: '#/components/schemas/TimesheetStatusWeekRead'
          readOnly: true
          description: The employee's weeks on THIS page, ordered by WeekNumber (not by date — see TimesheetStatusWeekRead.WeekNumber).
      description: 'The weekly timesheet status overview of one employee (the "timesheet status" report): who the employee
        and their approval manager are, and per week whether the timesheet is empty, open, submitted or approved. Read from
        the pre-computed timesheet-status aggregation, not from the live approval data.'
    TimesheetStatusWeekRead:
      type: object
      properties:
        WeekNumber:
          type: integer
          readOnly: true
          description: |-
            Number of the week as stored on the tenant's weekly aggregation unit. Details are sorted by it, so a range across New Year lists week 1 before week 52 — sort by StartDate if order matters.

            > **Not yet documented:** description.
        TimesheetStatus:
          type: string
          enum:
          - Empty
          - Open
          - Closed
          - Approved
          x-enum-descriptions:
          - 'No hours registered and not submitted; also: week outside the employee''s employment, or status could not be
            determined.'
          - Hours registered but not submitted — OR submitted and then rejected by the employee or project manager (rejections
            are not distinguished).
          - Submitted and awaiting approval, including partially approved, approved by the project manager(s) only, or waiting
            for project-manager approval.
          - Approved by the employee manager.
          readOnly: true
          description: |-
            Aggregated status of the week, derived from the employee-manager approval overview of the week.

            Allowed values:

            | Value | Name | Meaning |
            |---|---|---|
            | `Empty` | Empty | No hours registered and not submitted; also: week outside the employee's employment, or status could not be determined. |
            | `Open` | Open | Hours registered but not submitted — OR submitted and then rejected by the employee or project manager (rejections are not distinguished). |
            | `Closed` | Closed | Submitted and awaiting approval, including partially approved, approved by the project manager(s) only, or waiting for project-manager approval. |
            | `Approved` | Approved | Approved by the employee manager. |
        StartDate:
          type: string
          format: date-time
          readOnly: true
          description: |-
            First day of the week (aggregation unit start).

            Date only — no time component.
        EndDate:
          type: string
          format: date-time
          readOnly: true
          description: |-
            Last day of the week (aggregation unit end).

            Date only — no time component.
      description: The aggregated timesheet status of one employee for one week.
    WorkloadBook.create:
      type: object
      properties:
        StartDate:
          type: string
          format: date-time
          writeOnly: true
          description: |-
            First day of the booking period.

            Date only — no time component.

            - omitted, or outside 1753-01-01..9999-12-31 — 400 "StartDate is not a valid date."

            > **Not yet documented:** constraints → timezone.
        EndDate:
          type: string
          format: date-time
          writeOnly: true
          description: |-
            Last day of the booking period. Must not be before StartDate.

            Date only — no time component.

            - omitted or outside the SQL date range — 400 "EndDate is not a valid date."

            - before StartDate — 400 "EndDate must be after StartDate" (equal dates are allowed).

            > **Not yet documented:** constraints → timezone.
        Hours:
          type: number
          format: double
          writeOnly: true
          description: |-
            Number of hours to book for the employee on the task in the period. Whether this is a total spread over the period or hours per day is decided by Resource Planner (the TLP UI calls the same value TotalHours).

            Unit: hours

            - 0, negative or omitted — 400 "'Hours' must not be empty." / "'Hours' must be greater than '0'."

            > **Not yet documented:** description.
        EmployeeId:
          type: integer
          format: int32
          writeOnly: true
          x-timelog-identity:
            role: reference
          description: |-
            EMPLOYEE ID of the person to book — not the user ID used by most other Employees operations. Must be an active employee.

            Refers to `EmployeeID`.

            - 0, negative or omitted — 400 "'Employee Id' must not be empty." / "must be greater than '0'".

            - no such employee, or the employee's user is inactive — 500 Code 102, ErrorCode 37040 "No user with UserID: {EmployeeId} exist" — inactive is reported as not-existing.

            > **Not yet documented:** identity → references.
        TaskId:
          type: integer
          format: int32
          writeOnly: true
          x-timelog-identity:
            role: reference
          description: |-
            Task to book on. Its project must be enabled for Resource Planner.

            Refers to `TaskRead.TaskID`.

            - 0, negative or omitted — 400 "'Task Id' must not be empty." / "must be greater than '0'".

            - not an existing task — 500 Code 102, ErrorCode 37001.

            - task's project is not available in Resource Planner — 500 Code 102, ErrorCode 37968.

            > **Not yet documented:** behaviour.
      required:
      - StartDate
      - EndDate
      - Hours
      - EmployeeId
      - TaskId
      description: Books (plans) a number of hours of an employee on a task over a date range in Resource Planner.
