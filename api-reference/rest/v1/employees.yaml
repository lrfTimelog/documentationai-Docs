            > **Not yet documented:** behaviour.
        NormalWorkingTimeId:
          type: integer
          format: int32
          writeOnly: true
          x-timelog-identity:
            role: reference
          description: |-
            NormalWorkingTimeID of the norm to put the employee on (from GET /v1/normal-working-time). Must be active.

            Refers to `NormalWorkingTimeRead.NormalWorkingTimeID`. Look up valid values with `GET /v1/normal-working-time`.

            - norm exists but IsActive is false — 500 Code 102, ErrorCode 37922 "Normal working time with ID:{0} is not active".

            Valid values come from `GET /v1/normal-working-time`.

            > **Not yet documented:** behaviour.
        StartsAt:
          type: string
          format: date-time
          writeOnly: true
          description: |-
            First day the norm applies (inclusive). Only the date is used; any time part is dropped. Past, today and future dates are all accepted — there is no lower bound and no check against approved, closed or payroll-exported periods. The new entry supersedes every history entry starting on or after this date.

            Date only — no time component.

            - date is today or in the past — The employee's current norm is switched immediately, and the projection / flex postings are regenerated from this date (asynchronously).

            - date is in the future — Only the history entry is stored; the nightly user update switches the employee's current norm on that date. Projections from that date are regenerated now.

            - omitted — Binds to 0001-01-01. No validator: the history row insert into a DATETIME column is expected to fail -> 500 Code 100.

            > **Not yet documented:** behaviour.
