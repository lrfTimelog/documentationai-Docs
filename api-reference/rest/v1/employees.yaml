          readOnly: true
          description: |-
            One status for the whole period, aggregated from the distinct day statuses. The rule is mechanical and does NOT read like the day meanings: if every day has the same status, that status; otherwise PartiallyRejected when any day is Rejected, else PartiallyApproved when any day is Open, else Open. So Approved + PendingApproval days give Open, Open + PendingApproval days give PartiallyApproved, and a period with no days gives Open. Always inspect WeekDays before acting on a period.

            Contains personal data.

            - all days share one status — That status (Empty, Open, Approved, PendingApproval, Rejected or PartiallyApproved).

            - mixed statuses, at least one Rejected — PartiallyRejected.

            - mixed statuses, no Rejected, at least one Open — PartiallyApproved — even when nothing in the period is approved.

            - mixed statuses, no Rejected, no Open (e.g. Approved + PendingApproval, Empty + Approved) — Open.

            Allowed values:

            | Value | Name | Meaning |
            |---|---|---|
            | `Empty` | Empty | TimeLog returned no approval row for the employee on that day, so there is nothing to approve (Hours is 0). Integer 0. |
            | `Open` | Open | Not submitted: the employee has not closed the day (navigation status NotSubmitted, which also covers a partially approved day that is no longer closed). Registrations can still be edited. Integer 1. |
            | `Approved` | Approved | The employee manager approved the day. ALSO returned when project-manager approval is switched on for timesheet approval and the project manager(s) approved — in the 'project manager, then employee manager' setup the employee manager may not have approved yet. Integer 2. |
            | `PendingApproval` | PendingApproval | Submitted and waiting: the day is closed and not yet approved — including a day still missing a project manager's approval, and a project-manager-approved day when project-manager approval is not switched on. Integer 3. |
            | `Rejected` | Rejected | A manager rejected time on the day (the day has rejected time). The rejected registrations are re-opened for the employee to fix and resubmit; RecentRejectedComment carries the comment. Integer 4. |
            | `PartiallyApproved` | PartiallyApproved | On a day: closed, some of the day's time approved by the employee manager and the rest still waiting. On a PERIOD (PeriodStatus) it means something else — see ApprovalTimesheetPeriodRead.PeriodStatus. Integer 5. |
            | `PartiallyRejected` | PartiallyRejected | Never returned for a single day. Only a period aggregate: the period mixes Rejected days with days in another status. Integer 6. |
        LastRejectedComment:
          type:
          - string
          - 'null'
          readOnly: true
          description: 'Obsolete. Never filled by the adapter: always null. Use RecentRejectedComment.'
        RecentRejectedComment:
          $ref: '#/components/schemas/ApprovalTimesheetRejectedCommentRead'
          readOnly: true
          description: |-
            The latest non-empty rejection comment in the whole period. Looked up only when PeriodStatus is Rejected or PartiallyRejected; null otherwise.

            Contains personal data.
      description: 'The approval state of a run of consecutive days of one employee''s timesheet (a period or an ISO week):
        every day''s status in WeekDays plus one aggregated PeriodStatus. No ID: identified by (employee, first day, last
        day).'
    ApprovalTimesheetRejectedCommentRead:
      type: object
      properties:
        ManagerName:
          type:
          - string
          - 'null'
          readOnly: true
          description: |-
            Intended as the rejecting manager's full name. ACTUAL value: the full name of the user the dialogue entry is about — the employee whose timesheet was rejected — because it is resolved from the dialogue's EmployeeUserID, not from its author (CreatedBy). Do not display it as the manager.

            Contains personal data.
        ManagerComment:
          type: string
          readOnly: true
          description: |-
            The comment the manager entered when rejecting (free text; never empty — entries without a comment are skipped).

            Contains personal data.
      description: The text a manager wrote when rejecting time, taken from the employee's approval dialogue (the latest rejection
        with a non-empty comment in the requested day or period).
