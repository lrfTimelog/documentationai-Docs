openapi: 3.1.0
info:
  title: Employees — REST API v1
  version: v1
  description: |-
    Track and drive the approval of employees' timesheets — the gate between registered time and payroll — plus working norms, employee types and Resource Planner bookings.

    Enums are integers in v1.

    **Conventions that apply to every operation in this file:**
    - Property names are PascalCase.
    - Successful bodies use the TAF envelope: one object in `Properties`, lists in `Entities[].Properties`.
    - Some operations succeed without content: HTTP 200 with the literal body `null`, or HTTP 204.
    - `PUT` replaces the whole object: omitted fields are reset.
    - Treat error `Code` 102 as a business-rule violation, whether the HTTP status is 422 or 500.

    > **Not yet documented:** rate limits.
servers:
- url: https://{region-node}.timelog.com/{account}/api
  description: 'Your TimeLog site. Copy both values from the address bar when you are signed in to TimeLog: `region-node`
    is the first part of the host name (for example `app3` in `app3.timelog.com`), `account` is the first path segment after
    it.'
  variables:
    region-node:
      default: app3
    account:
      default: your-account
security:
- bearer: []
tags:
- name: Employees
  description: Track and drive the approval of employees' timesheets — the gate between registered time and payroll — plus
    working norms, employee types and Resource Planner bookings.
paths:
  /v1/approval/timesheets/get-status-by-dates:
    get:
      operationId: getApprovalTimesheetStatusByDates
      summary: Get timesheet approval status for days
      description: |-
        Returns, for each requested day, where one employee's timesheet is in the approval flow.

        For every date in `dates` returns one ApprovalTimesheetDayRead: the day's approval status (Empty, Open, PendingApproval, Approved, Rejected, PartiallyApproved), the hours registered, whether rejected time was resubmitted, and — for rejected days — the latest rejection comment and, with $expand=RejectedRegistrations, the rejected registrations. Days need not be consecutive. Status is computed live per day; long lists cost several database calls per day.

        **Use it to:**
        - Payroll export: before exporting a day's hours, check that every day of the pay period is Approved.
        - Reminder bot: find days still Open (not submitted) for an employee.

        **Not for:**
        - A contiguous range — use `GET /v1/approval/timesheets/get-status-by-period`, which adds an aggregated period status.

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Duplicates: A date sent twice is reported twice.
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v1/user`

        **Next:** `POST /v1/approval/timesheets/submit-dates`, `POST /v1/approval/timesheets/resubmit-rejected-time-registrations`

        **See also:** `GET /v1/approval/timesheets/get-status-by-period`, `GET /v1/employee-projection/get-in-period`

        > **Not yet documented:** examples (success); request → query params; response → empty result.
      tags:
      - Employees
      parameters:
      - name: employeeUserId
        in: query
        required: true
        schema:
          type: integer
          format: int32
        description: |-
          User ID of the employee. Omitted -> 404 action-not-matched.

          Refers to `UserRead.UserID`. Look up valid values with `GET /v1/user`.
      - name: dates
        in: query
        required: true
        schema:
          type: array
          items:
            type: string
            format: date-time
        description: 'Days to report, one parameter per day: ?dates=2026-10-05&dates=2026-10-07. Returned in the order sent.'
      - name: $expand
        in: query
        required: false
        schema:
          type: string
          enum:
          - RejectedRegistrations
          x-enum-descriptions:
          - Fill RejectedRegistrations on Rejected days (case-insensitive; other values are ignored).
        description: |-
          Expansion of the per-day rejected registrations.

          Allowed values:

          | Value | Name | Meaning |
          |---|---|---|
          | `RejectedRegistrations` | RejectedRegistrations | Fill RejectedRegistrations on Rejected days (case-insensitive; other values are ignored). |
      - name: $page
        in: query
        required: false
        schema:
          type: integer
        description: Does NOT page the response; applied to each Rejected day's RejectedRegistrations list.
      - name: $pagesize
        in: query
        required: false
        schema:
          type: integer
        description: 'As $page: page size of each day''s RejectedRegistrations list.'
      responses:
        '200':
          description: |-
            A list, wrapped in the TAF list envelope (`Entities[].Properties`). One entry per requested date, in request order.

            Order: Order of the dates parameters

            Empty result: 200 with no Entities when no dates are sent (not tested)
          content:
            application/json:
              schema:
                type: object
                description: 'TAF list envelope: each item is in `Entities[].Properties`.'
                properties:
                  Entities:
                    type: array
                    description: Omitted (not `[]`) when the list is empty.
                    items:
                      type: object
                      properties:
                        Properties:
                          $ref: '#/components/schemas/ApprovalTimesheetDayRead'
                        Links:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafLink'
                        Actions:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafAction'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
        '400':
          description: '- **Code 200** — The request body or parameters failed input validation. — When: employeeUserId or
            a date not parseable (Web API model binding) — Fix: Fix every item listed in Details and resend.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '404':
          description: '- The route matched a controller, but no action accepts the supplied query parameters — typically
            a required (non-nullable) simple parameter such as a DateTime was omitted. It is a missing-parameter error that
            looks like a 404. — When: employeeUserId omitted (captured with no parameters)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: No parameters
                  value:
                    Message: No HTTP resource was found that matches the request URI 'https://{region-node}.timelog.com/{account}/api/v1/approval/timesheets/get-status-by-dates'.
                    MessageDetail: No action was found on the controller 'ApprovalTimesheet' that matches the request.
        '500':
          description: |-
            - **Code 37967** — Same rights rule as 37966, applied to reading another employee's approval status. — When: employeeUserId is another user the caller may not see — Fix: Read your own status, or use a user with an approval privilege covering the employee.

            - **Code 100** — Unhandled server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v1.employees.approvaltimesheet.getstatusbydates
  /v1/approval/timesheets/get-status-by-period:
    get:
      operationId: getApprovalTimesheetStatusByPeriod
      summary: Get timesheet approval status for a period
      description: |-
        Returns the approval status of every day of a period of one employee's timesheet, plus an aggregated period status.

        Computes ApprovalTimesheetDayRead for each day from startDate to endDate (inclusive) and wraps them in an ApprovalTimesheetPeriodRead with PeriodStatus and, when the period has rejected days, the latest rejection comment. PeriodStatus is a mechanical aggregate that can mislead — decide on WeekDays, not on PeriodStatus. There is no limit on the period length; every day costs several database calls.

        **Use it to:**
        - Payroll cut-off: confirm every day of a pay period is Approved before exporting hours (check each WeekDays entry).
        - Show an employee which days of the month still need submitting or fixing.

        **Not for:**
        - ISO weeks — `GET /v1/approval/timesheets/get-status-by-week-of-year` computes the Monday–Sunday range for you.

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v1/user`

        **Next:** `POST /v1/approval/timesheets/submit-period`, `POST /v1/approval/timesheets/resubmit-rejected-time-registrations`

        **See also:** `GET /v1/approval/timesheets/get-status-by-dates`, `GET /v1/approval/timesheets/get-status-by-week-of-year`

        > **Not yet documented:** examples (success).
      tags:
      - Employees
      parameters:
      - name: employeeUserId
        in: query
        required: true
        schema:
          type: integer
          format: int32
        description: |-
          User ID of the employee. Omitted -> 404 action-not-matched.

          Refers to `UserRead.UserID`. Look up valid values with `GET /v1/user`.
      - name: startDate
        in: query
        required: true
        schema:
          type: string
          format: date-time
        description: First day, inclusive. Omitted -> 404 action-not-matched.
      - name: endDate
        in: query
        required: true
        schema:
          type: string
          format: date-time
        description: Last day, inclusive. Before startDate -> 200 with no WeekDays and PeriodStatus Open.
      - name: $expand
        in: query
        required: false
        schema:
          type: string
          enum:
          - RejectedRegistrations
          x-enum-descriptions:
          - Fill RejectedRegistrations on each Rejected day (case-insensitive; other values ignored).
        description: |-
          Expansion of the per-day rejected registrations.

          Allowed values:

          | Value | Name | Meaning |
          |---|---|---|
          | `RejectedRegistrations` | RejectedRegistrations | Fill RejectedRegistrations on each Rejected day (case-insensitive; other values ignored). |
      - name: $page
        in: query
        required: false
        schema:
          type: integer
        description: 'Not a response pager: applied to each Rejected day''s RejectedRegistrations list.'
      - name: $pagesize
        in: query
        required: false
        schema:
          type: integer
        description: Page size of each Rejected day's RejectedRegistrations list.
      responses:
        '200':
          description: |-
            The object, wrapped in the TAF envelope (`Properties`). The period with one WeekDays entry per day in date order.

            Order: WeekDays in ascending date order

            Empty result: 200 with WeekDays empty and PeriodStatus Open when endDate < startDate
          content:
            application/json:
              schema:
                type: object
                description: 'TAF envelope: the object is in `Properties`. Null members are omitted; a null result is `{"Links":
                  [self]}` without `Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/ApprovalTimesheetPeriodRead'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
                  Actions:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafAction'
        '400':
          description: '- **Code 200** — The request body or parameters failed input validation. — When: a parameter not parseable
            (Web API model binding) — Fix: Fix every item listed in Details and resend.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '404':
          description: '- The route matched a controller, but no action accepts the supplied query parameters — typically
            a required (non-nullable) simple parameter such as a DateTime was omitted. It is a missing-parameter error that
            looks like a 404. — When: employeeUserId, startDate or endDate omitted (captured with none)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: No parameters
                  value:
                    Message: No HTTP resource was found that matches the request URI 'https://{region-node}.timelog.com/{account}/api/v1/approval/timesheets/get-status-by-period'.
                    MessageDetail: No action was found on the controller 'ApprovalTimesheet' that matches the request.
        '500':
          description: |-
            - **Code 37967** — Same rights rule as 37966, applied to reading another employee's approval status. — When: employeeUserId is another user the caller may not see — Fix: Read your own status, or use a user with an approval privilege covering the employee.

            - **Code 100** — Unhandled server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v1.employees.approvaltimesheet.getstatusbyperiod
  /v1/approval/timesheets/get-status-by-period-with-rejected-time-tracking-items:
    get:
      operationId: getApprovalTimesheetStatusByPeriodWithRejectedTimeTrackingItems
      summary: Get timesheet approval status for a period (obsolete variant)
      description: |-
        Obsolete alias of get-status-by-period; returns exactly the same response.

        Despite its name it does not add rejected registrations by itself: send $expand=RejectedRegistrations, as on get-status-by-period. New integrations should call get-status-by-period.

        **Not for:**
        - New integrations — use `GET /v1/approval/timesheets/get-status-by-period`.

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v1/user`

        **See also:** `GET /v1/approval/timesheets/get-status-by-period`

        > **Not yet documented:** examples (success).
      tags:
      - Employees
      parameters:
      - name: employeeUserId
        in: query
        required: true
        schema:
          type: integer
          format: int32
        description: |-
          User ID of the employee. Omitted -> 404 action-not-matched.

          Refers to `UserRead.UserID`. Look up valid values with `GET /v1/user`.
      - name: startDate
        in: query
        required: true
        schema:
          type: string
          format: date-time
        description: First day, inclusive.
      - name: endDate
        in: query
        required: true
        schema:
          type: string
          format: date-time
        description: Last day, inclusive.
      - name: $expand
        in: query
        required: false
        schema:
          type: string
          enum:
          - RejectedRegistrations
          x-enum-descriptions:
          - Fill RejectedRegistrations on each Rejected day. Without it the list is empty, whatever the route name says.
        description: |-
          Expansion of the per-day rejected registrations.

          Allowed values:

          | Value | Name | Meaning |
          |---|---|---|
          | `RejectedRegistrations` | RejectedRegistrations | Fill RejectedRegistrations on each Rejected day. Without it the list is empty, whatever the route name says. |
      - name: $page
        in: query
        required: false
        schema:
          type: integer
        description: Applied to each Rejected day's RejectedRegistrations list.
      - name: $pagesize
        in: query
        required: false
        schema:
          type: integer
        description: Page size of each Rejected day's RejectedRegistrations list.
      responses:
        '200':
          description: |-
            The object, wrapped in the TAF envelope (`Properties`). Identical to get-status-by-period.

            Order: WeekDays in ascending date order

            Empty result: 200 with WeekDays empty and PeriodStatus Open when endDate < startDate
          content:
            application/json:
              schema:
                type: object
                description: 'TAF envelope: the object is in `Properties`. Null members are omitted; a null result is `{"Links":
                  [self]}` without `Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/ApprovalTimesheetPeriodRead'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
                  Actions:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafAction'
        '400':
          description: '- **Code 200** — The request body or parameters failed input validation. — When: a parameter not parseable
            (Web API model binding) — Fix: Fix every item listed in Details and resend.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '404':
          description: '- The route matched a controller, but no action accepts the supplied query parameters — typically
            a required (non-nullable) simple parameter such as a DateTime was omitted. It is a missing-parameter error that
            looks like a 404. — When: a required parameter omitted (captured with none)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: No parameters
                  value:
                    Message: No HTTP resource was found that matches the request URI 'https://{region-node}.timelog.com/{account}/api/v1/approval/timesheets/get-status-by-period-with-rejected-time-tracking-items'.
                    MessageDetail: No action was found on the controller 'ApprovalTimesheet' that matches the request.
        '500':
          description: |-
            - **Code 37967** — Same rights rule as 37966, applied to reading another employee's approval status. — When: employeeUserId is another user the caller may not see — Fix: Read your own status, or use a user with an approval privilege covering the employee.

            - **Code 100** — Unhandled server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v1.employees.approvaltimesheet.getstatusbyperiodwithrejectedtimetrackingitems
  /v1/approval/timesheets/get-status-by-week-of-year:
    get:
      operationId: getApprovalTimesheetStatusByWeekOfYear
      summary: Get timesheet approval status for an ISO week
      description: |-
        Returns the approval status of the seven days of one ISO week of an employee's timesheet.

        Turns year + week into the ISO 8601 week (Monday to Sunday) and returns the same ApprovalTimesheetPeriodRead as get-status-by-period for that range. Week numbers outside 1..52/53 are not rejected: they are counted on from week 1 of `year` (week 0 = the last week of the previous year, week 53 in a 52-week year = week 1 of the next).

        **Use it to:**
        - Weekly timesheet UI or bot: 'is week 41 submitted and approved?'

        **Not for:**
        - Several weeks at once — use `GET /v1/approval/timesheets/get-status-range-by-nearby-week-of-year`.

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v1/user`

        **Next:** `POST /v1/approval/timesheets/submit-period`

        **See also:** `GET /v1/approval/timesheets/get-status-by-period`, `GET /v1/approval/timesheets/get-status-range-by-nearby-week-of-year`

        > **Not yet documented:** examples (success); request → query params → description.
      tags:
      - Employees
      parameters:
      - name: employeeUserId
        in: query
        required: true
        schema:
          type: integer
          format: int32
        description: |-
          User ID of the employee. Omitted -> 404 action-not-matched.

          Refers to `UserRead.UserID`. Look up valid values with `GET /v1/user`.
      - name: year
        in: query
        required: true
        schema:
          type: integer
          format: int32
        description: ISO week-numbering year as a calendar year (1..9999; outside -> 500).
      - name: week
        in: query
        required: true
        schema:
          type: integer
          format: int32
        description: 'ISO week number. Not range-checked: values outside the year''s weeks roll into the neighbouring year.'
      - name: $expand
        in: query
        required: false
        schema:
          type: string
          enum:
          - RejectedRegistrations
          x-enum-descriptions:
          - Fill RejectedRegistrations on each Rejected day (case-insensitive; other values ignored).
        description: |-
          Expansion of the per-day rejected registrations.

          Allowed values:

          | Value | Name | Meaning |
          |---|---|---|
          | `RejectedRegistrations` | RejectedRegistrations | Fill RejectedRegistrations on each Rejected day (case-insensitive; other values ignored). |
      - name: $page
        in: query
        required: false
        schema:
          type: integer
        description: Applied to each Rejected day's RejectedRegistrations list.
      - name: $pagesize
        in: query
        required: false
        schema:
          type: integer
        description: Page size of each Rejected day's RejectedRegistrations list.
      responses:
        '200':
          description: |-
            The object, wrapped in the TAF envelope (`Properties`). The ISO week: seven WeekDays, Monday first.

            Order: WeekDays Monday to Sunday

            Empty result: Never empty: always seven days (days without data are Empty).
          content:
            application/json:
              schema:
                type: object
                description: 'TAF envelope: the object is in `Properties`. Null members are omitted; a null result is `{"Links":
                  [self]}` without `Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/ApprovalTimesheetPeriodRead'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
                  Actions:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafAction'
        '400':
          description: '- **Code 200** — The request body or parameters failed input validation. — When: a parameter not parseable
            (Web API model binding) — Fix: Fix every item listed in Details and resend.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '404':
          description: '- The route matched a controller, but no action accepts the supplied query parameters — typically
            a required (non-nullable) simple parameter such as a DateTime was omitted. It is a missing-parameter error that
            looks like a 404. — When: employeeUserId, year or week omitted (captured with none)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: No parameters
                  value:
                    Message: No HTTP resource was found that matches the request URI 'https://{region-node}.timelog.com/{account}/api/v1/approval/timesheets/get-status-by-week-of-year'.
                    MessageDetail: No action was found on the controller 'ApprovalTimesheet' that matches the request.
        '500':
          description: |-
            - **Code 37967** — Same rights rule as 37966, applied to reading another employee's approval status. — When: employeeUserId is another user the caller may not see — Fix: Read your own status, or use a user with an approval privilege covering the employee.

            - **Code 100** — Unhandled server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v1.employees.approvaltimesheet.getstatusbyweekofyear
  /v1/approval/timesheets/get-status-range-by-nearby-week-of-year:
    get:
      operationId: getApprovalTimesheetStatusRangeByNearbyWeekOfYear
      summary: Get timesheet approval status for a range of ISO weeks
      description: |-
        Returns one ISO week's approval status plus up to N weeks before and after it, one period per week.

        Returns a list of ApprovalTimesheetPeriodRead: prevCount weeks before `week` (oldest first), `week` itself, then nextCount weeks after it. Without prevCount and nextCount the list holds only `week`. Weeks crossing a year end are counted on from week 1 of `year` (see get-status-by-week-of-year), so the range is continuous.

        **Use it to:**
        - Timesheet navigator: show the status of the current week and the four weeks before it.

        **Not for:**
        - A single week — `GET /v1/approval/timesheets/get-status-by-week-of-year` returns an object instead of a list.

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v1/user`

        **Next:** `POST /v1/approval/timesheets/submit-period`

        **See also:** `GET /v1/approval/timesheets/get-status-by-week-of-year`

        > **Not yet documented:** examples (success); request → query params.
      tags:
      - Employees
      parameters:
      - name: employeeUserId
        in: query
        required: true
        schema:
          type: integer
          format: int32
        description: |-
          User ID of the employee. Omitted -> 404 action-not-matched.

          Refers to `UserRead.UserID`. Look up valid values with `GET /v1/user`.
      - name: year
        in: query
        required: true
        schema:
          type: integer
          format: int32
        description: Year of the centre week.
      - name: week
        in: query
        required: true
        schema:
          type: integer
          format: int32
        description: ISO week number of the centre week (not range-checked).
      - name: prevCount
        in: query
        required: false
        schema:
          type: integer
          format: int32
        description: Number of weeks before the centre week. Negative -> 500 (Enumerable.Range).
      - name: nextCount
        in: query
        required: false
        schema:
          type: integer
          format: int32
        description: Number of weeks after the centre week. Negative -> 500.
      - name: $expand
        in: query
        required: false
        schema:
          type: string
          enum:
          - RejectedRegistrations
          x-enum-descriptions:
          - Fill RejectedRegistrations on each Rejected day (case-insensitive; other values ignored).
        description: |-
          Expansion of the per-day rejected registrations.

          Allowed values:

          | Value | Name | Meaning |
          |---|---|---|
          | `RejectedRegistrations` | RejectedRegistrations | Fill RejectedRegistrations on each Rejected day (case-insensitive; other values ignored). |
      - name: $page
        in: query
        required: false
        schema:
          type: integer
        description: 'Not a response pager: applied to each Rejected day''s RejectedRegistrations list.'
      - name: $pagesize
        in: query
        required: false
        schema:
          type: integer
        description: Page size of each Rejected day's RejectedRegistrations list.
      responses:
        '200':
          description: |-
            A list, wrapped in the TAF list envelope (`Entities[].Properties`). prevCount + 1 + nextCount weeks, oldest first.

            Order: Weeks ascending

            Empty result: Never empty: at least the centre week.
          content:
            application/json:
              schema:
                type: object
                description: 'TAF list envelope: each item is in `Entities[].Properties`.'
                properties:
                  Entities:
                    type: array
                    description: Omitted (not `[]`) when the list is empty.
                    items:
