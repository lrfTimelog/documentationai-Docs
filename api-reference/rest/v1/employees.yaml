      summary: Submit a timesheet period for approval
      description: |-
        Closes every day from StartDate to EndDate of an employee's timesheet and sends it for approval.

        The API equivalent of the employee pressing "submit" on a week or month. All the employee's project time and absence registrations in the period are closed (no longer editable by the employee), the days are marked closed in the employee's projection, a submit entry with the optional comment is added to the approval dialogue, and a TimesheetClosed event (or its project-manager-approval variant) starts the approval workflow. Refused as a whole when the employee has a time tracker running on one of the days, or when the tenant forbids closing a period with zero hours / below standard time. Can be called for another employee by a user with the rights described below.

        **Use it to:**
        - Auto-submit timesheets at the end of the week for employees whose hours come from another system.
        - A manager or integration user closes the month for employees before payroll.

        **Not for:**
        - Submitting single registrations — use `POST /v1/approval/timesheets/submit-time-registrations`.
        - Approving or rejecting — no REST operation in this service does that.

        **Rules across fields:**
        - R1: StartDate must not be after EndDate; otherwise the day list is empty and the call fails with 500. Not validated.

        **Behaviour:**
        - Not idempotent.
        - Safe to retry only under a condition. Re-submitting closes nothing new but adds another dialogue entry and raises the event again (no 'already submitted' check on this path).
        - Duplicates: Not deduplicated (see safe_to_retry_detail).
        - Side effect: Every project-time and absence registration of the employee in the period gets status Closed (employee can no longer edit).
        - Side effect: The employee's projection days in the period are marked closed; the time tracker is notified of the closed period.
        - Side effect: An approval-dialogue entry (CloseTimeTrackingPeriod) with Comment is stored; approval context items are set to Submitted.
        - Changes are visible to the next read immediately.
        - Batch: all_or_nothing

        **Call first:** `GET /v1/approval/timesheets/get-status-by-period`

