components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: |-
        OAuth 2.0 bearer token, sent as `Authorization: Bearer <token>`. JWT and reference tokens are both accepted. The token must carry the required scope (default `tlp`).

        The token's `sub` claim is the acting user. A token WITHOUT `sub` (client-credentials) acts as the system service user. If the `sub` user cannot log in (inactive, locked, deleted), the request is rejected with 401 — it is no longer let through without a user.

        > **Not yet documented:** how to obtain a token.

        > **Not yet documented:** token lifetime.
  schemas:
    AbsenceCodeRead:
      type: object
      properties:
        AbsenceCodeID:
          type: integer
          format: int32
          readOnly: true
          x-timelog-identity:
            role: primary_id
            unique_scope: tenant
            uniqueness_enforced: true
            id_format: int
          description: |-
            Integer identifier. Send it as AbsenceID on the absence registration creates, as AbsenceCodeID on absence time trackers, and as EntityID (GroupType 3) on time registration create/import.

            Identifier of this object, unique per TimeLog site.
        AbsenceCode:
          type: string
          readOnly: true
          maxLength: 255
          description: |-
            The tenant's short code for the absence (e.g. "30", "20"); matched by searchText on GET /v1/absence-code/{status}.

            Filterable via `searchText` (contains).

            > **Not yet documented:** identity → role.
        Name:
          type: string
          readOnly: true
          maxLength: 255
          description: |-
