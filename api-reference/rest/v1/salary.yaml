openapi: 3.1.0
info:
  title: Salary and absence — REST API v1
  version: v1
  description: |-
    Absence codes and self-service absence registration, salary accounts (payroll balances) and their postings, and allowance legislations.

    Enums are integers in v1.

    **Conventions that apply to every operation in this file:**
    - Property names are PascalCase.
    - Successful bodies use the TAF envelope: one object in `Properties`, lists in `Entities[].Properties`.
    - Some operations succeed without content: HTTP 200 with the literal body `null`, or HTTP 204.
    - `PUT` replaces the whole object: omitted fields are reset.
    - Treat error `Code` 102 as a business-rule violation, whether the HTTP status is 422 or 500.

    > **Not yet documented:** rate limits.
servers:
- url: https://app{server-number}.timelog.com/{account}/api
  description: 'Your TimeLog site, as in the browser address bar when you are signed in: `https://app[X].timelog.com/[account
    name]`. `server-number` is the number after `app` (for example `3` in `app3.timelog.com`), `account` is the account name
    you use to log in. If your browser shows `https://app.timelog.com`, find your site URL in System Administration > Integrations
    and API > Reporting API settings, under Your TimeLog API URL.'
  variables:
    server-number:
      default: '3'
    account:
      default: your-account
security:
- bearer: []
paths:
  /v1/absence-code/get-recently-registered:
    get:
      operationId: listRecentlyRegisteredAbsenceCodes
      summary: List the caller's recently used absence codes
      description: |-
        Lists every absence code the calling user has ever registered absence on, most recently used first.

        Returns the distinct absence codes found on the caller's own absence registrations, ordered by the newest registration on each (highest TimeRegistrationID, i.e. most recently CREATED — not latest absence date). There is no time window, no active filter and no salary-group scope: inactive codes, and codes the caller can no longer register on, are included. Limited-licence users, the Time product and PSA Starter plans get an empty list.

        **Use it to:**
        - Show 'recently used' absence codes at the top of a self-service picker.

        **Not for:**
        - Codes the caller may register on — use `GET /v1/absence-code/{status}` (and check IsActive).

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **Next:** `POST /v1/absence-code/registration-by-hours`, `POST /v1/absence-code/registration-by-half-day`, `POST /v1/absence-code/registration-by-full-day`

        **See also:** `GET /v1/absence-code/{status}`
      parameters:
      - name: includeFavouriteOnly
        in: query
        required: false
        schema:
          type: boolean
          default: false
          x-timelog-filter:
            operators:
            - eq
        description: |-
          true → only the caller's favourite codes.

          Filters on `AbsenceCodeRead.IsFavourite` (eq).
      - name: $page
        in: query
        required: false
        schema:
          type: integer
          default: 1
        description: Page number.
      - name: $pagesize
        in: query
        required: false
        schema:
          type: integer
          default: 10
        description: Page size. No maximum enforced in the API layer.
      responses:
        '200':
          description: |-
            A list, wrapped in the TAF list envelope (`Entities[].Properties`). One page of absence codes with the same hypermedia Actions as GET /v1/absence-code/{status}.

            Paged with `$page` (default 1) and `$pagesize` (default 10).

            Order: Most recently created registration per code first (MAX(TimeRegistrationID) descending)

            Empty result: 200 with no Entities (also for limited users, the Time product and PSA Starter)
          content:
            application/json:
              schema:
                type: object
                description: 'TAF list envelope: each item is in `Entities[].Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/TafListPaging'
                  Entities:
                    type: array
                    description: Omitted (not `[]`) when the list is empty.
                    items:
                      type: object
                      properties:
                        Properties:
                          $ref: '#/components/schemas/AbsenceCodeRead'
                        Links:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafLink'
                        Actions:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafAction'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
              examples:
                example1:
                  summary: Recently used codes (first entity shown)
                  value:
                    Properties:
                      TotalRecord: '12'
                      TotalPage: '2'
                      PageNumber: '1'
                    Entities:
                    - Properties:
                        AbsenceCodeID: 3
                        AbsenceCode: '20'
                        Name: Vacation
                        Description: Registration of vacation
                        IsActive: true
                        FlexPositiveFactor: 1.0
                        SalaryAccountFactor: 1.0
                        SalaryAccountFactorEffect: -1
                        SalaryAccountID: 5
                        AbsenceCodeTypeID: 2
                        DeductCapacity: false
                        TimeTrackingFormat: 2
                        RequireApproval: true
                        IsPublicVisible: true
                        IsFavourite: true
                        ID: b0f671b5-81b8-46d5-adeb-d7ab064a2adc
                      Actions:
                      - Name: add-registration
                        Title: Add Registration
                        Method: Post
                        Href: https://app{server-number}.timelog.com/{account}/api/v1/absence-code/registration-by-half-day
                        Type: application/json
                        Fields:
                        - Name: Type
                          Type: AbsenceCodeHalfDayValueTypes
                          Enums:
                          - HalfDay
                          - FullDay
                        - Name: AbsenceID
                          Type: Number
                        - Name: Date
                          Type: DateTime
                        - Name: Comment
                          Type: Text
                    - … 9 more
                    Links:
                    - Href: https://app{server-number}.timelog.com/{account}/api/v1/absence-code/get-recently-registered
                      Rel: self
        '401':
          description: '- Missing, invalid or expired bearer token. — When: Captured (no / malformed token). — Fix: Obtain
            a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v1.salary.absencecode.getrecentlyregistered
  /v1/absence-code/registration-by-full-day:
    post:
      operationId: createAbsenceRegistrationByFullDay
      summary: Register a full day of absence (for the caller)
      description: |-
        Registers a full day of absence for the calling user on an absence code; the hours are the user's normal working time that day.

        Creates an absence time registration for the authenticated user on Date with the caller's full normal working hours for that date (employee projection, else the weekday of the normal working time). Type in the body is ignored. On a full/half-day absence CODE a second registration on the same code and date is refused (37954). Returns no body.

        **Use it to:**
        - Self-service sick-day or vacation-day registration from an employee app.

        **Not for:**
        - Absence for another employee — use `POST /v1/time-registration` (GroupType 3, TimeTrackingFormat 1).
        - Several days at once — call once per day (no range parameter).

        **Behaviour:**
        - Not idempotent.
        - Safe to retry only under a condition. On a full/half-day CODE a retry after success is refused with 37954. On an hours-format code a retry duplicates.
        - Duplicates: Same code + same date refused (37954) only when the absence CODE's own format is full/half day.
        - Side effect: Creates an absence time registration for the caller and posts it to the code's salary account.
        - Side effect: Same save path as `POST /v1/time-registration` (TimeRegistrationCreated event).
        - Read-after-write consistency: not yet documented.

        **Call first:** `GET /v1/absence-code/{status}`

        **See also:** `POST /v1/time-registration/update-full-day-absence`, `POST /v1/absence-code/registration-by-half-day`

        > **Not yet documented:** behaviour → consistency; examples (success).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AbsenceRegistrationCreate.create.createAbsenceRegistrationByFullDay'
      responses:
        '200':
          description: 'Success without content: HTTP 200 with the literal JSON body `null`. Body is the literal JSON `null`;
            the registration''s ID is not returned.'
          content:
            application/json:
              schema:
                type: 'null'
        '400':
          description: '- **Code 200** — The request body or parameters failed input validation. — When: AbsenceID ≤ 0 / missing,
            Date missing (captured) — Fix: Fix every item listed in Details and resend.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '401':
          description: '- Missing, invalid or expired bearer token. — When: Captured (no / malformed token). — Fix: Obtain
            a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '422':
          description: |-
            - **Code 38034** — EntityID is not a valid absence code (GroupType = Absence).

            - **Code 37588** — zero-norm-hours-day — When: The caller's norm is 0 on Date (37982 is raised as well)

            - **Code 37982** — Hours and minutes are both zero. — When: Derived duration is 0

            - **Code 37954** — absence-already-exists-on-date — When: Full/half-day code with an existing posting for the caller on Date

            - **Code 37977** — salary-account-inactive

            - **Code 70023** — Absence registration is not available on the Time product.

            - **Code 300116** — comment-required

            - **Code 102** — The request is well-formed but violates a TimeLog business rule. — When: General registration rules (30012, 30011, 37740, 37565 …)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v1.salary.absencecode.createregistrationbyfullday
  /v1/absence-code/registration-by-half-day:
    post:
      operationId: createAbsenceRegistrationByHalfDay
      summary: Register a half or full day of absence (for the caller)
      description: |-
        Registers half a day (Type 0) or a full day (Type 1) of absence for the calling user on an absence code.

        Creates an absence time registration for the authenticated user on Date. The duration is not sent: it is half (or all) of the caller's normal working hours on that date — from the employee projection when one exists, else from the weekday of the caller's normal working time. Any Type other than 1 means half day. On a full/half-day absence CODE a second registration on the same code and date is refused (37954). Returns no body.

        **Use it to:**
        - Self-service: register a half day off (morning appointment) from an employee app.

        **Not for:**
        - Absence for another employee — use `POST /v1/time-registration` (GroupType 3, TimeTrackingFormat 1/2).

        **Behaviour:**
        - Not idempotent.
        - Safe to retry only under a condition. On a full/half-day CODE a retry after success is refused with 37954 (no duplicate). On an hours-format code a retry creates a second registration.
        - Duplicates: Same code + same date refused (37954) only when the absence CODE's own format is full/half day.
        - Side effect: Creates an absence time registration for the caller and posts it to the code's salary account.
        - Side effect: Same save path as `POST /v1/time-registration` (TimeRegistrationCreated event).
        - Read-after-write consistency: not yet documented.

        **Call first:** `GET /v1/absence-code/{status}`

        **See also:** `POST /v1/time-registration/update-half-or-full-day-absence`, `POST /v1/absence-code/registration-by-full-day`

        > **Not yet documented:** behaviour → consistency; examples (success).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AbsenceRegistrationCreate.create.createAbsenceRegistrationByHalfDay'
      responses:
        '200':
          description: 'Success without content: HTTP 200 with the literal JSON body `null`. Body is the literal JSON `null`;
            the registration''s ID is not returned.'
          content:
            application/json:
              schema:
                type: 'null'
        '400':
          description: '- **Code 200** — The request body or parameters failed input validation. — When: AbsenceID ≤ 0 / missing,
            Date missing (captured) — Fix: Fix every item listed in Details and resend.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '401':
          description: '- Missing, invalid or expired bearer token. — When: Captured (no / malformed token). — Fix: Obtain
            a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '422':
          description: |-
            - **Code 38034** — EntityID is not a valid absence code (GroupType = Absence).

            - **Code 37588** — zero-norm-hours-day — When: The caller's norm is 0 on Date (the derived duration is then 0 and 37982 is raised as well)

            - **Code 37982** — Hours and minutes are both zero. — When: Derived duration is 0 (no normal working time that day)

            - **Code 37954** — absence-already-exists-on-date — When: The code is a full/half-day code and the caller already has a posting on it on Date

            - **Code 37977** — salary-account-inactive

            - **Code 70023** — Absence registration is not available on the Time product.

            - **Code 300116** — comment-required

            - **Code 102** — The request is well-formed but violates a TimeLog business rule. — When: General registration rules (30012, 30011, 37740, 37565 …)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v1.salary.absencecode.createregistrationbyhalffullday
  /v1/absence-code/registration-by-hours:
    post:
      operationId: createAbsenceRegistrationByHours
      summary: Register absence in hours (for the caller)
      description: |-
        Registers absence for the calling user on one date, as a number of minutes, on an absence code.

        Creates an absence time registration for the authenticated user (never for someone else) on Date with absence code AbsenceID, TimeTrackingFormat Hours. The stored duration is Minutes: Hours must be sent and > 0 to pass validation, but Minutes is applied after it and replaces it — omit Minutes and the call fails with 37982. The code's own TimeTrackingFormat is not checked. Returns no body; the new registration's ID is not returned.

        **Use it to:**
        - Self-service: an employee app or HR portal registers the user's own partial-day absence (doctor's visit, 2 h).

        **Not for:**
        - Registering absence for another employee — use `POST /v1/time-registration` (GroupType 3, UserID).
        - Full or half days — use `POST /v1/absence-code/registration-by-full-day` / createregistrationbyhalffullday.

        **Rules across fields:**
        - R1: Hours > 0 is required by validation, but the duration is Minutes (Minutes replaces Hours); Minutes 0 → 37982.

        **Behaviour:**
        - Not idempotent.
        - Not safe to retry blindly.
        - Duplicates: Not deduplicated: on an hours-format code every call adds another registration. (The same-day duplicate check 37954 runs only for full/half-day CODES.)
        - Side effect: Creates an absence time registration for the caller (new GUID per call); posts it to the absence code's salary account (duration × SalaryAccountFactor × SalaryAccountFactorEffect).
        - Side effect: Same save path as `POST /v1/time-registration`: TimeRegistrationCreated event, financial data recalculated after commit.
        - Read-after-write consistency: not yet documented.

        **Call first:** `GET /v1/absence-code/{status}`, `GET /v1/absence-code/get-recently-registered`

        **See also:** `POST /v1/time-registration/update-hours-absence`, `POST /v1/time-registration`, `POST /v1/absence-code/time-tracker`

        > **Not yet documented:** behaviour → consistency; examples (success); response (registration ID).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AbsenceRegistrationCreate.create.createAbsenceRegistrationByHours'
      responses:
        '200':
          description: 'Success without content: HTTP 200 with the literal JSON body `null`. Body is the literal JSON `null`.
            The registration''s ID is not returned; read it back with `GET /v1/time-registration/{timeRegistrationID}` … (no
            list-by-date in this service).'
          content:
            application/json:
              schema:
                type: 'null'
        '400':
          description: '- **Code 200** — The request body or parameters failed input validation. — When: AbsenceID ≤ 0 / missing,
            Date missing, Hours ≤ 0 (captured) — Fix: Fix every item listed in Details and resend.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '401':
          description: '- Missing, invalid or expired bearer token. — When: Captured (no / malformed token). — Fix: Obtain
            a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '422':
          description: |-
            - **Code 37982** — Hours and minutes are both zero. — When: Minutes omitted or 0 — even with Hours > 0

            - **Code 38034** — EntityID is not a valid absence code (GroupType = Absence). — When: AbsenceID is not an absence code

            - **Code 37588** — zero-norm-hours-day — When: The caller has no normal working time on Date

            - **Code 37977** — salary-account-inactive — When: The code's salary account is inactive

            - **Code 70023** — Absence registration is not available on the Time product.

            - **Code 300116** — comment-required

            - **Code 102** — The request is well-formed but violates a TimeLog business rule. — When: General registration rules — e.g.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v1.salary.absencecode.createregistrationbyhours
  /v1/absence-code/time-tracker:
    post:
      operationId: createAbsenceTimeTracker
      summary: Start a time tracker on an absence code (no response body)
      description: |-
        Starts a stopwatch for the calling user on an absence code; returns no body.

        Creates a running, non-billable time tracker for the authenticated user on AbsenceCodeID, starting now (server clock). Any tracker the caller already has running is stopped first and converted into a time registration. With TimeRegistrationID, comment, factor and monthly period are copied from that registration and the tracker is linked to it when it is dated today. Behaviour is identical to `POST /v1/time-tracker/absence/start-time-tracker`, which also returns the new tracker — prefer that operation.

        **Not for:**
        - When you need the tracker's ID — use `POST /v1/time-tracker/absence/start-time-tracker` (returns TimeTrackerRead).

        **Behaviour:**
        - Not idempotent.
        - Not safe to retry blindly.
        - Side effect: Stops the caller's running tracker (if any) and converts it into time registration(s).
        - Side effect: Creates the tracker (TimeTrackerCreated event); notifies invoicing potential.
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v1/absence-code/{status}`

        **Next:** `GET /v1/time-tracker/active-time-tracker`, `POST /v1/time-registration/stop-time-tracker/{timeTrackerId}`

        **See also:** `POST /v1/time-tracker/absence/start-time-tracker`

        > **Not yet documented:** examples (success).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeTrackerStartForAbsence.create'
      responses:
        '200':
          description: 'Success without content: HTTP 200 with the literal JSON body `null`. Body is the literal JSON `null`.
            The tracker''s ID is not returned; read it with `GET /v1/time-tracker/active-time-tracker`.'
          content:
            application/json:
              schema:
                type: 'null'
        '400':
          description: '- **Code 200** — The request body or parameters failed input validation. — When: AbsenceCodeID ≤ 0
            (also when omitted); Minute < 0 (captured) — Fix: Fix every item listed in Details and resend.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '401':
          description: '- Missing, invalid or expired bearer token. — When: Captured (no / malformed token). — Fix: Obtain
            a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '500':
          description: |-
            - **Code 37588** — zero-norm-hours-day — When: The caller has no normal working time on the day (37588)

            - **Code 37667** — The absence code does not use the hours time-tracking format, so it cannot be tracked with a stopwatch.

            - **Code 37714** — The absence code requires approval, so it cannot be tracked with a stopwatch.

            - **Code 37672** — The tracker's date is closed for the employee (employee projection IsClosed — e.g. a closed timesheet).

            - **Code 37671** — The tracker's date is in a closed accounting period for the employee.

            - **Code 37678** — Stopwatch time tracking is switched off: feature StopwatchTimeTracking is inactive while the time-tracking page setting UseStopwatchTimeTracking is 'True'.

            - **Code 37704** — Feature MandatoryComment is on and a NEW tracker has no comment.

            - **Code 37537** — invoiced-or-vouchered — When: Source registration dated today is invoiced (37537)

            - **Code 30011** — closed-accounting-period — When: Source registration dated today is in a closed accounting period (30011)

            - **Code 100** — Unhandled server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v1.salary.absencecode.createtimetracker
  /v1/absence-code/{status}:
    get:
      operationId: listAbsenceCodesByStatus
      summary: List absence codes available to the caller
      description: |-
        Lists the absence codes the calling user can register absence on, optionally by active status, favourites or a search text.

        Returns the absence codes attached (through their salary account) to the caller's salary group, where that salary account is active. status filters on the code's own active flag (-1 all, 0 inactive, 1 active; default all). The result is per caller: two users can get different lists, and the IsFavourite flag is the caller's. Limited-licence users, the Time product and PSA Starter plans get an empty list. Each entity carries hypermedia actions pointing at the create endpoint matching the code's format.

        **Use it to:**
        - Populate an absence-code picker in an employee self-service app.
        - Map an HR system's leave types to TimeLog AbsenceCodeIDs (call as a user in the relevant salary group).

        **Not for:**
        - A tenant-wide catalogue of every absence code — the list is filtered by the caller's salary group.

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **Next:** `POST /v1/absence-code/registration-by-hours`, `POST /v1/absence-code/registration-by-half-day`, `POST /v1/absence-code/registration-by-full-day`, `POST /v1/absence-code/time-tracker`

        **See also:** `GET /v1/absence-code/get-recently-registered`

        > **Not yet documented:** request → path params → status (names); request → query params → searchText (empty).
      parameters:
      - name: status
        in: path
        required: true
        schema:
          type: integer
          enum:
          - -1
          - 0
          - 1
          x-enum-descriptions:
          - Active and inactive codes (no filter).
          - Only inactive codes.
          - Only active codes.
          default: -1
          x-timelog-filter:
            operators:
            - eq
        description: |-
          Any other integer is treated as Active (non-zero → true).

          Filters on `AbsenceCodeRead.IsActive` (eq).

          Allowed values:

          | Value | Name | Meaning |
          |---|---|---|
          | `-1` | All | Active and inactive codes (no filter). |
          | `0` | Inactive | Only inactive codes. |
          | `1` | Active | Only active codes. |
      - name: includeFavouriteOnly
        in: query
        required: false
        schema:
          type: boolean
          default: false
          x-timelog-filter:
            operators:
            - eq
        description: |-
          true → only the caller's favourite codes.

          Filters on `AbsenceCodeRead.IsFavourite` (eq).
      - name: searchText
        in: query
        required: false
        schema:
          type: string
          x-timelog-filter:
            operators:
            - contains
        description: |-
          Substring match on Name OR AbsenceCode (SQL LIKE '%text%'; % and _ in the text act as wildcards).

          Filters on `AbsenceCodeRead.Name` (contains).
      - name: $page
        in: query
        required: false
        schema:
          type: integer
          default: 1
        description: Page number.
      - name: $pagesize
        in: query
        required: false
        schema:
          type: integer
          default: 10
        description: Page size. No maximum enforced in the API layer.
      responses:
        '200':
          description: |-
            A list, wrapped in the TAF list envelope (`Entities[].Properties`). One page of absence codes. Each entity carries `Actions`: add-registration (POST to registration-by-hours, -by-half-day or -by-full-day according to the code's TimeTrackingFormat) and, for hours codes, time-tracker.

            Paged with `$page` (default 1) and `$pagesize` (default 10).

            Order: AbsenceCodeID ascending

            Empty result: 200 with no Entities (also for limited users, the Time product and PSA Starter)
          content:
            application/json:
              schema:
                type: object
                description: 'TAF list envelope: each item is in `Entities[].Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/TafListPaging'
                  Entities:
                    type: array
                    description: Omitted (not `[]`) when the list is empty.
                    items:
                      type: object
                      properties:
                        Properties:
                          $ref: '#/components/schemas/AbsenceCodeRead'
                        Links:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafLink'
                        Actions:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafAction'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
              examples:
                example1:
                  summary: Active codes for the caller (first entity shown)
                  value:
                    Properties:
                      TotalRecord: '10'
                      TotalPage: '1'
                      PageNumber: '1'
