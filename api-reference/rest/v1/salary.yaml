  /v1/salary-account/{salaryAccountId}/posting:
    post:
      operationId: createSalaryAccountBulkPosting
      summary: Post manual salary account adjustments (bulk)
      description: |-
        Adds a manual posting (positive or negative, in hours) to one salary account for each listed employee, on one date.

        Adjusts payroll balances (e.g. flex or vacation) in bulk: for every item in EmployeeUsers a Manual posting of HoursAdjustment is created on salaryAccountId at BalanceDate, with optional comments to the manager and the employee. Hours-format accounts get hours (and whole minutes); days-format accounts get the hours converted to days with each employee's average daily norm; count-format accounts get 0. Validation is all-or-nothing: if any employee fails, nothing is written and Details lists every failure. Returns 204.

        **Use it to:**
        - Import opening balances or year-end corrections of flex / vacation accounts from a payroll system.

        **Not for:**
        - Registering absence — use the absence registration operations, which post to the account themselves.

        **Behaviour:**
        - Not idempotent.
        - Not safe to retry blindly.
        - Duplicates: Not deduplicated: a retry or a repeated UserId posts again (the balance is adjusted twice).
        - Side effect: Raises SalaryAccountEmployeePostingBatchCreated with the employee IDs, account and date (aggregation refresh).
        - Read-after-write consistency: not yet documented.
        - Batch: all_or_nothing

        **Call first:** `GET /v1/salary-account`, `GET /v1/user`

        **Next:** `GET /v1/salary-account/{salaryAccountId}/aggregation`

        > **Not yet documented:** behaviour (closed / approved periods); behaviour → consistency; examples (success).
      parameters:
      - name: salaryAccountId
        in: path
        required: true
        schema:
          type: integer
          format: int32
        description: Unknown ID → 37994 (HTTP 500).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalaryAccountManualPostingCreate.create'
      responses:
        '204':
          description: 'Success without content: HTTP 204 with an empty body. No body. Posting IDs are not returned.'
        '400':
          description: '- **Code 200** — The request body or parameters failed input validation. — When: BalanceDate missing
            / invalid, EmployeeUsers empty, UserId ≤ 0, HoursAdjustment 0 (captured: Details also contains an empty string)
            — Fix: Fix every item listed in Details and resend.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: Validation failure (empty body)
                  value:
                    Code: 200
                    Details:
                    - ''
                    - Balance Date is not a valid date.
                    - At least one employee is required.
                    Message: Invalid model state error.
                    Parameters: 'salaryAccountEmployeeManualPostingCreateModel: {"BalanceDate":"0001-01-01T00:00:00","EmployeeUsers":[]}'
                    Url: https://app{server-number}.timelog.com/{account}/api/v1/salary-account/1/posting
        '401':
          description: '- Missing, invalid or expired bearer token. — When: Captured (no / malformed token). — Fix: Obtain
            a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '404':
          description: '- The URL did not match any route (including a route constraint such as {id:int} receiving a non-integer).
            — When: salaryAccountId not an integer (captured)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '500':
          description: |-
            - **Code 37994** — The salaryAccountId in the path is not an existing salary account. — Fix: Use a SalaryAccountID from `GET /v1/salary-account`.

            - **Code 37040** — An EmployeeUsers[].UserId is not an existing user. The whole batch is refused. — Fix: Send UserIDs from `GET /v1/user`.

            - **Code 37931** — An EmployeeUsers[].UserId is an inactive user. The whole batch is refused. — Fix: Remove inactive employees from the batch.

            - **Code 37995** — BalanceDate is later than today + N months, or on/before today − M months (tenant settings SalaryAccountEmployeePostingDateNoOfMonthsAhead / ...Backdate). — Fix: Use a posting date inside the tenant's permitted window.

            - **Code 37993** — Header violation for one employee whose posting failed a business rule; the employee's own violations follow it in Details. — When: Header per failing employee, followed by 30181 / 30167 — Fix: Read the violations that follow; fix or remove that employee and resend the batch.

            - **Code 30181** — BalanceDate is before the tenant's site creation date. — Fix: Use a later posting date.

            - **Code 30167** — BalanceDate is before the employee's employment date or after the resignation date. — Fix: Remove the employee or use a date inside the employment period.

            - **Code 100** — Unhandled server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v1.salary.salaryaccount.create
