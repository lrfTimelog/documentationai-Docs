    get:
      operationId: getSalaryAccountEmployeeBalances
      summary: Get employees' salary account balances at a date
      description: |-
        Returns each active employee's balance on one salary account at the end of a date (or one employee's, with userId).

        For salaryAccountId and balanceDate, returns one row per active employee of the tenant — user ID, first and last name and AccountBalance (balance at the end of balanceDate, 2 decimals), ordered by user ID and paged. With userId only that employee is returned. The balance unit follows the account's BalanceFormat, which no curated operation returns (hours, minutes or days). Inactive (deactivated) users are never included.

        **Use it to:**
        - Payroll export: read flex / vacation balances of all employees at period end.
        - Show one employee's balance in an HR portal (with userId).

        **Not for:**
        - Posting history — this returns balances only.

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Read-after-write consistency: not yet documented.

