  /v1/time-registration/import:
    post:
      operationId: importTimeRegistration
      summary: Import a time registration
      description: |-
        Creates a time or absence registration priced with a caller-supplied hourly rate.

        Migration-style import: you send the project, contract, task, employee and the hourly rate the registration should carry. The server generates the registration GUID (one new registration per call) and returns the created registration. To price project or travel time, the server temporarily points the employee's allocation at a project-specific hourly rate on ContractID (an existing active rate with the same name and amount is reused, otherwise one is created), saves the registration, then points the allocation back. Cost price is no longer set by this call: CostPrice and CostPriceName are accepted and ignored.

        **Use it to:**
        - Migrating historical hours from another system with their original hourly rates

        **Not for:**
        - Day-to-day time entry → `POST /v1/time-registration` (client GUID, no rate records)
        - Dry run → `POST /v1/time-registration/validate-import`

        **Rules across fields:**
        - R1: GroupType ≠ Absence (3) → ProjectID, ContractID and TaskID are required (non-zero) and AbsenceCodeID must be 0.
        - R2: GroupType = Absence (3) → AbsenceCodeID is required (non-zero).
        - R3: GroupType ≠ Absence and HourlyRate ≠ 0 → HourlyRateName is required (400).
        - R4: GroupType = Project or TravelTime and HourlyRate differs from the allocation's current rate → HourlyRateName is required, else 38037 (HTTP 500). This also fires when HourlyRate is omitted (0) and the allocation's rate is not 0; R3 does not catch that case.
        - R5: TaskID is NOT checked against ContractID/ProjectID on import. A mismatch creates or reuses the hourly rate on ContractID while the allocation belongs to TaskID's contract.

        **Behaviour:**
        - Not idempotent.
        - Not safe to retry blindly. The GUID is server-generated, so a retry after a timeout creates a second registration.
        - Duplicates: None. Every call creates a new registration. Rate records are de-duplicated by (contract, name, amount).
        - Side effect: Allocation is created if the employee is not on the task (as create, before validation).
        - Side effect: If HourlyRate differs from the allocation's rate: an active project-specific hourly rate on ContractID with the same name (case-insensitive) and amount is reused; otherwise a NEW one is created (persists, ContractHourlyRateCreated). The allocation is saved pointing at it, the registration is saved, then the allocation is saved back to its original rate in a finally block.
        - On failure: A created hourly-rate record persists.
        - On failure: Not transactional: the switch and the restore are separate saves whose violations are not checked.
        - Read-after-write consistency: not yet documented.

        **Call first:** `POST /v1/time-registration/validate-import`

        **Next:** `GET /v1/time-registration/{timeRegistrationID}`

        **See also:** `POST /v1/time-registration`

        > **Not yet documented:** behaviour → consistency; examples (success).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeRegistrationImport.create'
      responses:
        '200':
          description: The object, wrapped in the TAF envelope (`Properties`). The created registration.
          content:
            application/json:
              schema:
                type: object
                description: 'TAF envelope: the object is in `Properties`. Null members are omitted; a null result is `{"Links":
                  [self]}` without `Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/TimeRegistrationRead'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
                  Actions:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafAction'
        '400':
          description: '- **Code 200** — The request body or parameters failed input validation. — When: Any rule in TimeRegistrationImport
            / R1–R3 fails — Fix: Fix every item listed in Details and resend.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '422':
          description: '- **Code 102** — The request is well-formed but violates a TimeLog business rule.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '500':
          description: |-
            - **Code 300131** — UserID is not the caller, and the caller lacks the 'register all registrations' privilege (RegistrationAllRegistrations). Department and legal-entity access do not count here. — When: UserID is another user and the caller lacks RegistrationAllRegistrations — Fix: Import only your own time, or use a user with the privilege.

            - **Code 38037** — Project or travel time: HourlyRate differs from the allocation's current rate (including HourlyRate omitted = 0) and HourlyRateName is empty, so no rate can be found or created. — When: R4 — Fix: Send HourlyRateName, or send the allocation's current rate as HourlyRate.

            - **Code 100** — Unhandled server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v1.timeregistration.import
  /v1/time-registration/stop-time-tracker/{timeTrackerId}:
    post:
      operationId: stopTimeTracker
      summary: Stop a time tracker
      description: |-
        Stops a running time tracker now and turns the tracked time into a time registration.

        Ends the tracker at the current server time. A tracker that ran past midnight is split per day (at most the start day and the next day). The tracked time is saved as registration(s) — added to the linked registration when the tracker was started from today's registration — and the tracker is deleted.

        **Behaviour:**
        - Not idempotent.
        - Not safe to retry blindly. A second call targets a deleted tracker and fails with 500.
        - Side effect: Ends the tracker (server clock); splits it across days when it ran past midnight (max 1 extra day).
        - Side effect: Creates or updates time registration(s) — full registration side effects (work unit, invoicing, salary, financials).
        - Side effect: Deletes the tracker once converted.
        - On failure: If conversion yields no registration the ended tracker is saved and the call returns 500.
        - Read-after-write consistency: not yet documented.

        **Next:** `GET /v1/time-registration/{timeRegistrationID}`

