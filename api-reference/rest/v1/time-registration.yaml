          description: |-
            When tracking started. Converted to the employee's time zone (user profile) before use; a value without an offset is read as server-local time. Omitted → server clock now. The tracker Date is StartTime's date. Ignored (server now used) when TimeRegistrationID is sent, the user uses timestamps and the registration is project time.

            Time zone: employee_local
      required:
      - IsBillable
      description: Starts a stopwatch for the calling user on a task — either a task given directly, or the task of an existing
        time registration (TimeRegistrationID).
