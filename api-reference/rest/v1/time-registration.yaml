            | `2` | HalfDay | Absence is half a day (or a full day); the hours come from half the employee's normal working time. |
            | `3` | YesNo | Salary-code (supplement) format: a registration posts a count of 1. Not observed on absence codes. |
            | `4` | Count | Salary-code (supplement) format: a registration posts the entered number as a count. Not observed on absence codes. |

