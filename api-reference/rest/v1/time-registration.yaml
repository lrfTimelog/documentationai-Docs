    TimeRegistrationUpdateTime.update:
      type: object
      properties:
        TimeRegistrationID:
          type: integer
          format: int32
          x-timelog-identity:
            role: primary_id
            unique_scope: tenant
            id_format: int
          description: |-
            Integer ID of the registration to change.

            Identifier of this object, unique per TimeLog site.
        Hours:
          type: number
          format: double
          description: |-
            New duration in decimal hours.

            Unit: hours (decimal)

            Must be non-zero. When StartTime and EndTime are both sent, Hours × 60 must equal their difference in whole minutes.
        Minutes:
          type: integer
          format: int32
          description: |-
            Duration in minutes.

            Unit: minutes

            - always — Hours is always present, and Hours wins for project time — Minutes is never applied.
        Billable:
          type: boolean
          default: false
          description: Whether the time is billable.
        BillableHours:
          type: number
          format: double
          default: 0
          description: |-
            Billable duration in decimal hours.

            Unit: hours (decimal)
        BillableMinutes:
          type: integer
          format: int32
          description: |-
            Billable duration in minutes.

            Unit: minutes

            - always — BillableHours is always passed (0 when omitted), so BillableMinutes is never applied.
        Factor:
          type: number
          format: double
          default: 0
          description: |-
            Registration factor (100 = normal).

            Same OvertimeFactor rules as TimeRegistrationWrite.Factor (update context: a value not in the allowed list keeps the previous value).
        MonthlyPeriod:
          type: string
          description: |-
            Salary month (MMyyyy).

            > **Not yet documented:** null semantics.
        TaskID:
          type: integer
          format: int32
          x-timelog-identity:
            role: reference
          description: |-
            Moves the registration to another task.

            Refers to `TaskRead.TaskID`.

            - TaskID differs from the current task and the employee is not allocated to it — The allocation is created (same staffing side effect as create).

            > **Not yet documented:** identity → references → lookup op.

            > **Not yet documented:** values → lookup op.
        StartTime:
          type: string
          format: date-time
          description: |-
            Start time of the work.

            Time zone: none applied — sent value stored as-is

            Applied only when the employee has timestamps enabled (see TimeRegistrationWrite.StartTime).
        EndTime:
          type: string
          format: date-time
          description: |-
            End time of the work — used ONLY to validate Hours.

            Time zone: none applied

            - StartTime and EndTime both sent — 400 if EndTime ≤ StartTime, or if (EndTime − StartTime) in minutes ≠ round(Hours × 60).

            - always — Not stored; the server sets EndTime = StartTime + Hours.
        Date:
          type: string
          format: date-time
          description: |-
            Moves the registration to another date.

            Time zone: not yet documented.

            > **Not yet documented:** constraints → timezone.
        Comment:
          type: string
          description: Free-text comment.
        AdditionalComment:
          type: string
          x-timelog-condition: Required when the site configures the additional field as mandatory (30048).
          description: |-
            Second free-text field, configurable per site.

            **Conditional.** Required when the site configures the additional field as mandatory (30048).
      required:
      - TimeRegistrationID
      - Hours
      description: Changes the duration, billing, comment, date or task of an existing project or travel time registration,
        addressed by its integer TimeRegistrationID. Unlike PUT /v1/time-registration the employee is kept; but several fields
        are still REPLACED when omitted (see each field).
    TimeRegistrationWrite.create:
      type: object
      properties:
        ID:
          type: string
          format: uuid
          x-timelog-identity:
            role: primary_id
            unique_scope: tenant
            uniqueness_enforced: true
            id_format: guid
          description: |-
            Client-generated GUID that identifies the registration. On create you choose it; on update it selects the registration to replace. It is NOT the integer TimeRegistrationID.

            Can be set on create only.

            Identifier of this object, unique per TimeLog site.

            Re-using an existing GUID on create fails with 38030 (422). Create is not idempotent.
        TaskID:
          type: integer
          format: int32
          x-timelog-condition: Required (non-zero) when GroupType is Project (1) or TravelTime (6). Not used for Absence.
          x-timelog-identity:
            role: reference
          description: |-
            The task the time is registered on.

            **Conditional.** Required (non-zero) when GroupType is Project (1) or TravelTime (6). Not used for Absence.

            Refers to `TaskRead.TaskID`.

            If the employee is not yet allocated to the task, TimeLog CREATES the allocation (adds the employee to the project resource group, the contract team and a 0-hour allocation) — before the registration is validated. See operation behaviour.
        UserID:
          type: integer
          format: int32
          x-timelog-identity:
            role: reference
          description: |-
            The user (employee) the time belongs to.

            Refers to `UserRead.UserID`.

            On update this is overwritten — an update can move a registration to another user.
        Date:
          type: string
          format: date-time
          description: |-
            The date the time is registered on.

            Time zone: not yet documented.

            Stored as sent; no truncation of a time component found. Send midnight (YYYY-MM-DDT00:00:00).

            > **Not yet documented:** constraints → timezone.
        Hours:
          type: number
          format: double
          x-timelog-condition: Required and non-zero when GroupType is Project, or TimeTrackingFormat is Hours.
          description: |-
            Duration in decimal hours (e.g. 1.5 = 1 h 30 min).

            **Conditional.** Required and non-zero when GroupType is Project, or TimeTrackingFormat is Hours.

            Unit: hours (decimal)

            - GroupType = Absence and TimeTrackingFormat = FullDay or HalfDay — Hours are taken from the employee's normal working time.

            No server-side rejection of negative values was found (only != 0 is checked).
        Minutes:
          type: integer
          format: int32
          description: |-
            Duration in minutes.

            - GroupType = Project or TravelTime — Hours always wins — the API passes Hours (or 0) to the engine, so Minutes is never applied. Send Hours.

            - GroupType = Absence and TimeTrackingFormat = Hours — Minutes is applied after Hours and wins.
        GroupType:
          type: integer
          enum:
          - 1
          - 3
          - 6
          x-enum-descriptions:
          - Time worked on a project task.
          - Absence (vacation, sickness …). EntityID = absence code.
          - Travel time on a project task.
          description: |-
            What kind of registration this is.

            Allowed values:

            | Value | Name | Meaning |
            |---|---|---|
            | `1` | Project | Time worked on a project task. |
            | `3` | Absence | Absence (vacation, sickness …). EntityID = absence code. |
            | `6` | TravelTime | Travel time on a project task. |
        TimeTrackingFormat:
          type: integer
          enum:
          - 0
          - 1
          - 2
          - 3
          - 4
          x-enum-descriptions:
          - Duration in hours/minutes.
          - Absence for a full day (hours from normal working time).
          - Absence for half a day (hours from normal working time).
          - 'Salary-code (supplement) format: a registration posts a count of 1.'
          - 'Salary-code (supplement) format: a registration posts the entered number as a count.'
          default: 0
          description: |-
            How the duration is expressed.

            Allowed values:

            | Value | Name | Meaning |
            |---|---|---|
            | `0` | Hours | Duration in hours/minutes. |
            | `1` | FullDay | Absence for a full day (hours from normal working time). |
            | `2` | HalfDay | Absence for half a day (hours from normal working time). |
            | `3` | YesNo | Salary-code (supplement) format: a registration posts a count of 1. |
            | `4` | Count | Salary-code (supplement) format: a registration posts the entered number as a count. |
        EntityID:
          type: integer
          format: int32
          x-timelog-condition: Required when GroupType = Absence. Ignored otherwise.
          x-timelog-identity:
            role: reference
          description: |-
            For absence, the absence code to register.

            **Conditional.** Required when GroupType = Absence. Ignored otherwise.

            Refers to `AbsenceCodeRead.AbsenceCodeID`.

            - GroupType = Project or TravelTime — Replaced by the allocation resolved from TaskID + UserID.
        Billable:
          type: boolean
          default: false
          description: |-
            Whether the time is billable to the customer.

            - Feature BillableOnTime is OFF — Forced to the task's billable flag.

            - Task is fixed-price and Billable = false — Fails with 37620.
        BillableHours:
          type: number
          format: double
          default: 0
          description: |-
            Billable duration in decimal hours.

            Unit: hours (decimal)

            - Feature BillableHoursIsEditable is OFF — Set to the actual Hours.

            - Feature BillableHoursIsEditable is ON and the field is omitted — 0 billable hours is stored.

            - Fixed-price task and BillableHoursIsEditableOnFixedPrice is OFF — Synced to actual hours.

            - RoundingOfBillableTime is ON — Mismatch raises 30168.
        BillableMinutes:
          type: integer
          description: |-
            Billable duration in minutes.

            - always — BillableHours is always passed (0 when omitted), so BillableMinutes is never applied.
        Factor:
          type: number
          format: double
          description: |-
            Registration factor (100 = normal). Used for overtime factors.

            Default: 0 on the wire → stored as 100

            - Feature OvertimeFactor is OFF, or the task is fixed-price — Always 100.

            - OvertimeFactor ON and value is in the setting RoundingFactorOptionOfTimeRegistrations (default "100") — applied

            - OvertimeFactor ON, create, value not in the list — Stored as 100.

            - OvertimeFactor ON, update, value not in the list — Previous value kept.

            > **Not yet documented:** description.
        Comment:
          type:
          - string
          - 'null'
          description: |-
            Free-text comment on the registration.

            Null: On update, omitting Comment clears the stored comment.

            - Feature MandatoryComment is ON and comment is empty — Fails with 300116.
        AdditionalComment:
          type: string
          x-timelog-condition: Required when the site configures the additional field as mandatory (30048).
          description: |-
            Second free-text field, configurable per site (title and validation are site settings).

            **Conditional.** Required when the site configures the additional field as mandatory (30048).
        MonthlyPeriod:
          type: string
          description: |-
            Salary month the registration belongs to.

            - Feature TempTreatAllTimeRegistrationAsRecurringTask is OFF — ignored

            - Value outside ±MonthlyPeriodDropdownRange months of today, or malformed — Returns 500 (Code 100), not 400.
        StartTime:
          type: string
          format: date-time
          description: |-
            Start time of the work.

            Time zone: not yet documented.

            - The user does not have timestamps enabled, or the registration is an absence — StartTime/EndTime are cleared.

            - Timestamps enabled, StartTime sent — Seconds dropped; no timezone conversion; EndTime = StartTime + Hours.

            - Timestamps enabled, create, no StartTime — EndTime = the user's current time on that date; StartTime = EndTime − Hours. If that would put StartTime on the previous day, StartTime = midnight of Date and EndTime = StartTime + Hours (may run past midnight).

            - Timestamps enabled, update, no StartTime, stored registration has a StartTime — The stored StartTime is kept; EndTime = StartTime + Hours.

            - Timestamps enabled, update, no StartTime, stored registration has no StartTime — The registration stays without timestamps (EndTime cleared).
        IsCalendarEvent:
          type: boolean
          default: false
          description: |-
            Marks the registration as originating from a calendar meeting.

            - create — Sets IsMeeting on the registration. No other effect via this API (CalendarEventID is always 0).

            - update — ignored
      required:
      - ID
      - UserID
      - Date
      - GroupType
      description: A registration of time worked on a task (project time, travel time) or of absence, for one employee on
        one date.
    TimeRegistrationWrite.update.updateTimeRegistration:
      type: object
      properties:
        ID:
          type: string
          format: uuid
          x-timelog-identity:
            role: primary_id
            unique_scope: tenant
            uniqueness_enforced: true
            id_format: guid
          description: |-
            Client-generated GUID that identifies the registration. On create you choose it; on update it selects the registration to replace. It is NOT the integer TimeRegistrationID.

            Can be set on create only.

            Identifier of this object, unique per TimeLog site.

            Selects the registration to replace (TimeRegistrationGUID, not TimeRegistrationID). Re-using an existing GUID on create fails with 38030 (422). Create is not idempotent.
        TaskID:
          type: integer
          format: int32
          x-timelog-condition: Required (non-zero) when GroupType is Project (1) or TravelTime (6). Not used for Absence.
          x-timelog-identity:
            role: reference
          description: |-
            The task the time is registered on.

            **Conditional.** Required (non-zero) when GroupType is Project (1) or TravelTime (6). Not used for Absence.

            Refers to `TaskRead.TaskID`.

            If the employee is not yet allocated to the task, TimeLog CREATES the allocation (adds the employee to the project resource group, the contract team and a 0-hour allocation) — before the registration is validated. See operation behaviour.
        UserID:
          type: integer
          format: int32
          x-timelog-identity:
            role: reference
          description: |-
            The user (employee) the time belongs to.

            Refers to `UserRead.UserID`.

            Overwritten — changing it moves the registration to another user. On update this is overwritten — an update can move a registration to another user.
        Date:
          type: string
          format: date-time
          description: |-
            The date the time is registered on.

            Time zone: not yet documented.

            Stored as sent; no truncation of a time component found. Send midnight (YYYY-MM-DDT00:00:00).

            > **Not yet documented:** constraints → timezone.
        Hours:
          type: number
          format: double
          x-timelog-condition: Required and non-zero when GroupType is Project, or TimeTrackingFormat is Hours.
          description: |-
            Duration in decimal hours (e.g. 1.5 = 1 h 30 min).

            **Conditional.** Required and non-zero when GroupType is Project, or TimeTrackingFormat is Hours.

            Unit: hours (decimal)

            - GroupType = Absence and TimeTrackingFormat = FullDay or HalfDay — Hours are taken from the employee's normal working time.

            No server-side rejection of negative values was found (only != 0 is checked).
        Minutes:
          type: integer
          format: int32
          x-timelog-condition: Update validator requires Minutes when Hours is absent (but see behaviour).
          description: |-
            Duration in minutes.

            **Conditional.** Update validator requires Minutes when Hours is absent (but see behaviour).

            - GroupType = Project or TravelTime — Hours always wins — the API passes Hours (or 0) to the engine, so Minutes is never applied. Send Hours.

            - GroupType = Absence and TimeTrackingFormat = Hours — Minutes is applied after Hours and wins.
        GroupType:
          type: integer
          enum:
          - 1
          - 3
          - 6
          x-enum-descriptions:
          - Time worked on a project task.
          - Absence (vacation, sickness …). EntityID = absence code.
          - Travel time on a project task.
          description: |-
            What kind of registration this is.

            Allowed values:

            | Value | Name | Meaning |
            |---|---|---|
            | `1` | Project | Time worked on a project task. |
            | `3` | Absence | Absence (vacation, sickness …). EntityID = absence code. |
            | `6` | TravelTime | Travel time on a project task. |
        TimeTrackingFormat:
          type: integer
          enum:
          - 0
          - 1
          - 2
          - 3
          - 4
          x-enum-descriptions:
          - Duration in hours/minutes.
          - Absence for a full day (hours from normal working time).
          - Absence for half a day (hours from normal working time).
          - 'Salary-code (supplement) format: a registration posts a count of 1.'
          - 'Salary-code (supplement) format: a registration posts the entered number as a count.'
          default: 0
          description: |-
            How the duration is expressed.

            Allowed values:

            | Value | Name | Meaning |
            |---|---|---|
            | `0` | Hours | Duration in hours/minutes. |
            | `1` | FullDay | Absence for a full day (hours from normal working time). |
            | `2` | HalfDay | Absence for half a day (hours from normal working time). |
            | `3` | YesNo | Salary-code (supplement) format: a registration posts a count of 1. |
            | `4` | Count | Salary-code (supplement) format: a registration posts the entered number as a count. |
        EntityID:
          type: integer
          format: int32
          x-timelog-condition: Required when GroupType = Absence. Ignored otherwise.
          x-timelog-identity:
            role: reference
          description: |-
            For absence, the absence code to register.

            **Conditional.** Required when GroupType = Absence. Ignored otherwise.

            Refers to `AbsenceCodeRead.AbsenceCodeID`.

            - GroupType = Project or TravelTime — Replaced by the allocation resolved from TaskID + UserID.
        Billable:
          type: boolean
          default: false
          description: |-
            Whether the time is billable to the customer.

            - Feature BillableOnTime is OFF — Forced to the task's billable flag.

            - Task is fixed-price and Billable = false — Fails with 37620.
        BillableHours:
          type: number
          format: double
          default: 0
          description: |-
            Billable duration in decimal hours.

            Unit: hours (decimal)

            - Feature BillableHoursIsEditable is OFF — Set to the actual Hours.

            - Feature BillableHoursIsEditable is ON and the field is omitted — 0 billable hours is stored.

            - Fixed-price task and BillableHoursIsEditableOnFixedPrice is OFF — Synced to actual hours.

            - RoundingOfBillableTime is ON — Mismatch raises 30168.
        BillableMinutes:
          type: integer
          description: |-
            Billable duration in minutes.

            - always — BillableHours is always passed (0 when omitted), so BillableMinutes is never applied.
        Factor:
          type: number
          format: double
          description: |-
            Registration factor (100 = normal). Used for overtime factors.

            Default: 0 on the wire → stored as 100

            - Feature OvertimeFactor is OFF, or the task is fixed-price — Always 100.

            - OvertimeFactor ON and value is in the setting RoundingFactorOptionOfTimeRegistrations (default "100") — applied

            - OvertimeFactor ON, create, value not in the list — Stored as 100.

            - OvertimeFactor ON, update, value not in the list — Previous value kept.

            > **Not yet documented:** description.
        Comment:
          type:
          - string
          - 'null'
          description: |-
            Free-text comment on the registration.

            Null: On update, omitting Comment clears the stored comment.

            - Feature MandatoryComment is ON and comment is empty — Fails with 300116.
        AdditionalComment:
          type: string
          x-timelog-condition: Required when the site configures the additional field as mandatory (30048).
          description: |-
            Second free-text field, configurable per site (title and validation are site settings).

            **Conditional.** Required when the site configures the additional field as mandatory (30048).
        MonthlyPeriod:
          type: string
          description: |-
            Salary month the registration belongs to.

            - Feature TempTreatAllTimeRegistrationAsRecurringTask is OFF — ignored

            - Value outside ±MonthlyPeriodDropdownRange months of today, or malformed — Returns 500 (Code 100), not 400.
        StartTime:
          type: string
          format: date-time
          description: |-
            Start time of the work.

            Time zone: not yet documented.

            - The user does not have timestamps enabled, or the registration is an absence — StartTime/EndTime are cleared.

            - Timestamps enabled, StartTime sent — Seconds dropped; no timezone conversion; EndTime = StartTime + Hours.

            - Timestamps enabled, create, no StartTime — EndTime = the user's current time on that date; StartTime = EndTime − Hours. If that would put StartTime on the previous day, StartTime = midnight of Date and EndTime = StartTime + Hours (may run past midnight).

            - Timestamps enabled, update, no StartTime, stored registration has a StartTime — The stored StartTime is kept; EndTime = StartTime + Hours.

            - Timestamps enabled, update, no StartTime, stored registration has no StartTime — The registration stays without timestamps (EndTime cleared).
        IsCalendarEvent:
          type: boolean
          default: false
          description: |-
            Marks the registration as originating from a calendar meeting.

            - create — Sets IsMeeting on the registration. No other effect via this API (CalendarEventID is always 0).

            - update — ignored

            Ignored on update.
      required:
      - ID
      - UserID
      - Date
      - GroupType
      description: A registration of time worked on a task (project time, travel time) or of absence, for one employee on
        one date.
    TimeTrackerCreateEmpty.create:
      type: object
      properties:
        Comment:
          type:
          - string
          - 'null'
        Minute:
          type: integer
          format: int32
          default: 0
          description: 'Unit: minutes'
        TimeRegistrationID:
          type:
          - integer
          - 'null'
          format: int32
          x-timelog-identity:
            role: reference
          description: |-
            Refers to `TimeRegistrationRead.TimeRegistrationID`. Look up valid values with `GET /v1/time-registration/{timeRegistrationID}`.

            - Always (POST /v1/time-tracker) — The default adapter branch never reads it.
      description: Base start-tracker model.
    TimeTrackerRead:
      type: object
      properties:
        TimeTrackerID:
          type: integer
          format: int32
          readOnly: true
          x-timelog-identity:
            role: primary_id
            unique_scope: tenant
            id_format: int
          description: |-
            Integer identifier. Used by GET and DELETE /v1/time-tracker/{timeTrackerID}, PUT /v1/time-tracker and the stop operation.

            Identifier of this object, unique per TimeLog site.
        ID:
          type: string
          format: uuid
          readOnly: true
          x-timelog-identity:
            role: alternate_key
            unique_scope: tenant
            uniqueness_enforced: unknown
            id_format: guid
          description: |-
            GUID generated by the server when the tracker is created (Guid.NewGuid). No API operation looks a tracker up by it.

            Alternate key, unique per TimeLog site.
        UserID:
          type: integer
          format: int32
          readOnly: true
          x-timelog-identity:
            role: reference
          description: |-
            The employee (user) who owns the tracker.

            Refers to `UserRead.UserID`.
        Date:
          type: string
          format: date-time
          readOnly: true
          description: |-
            The day the tracked time belongs to (time part is midnight). Server-local date when the tracker was started without StartTime; employee-local date when started for a task with StartTime.

            Time zone: not yet documented.
        StartTime:
          type: string
          format: date-time
          readOnly: true
          description: |-
            When the current tracking interval started. Elapsed time on stop = stop time − StartTime.

            Time zone: not yet documented.
        EntityType:
          type: integer
          enum:
          - 98
          - 149
          - 0
          x-enum-descriptions:
          - Tracking project time; EntityID is a task ID.
          - Tracking absence; EntityID is an absence code ID.
          - No entity. Rejected on save (60071), so a stored tracker should not carry it.
          readOnly: true
          description: |-
            What EntityID points to.

            Allowed values:

            | Value | Name | Meaning |
            |---|---|---|
            | `98` | Task | Tracking project time; EntityID is a task ID. |
            | `149` | AbsenceCode | Tracking absence; EntityID is an absence code ID. |
            | `0` | NotSpecified | No entity. Rejected on save (60071), so a stored tracker should not carry it. |
        EntityID:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          x-timelog-identity:
            role: reference
          description: |-
            Task ID or absence code ID, depending on EntityType. Null when the tracker has no entity yet.

            Refers to `TaskRead | AbsenceCode (see EntityType)`.
        Task:
          $ref: '#/components/schemas/TaskRead'
          readOnly: true
          description: The task, only when the request has $expand=task and EntityType is 98; otherwise null.
        AbsenceCode:
          $ref: '#/components/schemas/AbsenceCodeRead'
          readOnly: true
          description: The absence code, only when the request has $expand=absenceCode and EntityType is 149; otherwise null.
        TimeRegistrationID:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          x-timelog-identity:
            role: reference
          description: |-
            The registration this tracker is LINKED to: stopping adds the tracked minutes to that registration instead of creating a new one. Set only when the tracker was started from a registration dated the start day (and the user does not use timestamps on project time); otherwise null.

            Refers to `TimeRegistrationRead.TimeRegistrationID`. Look up valid values with `GET /v1/time-registration/{timeRegistrationID}`.
        Comment:
          type: string
          readOnly: true
          description: Comment copied into the registration on stop. A stored NULL is returned as an empty string.
        Minute:
          type: integer
          format: int32
          readOnly: true
          description: |-
            Minutes already counted before StartTime (an offset). On stop, the elapsed minutes are ADDED to it. For a tracker linked to a registration it is the difference to the registration's existing minutes.

            Unit: minutes
        BillableMinute:
          type: integer
          format: int32
          readOnly: true
          description: |-
            Billable minutes counted before StartTime. On stop, elapsed minutes are added only when IsBillable is true.

            Unit: minutes
        IsBillable:
          type:
          - boolean
          - 'null'
          readOnly: true
          description: Billable flag carried to the registration. Always false for absence trackers. Null when not set; a
            tracker with null IsBillable or null EntityID is not converted into a registration on stop.
        TimeTrackerStatus:
          type: integer
          enum:
          - 1
          - 2
          x-enum-descriptions:
          - 'Running: started and not yet stopped.'
          - 'Stopped, but not (yet) turned into a time registration — e.g. it had no task/absence or no billable flag. Source
            comment: ''Inactive Time Tracking''.'
          readOnly: true
          description: |-
            Allowed values:

            | Value | Name | Meaning |
            |---|---|---|
            | `1` | ActiveTimeTracking | Running: started and not yet stopped. |
            | `2` | EmptyTimeRegistration | Stopped, but not (yet) turned into a time registration — e.g. it had no task/absence or no billable flag. Source comment: 'Inactive Time Tracking'. |
        MonthlyPeriod:
          type:
          - string
          - 'null'
          readOnly: true
          description: Salary/monthly period label, resolved from the tracker's MonthlyPeriodID.
        AdditionalTextField:
          type:
          - string
          - 'null'
          readOnly: true
          description: The additional text field value carried to the registration (tenant feature TimeRegistrationAdditionalTextField).
        Factor:
          type: number
          readOnly: true
          description: |-
            Overtime factor (percent, e.g. 100) carried to the registration.

            Unit: percent
      description: A time tracker (stopwatch) of one employee. A tracker is either running (TimeTrackerStatus 1) or ended
        but not yet turned into a time registration (TimeTrackerStatus 2). When a tracker is stopped and its data forms a
        valid registration, the registration is written and the tracker row is deleted, so a tracker is short-lived.
    TimeTrackerStartForAbsence.create:
      type: object
      properties:
        AbsenceCodeID:
          type: integer
          format: int32
          x-timelog-identity:
            role: reference
          description: |-
            The absence code to track. Always used, also when TimeRegistrationID is sent (it replaces the registration's entity).

            Refers to `AbsenceCodeRead.AbsenceCodeID`.
        TimeRegistrationID:
          type:
          - integer
          - 'null'
          format: int32
          x-timelog-identity:
            role: reference
          description: |-
            Start from an existing registration: copies comment, additional text, factor and monthly period, and LINKS the tracker when the registration is dated today (server date). The registration is not checked to belong to the caller.

            Refers to `TimeRegistrationRead.TimeRegistrationID`. Look up valid values with `GET /v1/time-registration/{timeRegistrationID}`.
        Minute:
          type: integer
          format: int32
          default: 0
          description: |-
            Minutes already counted before now. With TimeRegistrationID and a value > 0: the expected total.

            Unit: minutes
        Comment:
          type:
          - string
          - 'null'
          description: '- Always — Overwrites the tracker comment, including the registration''s comment when TimeRegistrationID
            is sent and Comment is omitted.'
      required:
      - AbsenceCodeID
      description: Starts a stopwatch for the calling user on an absence code.
    TimeTrackerStartForTask.create:
      type: object
      properties:
        TaskID:
          type:
          - integer
          - 'null'
          format: int32
          x-timelog-condition: Required when TimeRegistrationID is not sent (rule R1). When both are sent, TaskID wins over
            the registration's task.
          x-timelog-identity:
            role: reference
          description: |-
            **Conditional.** Required when TimeRegistrationID is not sent (rule R1). When both are sent, TaskID wins over the registration's task.

            Refers to `TaskRead.TaskID`.
        TimeRegistrationID:
          type:
          - integer
          - 'null'
          format: int32
          x-timelog-condition: Required when TaskID is not sent (rule R1).
          x-timelog-identity:
            role: reference
          description: |-
            **Conditional.** Required when TaskID is not sent (rule R1).

            Refers to `TimeRegistrationRead.TimeRegistrationID`. Look up valid values with `GET /v1/time-registration/{timeRegistrationID}`.

            - The registration is dated the start day and the user does not use timestamps on project time — The tracker is LINKED to the registration: stopping adds the tracked minutes to it.

            - Otherwise — Task, additional text, billable flag, factor and monthly period are copied; stopping creates a new registration.

            The registration is not checked to belong to the caller.
        IsBillable:
          type:
          - boolean
          - 'null'
          description: Billable flag of the tracked time.
        Minute:
          type: integer
          format: int32
          default: 0
          description: |-
            Minutes already worked before now. Without TimeRegistrationID it is the tracker's starting offset. With TimeRegistrationID and a value > 0 it is the EXPECTED total, and the offset becomes Minute − the registration's minutes.

            Unit: minutes
        BillableMinute:
          type:
          - integer
          - 'null'
          format: int32
          default: 0
          description: |-
            Unit: minutes

            - TimeRegistrationID is sent — Only used for a tracker started without a registration.
        Comment:
          type:
          - string
          - 'null'
          description: '- Always — Overwrites the tracker comment, also when TimeRegistrationID is sent and Comment is omitted
            — the registration''s comment is then dropped.'
        MonthlyPeriod:
          type:
          - string
          - 'null'
          description: Monthly period label. When omitted with TimeRegistrationID, the registration's monthly period is used.
        AdditionalTextField:
