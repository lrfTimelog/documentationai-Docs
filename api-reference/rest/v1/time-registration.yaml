openapi: 3.1.0
info:
  title: Time registrations — REST API v1
  version: v1
  description: |-
    Register, read, change and delete time and absence registered by employees.

    Enums are integers in v1.

    **Conventions that apply to every operation in this file:**
    - Property names are PascalCase.
    - Successful bodies use the TAF envelope: one object in `Properties`, lists in `Entities[].Properties`.
    - Some operations succeed without content: HTTP 200 with the literal body `null`, or HTTP 204.
    - `PUT` replaces the whole object: omitted fields are reset.
    - Treat error `Code` 102 as a business-rule violation, whether the HTTP status is 422 or 500.

    > **Not yet documented:** rate limits.
servers:
- url: https://app{server-number}.timelog.com/{account}/api
  description: 'Your TimeLog site, as in the browser address bar when you are signed in: `https://app[X].timelog.com/[account
    name]`. `server-number` is the number after `app` (for example `3` in `app3.timelog.com`), `account` is the account name
    you use to log in. If your browser shows `https://app.timelog.com`, find your site URL in System Administration > Integrations
    and API > Reporting API settings, under Your TimeLog API URL.'
  variables:
    server-number:
      default: '3'
    account:
      default: your-account
security:
- bearer: []
paths:
  /v1/time-registration:
    post:
      operationId: createTimeRegistration
      summary: Create a time registration
      description: |-
        Creates a time or absence registration for an employee on a date.

        Registers project time, travel time or absence. You supply the registration's GUID. The response is the created registration, including the integer TimeRegistrationID used by GET and DELETE.

        **Use it to:**
        - Import hours from an external time-tracking or calendar tool
        - Register absence from an HR system

        **Not for:**
        - Import with project/contract and an hourly-rate override → `POST /v1/time-registration/import`

        **Rules across fields:**
        - R1: GroupType Project (1) or TravelTime (6) → TaskID and non-zero Hours are required; EntityID is ignored.
        - R2: GroupType Absence (3) → EntityID (absence code) is required; TaskID is not used.
        - R3: TimeTrackingFormat Hours (0) → Hours required and non-zero, for any GroupType.

        **Behaviour:**
        - Not idempotent.
        - Safe to retry only under a condition. Retry with the SAME GUID: a 422 with 38030 means the first attempt succeeded.
        - Duplicates: Not deduplicated beyond the GUID. Same work sent with a new GUID creates a second registration.
        - Side effect: If the employee is not allocated to the task: adds the employee to the project's resource group and contract team and creates a 0-hour allocation. This happens after the existence checks but BEFORE business-rule validation, outside the save transaction — it persists even if the registration is then rejected.
        - Side effect: Creates the work unit; updates invoicing potential, salary posting and mileage links (same transaction).
        - Side effect: Recalculates financial data after commit.
        - Read-after-write consistency: not yet documented.

        **Next:** `GET /v1/time-registration/{timeRegistrationID}`, `PUT /v1/time-registration/{timeRegistrationID}/external-keys`

        **See also:** `PUT /v1/time-registration`

        > **Not yet documented:** behaviour → consistency; examples (success).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeRegistrationWrite.create'
      responses:
        '200':
          description: The object, wrapped in the TAF envelope (`Properties`). The created registration.
          content:
            application/json:
              schema:
                type: object
                description: 'TAF envelope: the object is in `Properties`. Null members are omitted; a null result is `{"Links":
                  [self]}` without `Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/TimeRegistrationRead'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
                  Actions:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafAction'
        '400':
          description: '- **Code 200** — The request body or parameters failed input validation. — When: Any rule in the write
            schema / R1–R3 fails — Fix: Fix every item listed in Details and resend.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '422':
          description: '- **Code 102** — The request is well-formed but violates a TimeLog business rule.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v1.timeregistration.create
    put:
      operationId: updateTimeRegistration
      summary: Replace a time registration
      description: |-
        Replaces all fields of an existing time registration, identified by its GUID.

        Full replace, not a partial update: send every field, including those you do not want to change. Omitted fields are reset (Comment and AdditionalComment cleared, Billable false, BillableHours 0). Exceptions: MonthlyPeriod keeps its value when omitted; Factor not in the allowed list keeps its value.

        **Not for:**
        - Changing hours/comment by integer ID → `POST /v1/time-registration/update-time` (reads current values first; omitted Comment/Billable are still replaced)

        **Rules across fields:**
        - R1: Same as create (GroupType → TaskID/Hours/EntityID)

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Side effect: Overwrites Created and CreatedBy with the update's time and user.
        - Side effect: A rejected registration moves to …RejectedAndResolved.
        - Read-after-write consistency: not yet documented.

        **Call first:** `GET /v1/time-registration/{timeRegistrationID}`

        **Next:** `GET /v1/time-registration/{timeRegistrationID}`

        > **Not yet documented:** examples.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeRegistrationWrite.update.updateTimeRegistration'
      responses:
        '200':
          description: 'Success without content: HTTP 200 with the literal JSON body `null`. Body is the literal JSON `null`.
            Call GET to read the result.'
          content:
            application/json:
              schema:
                type: 'null'
        '400':
          description: '- **Code 200** — The request body or parameters failed input validation. — Fix: Fix every item listed
            in Details and resend.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '422':
          description: '- **Code 102** — The request is well-formed but violates a TimeLog business rule. — When: 38031 =
            no registration with this ID (NOT 404); plus all create rules'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v1.timeregistration.update
  /v1/time-registration-financial-data/get-by-date:
    get:
      operationId: getTimeRegistrationFinancialDataByDate
      summary: Get my time and billable totals for a day
      description: |-
        Returns the calling user's registered hours, billable hours, billable amount and registration count for one day.

        Aggregates the caller's time registrations on `date` that already have financial data. The financial data is written asynchronously after a registration is saved, so a just-saved registration may be missing from the totals; check get-status-by-date first when the numbers must be final.

        **Use it to:**
        - Day summary in a time-tracking client (worked vs billable, value of the day).

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Consistency: eventual — financial data rows are written by the asynchronous time-registration service handler; unprocessed registrations are not counted

        **Call first:** `GET /v1/time-registration-financial-data/get-status-by-date`

        **See also:** `GET /v1/time-registration-financial-data/get-by-date-range`

        > **Not yet documented:** errors; examples (success); response → success (no legal entity currency).
      parameters:
      - name: date
        in: query
        required: true
        schema:
          type: string
          format: date-time
          x-timelog-filter:
            operators:
            - eq
        description: |-
          The day. Compared for EQUALITY with the registration date (stored at midnight): send a date without a time part, or nothing matches and every total is 0.

          Filters on `TimeRegistrationRead.Date` (eq).

          Date only — no time component.
      responses:
        '200':
          description: |-
            The object, wrapped in the TAF envelope (`Properties`). Always one object. A day without (processed) registrations returns zeros and TotalRegistrationCount 0, not 404.

            Empty result: 200 with zero totals
          content:
            application/json:
              schema:
                type: object
                description: 'TAF envelope: the object is in `Properties`. Null members are omitted; a null result is `{"Links":
                  [self]}` without `Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/TimeRegistrationFinancialDataRead'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
                  Actions:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafAction'
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '404':
          description: '- The route matched a controller, but no action accepts the supplied query parameters — typically
            a required (non-nullable) simple parameter such as a DateTime was omitted. It is a missing-parameter error that
            looks like a 404. — When: date omitted'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: date omitted
                  value:
                    Message: No HTTP resource was found that matches the request URI 'https://app{server-number}.timelog.com/{account}/api/v1/time-registration-financial-data/get-by-date'.
                    MessageDetail: No action was found on the controller 'TimeRegistrationFinancialData' that matches the
                      request.
      x-timelog-key: rest.v1.timeregistration.financialdata.getbydate
  /v1/time-registration-financial-data/get-by-date-range:
    get:
      operationId: getTimeRegistrationFinancialDataByDateRange
      summary: Get my daily time and billable totals for a period
      description: |-
        Returns one totals object per calendar day from startDate to endDate for the calling user.

        Lists every calendar day in the period (inclusive), with zeros for days without registrations. The list is PAGED with the default page size 10: for a period longer than 10 days, pass $pagesize (or walk $page) or only the first 10 days come back. Same eventual-consistency caveat as get-by-date.

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Consistency: eventual — see get-by-date

        **Call first:** `GET /v1/time-registration-financial-data/get-status-by-date-range`

        > **Not yet documented:** examples (success); request → query params.
      parameters:
      - name: startDate
        in: query
        required: true
        schema:
          type: string
          format: date-time
          x-timelog-filter:
            operators:
            - between
        description: |-
          First day (inclusive). Compared with midnight day values: a time part after 00:00 excludes that day.

          Filters on `TimeRegistrationFinancialDataRead.Date` (between).

          Date only — no time component.
      - name: endDate
        in: query
        required: true
        schema:
          type: string
          format: date-time
          x-timelog-filter:
            operators:
            - between
        description: |-
          Last day (inclusive). startDate after endDate returns an empty list.

          Filters on `TimeRegistrationFinancialDataRead.Date` (between).

          Date only — no time component.
      - name: $page
        in: query
        required: false
        schema:
          type: integer
          default: 1
      - name: $pagesize
        in: query
        required: false
        schema:
          type: integer
          default: 10
        description: No maximum enforced in the API layer.
      responses:
        '200':
          description: |-
            A list, wrapped in the TAF list envelope (`Entities[].Properties`).

            Paged with `$page` (default 1) and `$pagesize` (default 10).

            Order: Date ascending

            Empty result: Days without registrations are present with zero totals; only startDate > endDate gives an empty list.
          content:
            application/json:
              schema:
                type: object
                description: 'TAF list envelope: each item is in `Entities[].Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/TafListPaging'
                  Entities:
                    type: array
                    description: Omitted (not `[]`) when the list is empty.
                    items:
                      type: object
                      properties:
                        Properties:
                          $ref: '#/components/schemas/TimeRegistrationFinancialDataRead'
                        Links:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafLink'
                        Actions:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafAction'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '404':
          description: '- The route matched a controller, but no action accepts the supplied query parameters — typically
            a required (non-nullable) simple parameter such as a DateTime was omitted. It is a missing-parameter error that
            looks like a 404. — When: startDate or endDate omitted'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: Parameters omitted
                  value:
                    Message: No HTTP resource was found that matches the request URI 'https://app{server-number}.timelog.com/{account}/api/v1/time-registration-financial-data/get-by-date-range'.
                    MessageDetail: No action was found on the controller 'TimeRegistrationFinancialData' that matches the
                      request.
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v1.timeregistration.financialdata.getbydaterange
  /v1/time-registration-financial-data/get-status-by-date:
    get:
      operationId: getTimeRegistrationFinancialDataStatusByDate
      summary: Get the financial-data processing status of a day
      description: |-
        Tells whether the financial data of all the calling user's registrations on a day has been computed.

        Completed is false while at least one of the caller's registrations on that day still has a pending domain-service request; then the get-by-date totals are not final. Poll until true.

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **Next:** `GET /v1/time-registration-financial-data/get-by-date`

        > **Not yet documented:** errors → internal-error; examples (success).
      parameters:
      - name: date
        in: query
        required: true
        schema:
          type: string
          format: date-time
          x-timelog-filter:
            operators:
            - eq
        description: |-
          The day (send without a time part — it is used as both ends of the range).

          Filters on `TimeRegistrationFinancialDataStatusRead.Date` (eq).

          Date only — no time component.
      responses:
        '200':
          description: The object, wrapped in the TAF envelope (`Properties`).
          content:
            application/json:
              schema:
                type: object
                description: 'TAF envelope: the object is in `Properties`. Null members are omitted; a null result is `{"Links":
                  [self]}` without `Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/TimeRegistrationFinancialDataStatusRead'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
                  Actions:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafAction'
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '404':
          description: '- The route matched a controller, but no action accepts the supplied query parameters — typically
            a required (non-nullable) simple parameter such as a DateTime was omitted. It is a missing-parameter error that
            looks like a 404. — When: date omitted'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: date omitted
                  value:
                    Message: No HTTP resource was found that matches the request URI 'https://app{server-number}.timelog.com/{account}/api/v1/time-registration-financial-data/get-status-by-date'.
                    MessageDetail: No action was found on the controller 'TimeRegistrationFinancialData' that matches the
                      request.
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v1.timeregistration.financialdata.getstatusbydate
  /v1/time-registration-financial-data/get-status-by-date-range:
    get:
      operationId: getTimeRegistrationFinancialDataStatusByDateRange
      summary: Get the financial-data processing status per day for a period
      description: |-
        Returns, for each calendar day from startDate to endDate, whether the calling user's financial data is fully computed.

        One status object per calendar day (inclusive), paged with default page size 10 — pass $pagesize for longer periods. Days without registrations report Completed = true.

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **Next:** `GET /v1/time-registration-financial-data/get-by-date-range`

        > **Not yet documented:** examples (success); request → query params.
      parameters:
      - name: startDate
        in: query
        required: true
        schema:
          type: string
          format: date-time
          x-timelog-filter:
            operators:
            - between
        description: |-
          First day (inclusive). A time part after 00:00 excludes that day.

          Filters on `TimeRegistrationFinancialDataStatusRead.Date` (between).

          Date only — no time component.
      - name: endDate
        in: query
        required: true
        schema:
          type: string
          format: date-time
          x-timelog-filter:
            operators:
            - between
        description: |-
          Last day (inclusive).

          Filters on `TimeRegistrationFinancialDataStatusRead.Date` (between).

          Date only — no time component.
      - name: $page
        in: query
        required: false
        schema:
          type: integer
          default: 1
      - name: $pagesize
        in: query
        required: false
        schema:
          type: integer
          default: 10
      responses:
        '200':
          description: |-
            A list, wrapped in the TAF list envelope (`Entities[].Properties`).

            Paged with `$page` (default 1) and `$pagesize` (default 10).

            Order: Date ascending

            Empty result: Only startDate > endDate gives an empty list; every day in range is present.
          content:
            application/json:
              schema:
                type: object
                description: 'TAF list envelope: each item is in `Entities[].Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/TafListPaging'
                  Entities:
                    type: array
                    description: Omitted (not `[]`) when the list is empty.
                    items:
                      type: object
                      properties:
                        Properties:
                          $ref: '#/components/schemas/TimeRegistrationFinancialDataStatusRead'
                        Links:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafLink'
                        Actions:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafAction'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '404':
          description: '- The route matched a controller, but no action accepts the supplied query parameters — typically
            a required (non-nullable) simple parameter such as a DateTime was omitted. It is a missing-parameter error that
            looks like a 404. — When: startDate or endDate omitted'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: Parameters omitted
                  value:
                    Message: No HTTP resource was found that matches the request URI 'https://app{server-number}.timelog.com/{account}/api/v1/time-registration-financial-data/get-status-by-date-range'.
                    MessageDetail: No action was found on the controller 'TimeRegistrationFinancialData' that matches the
                      request.
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
