  /v1/time-registration/validate-import:
    post:
      operationId: validateImportTimeRegistration
      summary: Validate a time registration import
      description: |-
        Checks whether an import body would be accepted, without saving the registration.

        Runs the import's existence checks (project, contract-on-project, task-on-contract, active user) and the time-registration business rules, then returns an empty success. It is stricter than import itself, which skips the existence checks. It is NOT side-effect free: the employee may be allocated to the task.

        **Use it to:**
        - Pre-flight a migration batch before calling import

        **Not for:**
        - Checking rates — HourlyRate is not evaluated (no rate lookup or swap is simulated, so 38037 cannot be pre-flighted)

        **Rules across fields:**
        - R1: Same as import R1–R3.
        - R2: GroupType ≠ Absence → ProjectID must exist, ContractID must belong to ProjectID, TaskID must be on ContractID.

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Side effect: If the employee is not allocated to TaskID: adds the employee to the project resource group and contract team and creates a 0-hour allocation. This persists.
        - Read-after-write consistency: not yet documented.

        **Next:** `POST /v1/time-registration/import`

        > **Not yet documented:** behaviour → consistency; examples (success).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeRegistrationImport.create.validateImportTimeRegistration'
      responses:
        '200':
          description: 'Success without content: HTTP 200 with the literal JSON body `null`. Body is the literal JSON `null`:
            the import would be accepted.'
          content:
            application/json:
              schema:
                type: 'null'
        '400':
          description: '- **Code 200** — The request body or parameters failed input validation. — When: Body fails TimeRegistrationImport
            validation — Fix: Fix every item listed in Details and resend.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '422':
          description: '- **Code 102** — The request is well-formed but violates a TimeLog business rule. — When: Any TimeRegistration
            business rule (same rule set as create)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '500':
          description: |-
            - **Code 37014** — ProjectID does not exist (non-absence registrations only).

            - **Code 37042** — ContractID does not exist or does not belong to ProjectID.

            - **Code 37949** — TaskID is not on ContractID.

            - **Code 37040** — UserID does not exist. (The import/create paths use 38033 for the same condition.)

            - **Code 37931** — UserID exists but the user is inactive.

            - **Code 300131** — UserID is not the caller, and the caller lacks the 'register all registrations' privilege (RegistrationAllRegistrations). Department and legal-entity access do not count here. — Fix: Import only your own time, or use a user with the privilege.

            - **Code 100** — Unhandled server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
