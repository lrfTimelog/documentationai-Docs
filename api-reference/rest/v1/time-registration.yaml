          - string
          - 'null'
          description: Additional text field value. When omitted with TimeRegistrationID, the registration's value is kept.
        Factor:
          type:
          - number
          - 'null'
          description: |-
            Unit: percent

            - Feature OvertimeFactor is ON and the value is not in setting RoundingFactorOptionOfTimeRegistrations — 400 'Invalid Factor value.'

            - Omitted — Keeps the registration's factor (with TimeRegistrationID), else the tracker default.
        StartTime:
          type:
          - string
          - 'null'
