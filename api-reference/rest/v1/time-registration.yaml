    TimeRegistrationUpdateAbsence.update.updateFullDayAbsence:
      type: object
      properties:
        TimeRegistrationID:
          type: integer
          format: int32
          x-timelog-identity:
            role: primary_id
            unique_scope: tenant
            id_format: int
          description: |-
            Integer ID of the absence registration to change.

            Identifier of this object, unique per TimeLog site.

            NOT validated on this route (no validator): 0 or unknown → HTTP 500. Validated as non-zero on update-half-or-full-day-absence and update-hours-absence (400). update-full-day-absence has NO validator: 0 or an unknown ID gives HTTP 500 (Code 100). The registration is not checked to be an absence.
        Type:
          type: integer
          enum:
          - 0
          - 1
          x-enum-descriptions:
          - Half of the employee's normal working time on that date.
          - The employee's full normal working time on that date.
          default: 0
          description: |-
            Whether the absence covers a half or a full day of the employee's normal working time.

            Not part of this model; always FullDay. The NotNull rule cannot fail on a non-nullable enum: omitting Type means HalfDay (0).

            Allowed values:

            | Value | Name | Meaning |
            |---|---|---|
            | `0` | HalfDay | Half of the employee's normal working time on that date. |
            | `1` | FullDay | The employee's full normal working time on that date. |
        Hours:
          type: number
          format: double
          default: 0
          description: |-
            New absence duration in decimal hours.

            Unit: hours (decimal)

            The validator's NotNull rule cannot fail on a non-nullable double; Hours = 0 passes validation (it then meets the zero-duration rule 37982 unless Minutes is set).
        Minutes:
          type: integer
          format: int32
          default: 0
          description: |-
            Absence duration in minutes.

            Unit: minutes

            - always — Applied after Hours (TimeTrackingFormat Hours), so Minutes wins over Hours.

            > **Not yet documented:** behaviour.
        Date:
          type: string
          format: date-time
          description: |-
            Moves the absence to another date.

            Time zone: not yet documented.

            > **Not yet documented:** constraints → timezone.
        Comment:
          type: string
          description: Free-text comment.
        AdditionalComment:
          type: string
          description: |-
            Accepted by the model but not used.

            - always — The stored additional comment is kept; the sent value is discarded.
      required:
      - TimeRegistrationID
      description: Changes the extent (full day, half day, or hours), date or comment of an existing absence registration,
        addressed by its integer TimeRegistrationID. The absence code, employee, billing and additional comment are kept.
