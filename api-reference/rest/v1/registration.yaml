openapi: 3.1.0
info:
  title: Timesheet (time tracking items) — REST API v1
  version: v1
  description: |-
    Read the caller's time registrations the way the timesheet shows them, toggle favourites, and check whether a period can be closed.

    Enums are integers in v1.

    **Conventions that apply to every operation in this file:**
    - Property names are PascalCase.
    - Successful bodies use the TAF envelope: one object in `Properties`, lists in `Entities[].Properties`.
    - Some operations succeed without content: HTTP 200 with the literal body `null`, or HTTP 204.
    - `PUT` replaces the whole object: omitted fields are reset.
    - Treat error `Code` 102 as a business-rule violation, whether the HTTP status is 422 or 500.

    > **Not yet documented:** rate limits.
servers:
- url: https://{region-node}.timelog.com/{account}/api
  description: 'Your TimeLog site. Copy both values from the address bar when you are signed in to TimeLog: `region-node`
    is the first part of the host name (for example `app3` in `app3.timelog.com`), `account` is the first path segment after
    it.'
  variables:
    region-node:
      default: app3
    account:
      default: your-account
security:
- bearer: []
paths:
  /v1/time-tracking-item/get-by-date:
    get:
      operationId: getTimeTrackingItemsByDate
      summary: List my time tracking items by date
      description: |-
        Lists the calling user's own time registrations (project time and absence) between two dates, enriched for display.

        Returns the caller's registrations with Date between startDate and endDate (both inclusive), each as a TimeTrackingItemRead: the registration plus its customer, project, task or absence code, allocation hours and approval / invoicing state. Always the CALLER's registrations — there is no employee parameter, so it cannot be used to read other employees' time. Paged ($page / $pagesize); each page is selected in creation order and then sorted by StartTime.

        **Use it to:**
        - Render a day / period timesheet in a time-tracking client
        - Let an employee review what they registered before submitting

        **Not for:**
        - Other employees' time or reporting across employees → Reporting API / time registration reports
        - Grouped week with norm time → `GET /v1/time-tracking-item/get-weekly-registrations`

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Duplicates: n/a (read)
        - Changes are visible to the next read immediately.

        **Next:** `GET /v1/time-tracking-item/{timeRegistrationID}`, `PUT /v1/time-registration`, `POST /v1/time-tracker/task/start-time-tracker`

        **See also:** `GET /v1/time-tracking-item/get-by-date-order-by-recent-registration`, `GET /v1/time-tracking-item/get-weekly-registrations`

        > **Not yet documented:** examples; request → query params.
      parameters:
      - name: startDate
        in: query
        required: true
        schema:
          type: string
          format: date-time
          x-timelog-filter:
            operators:
            - gte
        description: |-
          First day (inclusive). Omitting it → 404 (no action matched).

          Filters on `TimeTrackingItemRead.Date` (gte).
      - name: endDate
        in: query
        required: true
        schema:
          type: string
          format: date-time
          x-timelog-filter:
            operators:
            - lte
        description: |-
          Last day (inclusive). Not checked against startDate: endDate < startDate returns an empty list.

          Filters on `TimeTrackingItemRead.Date` (lte).
      - name: $page
        in: query
        required: false
        schema:
          type: integer
          default: 1
        description: Page number.
      - name: $pagesize
        in: query
        required: false
        schema:
          type: integer
          default: 10
        description: Page size.
      responses:
        '200':
          description: |-
            A list, wrapped in the TAF list envelope (`Entities[].Properties`). TAF list; each entity has a self link to the get-by-ID operation, and project rows (EntityType 43) a 'start-time-tracker' action.

            Paged with `$page` (default 1) and `$pagesize` (default 10).

            Empty result: 200 with TotalRecord "0" and no Entities
          content:
            application/json:
              schema:
                type: object
                description: 'TAF list envelope: each item is in `Entities[].Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/TafListPaging'
                  Entities:
                    type: array
                    description: Omitted (not `[]`) when the list is empty.
                    items:
                      type: object
                      properties:
                        Properties:
                          $ref: '#/components/schemas/TimeTrackingItemRead'
                        Links:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafLink'
                        Actions:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafAction'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '404':
          description: '- The route matched a controller, but no action accepts the supplied query parameters — typically
            a required (non-nullable) simple parameter such as a DateTime was omitted. It is a missing-parameter error that
            looks like a 404. — When: startDate or endDate omitted'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v1.registration.timetrackingitem.getbydate
  /v1/time-tracking-item/get-by-date-order-by-recent-registration:
    get:
      operationId: getTimeTrackingItemsByDateOrderByRecentRegistration
      summary: List my time tracking items by date, most recent first
      description: |-
        Lists the calling user's own time registrations between two dates, most recently CREATED first.

        Same data, scope and paging as get-by-date, but ordered by the registration's creation time, newest first, and not re-sorted. It returns registrations (one row each), not distinct tasks: to build a "recently used tasks" picker, de-duplicate on TaskID / AbsenceCodeID client-side.

        **Use it to:**
        - Show the caller's latest registrations first (e.g. a mobile 'recent' list)
        - Derive recently used tasks for quick re-entry

        **Not for:**
        - Chronological day view → `GET /v1/time-tracking-item/get-by-date`

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Duplicates: n/a (read)
        - Changes are visible to the next read immediately.

        **Next:** `GET /v1/time-tracking-item/{timeRegistrationID}`, `POST /v1/time-registration`

        **See also:** `GET /v1/time-tracking-item/get-by-date`, `GET /v1/customer/search-for-time-tracking-order-by-recent-registration`

        > **Not yet documented:** examples.
      parameters:
      - name: startDate
        in: query
        required: true
        schema:
          type: string
          format: date-time
          x-timelog-filter:
            operators:
            - gte
        description: |-
          First day (inclusive). Omitting it → 404 (no action matched).

          Filters on `TimeTrackingItemRead.Date` (gte).
      - name: endDate
        in: query
        required: true
        schema:
          type: string
          format: date-time
          x-timelog-filter:
            operators:
            - lte
        description: |-
          Last day (inclusive).

          Filters on `TimeTrackingItemRead.Date` (lte).
      - name: $page
        in: query
        required: false
        schema:
          type: integer
          default: 1
        description: Page number.
      - name: $pagesize
        in: query
        required: false
        schema:
          type: integer
          default: 10
        description: Page size (no maximum in the API layer).
      responses:
        '200':
          description: |-
            A list, wrapped in the TAF list envelope (`Entities[].Properties`). TAF list; self link per entity, 'start-time-tracker' action on project rows.

            Paged with `$page` (default 1) and `$pagesize` (default 10).

            Order: Created descending (newest-created first); no tie-breaker.

            Empty result: 200 with TotalRecord "0" and no Entities
          content:
            application/json:
              schema:
                type: object
                description: 'TAF list envelope: each item is in `Entities[].Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/TafListPaging'
                  Entities:
                    type: array
                    description: Omitted (not `[]`) when the list is empty.
                    items:
                      type: object
                      properties:
                        Properties:
                          $ref: '#/components/schemas/TimeTrackingItemRead'
                        Links:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafLink'
                        Actions:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafAction'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '404':
          description: '- The route matched a controller, but no action accepts the supplied query parameters — typically
            a required (non-nullable) simple parameter such as a DateTime was omitted. It is a missing-parameter error that
            looks like a 404. — When: startDate or endDate omitted'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v1.registration.timetrackingitem.getbydateorderbyrecentregistration
  /v1/time-tracking-item/get-weekly-registrations:
    get:
      operationId: getWeeklyRegistrations
      summary: Get my weekly registrations
      description: |-
        Returns the calling user's registrations for the 7 days from startDate, grouped by day and task, with daily and weekly norm hours and the difference.

        The weekly-timesheet view of the CALLER's time. The window is startDate through startDate + 6 days (no alignment to a week start: send the Monday yourself if you want an ISO week). All registrations of the window are read (no paging), grouped by day, then by task, and each day gets the employee's norm hours and registered − norm. Week totals: TotalRegisteredHours (days with registrations) and TotalNormHours (every day of the window that has an employee projection) — so a day with no registrations is missing from `Tasks` but still counts in TotalNormHours.

        **Use it to:**
        - Weekly timesheet grid in a time-tracking client
        - 'Am I short this week?' — TotalHoursDifference

        **Not for:**
        - A flat, paged list → `GET /v1/time-tracking-item/get-by-date`
        - Approval status per day → `GET /v1/approval/timesheets/get-status-by-dates`

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Duplicates: n/a (read)
        - Changes are visible to the next read immediately.

        **Next:** `GET /v1/time-tracking-item/{timeRegistrationID}`, `POST /v1/approval/timesheets/submit-period`

        **See also:** `GET /v1/time-tracking-item/get-by-date`

        > **Not yet documented:** examples.
      parameters:
      - name: startDate
        in: query
        required: true
        schema:
          type: string
          format: date-time
          x-timelog-filter:
            operators:
            - between
        description: |-
          First day of the 7-day window; the window ends startDate + 6 days (inclusive). Omitting it → 404.

          Filters on `TimeTrackingItemRead.Date` (between).
      responses:
        '200':
          description: |-
            The object, wrapped in the TAF envelope (`Properties`). One object for the window (TAF single envelope).

            Order: Days ascending; within a day, task groups by TaskName; within a group, registrations by Date (procedure order: Created ascending).

            Empty result: 200 with Tasks [] and TotalRegisteredHours 0; TotalNormHours still the window's norm.
          content:
            application/json:
              schema:
                type: object
                description: 'TAF envelope: the object is in `Properties`. Null members are omitted; a null result is `{"Links":
                  [self]}` without `Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/TimeTrackingItemExpandedRead'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
                  Actions:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafAction'
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '404':
          description: '- The route matched a controller, but no action accepts the supplied query parameters — typically
            a required (non-nullable) simple parameter such as a DateTime was omitted. It is a missing-parameter error that
            looks like a 404. — When: startDate omitted'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v1.registration.timetrackingitem.getweeklyregistrations
  /v1/time-tracking-item/save-favourite:
    post:
      operationId: saveTimeTrackingItemFavourite
      summary: Toggle a timesheet favourite
      description: |-
        Flips the calling user's "favourite" mark on a task or an absence code in the timesheet — adds it if absent, removes it if present.

        If the caller already has a favourite for (GroupType, ReferenceID) on the timesheet page, it is deleted; otherwise one is created. Favourites are per user. The result is visible as IsFavourite on time tracking items. Answers 204 with no body; there is no endpoint to read the current state directly.

        **Use it to:**
        - Star / un-star a task in a time-tracking client's task picker

        **Not for:**
        - Setting a known state idempotently — read IsFavourite first, then toggle only if needed

        **Rules across fields:**
        - R1: ReferenceID must be a TaskID when GroupType = 1 and an AbsenceCodeID when GroupType = 3.

        **Behaviour:**
        - Not idempotent.
        - Not safe to retry blindly. A retry after a lost response flips the favourite BACK. Re-read IsFavourite before retrying.
        - Duplicates: Toggle: a second identical call undoes the first.
        - Side effect: Inserts or deletes the caller's favourite row (entity = task 98 / absence code 149, page TimeTrackingBase 361).
        - Side effect: Clears the favourites cache.
        - Changes are visible to the next read immediately.

        **Call first:** Task IDs: `GET /v1/task/search-for-time-tracking` (or list rows' TaskID), Absence codes: AbsenceCodeRead lookups

        **Next:** `GET /v1/time-tracking-item/get-by-date`

        > **Not yet documented:** examples.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeTrackingItemSaveFavourite'
      responses:
        '204':
          description: |-
            Success without content: HTTP 204 with an empty body. No body, for both 'added' and 'removed' — the response does not say which happened.

            Order: n/a

            Empty result: n/a
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '500':
          description: |-
            - **Code 100** — ReferenceID is not an existing task (GroupType 1) or absence code (GroupType 3). Also raised when un-favouriting a task / absence code that has since been deleted. — When: ReferenceID is not an existing task / absence code (incl. omitted = 0), or un-favouriting a since-deleted one — Fix: Send an existing TaskID with GroupType 1, or an existing AbsenceCodeID with GroupType 3.

            - **Code 100** — GroupType is not 1 (Project) or 3 (Absence) — including omitted (0) and the time-tracker / travel-time members 4–6 of the shared enum. — When: GroupType not 1 or 3 — Fix: Send GroupType 1 or 3.

            - **Code 100** — No JSON body (or 'null'): the controller dereferences the null request model. — When: No body / null body — Fix: Send a JSON object with ReferenceID and GroupType.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: Empty body (error)
                  value:
                    Code: 100
                    Details: []
                    Message: Unknown error occur in system, please contact system administrator.
                    Parameters: 'requestModel: {"ReferenceID":0,"GroupType":0}'
                    Url: https://{region-node}.timelog.com/{account}/api/v1/time-tracking-item/save-favourite
      x-timelog-key: rest.v1.registration.timetrackingitem.savefavourite
  /v1/time-tracking-item/{timeRegistrationID}:
    get:
      operationId: getTimeTrackingItemByID
      summary: Get a time tracking item
      description: |-
        Returns one time registration, by its integer ID, in the enriched timesheet shape (TimeTrackingItemRead).

        Looks up a single registration by TimeRegistrationID and returns it with its customer, project, task or absence code, allocation hours and approval / invoicing state — the same shape as one row of the list operations. This is the target of every list row's self link. An ID that does not exist (or is not a project / absence registration the procedure can resolve) answers 500, not 404.

        **Use it to:**
        - Refresh one timesheet row after editing it
        - Follow a list row's self link

        **Not for:**
        - The write model of a registration (GUID, hourly rate, ...) → `GET /v1/time-registration/{timeRegistrationID}`

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Duplicates: n/a (read)
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v1/time-tracking-item/get-by-date`

        **See also:** `GET /v1/time-registration/{timeRegistrationID}`

        > **Not yet documented:** examples.
      parameters:
      - name: timeRegistrationID
        in: path
        required: true
        schema:
          type: integer
          format: int32
        description: The registration's integer ID (TimeRegistrationRead.TimeRegistrationID / list rows). A non-integer →
          404 route not found.
      responses:
        '200':
          description: |-
            The object, wrapped in the TAF envelope (`Properties`). TAF single envelope with a self link (and the 'start-time-tracker' action on project rows).

            Order: n/a (single object)
          content:
            application/json:
              schema:
                type: object
                description: 'TAF envelope: the object is in `Properties`. Null members are omitted; a null result is `{"Links":
                  [self]}` without `Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/TimeTrackingItemRead'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
                  Actions:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafAction'
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '404':
          description: '- The URL did not match any route (including a route constraint such as {id:int} receiving a non-integer).
            — When: timeRegistrationID is not an integer'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: Unknown ID (error)
                  value:
                    Code: 100
                    Details: []
                    Message: Unknown error occur in system, please contact system administrator.
                    Parameters: 'timeRegistrationID: 1'
                    Url: https://{region-node}.timelog.com/{account}/api/v1/time-tracking-item/1
      x-timelog-key: rest.v1.registration.timetrackingitem.get
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: |-
        OAuth 2.0 bearer token, sent as `Authorization: Bearer <token>`. JWT and reference tokens are both accepted. The token must carry the required scope (default `tlp`).

        The token's `sub` claim is the acting user. A token WITHOUT `sub` (client-credentials) acts as the system service user. If the `sub` user cannot log in (inactive, locked, deleted), the request is rejected with 401 — it is no longer let through without a user.

        > **Not yet documented:** how to obtain a token.

        > **Not yet documented:** token lifetime.
  schemas:
    MessageError:
      type: object
      description: Body of 401 and some framework errors — not the ResponseError shape.
      properties:
        Message:
          type: string
    ResponseError:
      type: object
      description: Error body for validation (400), privilege (403), business-rule (422/500) and other server errors. `Details`
        lists strings for validation errors, or `{ErrorCode, Message}` objects for business-rule violations. `Parameters`
        echoes the request arguments, including the full payload.
      properties:
        Code:
          type: integer
          description: 'TimeLog error class (not the HTTP status): 100 unexpected, 102 business rule, 103 privilege, 200 validation.'
        Message:
          type: string
        Details:
          type: array
          items: {}
        Parameters:
          type:
          - string
          - object
          - 'null'
        Url:
          type: string
    TafAction:
      type: object
      description: A hypermedia action the caller may take on the object. Present only where the operation registers actions.
    TafLink:
      type: object
      properties:
        Href:
          type: string
        Rel:
          type: string
    TafListPaging:
      type: object
      description: 'Paging values. They are returned as STRINGS, for example `"TotalRecord": "12"`.'
      properties:
        TotalRecord:
          type: string
        TotalPage:
          type: string
        PageNumber:
          type: string
    TimeTrackingItemExpandedDayRead:
      type: object
      properties:
        Date:
          type: string
          format: date-time
          readOnly: true
          description: |-
            The day (the registrations' Date with the time part removed).

            Date only — no time component.
        RegisteredHours:
          type: number
          format: double
          readOnly: true
          description: |-
            Sum of Hours of all registrations of the day (project time and absence).

            Unit: hours

            Contains personal data.
        NormHours:
          type: number
          format: double
          readOnly: true
          description: |-
            The employee's normal working hours for that day (NormalWorkingHours of the employee projection of the date; public holidays reduce it). 0 when there is no projection for the date.

            Unit: hours
        HoursDifference:
          type: number
          format: double
          readOnly: true
          description: |-
            RegisteredHours − NormHours for the day. Negative = under the norm.

            Unit: hours
        TaskInfos:
          type: array
          items:
            $ref: '#/components/schemas/TimeTrackingItemExpandedTaskRead'
          readOnly: true
          description: The day's registrations grouped by TaskID, ordered by TaskName. Project registrations form one group
            per task. ALL absence registrations of the day share ONE group (their TaskID is null), labelled with the first
            absence's code.
      description: 'One day of the employee''s week: the registrations of that day grouped by task, the hours registered,
        the employee''s norm hours for the day and the difference. Only exists for days that have registrations.'
    TimeTrackingItemExpandedRead:
      type: object
      properties:
        TotalRegisteredHours:
          type: number
          format: double
          readOnly: true
          description: |-
            Sum of Hours of every registration returned for the window — project time AND absence. Equal to the sum of the days' RegisteredHours.

            Unit: hours

            Contains personal data.
        TotalNormHours:
          type: number
          format: double
          readOnly: true
          description: |-
            The employee's normal (expected) working hours summed over ALL days of the window that have an employee projection — including days on which nothing was registered (those days are not in `Tasks`). So TotalNormHours is generally NOT the sum of the listed days' NormHours.

            Unit: hours

            > **Not yet documented:** description.
        TotalHoursDifference:
          type: number
          format: double
          readOnly: true
          description: |-
            TotalRegisteredHours − TotalNormHours. Negative = the employee registered less than the norm for the window.

            Unit: hours
        Tasks:
          type: array
          items:
            $ref: '#/components/schemas/TimeTrackingItemExpandedDayRead'
          readOnly: true
          description: One entry per DAY of the window that has at least one registration, ordered by date ascending. Days
            without registrations are omitted.
      description: 'The calling employee''s registrations for one 7-day window, grouped first by day and then by task, with
        the employee''s norm (expected) time per day and the difference. It is the data behind TimeLog''s weekly timesheet:
        "how much did I register each day, on what, and how far am I from my norm". Despite its name, `Tasks` is the list
        of DAYS. The object has no ID; it is identified by (caller, startDate).'
    TimeTrackingItemExpandedRegistrationRead:
      type: object
      properties:
        AllocatedHour:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          description: |-
            The hours the EMPLOYEE is allocated on the task — a per-employee, per-task budget figure, NOT the hours of this registration and NOT a remaining or used figure. 0 when the allocation has no hours; null on absence rows. Truncated to a whole number: the stored float is converted with Convert.ToInt32, which rounds to the nearest whole hour (ties to even). Identical on every registration of the same allocation.

            Unit: hours
        TimeRegistrationID:
          type: integer
          format: int32
          readOnly: true
          x-timelog-identity:
            role: primary_id
            unique_scope: tenant
            uniqueness_enforced: unknown
            id_format: int
          description: |-
            The registration's integer ID — the same ID TimeRegistrationRead exposes and GET /v1/time-tracking-item/{timeRegistrationID} takes. The registration's GUID is read but NOT exposed by this model.

            Identifier of this object, unique per TimeLog site.

            > **Not yet documented:** identity → uniqueness enforced.
        UserID:
          type: integer
          format: int32
          readOnly: true
          x-timelog-identity:
            role: reference
          description: |-
            The employee (user) who owns the registration.

            Refers to `UserRead.UserID`.

            Contains personal data.
        Created:
          type: string
          format: date-time
          readOnly: true
          description: |-
