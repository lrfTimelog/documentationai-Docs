openapi: 3.1.0
info:
  title: Users and organisation — REST API v1
  version: v1
  description: |-
    Read and create users, change a user's name, licence, roles and approval manager, and read legal entities, departments and daily employee norms.

    Enums are integers in v1.

    **Conventions that apply to every operation in this file:**
    - Property names are PascalCase.
    - Successful bodies use the TAF envelope: one object in `Properties`, lists in `Entities[].Properties`.
    - Some operations succeed without content: HTTP 200 with the literal body `null`, or HTTP 204.
    - `PUT` replaces the whole object: omitted fields are reset.
    - Treat error `Code` 102 as a business-rule violation, whether the HTTP status is 422 or 500.

    > **Not yet documented:** rate limits.
servers:
- url: https://{your-timelog-host}/{tlp-virtual-directory}/api
  description: 'Your TimeLog site. `your-timelog-host` is the host of your TimeLog site (Not yet documented: the production
    host pattern); `tlp-virtual-directory` is the virtual directory your TimeLog site is hosted under.'
  variables:
    your-timelog-host:
      default: your-timelog-host
    tlp-virtual-directory:
      default: your-virtual-directory
security:
- bearer: []
tags:
- name: Users and organisation
  description: Read and create users, change a user's name, licence, roles and approval manager, and read legal entities,
    departments and daily employee norms.
paths:
  /v1/department:
    get:
      operationId: listDepartments
      summary: List departments
      description: |-
        Lists every department of the tenant, active or not, ordered by name.

        Returns the whole department tree as a flat list; rebuild the hierarchy from ParentID (0 = top level). Inactive departments are included. There is no get-by-ID, filter or sort parameter, and the legal entity of a department is not returned.

        **Use it to:**
        - Choose the DepartmentID for a new user
        - Sync the organisation tree to an HR or BI system

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **Next:** `POST /v1/user/create`

        **See also:** `GET /v1/legal-entity`
      tags:
      - Users and organisation
      parameters:
      - name: $page
        in: query
        required: false
        schema:
          type: integer
          default: 1
        description: Page number.
      - name: $pagesize
        in: query
        required: false
        schema:
          type: integer
          default: 10
        description: Page size. No maximum enforced in the API layer.
      responses:
        '200':
          description: |-
            A list, wrapped in the TAF list envelope (`Entities[].Properties`). One page of departments. Entities carry no links.

            Paged with `$page` (default 1) and `$pagesize` (default 10).

            Order: Name ascending; no tie-breaker

            Empty result: 200 with no Entities
          content:
            application/json:
              schema:
                type: object
                description: 'TAF list envelope: each item is in `Entities[].Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/TafListPaging'
                  Entities:
                    type: array
                    description: Omitted (not `[]`) when the list is empty.
                    items:
                      type: object
                      properties:
                        Properties:
                          $ref: '#/components/schemas/DepartmentRead'
                        Links:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafLink'
                        Actions:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafAction'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v1.organization.department.list
  /v1/employee-projection/get-in-period:
    get:
      operationId: getEmployeeProjectionsInPeriod
      summary: List employee projections in a period
      description: |-
        Lists the per-day norm rows of the caller — or of every employee — between two dates.

        Returns one row per employee per day in [startDate, endDate] with the normal working time of the day and its status flags. By default only the caller's own rows are returned; with includeAllEmployees=true the rows of every employee. There is no parameter to pick one other employee. $expand=user adds the User object to each row.

        **Use it to:**
        - Compare registered hours with the norm per day (flex / under-registration checks)
        - Export expected working hours per employee to payroll or BI

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Consistency: eventual
        - Rows are pre-computed by TimeLog (projection generation); a change of normal working time or holidays shows up only after the projections are regenerated.

        **See also:** `GET /v1/user`, `GET /v1/time-registration/{timeRegistrationID}`

        > **Not yet documented:** behaviour → consistency detail; examples (success); request → query params → description.
      tags:
      - Users and organisation
      parameters:
      - name: startDate
        in: query
        required: true
        schema:
          type: string
          format: date-time
          x-timelog-filter:
            operators:
            - gte
        description: |-
          First day of the period (inclusive: Date >= startDate). Omitted -> 404 action-not-matched.

          Filters on `EmployeeProjectionRead.Date` (gte).
      - name: endDate
        in: query
        required: true
        schema:
          type: string
          format: date-time
          x-timelog-filter:
            operators:
            - lte
        description: |-
          Last day of the period (inclusive: Date <= endDate). Omitted -> 404 action-not-matched.

          Filters on `EmployeeProjectionRead.Date` (lte).
      - name: includeAllEmployees
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: false = only the caller's rows; true = every employee's rows.
      - name: $page
        in: query
        required: false
        schema:
          type: integer
          default: 1
        description: Page number.
      - name: $pagesize
        in: query
        required: false
        schema:
          type: integer
          default: 10
        description: Page size. No maximum enforced in the API layer.
      - name: $expand
        in: query
        required: false
        schema:
          type: string
          enum:
          - user
          x-enum-descriptions:
          - Add the User object (name, initials, e-mail …) to every row. Any other value makes the call fail with 500.
        description: |-
          Expansion. Only `user` is supported.

          Allowed values:

          | Value | Name | Meaning |
          |---|---|---|
          | `user` | user | Add the User object (name, initials, e-mail …) to every row. Any other value makes the call fail with 500. |
      responses:
        '200':
          description: |-
            A list, wrapped in the TAF list envelope (`Entities[].Properties`). One page of projection rows. Entities carry no links. User is present only with $expand=user.

            Paged with `$page` (default 1) and `$pagesize` (default 10).

            Order: ProjectionID descending (for one employee usually newest date first; not guaranteed)

            Empty result: 200 with no Entities (e.g. the system user under client credentials without includeAllEmployees)
          content:
            application/json:
              schema:
                type: object
                description: 'TAF list envelope: each item is in `Entities[].Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/TafListPaging'
                  Entities:
                    type: array
                    description: Omitted (not `[]`) when the list is empty.
                    items:
                      type: object
                      properties:
                        Properties:
                          $ref: '#/components/schemas/EmployeeProjectionRead'
                        Links:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafLink'
                        Actions:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafAction'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
        '400':
          description: '- **Code 200** — The request body or parameters failed input validation. — When: startDate / endDate
            / includeAllEmployees not parseable (Web API model binding) — Fix: Fix every item listed in Details and resend.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '404':
          description: '- The route matched a controller, but no action accepts the supplied query parameters — typically
            a required (non-nullable) simple parameter such as a DateTime was omitted. It is a missing-parameter error that
            looks like a 404. — When: startDate or endDate omitted (capture)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: Required dates omitted
                  value:
                    Message: No HTTP resource was found that matches the request URI 'https://{your-timelog-host}/{tlp-virtual-directory}/api/v1/employee-projection/get-in-period'.
                    MessageDetail: No action was found on the controller 'EmployeeProjection' that matches the request.
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v1.organization.employeeprojection.getinperiod
  /v1/legal-entity:
    get:
      operationId: listLegalEntities
      summary: List legal entities
      description: |-
        Lists every legal entity (company) of the tenant, active or not, ordered by ID.

        Returns all legal entities with their currency and default country. A tenant without the multi-company feature has exactly one (IsSystemLegalEntity true). No filter or sort parameter.

        **Use it to:**
        - Choose the LegalEntityID for a new user
        - Map TimeLog companies to the entities of an ERP / payroll system

        **Not for:**
        - Only the default company → `GET /v1/legal-entity/system`

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **Next:** `GET /v1/legal-entity/{legalEntityId}`, `POST /v1/user/create`

        **See also:** `GET /v1/legal-entity/system`, `GET /v1/currency/{status}`

        > **Not yet documented:** examples.
      tags:
      - Users and organisation
      parameters:
      - name: $page
        in: query
        required: false
        schema:
          type: integer
          default: 1
        description: Page number.
      - name: $pagesize
        in: query
        required: false
        schema:
          type: integer
          default: 10
        description: Page size. No maximum enforced in the API layer.
      responses:
        '200':
          description: |-
            A list, wrapped in the TAF list envelope (`Entities[].Properties`). One page of legal entities. Entities carry no links (the controller maps none).

            Paged with `$page` (default 1) and `$pagesize` (default 10).

            Order: LegalEntityID ascending

            Empty result: 200 with no Entities (not expected: every tenant has a system legal entity)
          content:
            application/json:
              schema:
                type: object
                description: 'TAF list envelope: each item is in `Entities[].Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/TafListPaging'
                  Entities:
                    type: array
                    description: Omitted (not `[]`) when the list is empty.
                    items:
                      type: object
                      properties:
                        Properties:
                          $ref: '#/components/schemas/LegalEntityRead'
                        Links:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafLink'
                        Actions:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafAction'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v1.organization.legalentity.list
  /v1/legal-entity/system:
    get:
      operationId: getSystemLegalEntity
      summary: Get the system legal entity
      description: |-
        Returns the tenant's system (default) legal entity.

        Returns the legal entity flagged IsSystemLegalEntity — the tenant's main company. When the multi-company feature (MultiLegalEntities) is off this is the only legal entity users can be created in.

        **Use it to:**
        - Get the LegalEntityID for user create on a single-company tenant
        - Read the tenant's base currency and country

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **Next:** `POST /v1/user/create`

        **See also:** `GET /v1/legal-entity`, `GET /v1/legal-entity/{legalEntityId}`

        > **Not yet documented:** behaviour → consistency detail.
      tags:
      - Users and organisation
      responses:
        '200':
          description: The object, wrapped in the TAF envelope (`Properties`). The system legal entity, with a self link to
            /v1/legal-entity/system.
          content:
            application/json:
              schema:
                type: object
                description: 'TAF envelope: the object is in `Properties`. Null members are omitted; a null result is `{"Links":
                  [self]}` without `Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/LegalEntityRead'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
                  Actions:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafAction'
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
      x-timelog-key: rest.v1.organization.legalentity.getsystem
  /v1/legal-entity/{legalEntityId}:
    get:
      operationId: getLegalEntity
      summary: Get a legal entity
      description: |-
        Returns one legal entity by its integer LegalEntityID.

        Returns the legal entity with its currency and default country. An unknown ID does NOT fail: it returns 200 with an empty object. Treat LegalEntityID 0 in the response as "not found".

        **Use it to:**
        - Resolve User.LegalEntityID to the company name and currency

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v1/legal-entity`

        **See also:** `GET /v1/legal-entity/system`
      tags:
      - Users and organisation
      parameters:
      - name: legalEntityId
        in: path
        required: true
        schema:
          type: integer
          format: int32
        description: LegalEntityID. The route has no {int} constraint; a non-integer gets 400.
      responses:
        '200':
          description: |-
            The object, wrapped in the TAF envelope (`Properties`). The legal entity, with a self link. For an unknown ID: an empty object.

            Empty result: Unknown ID -> 200 with LegalEntityID 0, ID 00000000-0000-0000-0000-000000000000, Name/CurrencyISO/CountryISO null
          content:
            application/json:
              schema:
                type: object
                description: 'TAF envelope: the object is in `Properties`. Null members are omitted; a null result is `{"Links":
                  [self]}` without `Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/LegalEntityRead'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
                  Actions:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafAction'
              examples:
                example1:
                  summary: Unknown ID (200 with an empty object)
                  value:
                    Properties:
                      LegalEntityID: 0
                      Name: null
                      IsActive: false
                      ID: 00000000-0000-0000-0000-000000000000
                      CurrencyID: 0
                      CurrencyISO: null
                      CountryISO: null
                      IsSystemLegalEntity: false
                    Links:
                    - Href: https://{your-timelog-host}/{tlp-virtual-directory}/api/v1/legal-entity/99999999
                      Rel: self
        '400':
          description: '- **Code 200** — The request body or parameters failed input validation. — When: legalEntityId is
            not an integer (''The value ''x'' is not valid for Int32.'') — Fix: Fix every item listed in Details and resend.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: Non-integer ID
                  value:
                    Code: 200
                    Details:
                    - The value 'not_an_integer' is not valid for Int32.
                    Message: Invalid model state error.
                    Parameters: 'legalEntityId: null'
                    Url: https://{your-timelog-host}/{tlp-virtual-directory}/api/v1/legal-entity/not_an_integer
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
      x-timelog-key: rest.v1.organization.legalentity.get
  /v1/user:
    get:
      operationId: listUsers
      summary: List users
      description: |-
        Lists every user of the tenant, ordered by first name, one page at a time.

        Returns all rows of the user table, active and inactive, including TimeLog's technical users (SYSTEM, ECNuser — UserType ApiUser) and anonymized former employees. There is no filter, search or sort parameter: filter on IsActive and UserType on your side. The model carries only identifiers, name, initials, e-mail, active flag, user type and legal entity.

        **Use it to:**
        - Initial sync of users into an HR, payroll or BI system
        - Map initials or e-mail to the UserID needed by time registrations

        **Not for:**
        - The caller's own user → `GET /v1/user/me`

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.
        - Reads the user tables directly (no read model or cache).

        **Next:** `GET /v1/user/{id}`, `PUT /v1/user`

        **See also:** `GET /v1/user/me`, `GET /v1/legal-entity`
      tags:
      - Users and organisation
      parameters:
      - name: $page
        in: query
        required: false
        schema:
          type: integer
          default: 1
        description: Page number.
      - name: $pagesize
        in: query
        required: false
        schema:
          type: integer
          default: 10
        description: Page size. No maximum enforced in the API layer.
      responses:
        '200':
          description: |-
            A list, wrapped in the TAF list envelope (`Entities[].Properties`). One page of users. Each entity has a self link to GET /v1/user/{UserID}.

            Paged with `$page` (default 1) and `$pagesize` (default 10).

            Order: FirstName ascending; no tie-breaker

            Empty result: 200 with no Entities (not reachable in practice: the technical users always exist)
          content:
            application/json:
              schema:
                type: object
                description: 'TAF list envelope: each item is in `Entities[].Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/TafListPaging'
                  Entities:
                    type: array
                    description: Omitted (not `[]`) when the list is empty.
                    items:
                      type: object
                      properties:
                        Properties:
                          $ref: '#/components/schemas/UserRead'
                        Links:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafLink'
                        Actions:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafAction'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v1.organization.user.list
    put:
      operationId: updateUser
      summary: Update a user
      description: |-
        Changes a user's name, licence type, extra roles and approval manager, addressed by the user's GUID.

        Updates first and last name, the licence type (with the role changes it implies), adds roles, and sets a new approval manager from a given day. FirstName and LastName are ALWAYS written: omit them and the stored names are cleared, so always send both. Nothing else about the user can be changed through REST v1. The call returns 200 with body `null` even when the save reported a problem and nothing was changed: read the user back to confirm.

        **Use it to:**
        - Keep names in sync from an HR system
        - Move an employee to a new approval manager from a given date
        - Change a user's licence type (Standard / Limited / TimeExpense)

        **Not for:**
        - E-mail, department, legal entity, dates, rates — not changeable in REST v1

        **Rules across fields:**
        - R1: ApprovalManagerInitials and ApprovalManagerStartDate are sent together or not at all.
        - R2: UserRoleIDs may be non-empty only when UserLicenseType is sent as 2 (Standard) in the same body.

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Side effect: Saves the user and profile; deletes and re-inserts ALL of the user's roles and modules
        - Side effect: On a licence change: removes system roles and modules (to Limited/TimeExpense) or the licence-specific roles (to Standard)
        - Side effect: Refreshes the platform licence status and the allocation-search denormalisation
        - On failure: The user save and the approval-manager change are separate steps: a failure in the second leaves the first committed
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v1/user/{id}`, `GET /v1/user`

        **Next:** `GET /v1/user/{id}`

        > **Not yet documented:** behaviour → events emitted; examples (success).
      tags:
      - Users and organisation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate.update'
      responses:
        '200':
          description: 'Success without content: HTTP 200 with the literal JSON body `null`. Literal JSON `null`. Returned
            also when the save reported violations and nothing was stored.'
          content:
            application/json:
              schema:
                type: 'null'
        '400':
          description: '- **Code 200** — The request body or parameters failed input validation. — When: R1, R2, licence type
            not allowed, approval manager not a valid approver (see UserUpdate) — Fix: Fix every item listed in Details and
            resend.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '500':
          description: |-
            - **Code 100** — Unhandled server error.

            - **Code 102** — The request is well-formed but violates a TimeLog business rule. — When: Any business rule on the whole stored user — e.g. it now violates a rule that did not exist when it was created (EmployeeNo required, …); role checks; a role that cannot be removed on a licence change

            - **Code 20012** — The caller (not the system user) lacks an employee privilege covering the target user — 'all employees', 'employees in my department and sub-departments' (target in the caller's department tree, when Departments is on) or 'all employees in my legal entity' (same legal entity, when MultiLegalEntities is on) — combined with the Create OR Edit action. {1} lists the missing privileges joined by " or ". — Fix: Use a user with an employee privilege that covers the target's department / legal entity, or a client-credentials token.

            - **Code 20022** — Another active user has the same user name or the same initials. — When: The stored user name / initials collide with another active user — Fix: Choose another user name and initials.

            - **Code 37037** — A UserRoleIDs entry is not an existing role.

            - **Code 37930** — A UserRoleIDs entry is another employee's personal role.

            - **Code 37929** — A UserRoleIDs entry is a locked system role.

            - **Code 37926** — A UserRoleIDs entry is an inactive role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: Empty body
                  value:
                    Code: 100
                    Details: []
                    Message: Unknown error occur in system, please contact system administrator.
                    Parameters: 'user: {"ID":"00000000-0000-0000-0000-000000000000","FirstName":null,"LastName":null,"ApprovalManagerInitials":null,"ApprovalManagerStartDate":null,"UserLicenseType":null,"UserRoleIDs":null}'
                    Url: https://{your-timelog-host}/{tlp-virtual-directory}/api/v1/user
      x-timelog-key: rest.v1.organization.user.update
  /v1/user/create:
    post:
      operationId: createUser
      summary: Create a user
      description: |-
        Creates an active user (employee) with its HR settings and returns it.

        Creates the login and the employee profile in one call: name, initials, e-mail, legal entity, department, approval manager, rates, calendar, working time, salary group, licence type and extra roles. The new user is active immediately; time zone, language and front page come from tenant defaults. Run `POST /v1/user/validate-new-user` first to get every rule violation without side effects. The response is the User representation, which does not echo most of what was sent.

        **Use it to:**
        - Provision new hires from an HR or identity system

        **Not for:**
        - Changing an existing user → `PUT /v1/user` (name, licence, roles, approval manager only)

        **Rules across fields:**
        - R1: UserRoleIDs must be null or empty unless UserLicenseType is Standard (2).
        - R2: StandardHourlyRateID and CostPriceID must belong to LegalEntityID.
        - R3: Neither UserName nor Initials may be used by another user, active or inactive.

        **Behaviour:**
        - Not idempotent.
        - Safe to retry only under a condition. A retry after a timeout fails with 20022 if the first call succeeded — check user.list for the initials before retrying.
        - Duplicates: UserName and Initials must be unused (application check, 20022/20024); nothing else is deduplicated.
        - Side effect: Inserts the user, its profile, its personal (employee-specific) role and the licence's system role or the requested roles, default page settings and predefined filter views
        - Side effect: Sets an initial login credential for the user
        - Side effect: Creates the cost-price drill-down rows and refreshes the platform licence status
        - Side effect: Updates the allocation-search denormalisation (a failure here is logged and ignored)
