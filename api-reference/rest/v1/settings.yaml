openapi: 3.1.0
info:
  title: Settings — REST API v1
  version: v1
  description: |-
    Enums are integers in v1.

    **Conventions that apply to every operation in this file:**
    - Property names are PascalCase.
    - Successful bodies use the TAF envelope: one object in `Properties`, lists in `Entities[].Properties`.
    - Some operations succeed without content: HTTP 200 with the literal body `null`, or HTTP 204.
    - `PUT` replaces the whole object: omitted fields are reset.
    - Treat error `Code` 102 as a business-rule violation, whether the HTTP status is 422 or 500.

    > **Not yet documented:** rate limits.
servers:
- url: https://{region-node}.timelog.com/{account}/api
  description: 'Your TimeLog site. Copy both values from the address bar when you are signed in to TimeLog: `region-node`
    is the first part of the host name (for example `app3` in `app3.timelog.com`), `account` is the first path segment after
    it.'
  variables:
    region-node:
      default: app3
    account:
      default: your-account
security:
- bearer: []
paths:
  /v1/barrier:
    get:
      operationId: getBarriers
      summary: List barrier types
      description: |-
        Barriers are the tenant-wide list of reasons that hold back a sales OPPORTUNITY (system administration → "Barrier management in TimeLog CRM"). They are not period or registration locks and block nothing. The Reporting API (GetBarriersShortlist) reads the same table and is the working alternative.

        **Not for:**
        - Locking time registration — barriers have nothing to do with it

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **Next:** `PUT /v1/barrier`, `DELETE /v1/barrier/{id}`

        > **Not yet documented:** response → default ordering.
      responses:
        '200':
          description: |-
            A list, wrapped in the TAF list envelope (`Entities[].Properties`). As coded: every barrier, unpaged, with self links and add / delete actions.

            Order: not yet documented.

            Empty result: not yet documented.
          content:
            application/json:
              schema:
                type: object
                description: 'TAF list envelope: each item is in `Entities[].Properties`.'
                properties:
                  Entities:
                    type: array
                    description: Omitted (not `[]`) when the list is empty.
                    items:
                      type: object
                      properties:
                        Properties:
                          $ref: '#/components/schemas/BarrierRead'
                        Links:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafLink'
                        Actions:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafAction'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
        '401':
          description: '- Missing, invalid or expired bearer token. — When: No or invalid bearer token (captured). — Fix:
            Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: Example
                  value:
                    Code: 100
                    Details: []
                    Message: Unknown error occur in system, please contact system administrator.
                    Parameters: ''
                    Url: https://{region-node}.timelog.com/{account}/api/v1/barrier
      x-timelog-key: rest.v1.settings.barrier.list
    post:
      operationId: createBarrier
      summary: Create a barrier type
      description: |-
        Adds a reason that can be attached to sales opportunities. Do not retry blindly — check the Reporting API's barrier list.

        **Use it to:**
        - Seed the CRM barrier list of a new tenant

        **Behaviour:**
        - Not idempotent.
        - Not safe to retry blindly. A 500 may follow a committed insert. Retrying with the SAME Id fails on the unique GUID (no duplicate); with a new Id it creates a duplicate.
        - Duplicates: Names are not deduplicated; the caller-supplied Id is unique (database constraint).
        - Side effect: Inserts the barrier and raises BarrierCreated; clears the barrier cache.
        - Changes are visible to the next read immediately.

        **Next:** `PUT /v1/barrier`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BarrierCreate'
      responses:
        '200':
          description: |-
            The object, wrapped in the TAF envelope (`Properties`). As coded: the new barrier.

            Order: none

            Empty result: none
          content:
            application/json:
              schema:
                type: object
                description: 'TAF envelope: the object is in `Properties`. Null members are omitted; a null result is `{"Links":
                  [self]}` without `Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/BarrierRead'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
                  Actions:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafAction'
        '400':
          description: '- **Code 200** — The request body or parameters failed input validation. — When: Name missing or empty
            (captured). — Fix: Fix every item listed in Details and resend.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: Empty body (captured)
                  value:
                    Code: 200
                    Details:
                    - '''Name'' must not be empty.'
                    Message: Invalid model state error.
                    Parameters: 'barrier: {"Id":"00000000-0000-0000-0000-000000000000","Name":null}'
                    Url: https://{region-node}.timelog.com/{account}/api/v1/barrier
        '401':
          description: '- Missing, invalid or expired bearer token. — When: No or invalid bearer token (captured). — Fix:
            Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v1.settings.barrier.create
    put:
      operationId: updateBarrier
      summary: Rename a barrier type
      description: |-
        Renames a CRM barrier type identified by its GUID.

        Changes the display name of a barrier; opportunities keep referencing it by BarrierID, so the new name shows everywhere at once. The active state is kept (it cannot be changed through the API). Sending the current name writes nothing.

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Side effect: Updates the name (and LastModified / LastModifiedBy) and raises BarrierUpdated — only when the name differs.
        - Changes are visible to the next read immediately.

        **See also:** `GET /v1/barrier`

        > **Not yet documented:** examples.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BarrierUpdate'
      responses:
        '200':
          description: |-
            Success without content: HTTP 200 with the literal JSON body `null`. Literal JSON `null` (TafSuccessResult).

            Order: none

            Empty result: none
          content:
            application/json:
              schema:
                type: 'null'
        '401':
          description: '- Missing, invalid or expired bearer token. — When: No or invalid bearer token (captured). — Fix:
            Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '500':
          description: |-
            - **Code 100** — Unhandled server error.

            - **Code 60015** — Name missing or blank on an update. Raised by the domain check, because these update bodies have no working request validator. — When: Name missing or blank (no request validator). — Fix: Always send the full Name on update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: Empty body (captured)
                  value:
                    Code: 100
                    Details: []
                    Message: Unknown error occur in system, please contact system administrator.
                    Parameters: 'barrierApi: {"Id":"00000000-0000-0000-0000-000000000000","Name":null}'
                    Url: https://{region-node}.timelog.com/{account}/api/v1/barrier
      x-timelog-key: rest.v1.settings.barrier.update
  /v1/barrier/{barrierId}:
    get:
      operationId: getBarrier
      summary: Get a barrier type
      description: |-
        Would resolve a BarrierID (as stored on opportunities) to the barrier's GUID and name. Note the id mismatch of this controller: this read takes the integer BarrierID, while update and delete take the GUID Id.

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **See also:** `GET /v1/barrier`
      parameters:
      - name: barrierId
        in: path
        required: true
        schema:
          type: integer
          format: int32
        description: |-
          BarrierRead.BarrierID (integer), not the GUID.

          Refers to `BarrierRead.BarrierID`. Look up valid values with `GET /v1/barrier`.
      responses:
        '200':
          description: |-
            The object, wrapped in the TAF envelope (`Properties`). As coded: the barrier with a self link and the add / delete actions.

            Order: none

            Empty result: not yet documented.
          content:
            application/json:
              schema:
                type: object
                description: 'TAF envelope: the object is in `Properties`. Null members are omitted; a null result is `{"Links":
                  [self]}` without `Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/BarrierRead'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
                  Actions:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafAction'
        '401':
          description: '- Missing, invalid or expired bearer token. — When: No or invalid bearer token (captured). — Fix:
            Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '404':
          description: '- The URL did not match any route (including a route constraint such as {id:int} receiving a non-integer).
            — When: barrierId not an integer (captured).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: Example
                  value:
                    Code: 100
                    Details: []
                    Message: Unknown error occur in system, please contact system administrator.
                    Parameters: 'barrierId: 1'
                    Url: https://{region-node}.timelog.com/{account}/api/v1/barrier/1
      x-timelog-key: rest.v1.settings.barrier.get
  /v1/barrier/{id}:
    delete:
      operationId: deleteBarrier
      summary: Delete a barrier type
      description: |-
        Permanently deletes a CRM barrier type that no opportunity uses, by its GUID.

        Hard delete. Refused (30118) while any opportunity lists the barrier. The id is the barrier's GUID (Id), not the integer BarrierID.

        **Behaviour:**
        - Not idempotent.
        - Safe to retry only under a condition. A repeat after success hits an unknown id (500 Code 100).
        - Changes are visible to the next read immediately.

        **See also:** `GET /v1/barrier`

        > **Not yet documented:** examples.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: |-
          BarrierRead.Id (GUID).

          Refers to `BarrierRead.Id`. Look up valid values with `GET /v1/barrier`.
      responses:
        '200':
          description: |-
            Success without content: HTTP 200 with the literal JSON body `null`. Literal JSON `null` (TafSuccessResult).

            Order: none

            Empty result: none
          content:
            application/json:
              schema:
                type: 'null'
        '401':
          description: '- Missing, invalid or expired bearer token. — When: No or invalid bearer token (captured). — Fix:
            Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '405':
          description: '- The route matched, but no action for this HTTP method accepted the request. Observed when a DELETE
            that needs required (non-nullable) query parameters is sent without them: the versioning layer reports it as an
            unsupported version / method, although the method is listed in the Allow header. It is a missing-parameter error
            that looks like a 405. Returned before authentication (also without a token). — When: id is not a GUID (captured).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '500':
          description: |-
            - **Code 30118** — At least one opportunity lists the barrier. Also returned when the attachment count cannot be read (the generic data error is replaced by 30118). — When: An opportunity lists the barrier. — Fix: Remove the barrier from those opportunities first (TimeLog CRM UI).

            - **Code 100** — Unhandled server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: Unknown GUID (captured)
                  value:
                    Code: 100
                    Details: []
                    Message: Unknown error occur in system, please contact system administrator.
                    Parameters: 'id: "00000000-0000-0000-0000-000000000001"'
                    Url: https://{region-node}.timelog.com/{account}/api/v1/barrier/00000000-0000-0000-0000-000000000001
      x-timelog-key: rest.v1.settings.barrier.delete
  /v1/car:
    get:
      operationId: getCars
      summary: List my cars
      description: |-
        Lists the active cars the caller may register mileage with — the caller's own private cars plus the company cars of the caller's legal entity.

        The car picker for a mileage registration. Returns, for the caller's legal entity, every ACTIVE company car and every ACTIVE private car owned by the caller, ordered by name and paged. Other employees' private cars are never listed, not even for administrators — this is "my cars", not a car register. IsDefault marks the caller's own default car.

        **Use it to:**
        - Populate the car choice before `POST /v1/mileage-registration` (send the chosen CarID)

        **Not for:**
        - Listing all cars of the tenant or of another employee (no such operation in REST v1)

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **Next:** `POST /v1/mileage-registration`, `GET /v1/car/{id}`

        **See also:** `GET /v1/car/default`

        > **Not yet documented:** request → query params → $expand.
      parameters:
      - name: $page
        in: query
        required: false
        schema:
          type: integer
          default: 1
        description: Page number (1-based).
      - name: $pagesize
        in: query
        required: false
        schema:
          type: integer
          default: 10
        description: Page size. No maximum enforced in the API layer.
      - name: $expand
        in: query
        required: false
        schema:
          type: string
          enum:
          - owner
          - mileagerate
          x-enum-descriptions:
          - Fill EmployeeUser (the owner's user record, incl. e-mail) on private cars.
          - Fill DefaultMileageRate (the car's default mileage rate).
        description: |-
          Optional expansions; each value becomes procedure parameter Expand<Value>. Any other value adds a parameter the procedure does not declare (error not tested).

          Several values: one string, separated by `,`.

          Allowed values:

          | Value | Name | Meaning |
          |---|---|---|
          | `owner` | owner | Fill EmployeeUser (the owner's user record, incl. e-mail) on private cars. |
          | `mileagerate` | mileagerate | Fill DefaultMileageRate (the car's default mileage rate). |
      responses:
        '200':
          description: |-
            A list, wrapped in the TAF list envelope (`Entities[].Properties`). One page. Properties: TotalRecord, TotalPage, PageNumber (strings). Each entity has a self link (/v1/car/{CarID}).

            Paged with `$page` (default 1) and `$pagesize` (default 10).

            Order: Name ascending (fixed)

            Empty result: 200 with no Entities
          content:
            application/json:
              schema:
                type: object
                description: 'TAF list envelope: each item is in `Entities[].Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/TafListPaging'
                  Entities:
                    type: array
                    description: Omitted (not `[]`) when the list is empty.
                    items:
                      type: object
                      properties:
                        Properties:
                          $ref: '#/components/schemas/CarRead'
                        Links:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafLink'
                        Actions:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafAction'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
        '401':
          description: '- Missing, invalid or expired bearer token. — When: No or invalid bearer token (captured). — Fix:
            Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v1.settings.car.list
    post:
      operationId: createCar
      summary: Create my private car
      description: |-
        Registers a new private car owned by the caller and returns it.

        Adds a car the caller can use on their own mileage registrations. The server fixes everything except the name, plate and default flag: type Private, owner = the caller, the caller's legal entity, active, the legal entity's default mileage rate for private cars, and "employee may change the rate" off. A car for another employee or a company car cannot be created through the API (use the TimeLog car administration page). Plates are not checked for duplicates.

        **Use it to:**
        - Self-service: an employee adds their own car from a mobile mileage app

        **Not for:**
        - Creating company cars or cars for other employees

        **Behaviour:**
        - Not idempotent.
        - Not safe to retry blindly. Each call creates another car (new GUID, no duplicate check). After a lost response, check `GET /v1/car` before retrying.
        - Duplicates: Not deduplicated (no unique constraint on name or plate).
        - Side effect: Inserts the car and raises CarCreated.
        - Side effect: IsDefault true: the caller's default-car user setting now points to the new car.
        - Changes are visible to the next read immediately.

        **Next:** `POST /v1/mileage-registration`

        **See also:** `GET /v1/car`, `GET /v1/mileage-rate`

        > **Not yet documented:** examples.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CarCreate'
      responses:
        '200':
          description: |-
            The object, wrapped in the TAF envelope (`Properties`). The new car (read back by its CarID), with a self link.

            Order: none

            Empty result: none
          content:
            application/json:
              schema:
                type: object
                description: 'TAF envelope: the object is in `Properties`. Null members are omitted; a null result is `{"Links":
                  [self]}` without `Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/CarRead'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
                  Actions:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafAction'
        '400':
          description: '- **Code 200** — The request body or parameters failed input validation. — When: Name or LicensePlate
            missing / empty (captured). — Fix: Fix every item listed in Details and resend.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: Empty body (captured)
                  value:
                    Code: 200
                    Details:
                    - '''Name'' must not be empty.'
                    - '''License Plate'' must not be empty.'
                    Message: Invalid model state error.
                    Parameters: 'model: {"Name":null,"LicensePlate":null,"IsDefault":false}'
                    Url: https://{region-node}.timelog.com/{account}/api/v1/car
        '401':
          description: '- Missing, invalid or expired bearer token. — When: No or invalid bearer token (captured). — Fix:
            Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '500':
          description: |-
            - **Code 37937** — The caller's legal entity has no mileage rate marked as default for private cars, so the new car cannot get a rate. — When: The caller's legal entity has no default private-car mileage rate. — Fix: An administrator marks a mileage rate of the legal entity as default for private cars (Settings → Mileage rates; IsDefaultForPrivateCar in GET /v1/mileage-rate).

            - **Code 37832** — The private car's default mileage rate is not a reimbursed rate (HasReimbursement false). On create: the legal entity's default rate for private cars is not reimbursed. — When: That default rate is not reimbursed. — Fix: An administrator makes the default private-car rate a reimbursed rate.

            - **Code 100** — Unhandled server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v1.settings.car.create
    put:
      operationId: updateCar
      summary: Update a car
      description: |-
        Renames a car, changes its plate and sets or clears it as the caller's default car; returns the car.

        Ordinary users can update only their OWN private cars. Users with access to the car administration page can update any car of the tenant (other employees' private cars and company cars). Name and LicensePlate are always overwritten, so send both. Owner, type, active state and mileage rate are not changeable here. IsDefault acts on the CALLER's default-car setting, even when the car belongs to someone else.

        **Use it to:**
        - Employee corrects the plate of their car
        - Make a car the caller's default for mileage registrations

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Side effect: Updates Name and LicensePlate (always written, even when unchanged) and raises CarUpdated.
        - Side effect: IsDefault true → the caller's default car becomes this car; false (or omitted) → clears the caller's default if it was this car.
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v1/car`

        **See also:** `GET /v1/car/default`

        > **Not yet documented:** examples.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CarUpdate'
      responses:
        '200':
          description: |-
            The object, wrapped in the TAF envelope (`Properties`). The car after the update, with a self link.

            Order: none

            Empty result: none
          content:
            application/json:
              schema:
                type: object
                description: 'TAF envelope: the object is in `Properties`. Null members are omitted; a null result is `{"Links":
                  [self]}` without `Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/CarRead'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
                  Actions:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafAction'
        '401':
          description: '- Missing, invalid or expired bearer token. — When: No or invalid bearer token (captured). — Fix:
            Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '500':
          description: |-
            - **Code 100** — Unhandled server error.

            - **Code 37833** — The caller has no access to the system-administration page for cars and the car is either another employee's private car or a company car. — When: Not the caller's own private car and no car-administration page access. — Fix: Change only your own private cars, or use a user whose role grants the car administration page.

            - **Code 60015** — Name missing or blank on an update. Raised by the domain check, because these update bodies have no working request validator. — When: Name missing or blank. — Fix: Always send the full Name on update.

            - **Code 60109** — LicensePlate missing or blank on update (domain check; on create the request validator answers 400 instead). — When: LicensePlate missing or blank. — Fix: Always send the full LicensePlate on update.

            - **Code 37832** — The private car's default mileage rate is not a reimbursed rate (HasReimbursement false). On create: the legal entity's default rate for private cars is not reimbursed. — When: A private car whose default rate has meanwhile lost its reimbursement. — Fix: An administrator makes the default private-car rate a reimbursed rate.

            - **Code 37844** — Saving an ACTIVE private car whose owner is deactivated. (Deactivating a user normally deactivates the user's private cars, so this needs data out of step.) — When: Active private car of a deactivated owner. — Fix: Reactivate the owner, or leave the car unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: Empty body (captured)
                  value:
                    Code: 100
                    Details: []
                    Message: Unknown error occur in system, please contact system administrator.
                    Parameters: 'carApiUpdateModel: {"CarID":0,"Name":null,"LicensePlate":null,"IsDefault":false}'
                    Url: https://{region-node}.timelog.com/{account}/api/v1/car
      x-timelog-key: rest.v1.settings.car.update
  /v1/car/default:
    get:
      operationId: getDefaultCar
      summary: Get my default car
      description: |-
        Returns the caller's default car — the car preselected on the caller's new mileage registrations.

        The default car is a per-user setting (not a property of the car). It is set with IsDefault true on car create or update, or in the user's settings in the UI. If the stored car no longer exists the setting is treated as empty. With no default car the call still answers 200, with "Properties": null.

        **Use it to:**
        - Preselect the car in a mobile mileage form

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **Next:** `POST /v1/mileage-registration`

        **See also:** `GET /v1/car`, `PUT /v1/car`

        > **Not yet documented:** purpose → description; response → empty result.
      parameters:
      - name: $expand
        in: query
        required: false
        schema:
          type: string
          enum:
          - owner
          - mileagerate
          x-enum-descriptions:
          - Fill EmployeeUser.
          - Fill DefaultMileageRate.
        description: |-
          Same expansions as the integer get (the default car is read through it).

          Several values: one string, separated by `,`.

          Allowed values:

          | Value | Name | Meaning |
          |---|---|---|
