  /v1/feature:
    put:
      operationId: updateFeature
      summary: Switch a tenant feature on or off
      description: |-
        Turns one tenant-wide feature flag on or off (internal client only).

        TENANT-WIDE CONFIGURATION WRITE. A feature is an on/off switch that changes TimeLog's behaviour for every user of the tenant. Examples: CurrencyMatrix (whether amounts are converted through the currency matrix, Settings service), UniqueCustomerNumber (customer-number uniqueness on customer create / update, CRM), ContractTypeIsRequired (contract creates, ProjectManagement), MandatoryComment (registration / absence comments, TimeRegistration and Salary), InvoiceMultilingual / OIOXML (customer invoice settings, CRM), MultiLegalEntities / Departments (user create rules, Organization), BillableOnTime (registration billable flag, TimeRegistration), AllocationDates (allocation dates, ProjectManagement). Only callable with a JWT issued to the OAuth client 'uitestmobile'. Setting a feature to its current value does nothing and still returns 200. A real change is validated, written, and then triggers the feature's side effects — some of which rewrite tenant data (see behaviour).

        **Use it to:**
        - Internal UI / test automation (client 'uitestmobile') switching features on a test tenant

        **Not for:**
        - Integrations: the operation rejects every other OAuth client (400).
        - Changing a typed tenant setting (number, date, enum) → `PUT /v1/setting`

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Duplicates: Same value again = no write, no events, 200.
        - Side effect: Writes the feature value for the whole tenant; invalidates the cached system configuration.
        - Side effect: Feature-specific pre / post actions, e.g.: StopwatchTimeTracking (pre-change handling of running timers); SalaryAccounts / approval features (menus, process and user caches flushed); SalaryGroups / SalarySpecification (may switch further features and change the system salary group's salary type); AllocationDates OFF (rewrites the dates of EVERY allocation to its task's dates — not reversible by switching back); CopyWeek (menus); NewResourcePlanner ON (publishes the Resource Planner onboarding event).
        - Side effect: Dependent settings / templates updated, e.g. export types (Pdf / Xml / MSExcel / MSWord / TextFile), invoice print-template recipient fields (CustomerSalutation / Initials / ProfessionalTitle1-2), password rules (AdvancedPasswordSecurity), project sub-contract features.
        - Side effect: Post actions run TWICE per call — e.g. the onboarding event is published twice.

        **See also:** `PUT /v1/setting`

        > **Not yet documented:** behaviour → consistency; behaviour → side effects; examples (success).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeatureUpdate.update'
      responses:
        '200':
          description: 'Success without content: HTTP 200 with the literal JSON body `null`. Literal JSON `null` — also when
            the value was already set (no-op).'
          content:
            application/json:
              schema:
                type: 'null'
        '400':
          description: '- The bearer token is a JWT whose client_id claim is not ''uitestmobile''. These two operations accept
            only that OAuth client. — When: JWT of another OAuth client — Fix: None for integrations: the operations are internal.
            Use the TimeLog UI to change features and settings.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '401':
          description: '- Missing, invalid or expired bearer token. — When: uitestmobile JWT that fails normal authentication
            — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '500':
          description: |-
            - Raised before authentication, so a request with no token gets 500, not 401. The body discloses the exception, stack trace and server source paths. — When: No Authorization header, or a non-JWT token (captured) — Fix: Not callable with a non-JWT token.

            - **Code 100** — Also: a feature defined with a null page list (e.g. CRM, UsePostEvents). — When: ValidateFeatureForUser violations; feature with a null page list — Fix: Change the feature in the TimeLog UI, where the reason is shown.

            - **Code 100** — Unhandled server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v1.settings.feature.update
  /v1/setting:
    put:
      operationId: updateSetting
      summary: Change a tenant setting
      description: |-
        Changes one typed tenant-wide setting (internal client only).

        TENANT-WIDE CONFIGURATION WRITE. A setting is a typed configuration value (number, date, enum, text) that applies to the whole tenant, as opposed to an on/off feature (`PUT /v1/feature`). Only callable with a JWT issued to the OAuth client 'uitestmobile'. Every call writes — there is no "unchanged" short-cut — after validation.

        **Use it to:**
        - Internal UI / test automation (client 'uitestmobile') configuring a test tenant

        **Not for:**
        - Integrations: the operation rejects every other OAuth client (400).
        - On/off feature flags → `PUT /v1/feature`

        **Rules across fields:**
        - R1: With an e-conomic integration active: InvoiceSetting_NumberOfDecimals must be 2 and InvoiceSetting_RoundTotals must be no rounding; InvoiceSetting_ExportType = export-and-e-mail needs InvoiceSetting_ExportEmail set.

        **Behaviour:**
        - Safe to retry only under a condition.
        - Duplicates: Not short-circuited: re-sending the same value rewrites it and raises the events again.
        - Side effect: Writes the sanitised value for the whole tenant, then invalidates the cached system configuration.
        - Side effect: Setting-specific post actions, e.g. CustomerDefaultCountry, TimeRegistrationPotentialTypeColumn, DefaultTimeSheetViewForNewUsers; FlexTruncationDate 1 (Today) / 2 (Yesterday) raises the events that create / delete today's flex postings for employees.

        **See also:** `PUT /v1/feature`

        > **Not yet documented:** behaviour → consistency; behaviour → idempotent; examples (success).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingUpdate.update'
      responses:
        '200':
          description: 'Success without content: HTTP 200 with the literal JSON body `null`. Literal JSON `null`.'
          content:
            application/json:
              schema:
                type: 'null'
        '400':
          description: '- The bearer token is a JWT whose client_id claim is not ''uitestmobile''. These two operations accept
            only that OAuth client. — When: JWT of another OAuth client — Fix: None for integrations: the operations are internal.
            Use the TimeLog UI to change features and settings.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '401':
          description: '- Missing, invalid or expired bearer token. — When: uitestmobile JWT that fails normal authentication
            — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '500':
          description: |-
            - Raised before authentication, so a request with no token gets 500, not 401. The body discloses the exception, stack trace and server source paths. — When: No Authorization header, or a non-JWT token — Fix: Not callable with a non-JWT token.

            - **Code 100** — When: ValidateSettingForUser violations (incl. R1) — Fix: Change the setting in the TimeLog UI, where the reason is shown.

            - **Code 100** — Unhandled server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
