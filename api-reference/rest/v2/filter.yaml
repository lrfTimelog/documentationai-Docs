        UserId:
          type: integer
          format: int32
          readOnly: true
          x-timelog-identity:
            role: reference
          description: |-
            UserID (not EmployeeID) of the view's owner. Always the caller on GET, which only returns the caller's own views.

            Refers to `UserRead.UserID`.
        IsDefault:
          type: boolean
          readOnly: true
          description: true = the view the page opens with for this user. Writes keep at most one default per (user, page);
            predefined views mark MyActiveProjects / MyView as default.
        Created:
          type: string
          format: date-time
          readOnly: true
          description: |-
            When the view was created.

            Time zone: server local time (DateTime.Now on the TimeLog web server), no offset in the value

            > **Not yet documented:** constraints → timezone.
        CreatedBy:
          type: integer
          format: int32
          readOnly: true
          x-timelog-identity:
            role: reference
          description: |-
            EmployeeID (not UserID) of whoever created the view — the caller for API creates; the system user's employee for predefined views made without a session user.

            Refers to `EmployeeRead.EmployeeID`.
        LastModified:
          type: string
          format: date-time
          readOnly: true
          description: |-
            When the view was last written (create or update).

            Time zone: server local time (DateTime.Now on the TimeLog web server), no offset in the value

            > **Not yet documented:** constraints → timezone.
        LastModifiedBy:
          type: integer
          format: int32
          readOnly: true
          x-timelog-identity:
            role: reference
          description: |-
            EmployeeID of whoever last wrote the view (stored in an NCHAR(10) column, returned as an integer).

            Refers to `EmployeeRead.EmployeeID`.
        FilterValues:
          type: array
          items:
            $ref: '#/components/schemas/FilterValueRead'
          readOnly: true
          description: |-
            The values the view restores.

            > **Not yet documented:** multiple → order significant.

            > **Not yet documented:** multiple.
      description: Per user and per page; at most one default per (user, page) is maintained on write.
    FilterViewUpdate:
      type: object
      properties:
        FilterViewId:
          type: integer
          format: int32
          x-timelog-identity:
            role: primary_id
            unique_scope: tenant
            uniqueness_enforced: true
            id_format: int
          description: |-
            The view to overwrite (FilterViewRead.FilterViewId).

            Identifier of this object, unique per TimeLog site.

            - No view has this ID — The UPDATE matches no row; with an empty FilterValues list the call still answers 204.
        Name:
          type: string
          maxLength: 255
          minLength: 1
          description: New display name.
        IsDefault:
          type: boolean
          default: false
          description: |-
            New default flag. Omitted = false (the view stops being the default).

            - IsDefault = true — Clears IsDefault on the CALLER's other views of the ROUTE's page — not on the view owner's / the view's own page when those differ.
        FilterValues:
          type: array
          items:
            $ref: '#/components/schemas/FilterValueWrite'
          description: |-
            The complete new value set. Every stored value of the view is deleted first, then these are inserted; an empty list clears the view.

            - FilterValues omitted or null — No validator rule; the adapter iterates it and fails with HTTP 500 Code 100.

            - Values were read with GET and sent back — GET hides values of filters hidden on the page; a GET-then-PUT round trip therefore deletes those stored values.

            > **Not yet documented:** multiple.
      description: The complete new state of an existing saved view, addressed by FilterViewId in the body. Every field is
        written; there is no partial update.
    MessageError:
      type: object
      description: Body of 401 and some framework errors — not the ResponseError shape.
      properties:
        Message:
          type: string
    ResponseError:
      type: object
      description: Error body for validation (400), privilege (403), business-rule (422/500) and other server errors. `Details`
        lists strings for validation errors, or `{ErrorCode, Message}` objects for business-rule violations. `Parameters`
        echoes the request arguments, including the full payload.
      properties:
        Code:
          type: integer
          description: 'TimeLog error class (not the HTTP status): 100 unexpected, 102 business rule, 103 privilege, 200 validation.'
        Message:
          type: string
        Details:
          type: array
          items: {}
        Parameters:
          type:
          - string
          - object
          - 'null'
        Url:
          type: string
    TafAction:
      type: object
      description: A hypermedia action the caller may take on the object. Present only where the operation registers actions.
    TafLink:
      type: object
      properties:
        Href:
          type: string
        Rel:
          type: string
    TafListPaging:
      type: object
      description: 'Paging values. They are returned as STRINGS, for example `"TotalRecord": "12"`.'
      properties:
        TotalRecord:
          type: string
        TotalPage:
          type: string
        PageNumber:
          type: string
