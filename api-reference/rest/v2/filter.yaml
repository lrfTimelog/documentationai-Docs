      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilterViewUpdate'
      responses:
        '204':
          description: |-
            Success without content: HTTP 204 with an empty body. No body.

            Order: none

            Empty result: none
        '400':
          description: '- **Code 200** — The request body or parameters failed input validation. — When: Unknown page name,
            FilterViewId 0 / missing, Name empty, or a value item with empty Name / Value (captured). — Fix: Fix every item
            listed in Details and resend.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: Empty body on an unknown page (captured)
                  value:
                    Code: 200
                    Details:
                    - The value 'test' is not valid for PageIdentifier.
                    - '''Filter View Id'' must not be empty.'
                    - '''Name'' must not be empty.'
                    Message: Invalid model state error.
                    Parameters: 'model: {"FilterViewId":0,"Name":null,"IsDefault":false,"FilterValues":null}'
                    Url: https://{your-timelog-host}/{tlp-virtual-directory}/api/v2/filter-view/test
        '401':
          description: '- Missing, invalid or expired bearer token. — When: No or invalid bearer token (captured). — Fix:
            Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '404':
          description: '- The URL did not match any route (including a route constraint such as {id:int} receiving a non-integer).
            — When: pageIdentifier empty (captured).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v2.filter.filterview.update
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: |-
        OAuth 2.0 bearer token, sent as `Authorization: Bearer <token>`. JWT and reference tokens are both accepted. The token must carry the required scope (default `tlp`).

        The token's `sub` claim is the acting user. A token WITHOUT `sub` (client-credentials) acts as the system service user. If the `sub` user cannot log in (inactive, locked, deleted), the request is rejected with 401 — it is no longer let through without a user.

        > **Not yet documented:** how to obtain a token.

        > **Not yet documented:** token lifetime.
  schemas:
    FilterComponentType:
      type: string
      enum:
      - SingleSelect
      - MultiSelect
      - SingleSelectTypeSearch
      - MultiSelectTypeSearch
      - Checkbox
      - RadioButton
      - Textbox
      - DateRange
      x-enum-descriptions:
      - Single-choice control (a view option such as group-by). Stored as one string; returned as that string unchanged.
      - 'Multi-choice list of entity IDs. Stored comma-separated; returned as a list of {Key: display name, Value: ID} resolved
        through the page''s dropdown content.'
      - Searchable single-choice entity picker. Stored and returned like MultiSelect (list of {Key, Value}).
      - Searchable multi-choice entity picker — the sidebar filters (project manager, project status, employee ...). Stored
        comma-separated IDs; returned as a list of {Key, Value}.
      - 'On/off option. Stored as one string; returned as a one-item list [{Key: null, Value: <stored string>}].'
      - 'Radio choice. Not special-cased by the GET: decoded like MultiSelect (list of {Key, Value}).'
      - Free text (e.g. search text). Stored as one string; returned as that string.
      - A named period (e.g. CurrentWeek, OneMonth). Stored as one string; returned as that string.
      description: |-
        It decides how a saved value is stored and how GET /v2/filter-view/{pageIdentifier} hands it back: plain string, a one-item list, or a list of resolved {Key, Value} pairs.

        Allowed values:

        | Value | Name | Meaning |
        |---|---|---|
        | `0` | SingleSelect | Single-choice control (a view option such as group-by). Stored as one string; returned as that string unchanged. |
        | `1` | MultiSelect | Multi-choice list of entity IDs. Stored comma-separated; returned as a list of {Key: display name, Value: ID} resolved through the page's dropdown content. |
        | `2` | SingleSelectTypeSearch | Searchable single-choice entity picker. Stored and returned like MultiSelect (list of {Key, Value}). |
        | `3` | MultiSelectTypeSearch | Searchable multi-choice entity picker — the sidebar filters (project manager, project status, employee ...). Stored comma-separated IDs; returned as a list of {Key, Value}. |
        | `4` | Checkbox | On/off option. Stored as one string; returned as a one-item list [{Key: null, Value: <stored string>}]. |
        | `5` | RadioButton | Radio choice. Not special-cased by the GET: decoded like MultiSelect (list of {Key, Value}). |
        | `6` | Textbox | Free text (e.g. search text). Stored as one string; returned as that string. |
        | `7` | DateRange | A named period (e.g. CurrentWeek, OneMonth). Stored as one string; returned as that string. |
    FilterValueRead:
      type: object
      properties:
        Name:
          type: string
          readOnly: true
          maxLength: 255
          description: What the value is for. Either the name of a sidebar filter type — subject to the page's filter visibility
            — or the name of a view-option control chosen by the frontend (e.g. DateRange, a search-text box), which is always
            returned.
        Value:
          type: string
          readOnly: true
          description: |-
            The saved setting. Its JSON shape depends on FilterType: Textbox / DateRange / SingleSelect → the stored string; Checkbox → [{"Key": null, "Value": "<stored string>"}]; every other type → a list of {"Key": display name, "Value": "<id>"}, one per comma-separated ID, with the display name looked up from the page's current dropdown content (falling back to the entity's name for customers, departments, employees, projects, contracts, legal entities, project types and categories, employee and task types).

            - FilterType is Textbox, DateRange or SingleSelect — Value is a JSON string: the stored value unchanged.

            - FilterType is Checkbox — Value is a JSON array with one item: [{"Key": null, "Value": "<stored string>"}].

            - FilterType is MultiSelect, SingleSelectTypeSearch, MultiSelectTypeSearch or RadioButton — Value is a JSON array of {"Key": display name, "Value": "<id>"}, one per comma-separated stored ID.

            - Decoding fails (an ID that no longer resolves, a filter type with no fallback lookup, a non-integer ID) — The exception is logged and the WHOLE value is left out of the response — the view is returned without it, no error.

            > **Not yet documented:** example.

            > **Not yet documented:** multiple.
        IsInclusive:
          type: boolean
          readOnly: true
          description: |-
            true = the selected IDs are included; false = they are excluded (an exclusion filter).

            > **Not yet documented:** description.
        FilterType:
          $ref: '#/components/schemas/FilterComponentType'
          enum:
          - SingleSelect
          - MultiSelect
          - SingleSelectTypeSearch
          - MultiSelectTypeSearch
          - Checkbox
          - RadioButton
          - Textbox
          - DateRange
          x-enum-descriptions:
          - Single-choice control (a view option such as group-by). Stored as one string; returned as that string unchanged.
          - 'Multi-choice list of entity IDs. Stored comma-separated; returned as a list of {Key: display name, Value: ID}
            resolved through the page''s dropdown content.'
          - Searchable single-choice entity picker. Stored and returned like MultiSelect (list of {Key, Value}).
          - Searchable multi-choice entity picker — the sidebar filters (project manager, project status, employee ...). Stored
            comma-separated IDs; returned as a list of {Key, Value}.
          - 'On/off option. Stored as one string; returned as a one-item list [{Key: null, Value: <stored string>}].'
          - 'Radio choice. Not special-cased by the GET: decoded like MultiSelect (list of {Key, Value}).'
          - Free text (e.g. search text). Stored as one string; returned as that string.
          - A named period (e.g. CurrentWeek, OneMonth). Stored as one string; returned as that string.
          readOnly: true
          description: |-
            The kind of control the value belongs to; decides the shape of Value.

            Allowed values:

            | Value | Name | Meaning |
            |---|---|---|
            | `0` | SingleSelect | Single-choice control (a view option such as group-by). Stored as one string; returned as that string unchanged. |
            | `1` | MultiSelect | Multi-choice list of entity IDs. Stored comma-separated; returned as a list of {Key: display name, Value: ID} resolved through the page's dropdown content. |
            | `2` | SingleSelectTypeSearch | Searchable single-choice entity picker. Stored and returned like MultiSelect (list of {Key, Value}). |
            | `3` | MultiSelectTypeSearch | Searchable multi-choice entity picker — the sidebar filters (project manager, project status, employee ...). Stored comma-separated IDs; returned as a list of {Key, Value}. |
            | `4` | Checkbox | On/off option. Stored as one string; returned as a one-item list [{Key: null, Value: <stored string>}]. |
            | `5` | RadioButton | Radio choice. Not special-cased by the GET: decoded like MultiSelect (list of {Key, Value}). |
            | `6` | Textbox | Free text (e.g. search text). Stored as one string; returned as that string. |
            | `7` | DateRange | A named period (e.g. CurrentWeek, OneMonth). Stored as one string; returned as that string. |
      description: 'One value saved in a filter view: either a sidebar filter or a view option (Name = the frontend control,
        Value = its setting). The database row''s own IDs are not exposed — values have no identity of their own and are always
        replaced as a set.'
    FilterValueWrite:
      type: object
      properties:
        Name:
          type: string
          maxLength: 255
          minLength: 1
          description: |-
            Sidebar filter type name or the name of a view-option control. Read back as FilterValueRead.Name.

            - Name is a sidebar filter type that is hidden on the page — Saved, but GET leaves it out of the view (FilterViewRead.FilterValues).

            > **Not yet documented:** constraints → max length.
        Value:
          type: string
          maxLength: 255
          minLength: 1
          description: |-
            The setting, as ONE string: comma-separated IDs for select filters (split on commas by GET), the plain value for text, date-range and checkbox options.

            > **Not yet documented:** constraints → max length.
        IsInclusive:
          type: boolean
          default: false
          description: |-
            true = include the selected IDs; false = exclude them.

            The validator's NotNull on a non-nullable bool never fires: omitted = false.
        FilterType:
          $ref: '#/components/schemas/FilterComponentType'
          enum:
          - SingleSelect
          - MultiSelect
          - SingleSelectTypeSearch
          - MultiSelectTypeSearch
          - Checkbox
          - RadioButton
          - Textbox
          - DateRange
          x-enum-descriptions:
          - Single-choice control (a view option such as group-by). Stored as one string; returned as that string unchanged.
          - 'Multi-choice list of entity IDs. Stored comma-separated; returned as a list of {Key: display name, Value: ID}
            resolved through the page''s dropdown content.'
          - Searchable single-choice entity picker. Stored and returned like MultiSelect (list of {Key, Value}).
          - Searchable multi-choice entity picker — the sidebar filters (project manager, project status, employee ...). Stored
            comma-separated IDs; returned as a list of {Key, Value}.
          - 'On/off option. Stored as one string; returned as a one-item list [{Key: null, Value: <stored string>}].'
          - 'Radio choice. Not special-cased by the GET: decoded like MultiSelect (list of {Key, Value}).'
          - Free text (e.g. search text). Stored as one string; returned as that string.
          - A named period (e.g. CurrentWeek, OneMonth). Stored as one string; returned as that string.
          description: |-
            The kind of control the value belongs to; decides how GET returns Value.

            Default: SingleSelect

            Omitted = 0 (SingleSelect); the NotNull / >= 0 rules cannot fire for an omitted non-nullable enum.

            Allowed values:

            | Value | Name | Meaning |
            |---|---|---|
            | `0` | SingleSelect | Single-choice control (a view option such as group-by). Stored as one string; returned as that string unchanged. |
            | `1` | MultiSelect | Multi-choice list of entity IDs. Stored comma-separated; returned as a list of {Key: display name, Value: ID} resolved through the page's dropdown content. |
            | `2` | SingleSelectTypeSearch | Searchable single-choice entity picker. Stored and returned like MultiSelect (list of {Key, Value}). |
            | `3` | MultiSelectTypeSearch | Searchable multi-choice entity picker — the sidebar filters (project manager, project status, employee ...). Stored comma-separated IDs; returned as a list of {Key, Value}. |
            | `4` | Checkbox | On/off option. Stored as one string; returned as a one-item list [{Key: null, Value: <stored string>}]. |
            | `5` | RadioButton | Radio choice. Not special-cased by the GET: decoded like MultiSelect (list of {Key, Value}). |
            | `6` | Textbox | Free text (e.g. search text). Stored as one string; returned as that string. |
            | `7` | DateRange | A named period (e.g. CurrentWeek, OneMonth). Stored as one string; returned as that string. |
      description: 'One value to save in a filter view. Values are always written as a complete set: create inserts them,
        update deletes every stored value of the view and inserts the ones sent.'
    FilterViewCreate:
      type: object
      properties:
        Name:
          type: string
          maxLength: 255
          minLength: 1
          description: |-
            Display name of the view. Not checked for uniqueness.

            Can be set on create only.

            > **Not yet documented:** constraints → max length.
        IsDefault:
          type: boolean
          default: false
          description: |-
            true = make this the caller's default view for the page; the caller's other views on that page lose the flag.

            Can be set on create only.
        FilterValues:
          type: array
          items:
            $ref: '#/components/schemas/FilterValueWrite'
          description: |-
            The values to save. May be an empty list.

            Can be set on create only.

            - FilterValues omitted or null — No validator rule; the adapter iterates it and fails with HTTP 500 Code 100.

            > **Not yet documented:** multiple.
      description: 'A new saved view for the CALLER on the page named in the route. Owner and page are not in the body: the
        owner is always the authenticated user, the page is the route''s pageIdentifier.'
