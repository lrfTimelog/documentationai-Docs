openapi: 3.1.0
info:
  title: Saved filter views — REST API v2
  version: v2
  description: |-
    Enums are strings (member names) in v2 responses.

    **Conventions that apply to every operation in this file:**
    - Property names are PascalCase.
    - Successful bodies use the TAF envelope: one object in `Properties`, lists in `Entities[].Properties`.
    - Some operations succeed without content: HTTP 200 with the literal body `null`, or HTTP 204.
    - `PUT` replaces the whole object: omitted fields are reset.
    - Treat error `Code` 102 as a business-rule violation, whether the HTTP status is 422 or 500.

    > **Not yet documented:** rate limits.
servers:
- url: https://{your-timelog-host}/{tlp-virtual-directory}/api
  description: 'Your TimeLog site. `your-timelog-host` is the host of your TimeLog site (Not yet documented: the production
    host pattern); `tlp-virtual-directory` is the virtual directory your TimeLog site is hosted under.'
  variables:
    your-timelog-host:
      default: your-timelog-host
    tlp-virtual-directory:
      default: your-virtual-directory
security:
- bearer: []
tags:
- name: Saved filter views
  description: Enums are strings (member names) in v2 responses.
paths:
  /v2/filter-view/{id}:
    delete:
      operationId: deleteFilterViewV2
      summary: Delete a saved filter view
      description: |-
        Permanently deletes a saved filter view and all its values by its ID.

        Deletes the view and its values. The route takes only the view's integer ID (no page). Deleting the default view does not promote another view to default. A second delete of the same ID, or any unknown ID, fails with 500.

        **Not for:**
        - Clearing a view's selections but keeping it — `PUT /v2/filter-view/{pageIdentifier}` with an empty FilterValues list

        **Behaviour:**
        - Not idempotent.
        - The first call answers 204; a repeat answers 500 Code 100 (captured).
        - Safe to retry only under a condition. After a lost response, a 500 Code 100 on retry most likely means the first call succeeded; confirm with GET.
        - Duplicates: n/a
        - Side effect: Deletes all values of the view, then the view.
        - On failure: Not transactional: values are deleted before the view row; if the view delete fails, the view remains without values (src_only).
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v2/filter-view/{pageIdentifier}`

        **See also:** `PUT /v2/filter-view/{pageIdentifier}`
      tags:
      - Saved filter views
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
        description: 'The view''s FilterViewId. No route constraint: a non-integer reaches model binding and gives 400 (captured),
          not 404.'
      responses:
        '204':
          description: |-
            Success without content: HTTP 204 with an empty body. No body.

            Order: none

            Empty result: none
        '400':
          description: '- **Code 200** — The request body or parameters failed input validation. — When: id is not an integer
            (captured: ''not_an_integer''). — Fix: Fix every item listed in Details and resend.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '401':
          description: '- Missing, invalid or expired bearer token. — When: No or invalid bearer token (captured). — Fix:
            Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: Unknown ID (captured)
                  value:
                    Code: 100
                    Details: []
                    Message: Unknown error occur in system, please contact system administrator.
                    Parameters: 'id: 99999999'
                    Url: https://{your-timelog-host}/{tlp-virtual-directory}/api/v2/filter-view/99999999
      x-timelog-key: rest.v2.filter.filterview.delete
  /v2/filter-view/{pageIdentifier}:
    get:
      operationId: getSavedFiltersViewsV2
      summary: List my saved filter views on a page
      description: |-
        Returns the caller's saved filter views for one page, default view first, each with its filter values decoded for display.

        This call returns all of the CALLER's views for the page in the route — the action's name notwithstanding, there is no way to ask for another user's views. Selected IDs are returned with their display names.

        **Use it to:**
        - Restore a user's saved view when a page opens (the default view first)

        **Not for:**
        - Reading another user's views — not possible; the owner is always the caller
        - The filter definitions and dropdown contents of a page — the Navigation / Filters operations

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **Next:** `PUT /v2/filter-view/{pageIdentifier}`, `DELETE /v2/filter-view/{id}`

        **See also:** `POST /v2/filter-view/{pageIdentifier}`

        > **Not yet documented:** examples; request → path params → description.
      tags:
      - Saved filter views
      parameters:
      - name: pageIdentifier
