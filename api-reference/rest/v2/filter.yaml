      responses:
        '200':
          description: |-
            A list, wrapped in the TAF list envelope (`Entities[].Properties`).

            Order: IsDefault descending (default view first), then Name ascending. Values inside a view: no defined order.

            Empty result: 200 with only the self link (no Entities) — captured for a page with no views.
          content:
            application/json:
              schema:
                type: object
                description: 'TAF list envelope: each item is in `Entities[].Properties`.'
                properties:
                  Entities:
                    type: array
                    description: Omitted (not `[]`) when the list is empty.
                    items:
                      type: object
                      properties:
                        Properties:
                          $ref: '#/components/schemas/FilterViewRead'
                        Links:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafLink'
                        Actions:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafAction'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
              examples:
                example1:
                  summary: Page with no saved views (captured at 3774fda)
                  value:
                    Links:
                    - Href: https://{your-timelog-host}/{tlp-virtual-directory}/api/v2/filter-view/12345
                      Rel: self
        '400':
          description: '- **Code 200** — The request body or parameters failed input validation. — When: pageIdentifier is
            not a PageIdentifier name or an integer (captured: ''test''). — Fix: Fix every item listed in Details and resend.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: Unknown page name (captured)
                  value:
                    Code: 200
                    Details:
                    - The value 'test' is not valid for PageIdentifier.
                    Message: Invalid model state error.
                    Parameters: 'pageIdentifier: null'
                    Url: https://{your-timelog-host}/{tlp-virtual-directory}/api/v2/filter-view/test
        '401':
          description: '- Missing, invalid or expired bearer token. — When: No or invalid bearer token (captured). — Fix:
            Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '404':
          description: '- The URL did not match any route (including a route constraint such as {id:int} receiving a non-integer).
            — When: pageIdentifier empty (/v2/filter-view/) — captured.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v2.filter.filterview.getbyuseridandpageid
    post:
      operationId: createFilterViewV2
      summary: Save a new filter view
      description: |-
        Saves a new named filter view for the caller on the page in the route, optionally as the page's default view.

        Stores the caller's current filter selections and view options under a name. The owner is always the authenticated user; the page is the route's pageIdentifier. Setting IsDefault makes it the view the page opens with and clears the flag on the caller's other views of that page. The response body is JSON null — the new view's ID is not returned; list the page's views to find it.

        **Not for:**
        - Changing an existing view — `PUT /v2/filter-view/{pageIdentifier}`

        **Behaviour:**
        - Not idempotent.
        - Not safe to retry blindly. Each call inserts a new view; names are not unique, so a retry after a lost response creates a duplicate.
        - Duplicates: Not deduplicated — same name twice gives two views.
        - Side effect: Inserts the view and its values.
        - Side effect: IsDefault = true: clears IsDefault on the caller's other views of the same page.
        - On failure: Not transactional: if the value insert fails, the view row remains without (some of) its values (src_only).
        - Changes are visible to the next read immediately.

        **Next:** `GET /v2/filter-view/{pageIdentifier}`

        **See also:** `PUT /v2/filter-view/{pageIdentifier}`

        > **Not yet documented:** behaviour → side effects on failure; examples.
