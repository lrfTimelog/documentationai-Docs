          application/json:
            schema:
              $ref: '#/components/schemas/FilterViewCreate'
      responses:
        '200':
          description: |-
            Success without content: HTTP 200 with the literal JSON body `null`. Body is the JSON literal null.

            Order: none

            Empty result: none
          content:
            application/json:
              schema:
                type: 'null'
        '400':
          description: '- **Code 200** — The request body or parameters failed input validation. — When: Unknown page name,
            Name empty, or a FilterValues item with empty Name / Value (captured: ''test'' page, empty body). — Fix: Fix every
            item listed in Details and resend.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: Empty body on an unknown page (captured)
                  value:
                    Code: 200
                    Details:
                    - The value 'test' is not valid for PageIdentifier.
                    - '''Name'' must not be empty.'
                    Message: Invalid model state error.
                    Parameters: 'model: {"Name":null,"IsDefault":false,"FilterValues":null}'
                    Url: https://{your-timelog-host}/{tlp-virtual-directory}/api/v2/filter-view/test
        '401':
          description: '- Missing, invalid or expired bearer token. — When: No or invalid bearer token (captured). — Fix:
            Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '404':
          description: '- The URL did not match any route (including a route constraint such as {id:int} receiving a non-integer).
            — When: pageIdentifier empty (captured).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v2.filter.filterview.create
    put:
      operationId: updateFilterViewV2
      summary: Overwrite a saved filter view
      description: |-
        Replaces a saved filter view's name, default flag and complete set of filter values.

        Full replacement of the view whose FilterViewId is in the body: the name and default flag are overwritten, every stored value is deleted and the sent values are inserted (an empty list clears the view). The view's owner and page never change — the route's pageIdentifier is only used to clear the default flag on the caller's other views of that page. Values hidden by GET (filters hidden on the page) are not sent back by a GET-then-PUT client and are therefore deleted.

        **Use it to:**
        - Rename a saved view, make it the default, or save the current selections over it

        **Not for:**
        - Changing one value — there is no partial update; send the complete set
        - Moving a view to another page — the stored page is not updated

        **Behaviour:**
        - Idempotent.
        - Same body twice gives the same stored state (LastModified changes; a FilterViewUpdated event is raised each time).
        - Safe to retry.
        - Duplicates: n/a
        - Side effect: Overwrites Name and IsDefault; sets LastModified / LastModifiedBy to now / the caller's EmployeeID.
        - Side effect: Deletes every stored value of the view and inserts the sent ones.
        - Side effect: IsDefault = true: clears IsDefault on the caller's other views of the ROUTE's page.
        - On failure: Not transactional: the row update and the value delete run before the value insert. If the insert fails (e.g. a Value longer than 255 characters, or an unknown FilterViewId), the view keeps its new name but has LOST its values.
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v2/filter-view/{pageIdentifier}`

        **Next:** `GET /v2/filter-view/{pageIdentifier}`

        **See also:** `POST /v2/filter-view/{pageIdentifier}`, `DELETE /v2/filter-view/{id}`

        > **Not yet documented:** behaviour → side effects on failure; examples.
