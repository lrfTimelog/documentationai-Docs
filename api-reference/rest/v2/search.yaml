openapi: 3.1.0
info:
  title: Global search — REST API v2
  version: v2
  description: |-
    Prefix search across customers, contacts, projects, invoices and employees, plus the caller's saved category preference.

    Enums are strings (member names) in v2 responses.

    **Conventions that apply to every operation in this file:**
    - Property names are PascalCase.
    - Successful bodies use the TAF envelope: one object in `Properties`, lists in `Entities[].Properties`.
    - Some operations succeed without content: HTTP 200 with the literal body `null`, or HTTP 204.
    - `PUT` replaces the whole object: omitted fields are reset.
    - Treat error `Code` 102 as a business-rule violation, whether the HTTP status is 422 or 500.

    > **Not yet documented:** rate limits.
servers:
- url: https://app{server-number}.timelog.com/{account}/api
  description: If your browser shows `https://app.timelog.com`, find your site URL in System Administration > Integrations
    and API > Reporting API settings, under Your TimeLog API URL.
  variables:
    server-number:
      default: '3'
    account:
      default: your-account
security:
- bearer: []
paths:
  /v2/search:
    get:
      operationId: searchV2
      summary: Search customers, contacts, projects, invoices and employees
      description: |-
        Finds customers, contacts, projects, invoices and employees whose name or number starts with the search text.

        Prefix search across five categories at once, at most 20 hits per category, each hit with a display label and a link into the web UI. The caller's saved category preferences (GET /v2/search/categories) are NOT applied here — the client passes them in `categories`.

        **Use it to:**
        - Type-ahead search box: jump to a customer, contact, project, invoice or colleague.

        **Not for:**
        - Picking a task or project to register time on → the v1 *search-for-time-tracking* operations

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v2/search/categories`

        **See also:** `GET /v1/project-header/search-for-time-tracking`

        > **Not yet documented:** examples (success); request → query params.
      parameters:
      - name: searchText
        in: query
        required: true
        schema:
          type: string
          x-timelog-filter:
            operators:
            - starts_with
        description: |-
          Text the name / number must START with. '[' is escaped; '%' and '_' are NOT, so they act as wildcards ('%' matches everything). Omitted → 404 'No action was found' (captured), not 400.

          Filters on `SearchItemRead.Name` (starts_with).
      - name: categories
        in: query
        required: false
        schema:
          type: string
          enum:
          - Customer
          - Contact
          - Project
          - Invoice
          - Employee
          - All
          - None
          x-enum-descriptions:
          - Search customers (flag 1).
          - Search active contact persons (flag 2).
          - Search projects (flag 4).
          - Search invoices / vouchers (flag 8).
          - Search active users (flag 16).
          - '-1: every category — only meaningful alone.'
          - '0: adds nothing.'
        description: |-
          Category names, case-insensitive: Customer, Contact, Project, Invoice, Employee. The values are ADDED, not OR-ed: a repeated name or 'All' mixed with others produces a wrong set. An unknown name → 500.

          Several values: one string, separated by `,`.

          Default: all five categories

          Allowed values:

          | Value | Name | Meaning |
          |---|---|---|
          | `Customer` | Customer | Search customers (flag 1). |
          | `Contact` | Contact | Search active contact persons (flag 2). |
          | `Project` | Project | Search projects (flag 4). |
          | `Invoice` | Invoice | Search invoices / vouchers (flag 8). |
          | `Employee` | Employee | Search active users (flag 16). |
          | `All` | All | -1: every category — only meaningful alone. |
          | `None` | None | 0: adds nothing. |
      responses:
        '200':
          description: |-
            The object, wrapped in the TAF envelope (`Properties`).

            Order: None — SELECT TOP 20 without ORDER BY per category; order is not guaranteed.

            Empty result: 200 with Properties {} (all arrays omitted).
          content:
            application/json:
              schema:
                type: object
                description: 'TAF envelope: the object is in `Properties`. Null members are omitted; a null result is `{"Links":
                  [self]}` without `Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/SearchResultRead'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
                  Actions:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafAction'
        '401':
          description: '- Missing, invalid or expired bearer token. — When: No or invalid bearer token (not captured: the
            404 above wins in the captures because searchText was missing). — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '404':
          description: '- The route matched a controller, but no action accepts the supplied query parameters — typically
            a required (non-nullable) simple parameter such as a DateTime was omitted. It is a missing-parameter error that
            looks like a 404. — When: searchText omitted (captured for every scenario).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: searchText missing
                  value:
                    Message: No HTTP resource was found that matches the request URI 'https://app{server-number}.timelog.com/{account}/api/v2/search'.
                    MessageDetail: No action was found on the controller 'Search' that matches the request.
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v2.search.search.search
  /v2/search/categories:
    get:
      operationId: getSearchCategoriesV2
      summary: List my search categories
      description: |-
        Lists the global-search categories the caller can use, each with the caller's saved on/off preference.

        One entry per category whose UI page the caller may open (Customer, Contact, Project, Invoice, Employee, in that order), with IsSelected from the caller's personal user default MainSearchCategory (all on until saved). Page access is the only filter here — a listed category can still return nothing in GET /v2/search when the caller lacks the matching area privilege.

        **Use it to:**
        - Render the category checkboxes of the search box, then pass the selected names to GET /v2/search?categories=

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **Next:** `PUT /v2/search/categories`, `GET /v2/search`
      responses:
        '200':
          description: |-
            A list, wrapped in the TAF list envelope (`Entities[].Properties`).

            Order: Enum order: Customer, Contact, Project, Invoice, Employee.
          content:
            application/json:
              schema:
                type: object
                description: 'TAF list envelope: each item is in `Entities[].Properties`.'
                properties:
                  Entities:
                    type: array
                    description: Omitted (not `[]`) when the list is empty.
                    items:
                      type: object
                      properties:
                        Properties:
                          $ref: '#/components/schemas/SearchCategoryStatusRead'
                        Links:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafLink'
                        Actions:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafAction'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
              examples:
                example1:
                  summary: Example
                  value:
                    Entities:
                    - Properties:
                        Name: Customer
                        IsSelected: true
                    - Properties:
                        Name: Contact
                        IsSelected: true
                    - Properties:
                        Name: Project
                        IsSelected: true
                    - Properties:
                        Name: Invoice
                        IsSelected: false
                    - Properties:
                        Name: Employee
                        IsSelected: false
                    Links:
                    - Href: https://app{server-number}.timelog.com/{account}/api/v2/search/categories
                      Rel: self
        '401':
          description: '- Missing, invalid or expired bearer token. — When: No or invalid bearer token (captured). — Fix:
            Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
      x-timelog-key: rest.v2.search.search.getsearchcategories
    put:
      operationId: updateSearchCategoriesV2
      summary: Save my search categories
      description: |-
        Saves which global-search categories are switched on for the calling user.

        Replaces the caller's MainSearchCategory user default with the sum of the flag values of the entries sent with IsSelected true. Categories not in the body are switched off. Only the caller's own preference changes (user ID from the token). The preference is what GET /v2/search/categories reports; GET /v2/search does not read it.

        **Use it to:**
        - Persist the search-box checkboxes.

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Side effect: Raises event UserSettingConfigurationUpdated.
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v2/search/categories`

        > **Not yet documented:** examples (success).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchCategoryStatusUpdate'
      responses:
        '200':
          description: 'Success without content: HTTP 200 with the literal JSON body `null`. Literal JSON `null` (TafSuccessResult).'
          content:
            application/json:
              schema:
                type: 'null'
        '401':
          description: '- Missing, invalid or expired bearer token. — When: No or invalid bearer token (captured). — Fix:
            Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: Empty body
                  value:
                    Code: 100
                    Details: []
                    Message: Unknown error occur in system, please contact system administrator.
                    Parameters: 'categories: {"Categories":null}'
                    Url: https://app{server-number}.timelog.com/{account}/api/v2/search/categories
      x-timelog-key: rest.v2.search.search.updatesearchcategories
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: |-
        OAuth 2.0 bearer token, sent as `Authorization: Bearer <token>`. JWT and reference tokens are both accepted. The token must carry the required scope (default `tlp`).

        The token's `sub` claim is the acting user. A token WITHOUT `sub` (client-credentials) acts as the system service user. If the `sub` user cannot log in (inactive, locked, deleted), the request is rejected with 401 — it is no longer let through without a user.

        > **Not yet documented:** how to obtain a token.

        > **Not yet documented:** token lifetime.
  schemas:
    MessageError:
      type: object
      description: Body of 401 and some framework errors — not the ResponseError shape.
      properties:
        Message:
          type: string
    ResponseError:
      type: object
      description: Error body for validation (400), privilege (403), business-rule (422/500) and other server errors. `Details`
        lists strings for validation errors, or `{ErrorCode, Message}` objects for business-rule violations. `Parameters`
        echoes the request arguments, including the full payload.
      properties:
        Code:
          type: integer
          description: 'TimeLog error class (not the HTTP status): 100 unexpected, 102 business rule, 103 privilege, 200 validation.'
        Message:
          type: string
        Details:
          type: array
          items: {}
        Parameters:
          type:
          - string
          - object
          - 'null'
        Url:
          type: string
    SearchCategoryStatusRead:
      type: object
      properties:
        Name:
          type: string
          enum:
          - Customer
          - Contact
          - Project
          - Invoice
          - Employee
          x-enum-descriptions:
          - Customers; listed when the caller has the EditCustomer page. Flag 1.
          - Contact persons; listed with the CRMContactEdit page. Flag 2.
          - Projects; listed with the ProjectTaskPlanHour page. Flag 4.
          - Invoices and vouchers; listed with the InvoiceEdit page. Flag 8.
          - Employees (users); listed with the EmployeeOverviewBase page. Flag 16.
          readOnly: true
          x-timelog-identity:
            role: primary_id
            unique_scope: none
            id_format: string
          description: |-
            Only categories whose UI page the caller may open are listed.

            Identifier of this object.

            Allowed values:

            | Value | Name | Meaning |
            |---|---|---|
            | `Customer` | Customer | Customers; listed when the caller has the EditCustomer page. Flag 1. |
            | `Contact` | Contact | Contact persons; listed with the CRMContactEdit page. Flag 2. |
            | `Project` | Project | Projects; listed with the ProjectTaskPlanHour page. Flag 4. |
            | `Invoice` | Invoice | Invoices and vouchers; listed with the InvoiceEdit page. Flag 8. |
            | `Employee` | Employee | Employees (users); listed with the EmployeeOverviewBase page. Flag 16. |
        IsSelected:
          type: boolean
          readOnly: true
          description: 'True when the category''s bit is set in the caller''s MainSearchCategory user default. Default (never
            saved): all five on.'
      description: One global-search category the caller can use, and whether the caller has it switched on in their personal
        search preferences (user default MainSearchCategory).
    SearchCategoryStatusUpdate:
      type: object
      properties:
        Categories:
          type: array
          items: {}
          writeOnly: true
          description: The category entries. Omitted / null → 500 (the loop dereferences it). Duplicates are not rejected
            and are counted twice.
        Categories[].Name:
          type: string
          writeOnly: true
          description: |-
            Category (MainSearchCategory).

            Bit flags — values combine.

            | Value | Name | Meaning |
            |---|---|---|
            | `0` | None | No category; adds nothing. |
            | `1` | Customer | Customers. |
            | `2` | Contact | Contact persons. |
            | `4` | Project | Projects. |
            | `8` | Invoice | Invoices and vouchers. |
            | `16` | Employee | Employees. |
            | `-1` | All | All categories as a filter value; ADDED (not OR-ed) to the stored sum, so combined with other entries it corrupts the value. |
        Categories[].IsSelected:
          type: boolean
          writeOnly: true
          default: false
          description: True to switch the category on. false and omitted are the same (not counted).
      description: The caller's complete set of global-search category preferences. The server stores the SUM of the flag
        values of the entries with IsSelected true; every category not sent (or sent with false) is switched off.
    SearchItemRead:
      type: object
      properties:
        Id:
          type: integer
          format: int32
          readOnly: true
          x-timelog-identity:
            role: primary_id
            unique_scope: parent
            id_format: int
          description: |-
            Integer ID of the hit: customer ID (Customers), contact ID (Contacts), project ID (Projects), invoice ID (Invoices) or USER ID (Employees).

            Identifier of this object, unique within its parent.
        Name:
          type: string
          readOnly: true
          description: |-
            Display label built by TSP_SuperSearch. Customers: "Name (CustomerNo)" or "CustomerNo Name". Contacts: "First Last (Customer)" or "Last, First (Customer)". Projects: "Project (Customer)" or "ContractNo Project (Customer)". Invoices: "InvoiceNo Header (Customer)". Employees: "First Last (Department or company name)" or "Initials (First Last - company name)".

            Contains personal data.
        ImageUrl:
          type:
          - string
          - 'null'
          format: uri
          readOnly: true
          description: 'Employees: the user''s profile-picture URL (29 px). Other categories: null.'
        PageUrl:
          type: string
          format: uri
          readOnly: true
          description: 'Link to the record in the TimeLog web UI: CRM/Customer/Edit, CRM/Contact/Edit, ProjectManagement/Plan/Task,
            Financial/Invoicing/Edit or Employee/EmployeeOverview/Index, with the Id.'
      description: What the Id refers to depends on the category array the item is in.
    SearchResultRead:
      type: object
      properties:
        Customers:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SearchItemRead'
          readOnly: true
          description: Customer hits (Id = customer ID). Omitted when none.
        Contacts:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SearchItemRead'
          readOnly: true
          description: |-
            Active contact-person hits (Id = contact ID). Omitted when none.

            Contains personal data.
        Projects:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SearchItemRead'
          readOnly: true
          description: Project hits (Id = project ID; templates and order status 5/6 excluded). Omitted when none.
        Invoices:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SearchItemRead'
          readOnly: true
          description: |-
            Invoice / voucher hits (Id = invoice ID; InvoiceType 4 excluded). Omitted when none.

            Contains financial data.
        Employees:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SearchItemRead'
          readOnly: true
          description: |-
            Active user hits (Id = USER ID, not employee ID). Omitted when none.

            Contains personal data.
      description: The result of one global search, grouped by category (customers, contacts, projects, invoices, employees).
        Each category holds at most 20 hits. Which categories are searched, and which records the caller can find in each,
        depends on the caller's page access and privileges (see `GET /v2/search`).
    TafAction:
      type: object
      description: A hypermedia action the caller may take on the object. Present only where the operation registers actions.
    TafLink:
      type: object
      properties:
        Href:
          type: string
        Rel:
          type: string
    TafListPaging:
      type: object
      description: 'Paging values. They are returned as STRINGS, for example `"TotalRecord": "12"`.'
      properties:
        TotalRecord:
          type: string
        TotalPage:
          type: string
        PageNumber:
          type: string
x-timelog-service: Search
