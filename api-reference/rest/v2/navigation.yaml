components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: |-
        OAuth 2.0 bearer token, sent as `Authorization: Bearer <token>`. JWT and reference tokens are both accepted. The token must carry the required scope (default `tlp`).

        The token's `sub` claim is the acting user. A token WITHOUT `sub` (client-credentials) acts as the system service user. If the `sub` user cannot log in (inactive, locked, deleted), the request is rejected with 401 — it is no longer let through without a user.

        > **Not yet documented:** how to obtain a token.

        > **Not yet documented:** token lifetime.
  schemas:
    BookmarkCreate.create:
      type: object
      properties:
        PageId:
          type: string
          format: uuid
          writeOnly: true
          x-timelog-identity:
            role: reference
          description: |-
            GUID of the page to bookmark — PageRead.PageId or MenuRead.PageId.

            Refers to `PageRead.PageId`. Look up valid values with `GET /v2/pages/design-seven`.

            - missing or the empty GUID — 400 Code 200 ("'Page Id' must not be empty.", "PageId of the page to bookmark must be set.") — captured.

            - a GUID that is not a page — 500 Code 100: the page lookup returns null and the manager dereferences it.
        Url:
          type: string
          format: uri
          writeOnly: true
          description: |-
            The page's ABSOLUTE URL as the browser shows it. It must start with the scheme+host(+port) of the request's Referer header. The server stores only the part after that origin (leading '/' trimmed) and rebuilds the absolute URL when listing. Also used to detect an existing bookmark for the same page.

            - missing or empty — 400 Code 200 "Url of the page to bookmark must be set." (captured).

            - does not start with the Referer origin — 400 Code 400 "Url and the referer do not match." (rest.navigation.bookmark-url-referer-mismatch).

            - ends with (query string ignored, case-insensitive) the URL of one of the caller's existing bookmarks — Treated as already bookmarked: 200, nothing created.
        EntityId:
          type:
          - integer
          - 'null'
          format: int32
          writeOnly: true
          description: |-
            For entity pages, the ID of the record the page shows (project, customer, contact, CRM event or opportunity, invoice, voucher, credit note, reminder, employee). Used ONLY to compose the bookmark's name (e.g. "<page name>: <project name>"); it is not stored and does not affect the URL.

            Default: null — the bookmark is named after the page, in the caller's language.

            - page is any other page — Name = the page's name resource in the caller's language.

            - ID of a record that does not exist (entity page) — 500 expected from the entity lookup.
      required:
      - PageId
      - Url
      description: Adds a page to the caller's bookmarks. The bookmark's owner is always the caller and its name is generated
        by the server; the caller supplies the page, the page's absolute URL and, for entity pages, the entity's ID.
