  /v2/filters/task/content:
    get:
      operationId: filtersTaskContentGetV2
      summary: List task filter options
      description: |-
        Returns up to maxResults (default 30) leaf tasks of the selected projects as filter options, optionally narrowed by search text and task status.

        A project selection is MANDATORY: without projectIds the result is always empty. Search text matches the task full name, the task number or the WBS code. pageIdentifier is NOT ignored here: NewResourcePlanner keeps only tasks of projects available in the resource planner. The SQL takes the first maxResults tasks BY NAME, which are then shown in WBS order.

        **Use it to:**
        - Fill the task picker after the user picked projects (projectIds from `GET /v2/filters/project/content`)

        **Not for:**
        - Listing a project's tasks — use the task operations (REST v1 ProjectManagement)

        **Rules across fields:**
        - R1: projectIds must be non-empty for any result; without it the response is an empty list whatever the other parameters.
        - R2: Each is...Inclusive flag only has an effect when its ID list is non-empty.

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v2/filters/list/{pageIdentifier}`, `GET /v2/filters/project/content`, `GET /v2/filters/task-status/content`

        **See also:** `GET /v1/task`

        > **Not yet documented:** examples; request → query params.
      tags:
      - Navigation (menus, bookmarks, pages, filters)
      parameters:
      - name: pageIdentifier
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/PageIdentifier'
        description: |-
          Required for route binding (404 when omitted). NewResourcePlanner = only tasks of projects with IsAvailableInResourcePlanner = 1; any other value = no restriction.

          Allowed values: see `PageIdentifier`.
      - name: searchText
        in: query
        required: false
        schema:
          type: string
          x-timelog-filter:
            operators:
            - contains
        description: |-
          Keeps tasks whose full name, number or WBS contains the text (LIKE '%text%'). Omitted / null = no text filter.

          Filters on `task full name, task number or WBS code` (contains).
      - name: maxResults
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 30
        description: Maximum options returned (SQL TOP). Omitted = 30.
      - name: projectIds
        in: query
        required: false
        schema:
          type: string
          x-timelog-filter:
            operators:
            - in
        description: |-
          Project IDs. Omitted / empty = empty result (a project selection is mandatory).

          Several values: one string, separated by `,`.

          Filters on `task's project (project ID)` (in).
      - name: isProjectInclusive
        in: query
        required: false
        schema:
          type: boolean
          default: true
        description: true = tasks of these projects; false = tasks of every other project.
      - name: taskStatusIds
        in: query
        required: false
        schema:
          type: string
          x-timelog-filter:
            operators:
            - in
        description: |-
          Task status codes (from `GET /v2/filters/task-status/content`).

          Several values: one string, separated by `,`.

          Filters on `task status (TaskStatus code)` (in).
      - name: isTaskStatusInclusive
        in: query
        required: false
        schema:
          type: boolean
          default: true
        description: Include / exclude switch for taskStatusIds. Ignored when taskStatusIds is empty.
      responses:
        '200':
          description: |-
            A list, wrapped in the TAF list envelope (`Entities[].Properties`). Value = task ID; DisplayText = task full name, plus " (<task number>)" when the TaskNo feature is on and the task has a number.

            Order: WBS code (in memory), over the first maxResults tasks by full name.

            Empty result: 200 with only the self link (no Entities) — always when projectIds is omitted.
          content:
            application/json:
              schema:
                type: object
                description: 'TAF list envelope: each item is in `Entities[].Properties`.'
                properties:
                  Entities:
                    type: array
                    description: Omitted (not `[]`) when the list is empty.
