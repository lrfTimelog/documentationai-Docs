  /v2/filters/list/{pageIdentifier}:
    get:
      operationId: filtersListGetV2
      summary: List the filters of a page
      description: |-
        Returns the code-defined filter definitions for a page. DesignSevenReports and NewResourcePlanner (one shared list), DesignSevenSearchProject and DesignSevenMoveHours have their own list in a fixed order; every other page — including an integer that is not a PageIdentifier member — gets the general list of all filters in definition order. Filters whose tenant feature is off are removed. The result is grouped by category (FilterCategory), categories in the order their first filter appears. Nothing here depends on the caller: same tenant + page = same answer for every user. Load each filter's options from its ContentUrl (the dropdown-content operations).

        **Use it to:**
        - Discover which dropdown-content route serves a filter, and which filters narrow it (ParentFilters)

        **Not for:**
        - The options of a filter — call its ContentUrl (e.g. `GET /v2/filters/project/content`)
        - The caller's saved filter selections — `GET /v2/filter-view/{pageIdentifier}`

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.
