openapi: 3.1.0
info:
  title: Navigation (menus, bookmarks, pages, filters) — REST API v2
  version: v2
  description: |-
    Enums are strings (member names) in v2 responses.

    **Conventions that apply to every operation in this file:**
    - Property names are PascalCase.
    - Successful bodies use the TAF envelope: one object in `Properties`, lists in `Entities[].Properties`.
    - Some operations succeed without content: HTTP 200 with the literal body `null`, or HTTP 204.
    - `PUT` replaces the whole object: omitted fields are reset.
    - Treat error `Code` 102 as a business-rule violation, whether the HTTP status is 422 or 500.

    > **Not yet documented:** rate limits.
servers:
- url: https://{region-node}.timelog.com/{account}/api
  description: 'Your TimeLog site. Copy both values from the address bar when you are signed in to TimeLog: `region-node`
    is the first part of the host name (for example `app3` in `app3.timelog.com`), `account` is the first path segment after
    it.'
  variables:
    region-node:
      default: app3
    account:
      default: your-account
security:
- bearer: []
tags:
- name: Navigation (menus, bookmarks, pages, filters)
  description: Enums are strings (member names) in v2 responses.
paths:
  /v2/bookmarks:
    get:
      operationId: bookmarksGetAllV2
      summary: List my bookmarks
      description: |-
        Returns the caller's own bookmarks, sorted by name, each with an absolute URL and create / delete actions.

        Lists the bookmarks ("favourite pages") of the CALLER — there is no parameter to read another user's. Bookmarks whose page the caller can no longer open (role or licence change, feature off, deactivated report) are silently left out but not deleted. Names are as stored at creation (the creator's language then), URLs are rebuilt absolute.

        **Use it to:**
        - Render the bookmark menu of the web app

        **Not for:**
        - Reading another user's bookmarks — not possible

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Consistency: immediate for the caller's own create / delete (both invalidate the "UserPageFavorites" cache entry).

        **Next:** `DELETE /v2/bookmarks/{bookmarkId}`

        **See also:** `POST /v2/bookmarks`

        > **Not yet documented:** behaviour → consistency.
      tags:
      - Navigation (menus, bookmarks, pages, filters)
      responses:
        '200':
          description: |-
            A list, wrapped in the TAF list envelope (`Entities[].Properties`). Each entity carries the TAF actions create (POST /v2/bookmarks) and delete (DELETE /v2/bookmarks/{Id}).

            Order: Name ascending (current culture string order).

            Empty result: 200 with only the self link (no Entities) — also when reading the bookmarks failed (the manager swallows exceptions).
          content:
            application/json:
              schema:
                type: object
                description: 'TAF list envelope: each item is in `Entities[].Properties`.'
                properties:
                  Entities:
                    type: array
                    description: Omitted (not `[]`) when the list is empty.
                    items:
                      type: object
                      properties:
                        Properties:
                          $ref: '#/components/schemas/BookmarkRead'
                        Links:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafLink'
                        Actions:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafAction'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
        '401':
          description: '- Missing, invalid or expired bearer token. — When: No or invalid bearer token (captured). — Fix:
            Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
              examples:
                example1:
                  summary: No token (captured)
                  value:
                    Message: Authorization has been denied for this request.
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v2.navigation.bookmarks.getall
    post:
      operationId: bookmarksCreateV2
      summary: Bookmark a page
      description: |-
        Adds a page to the caller's own bookmarks; the server names the bookmark and stores the URL relative to the Referer's origin.

        Bookmarks a page for the CALLER (the owner is always the current user — there is no user parameter). The caller sends the page GUID, the page's absolute URL and, for entity pages, the entity ID. The server checks that the URL starts with the origin of the request's Referer header, stores the URL relative to that origin, and names the bookmark itself: the page's name in the caller's language, or for entity pages "<page name>: <entity name>" (project, customer, contact, CRM event / opportunity, employee) or "<prefix> <number>" (invoice, voucher, credit note, reminder). If the caller already has a bookmark for the same page (non-entity pages) or a URL ending with the same path, nothing is created. The response is `null` — re-list to obtain the new bookmark's ID.

        **Use it to:**
        - "Bookmark this page" in the web app's page header

        **Not for:**
        - Bookmarking a page for another user — not possible
        - Server-to-server use — a Referer header matching the page's origin is mandatory

        **Rules across fields:**
        - R1: Url must start with the scheme+host(+port) of the Referer header (ordinal string prefix).

        **Behaviour:**
        - Not idempotent.
        - A repeat with the same page (non-entity pages) or a Url ending with an existing bookmark's stored URL creates nothing and still answers 200 null.
        - Safe to retry.
        - Duplicates: Server-side duplicate check against the caller's own (cached, access-filtered) bookmarks: same page for non-entity pages, or stored URL is a case-insensitive suffix of the new Url (query strings ignored). No DB constraint.
        - Side effect: Invalidates the caller's bookmark cache.
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v2/pages/design-seven`, `GET /v2/menus/main`

        **Next:** `GET /v2/bookmarks`

        **See also:** `DELETE /v2/bookmarks/{bookmarkId}`

        > **Not yet documented:** examples.
      tags:
      - Navigation (menus, bookmarks, pages, filters)
      parameters:
      - name: Referer
        in: header
        required: true
        schema:
          type: string
          format: uri
        description: The page the request comes from. Its scheme+host(+port) must prefix the body's Url; that origin is stripped
          from Url before storing. Missing → 400 Code 400 "Missing referer in header.".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookmarkCreate.create'
      responses:
        '200':
          description: |-
            Success without content: HTTP 200 with the literal JSON body `null`. Literal JSON `null` (TafSuccessResult) — both when a bookmark was created and when it already existed. No ID is returned.

            Order: none

            Empty result: none
          content:
            application/json:
              schema:
                type: 'null'
        '400':
          description: |-
            - **Code 200** — The request body or parameters failed input validation. — When: PageId missing / empty GUID, Url missing or empty (captured: body {}). — Fix: Fix every item listed in Details and resend.

            - **Code 400** — POST /v2/bookmarks requires a Referer header: the bookmark URL is stored relative to the Referer's origin. Browsers send it; server-to-server callers usually do not. — When: No Referer header (checked after model validation). — Fix: Send a Referer header whose scheme+host(+port) is the origin of the page being bookmarked.

            - **Code 400** — The body's Url does not start with the Referer header's scheme+host(+port) (case-sensitive string prefix). — When: Url does not start with the Referer origin. — Fix: Send the page's absolute URL from the same origin as the Referer (e.g.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: Empty body (captured)
                  value:
                    Code: 200
                    Details:
                    - '''Page Id'' must not be empty.'
                    - PageId of the page to bookmark must be set.
                    - Url of the page to bookmark must be set.
                    Message: Invalid model state error.
                    Parameters: 'createModel: {"PageId":"00000000-0000-0000-0000-000000000000","Url":null,"EntityId":null}'
                    Url: https://{region-node}.timelog.com/{account}/api/v2/bookmarks
        '401':
          description: '- Missing, invalid or expired bearer token. — When: No or invalid bearer token (captured). — Fix:
            Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: JSON null body (captured)
                  value:
                    Code: 100
                    Details: []
                    Message: Unknown error occur in system, please contact system administrator.
                    Parameters: 'createModel: null'
                    Url: https://{region-node}.timelog.com/{account}/api/v2/bookmarks
      x-timelog-key: rest.v2.navigation.bookmarks.create
  /v2/bookmarks/{bookmarkId}:
    delete:
      operationId: bookmarksDeleteV2
      summary: Delete a bookmark
      description: |-
        Permanently deletes a bookmark by its ID.

        Deletes the bookmark with this ID. Intended for the caller's own bookmarks (the delete action on each entity of GET /v2/bookmarks), but the ID is not checked against the caller. An unknown or already-deleted ID fails with 500, not 404.

        **Use it to:**
        - "Remove bookmark" in the bookmark menu (follow the entity's delete action)

        **Not for:**
        - Deleting other users' bookmarks — currently possible, not intended

        **Behaviour:**
        - Not idempotent.
        - The first call answers 200 null; a repeat answers 500 Code 100 (the lookup throws).
        - Safe to retry only under a condition. After a lost response, a 500 Code 100 on retry most likely means the first call succeeded; confirm with GET /v2/bookmarks.
        - Duplicates: n/a
        - Side effect: Invalidates the "UserPageFavorites" cache entry (the caller's list).
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v2/bookmarks`

        **See also:** `POST /v2/bookmarks`

        > **Not yet documented:** examples.
      tags:
      - Navigation (menus, bookmarks, pages, filters)
      parameters:
      - name: bookmarkId
        in: path
        required: true
        schema:
          type: integer
          format: int32
        description: 'The bookmark''s Id from GET /v2/bookmarks. No route constraint: a non-integer reaches model binding
          and gives 400 (captured).'
      responses:
        '200':
          description: |-
            Success without content: HTTP 200 with the literal JSON body `null`. Literal JSON `null` (TafSuccessResult).

            Order: none

            Empty result: none
          content:
            application/json:
              schema:
                type: 'null'
        '400':
          description: '- **Code 200** — The request body or parameters failed input validation. — When: bookmarkId is not
            an integer (captured: ''not_an_integer''). — Fix: Fix every item listed in Details and resend.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: Non-integer ID (captured)
                  value:
                    Code: 200
                    Details:
                    - The value 'not_an_integer' is not valid for Int32.
                    Message: Invalid model state error.
                    Parameters: 'bookmarkId: null'
                    Url: https://{region-node}.timelog.com/{account}/api/v2/bookmarks/not_an_integer
        '401':
          description: '- Missing, invalid or expired bearer token. — When: No or invalid bearer token (captured). — Fix:
            Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: Unknown ID (captured)
                  value:
                    Code: 100
                    Details: []
                    Message: Unknown error occur in system, please contact system administrator.
                    Parameters: 'bookmarkId: 99999999'
                    Url: https://{region-node}.timelog.com/{account}/api/v2/bookmarks/99999999
      x-timelog-key: rest.v2.navigation.bookmarks.delete
  /v2/filters/account-manager/content:
    get:
      operationId: filtersAccountManagerContentGetV2
      summary: List account manager filter options
      description: |-
        Returns one page of the employees who are account manager of at least one project, by name, as filter options, optionally narrowed by search text.

        Returns each employed employee (Ansat = 1, SystemEmployeeType not 1) who is the account manager of at least one project — any project, including closed projects and project templates — once, ordered by "first last" name. Search text matches the full name or the initials. NOT scoped to the caller: every such employee of the tenant is returned. The AccountManager feature hides this filter from the filter list but is not checked here. Personal data (employee names).

        **Use it to:**
        - Fill the account-manager picker; send the chosen values as accountManagerIds to the project dropdown

        **Not for:**
        - Listing employees — use the employee operations

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v2/filters/list/{pageIdentifier}`

        **Next:** `GET /v2/filters/project/content`

        **See also:** `GET /v2/filters/project-manager/content`

        > **Not yet documented:** examples; purpose → description.
      tags:
      - Navigation (menus, bookmarks, pages, filters)
      parameters:
      - name: pageIdentifier
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/PageIdentifier'
        description: |-
          Required for route binding (404 when omitted); otherwise ignored.

          Allowed values: see `PageIdentifier`.
      - name: skip
        in: query
        required: true
        schema:
          type: integer
          format: int32
        description: Rows to skip (SQL OFFSET). Required (404 when omitted).
      - name: take
        in: query
        required: true
        schema:
          type: integer
          format: int32
        description: Rows to return (SQL FETCH NEXT). Required (404 when omitted); no upper bound.
      - name: searchText
        in: query
        required: false
        schema:
          type: string
          x-timelog-filter:
            operators:
            - contains
        description: |-
          Keeps employees whose "first last" name or initials contain the text (LIKE '%text%'). Omitted / null = all.

          Filters on `employee full name or initials` (contains).
      responses:
        '200':
          description: |-
            A list, wrapped in the TAF list envelope (`Entities[].Properties`). Value = employee ID (send back as accountManagerIds); DisplayText = "<first name> <last name>" (initials are searched but not returned).

            Paged with `skip` and `take`.

            Order: "First last" name.

            Empty result: 200 with only the self link (no Entities).
          content:
            application/json:
              schema:
                type: object
                description: 'TAF list envelope: each item is in `Entities[].Properties`.'
                properties:
                  Entities:
                    type: array
                    description: Omitted (not `[]`) when the list is empty.
                    items:
                      type: object
                      properties:
                        Properties:
                          $ref: '#/components/schemas/FilterDropdownItemRead'
                        Links:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafLink'
                        Actions:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafAction'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
        '400':
          description: '- **Code 200** — The request body or parameters failed input validation. — When: pageIdentifier not
            a member name nor an integer, or skip / take not an integer (model binding; src_only). — Fix: Fix every item listed
            in Details and resend.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '401':
          description: '- Missing, invalid or expired bearer token. — When: No or invalid bearer token, once the action matched.
            — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '404':
          description: '- The route matched a controller, but no action accepts the supplied query parameters — typically
            a required (non-nullable) simple parameter such as a DateTime was omitted. It is a missing-parameter error that
            looks like a 404. — When: pageIdentifier, skip or take omitted — also without a token, since action selection
            runs before authorization (captured: every scenario omitted them).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v2.navigation.filters.accountmanagerdropdowncontent
  /v2/filters/approval-manager/content:
    get:
      operationId: filtersApprovalManagerContentGetV2
      summary: List approval manager filter options
      description: |-
        Returns one page of the users who are approval manager of at least one active user, by name, as filter options, optionally narrowed by search text.

        Returns each user who is the approval manager of at least one active user of type 0, ordered by "First Last (INITIALS)". Only the managed users are filtered on active state and type — the manager is listed even if they are inactive themselves. Search text matches the first name, the last name or the initials separately. NOT scoped to the caller: every such manager of the tenant is returned. Value is the USER ID, which the employee dropdown accepts as approvalManagerIds. Personal data (names, initials).

        **Use it to:**
        - Fill the approval-manager picker; send the chosen values as approvalManagerIds to the employee dropdown

        **Not for:**
        - Reading a user's approval manager — use the employee / user operations

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v2/filters/list/{pageIdentifier}`

        **Next:** `GET /v2/filters/employee/content`

        **See also:** `GET /v2/filters/project-manager/content`

        > **Not yet documented:** examples.
      tags:
      - Navigation (menus, bookmarks, pages, filters)
      parameters:
      - name: pageIdentifier
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/PageIdentifier'
        description: |-
          Required for route binding (404 when omitted); otherwise ignored.

          Allowed values: see `PageIdentifier`.
      - name: skip
        in: query
        required: true
        schema:
          type: integer
          format: int32
        description: Rows to skip (SQL OFFSET). Required (404 when omitted).
      - name: take
        in: query
        required: true
        schema:
          type: integer
          format: int32
        description: Rows to return (SQL FETCH NEXT). Required (404 when omitted); no upper bound.
      - name: searchText
        in: query
        required: false
        schema:
          type: string
          x-timelog-filter:
            operators:
            - contains
        description: |-
          Keeps managers whose first name, last name or initials contain the text (LIKE '%text%', each column separately). Omitted / null = all.

          Filters on `manager first name, last name or initials` (contains).
      responses:
        '200':
          description: |-
            A list, wrapped in the TAF list envelope (`Entities[].Properties`). Value = user ID of the manager (send back as approvalManagerIds); DisplayText = "<first name> <last name> (<initials>)".

            Paged with `skip` and `take`.

            Order: DisplayText ("First Last (INITIALS)").

            Empty result: 200 with only the self link (no Entities).
          content:
            application/json:
              schema:
                type: object
                description: 'TAF list envelope: each item is in `Entities[].Properties`.'
                properties:
                  Entities:
                    type: array
                    description: Omitted (not `[]`) when the list is empty.
                    items:
                      type: object
                      properties:
                        Properties:
                          $ref: '#/components/schemas/FilterDropdownItemRead'
                        Links:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafLink'
                        Actions:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafAction'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
        '400':
          description: '- **Code 200** — The request body or parameters failed input validation. — When: pageIdentifier not
            a member name nor an integer, or skip / take not an integer (model binding; src_only). — Fix: Fix every item listed
            in Details and resend.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '401':
          description: '- Missing, invalid or expired bearer token. — When: No or invalid bearer token, once the action matched.
            — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '404':
          description: '- The route matched a controller, but no action accepts the supplied query parameters — typically
            a required (non-nullable) simple parameter such as a DateTime was omitted. It is a missing-parameter error that
            looks like a 404. — When: pageIdentifier, skip or take omitted — also without a token, since action selection
            runs before authorization (captured: every scenario omitted them).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v2.navigation.filters.approvalmanagerdropdowncontent
  /v2/filters/competence/content:
    get:
      operationId: filtersCompetenceContentGetV2
      summary: List competence filter options
      description: |-
        Returns up to maxResults (default 30) of the tenant's active competences as filter options, optionally narrowed by search text.

        Returns active competences with their competence group; the SQL takes the first maxResults ordered by group name then competence name, and the manager re-sorts them by competence name. The group is read but not returned, so equally named competences of different groups are indistinguishable. Search text matches the competence name. competenceIds / isCompetenceInclusive are accepted but IGNORED. Tenant configuration, not scoped to the caller (not filed).

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v2/filters/list/{pageIdentifier}`

        > **Not yet documented:** examples.
      tags:
      - Navigation (menus, bookmarks, pages, filters)
      parameters:
      - name: pageIdentifier
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/PageIdentifier'
        description: |-
          Required for route binding (404 when omitted); otherwise ignored.

          Allowed values: see `PageIdentifier`.
      - name: searchText
        in: query
        required: false
        schema:
          type: string
          x-timelog-filter:
            operators:
            - contains
        description: |-
          Keeps competences whose name contains the text (LIKE '%text%'). Omitted / null = all.

          Filters on `competence name` (contains).
      - name: maxResults
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 30
        description: Maximum options returned (SQL TOP). Omitted = 30.
      - name: competenceIds
        in: query
        required: false
        schema:
          type: string
        description: Accepted but IGNORED — not even parsed.
      - name: isCompetenceInclusive
        in: query
        required: false
        schema:
          type: boolean
          default: true
        description: Accepted but IGNORED.
      responses:
        '200':
          description: |-
            A list, wrapped in the TAF list envelope (`Entities[].Properties`). Value = competence ID; DisplayText = competence name (the group name is not included).

            Order: Competence name (in memory), over the first maxResults by group name then competence name.

            Empty result: 200 with only the self link (no Entities).
          content:
            application/json:
              schema:
                type: object
                description: 'TAF list envelope: each item is in `Entities[].Properties`.'
                properties:
                  Entities:
                    type: array
                    description: Omitted (not `[]`) when the list is empty.
                    items:
                      type: object
                      properties:
                        Properties:
                          $ref: '#/components/schemas/FilterDropdownItemRead'
                        Links:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafLink'
                        Actions:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafAction'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
        '400':
          description: '- **Code 200** — The request body or parameters failed input validation. — When: pageIdentifier not
            a member name nor an integer, or maxResults / isCompetenceInclusive not parseable (model binding; src_only). —
            Fix: Fix every item listed in Details and resend.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '401':
          description: '- Missing, invalid or expired bearer token. — When: No or invalid bearer token, once the action matched.
            — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '404':
          description: '- The route matched a controller, but no action accepts the supplied query parameters — typically
            a required (non-nullable) simple parameter such as a DateTime was omitted. It is a missing-parameter error that
            looks like a 404. — When: pageIdentifier omitted — also without a token, since action selection runs before authorization
            (captured: every scenario omitted it).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v2.navigation.filters.competencedropdowncontent
  /v2/filters/contact/content:
    get:
      operationId: filtersContactContentGetV2
      summary: List contact filter options
      description: |-
        Returns one page of the customer contact persons that are the contact of at least one project, by name, optionally limited to given customers.

        Returns each customer contact person that is set as the contact of at least one project — any project state; no contact or project state filter is applied — once, ordered by "first last" name. customerIds limits the list to contacts of those customers (always inclusive; there is no exclude switch). Search text matches the initials, first name or last name. NOT scoped to the caller: contacts of every customer of the tenant are returned. Personal data of external people (customer contact names).

        **Use it to:**
        - Fill the contact picker, narrowed to the customers chosen in the customer dropdown

