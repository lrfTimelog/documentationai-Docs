        PageUrl:
          type:
          - string
          - 'null'
          readOnly: true
          description: |-
            Effectively never present.

            Null: Omitted (NullValueHandling.Ignore).
        PageActions:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/PageActionRead'
          readOnly: true
          description: |-
            The page's static actions from its definition in code, each with how it opens. Omitted when the page defines none (none of the 10 pages in the capture had any). Context-dependent actions that need an entity ID are not resolved here.

            Null: Omitted when the page has no actions.
      description: The page catalogue is defined in code (not tenant data); which pages are returned depends on tenant configuration
        and the caller's access.
    ResponseError:
      type: object
      description: Error body for validation (400), privilege (403), business-rule (422/500) and other server errors. `Details`
        lists strings for validation errors, or `{ErrorCode, Message}` objects for business-rule violations. `Parameters`
        echoes the request arguments, including the full payload.
      properties:
        Code:
          type: integer
          description: 'TimeLog error class (not the HTTP status): 100 unexpected, 102 business rule, 103 privilege, 200 validation.'
        Message:
          type: string
        Details:
          type: array
          items: {}
        Parameters:
          type:
          - string
          - object
          - 'null'
        Url:
          type: string
    TafAction:
      type: object
      description: A hypermedia action the caller may take on the object. Present only where the operation registers actions.
    TafLink:
      type: object
      properties:
        Href:
          type: string
        Rel:
          type: string
    TafListPaging:
      type: object
      description: 'Paging values. They are returned as STRINGS, for example `"TotalRecord": "12"`.'
      properties:
        TotalRecord:
          type: string
        TotalPage:
          type: string
        PageNumber:
          type: string
