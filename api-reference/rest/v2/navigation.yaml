        PageType:
          type:
          - string
          - 'null'
          enum:
          - Normal
          - Setting
          - LinkToPage
          - Modal
          - Extranet
          - ConnectedPage
          x-enum-descriptions:
          - An ordinary application page.
          - A settings page (system administration). A user whose roles grant at least one Setting page may see the system
            administration menu (subject to licence).
          - A page whose action only redirects to the final page (e.g. MyProjects). Not shown in permission control.
          - A page that opens as a modal dialog (e.g. ProjectAddResourceToTasks). Not shown in permission control.
          - An extranet page (e.g. ExtranetLogin). Not shown in permission control.
          - A page connected to an event-type group (e.g. NewProject). Not shown in permission control.
          readOnly: true
          description: |-
            Kind of page (normal, setting, modal ...). Omitted when the entry has no page.

            Null: Omitted when the entry has no page.

            Allowed values:

            | Value | Name | Meaning |
            |---|---|---|
            | `0` | Normal | An ordinary application page. |
            | `1` | Setting | A settings page (system administration). A user whose roles grant at least one Setting page may see the system administration menu (subject to licence). |
            | `2` | LinkToPage | A page whose action only redirects to the final page (e.g. MyProjects). Not shown in permission control. |
            | `3` | Modal | A page that opens as a modal dialog (e.g. ProjectAddResourceToTasks). Not shown in permission control. |
            | `4` | Extranet | An extranet page (e.g. ExtranetLogin). Not shown in permission control. |
            | `5` | ConnectedPage | A page connected to an event-type group (e.g. NewProject). Not shown in permission control. |
