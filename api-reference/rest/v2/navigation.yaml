        **Not for:**
        - Searching projects with their details — use the project search operations (REST v1 Project)

        **Rules across fields:**
        - R1: Each is...Inclusive flag only has an effect when its ID list is non-empty.
        - R2: All supplied ID-list restrictions apply together (AND).

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Consistency: eventual

