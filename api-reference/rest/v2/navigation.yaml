      parameters:
      - name: pageIdentifier
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/PageIdentifier'
        description: |-
          Required for route binding (404 when omitted). Only NewResourcePlanner changes the result: then only projects with IsAvailableInResourcePlanner = 1.

          Allowed values: see `PageIdentifier`.
      - name: skip
        in: query
        required: true
        schema:
          type: integer
          format: int32
        description: Rows to skip (SQL OFFSET). Required (404 when omitted).
      - name: take
        in: query
        required: true
        schema:
          type: integer
          format: int32
        description: Rows to return (SQL FETCH NEXT). Required (404 when omitted); no upper bound.
      - name: searchText
        in: query
        required: false
        schema:
          type: string
          x-timelog-filter:
            operators:
            - contains
        description: |-
          Keeps projects whose name or project number contains the text (LIKE '%text%'). Omitted / null = no text filter.

          Filters on `project name or project number` (contains).
      - name: projectManagerIds
        in: query
        required: false
        schema:
          type: string
          x-timelog-filter:
            operators:
            - in
        description: |-
          Employee IDs of project managers (from `GET /v2/filters/project-manager/content`).

          Several values: one string, separated by `,`.

          Filters on `project manager (employee ID)` (in).
      - name: isProjectManagerInclusive
