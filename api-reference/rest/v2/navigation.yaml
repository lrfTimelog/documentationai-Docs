          - Main
          - Page
          - SystemAdministration
          - PageSetting
          - PersonalSettings
          x-enum-descriptions:
          - Main navigation. Returned by /v2/menus/main and by /v2/menus/create (the create menu is built from Main-type entries).
          - A page's own sub-menu (legacy page and report menus). Not returned by any /v2/menus/* route.
          - System administration menu (/v2/menus/system-administration). Names come from the system-settings resources instead
            of the main-page resources.
          - Page settings menu (/v2/menus/page-settings). PageUrl points at the page's personal page-settings screen, not
            at the page itself.
          - 'Personal settings menu (/v2/menus/personal-settings): the user''s own preferences and profile pages.'
          readOnly: true
          description: |-
            The menu this entry was built for; the same for every entry of one call.

            Allowed values:

            | Value | Name | Meaning |
            |---|---|---|
            | `0` | Main | Main navigation. Returned by /v2/menus/main and by /v2/menus/create (the create menu is built from Main-type entries). |
            | `1` | Page | A page's own sub-menu (legacy page and report menus). Not returned by any /v2/menus/* route. |
            | `2` | SystemAdministration | System administration menu (/v2/menus/system-administration). Names come from the system-settings resources instead of the main-page resources. |
            | `3` | PageSetting | Page settings menu (/v2/menus/page-settings). PageUrl points at the page's personal page-settings screen, not at the page itself. |
            | `4` | PersonalSettings | Personal settings menu (/v2/menus/personal-settings): the user's own preferences and profile pages. |
        IsParent:
          type: boolean
          readOnly: true
          description: true for the entries defined at the top level of the menu (group headings and top-level page links
            such as "Front page"); false for entries inside a group's SubMenus. It does not say whether SubMenus is present.
        PageUrl:
          type:
          - string
          - 'null'
          format: uri
          readOnly: true
          description: |-
            Where the entry navigates. Omitted when the entry has no page.

            Null: Omitted when the entry has no page.

            - Type = PageSetting — The page's personal page-settings URL, '~' replaced by the frontend address (DesignSeven) or <scheme>://<host>/<site> (DesignSix).

            - PageVersion = DesignSeven (other menu types) — A RELATIVE SPA route: '/' + the non-empty area/controller/action segments, e.g. '/' for the front page.

            - PageVersion = DesignSix (other menu types) — An absolute legacy URL <scheme>://<host>/<site>/<area>/<controller>/<action>; an 'Index' action is dropped.
