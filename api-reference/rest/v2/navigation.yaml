        schema:
          type: boolean
          default: true
        description: Include / exclude switch for accountManagerIds.
      - name: projectDepartmentIds
        in: query
        required: false
        schema:
          type: string
          x-timelog-filter:
            operators:
            - in
        description: |-
          Department IDs (from `GET /v2/filters/project-department/content`).

          Several values: one string, separated by `,`.

          Filters on `project department (department ID)` (in).
      - name: isProjectDepartmentInclusive
        in: query
        required: false
        schema:
          type: boolean
          default: true
        description: Include / exclude switch for projectDepartmentIds.
      - name: customerIds
        in: query
        required: false
        schema:
          type: string
          x-timelog-filter:
            operators:
            - in
        description: |-
          Customer IDs (from `GET /v2/filters/customer/content`).

