        '400':
          description: '- **Code 200** — The request body or parameters failed input validation. — When: pageIdentifier not
            a member name nor an integer, or maxResults / an is...Inclusive flag not parseable (model binding; src_only).
            — Fix: Fix every item listed in Details and resend.'
