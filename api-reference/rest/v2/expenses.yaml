components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: |-
        OAuth 2.0 bearer token, sent as `Authorization: Bearer <token>`. JWT and reference tokens are both accepted. The token must carry the required scope (default `tlp`).

        The token's `sub` claim is the acting user. A token WITHOUT `sub` (client-credentials) acts as the system service user. If the `sub` user cannot log in (inactive, locked, deleted), the request is rejected with 401 — it is no longer let through without a user.

        > **Not yet documented:** how to obtain a token.

        > **Not yet documented:** token lifetime.
  schemas:
    CurrencyConversionRateRead:
      type: object
      properties:
        Amount:
          type: number
          format: double
          readOnly: true
          description: |-
            The rate between fromCurrencyID and toCurrencyID, quoted per 100 (same currency → 100). When the FROM currency was created by the account it is (from-currency stored rate × 100 / to-currency stored rate), and the date is ignored.

            Unit: rate per 100 units (100 = parity); quote direction see gaps

            - from-currency is a system currency — Provider rate(from ISO, to ISO, yyyy-MM-dd) × 100.

            - from-currency is account-created (IsCreatedByUser) — fromCurrency.Rate × 100 / toCurrency.Rate from the stored currency rows; the date is not used.

            > **Not yet documented:** constraints → unit.
      description: The conversion rate between two currencies on a date, quoted per 100 units, as the TimeLog expense form
        uses it to prefill an expense's exchange rate. One field.
    CurrencyRead:
      type: object
      properties:
        CurrencyID:
          type: integer
          readOnly: true
          x-timelog-identity:
            role: primary_id
            unique_scope: tenant
            uniqueness_enforced: true
            id_format: int
          description: |-
            Integer identifier. Send it as CurrencyID on customer create/update.

            Identifier of this object, unique per TimeLog site.
        CurrencyABB:
          type: string
          readOnly: true
          x-timelog-identity:
            role: alternate_key
            unique_scope: tenant
            uniqueness_enforced: true
            id_format: string
          maxLength: 10
          description: |-
            Currency code, e.g. "EUR", "DKK". ISO 4217 for system currencies; a account-created currency can carry any unique code.

            Alternate key, unique per TimeLog site.
        DescriptiveName:
          type: string
          readOnly: true
          maxLength: 255
          description: Display name, e.g. "Afghan afghani". NULL is returned as an empty string.
        CurrentRate:
          type: number
          format: double
          readOnly: true
          description: |-
            Today's exchange rate between this currency and the caller's legal-entity currency, quoted per 100 (100 = same value as the legal-entity currency), rounded to the account's invoice decimals. Computed per request from the exchange-rate service; for a account-created currency it is derived from the stored rates of both currencies.

            Unit: rate per 100 units (100 = parity with the caller's legal-entity currency)

            - That stored rate is not computed against the legal-entity currency.

            - Always — Rounded half away from zero to InvoiceSetting_NumberOfDecimals.

            Direction of the quote (how many LE-currency units per 100 of this currency, or the reverse) is not established from source; only parity (same currency → 100) is.

            > **Not yet documented:** notes.
