    get:
      operationId: getExchangeRateForCurrenciesOnDateV2
      summary: Get the exchange rate between two currencies on a date
      description: |-
        Returns the conversion rate (per 100) between two currencies on a date, as TimeLog's expense form uses it to prefill an expense's exchange rate.

        If the FROM currency was created by the account, the rate is computed from the stored rates of both currencies instead, and the date is ignored.

        **Use it to:**
        - Expense or receipt-capture app suggesting ExchangeRate for a foreign-currency receipt before POST /v2/employee-expense (`POST /v2/employee-expense`)

        **Not for:**
        - The currency list with today's rate against the caller's legal-entity currency — `GET /v1/currency/{status}`

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Side effect: One outbound HTTP GET &#123;CurrencyExchangeServiceAddress&#125;/api/CurrencyExchange/&#123;fromISO&#125;/&#123;toISO&#125;/&#123;yyyy-MM-dd&#125; per try, with the TimeLog-Authorization header; each failure is written to the error log.
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v1/currency/{status}`

        **Next:** `POST /v2/employee-expense`, `PUT /v2/employee-expense`

        **See also:** `GET /v1/currency/{status}`

        > **Not yet documented:** errors; examples; response → success.
      parameters:
      - name: date
        in: query
        required: true
        schema:
          type: string
          format: date-time
        description: The rate date. Only the calendar date is sent to the provider (yyyy-MM-dd); ignored when the FROM currency
          is account-created. Omitting it means no action matches (404).
      - name: fromCurrencyID
        in: query
        required: true
        schema:
          type: integer
          format: int32
        description: The currency converted FROM (a CurrencyID from GET /v1/currency). Omitting it → 404 (no action matches).
      - name: toCurrencyID
        in: query
        required: true
        schema:
          type: integer
          format: int32
        description: The currency converted TO. Omitting it → 404 (no action matches).
      responses:
        '200':
          description: |-
            The object, wrapped in the TAF envelope (`Properties`). {"Properties":{"Amount":<rate per 100>}, "Links": …}. No TAF actions.

            Order: none

            Empty result: none
          content:
            application/json:
              schema:
                type: object
                description: 'TAF envelope: the object is in `Properties`. Null members are omitted; a null result is `{"Links":
                  [self]}` without `Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/CurrencyConversionRateRead'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
                  Actions:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafAction'
        '400':
          description: '- **Code 200** — The request body or parameters failed input validation. — When: A parameter that
            cannot be converted (e.g. date=abc) — Web API model binding marks the model state invalid (not captured). — Fix:
            Fix every item listed in Details and resend.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '401':
          description: '- Missing, invalid or expired bearer token. — When: All three parameters present and no / invalid
            token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '404':
          description: '- The route matched a controller, but no action accepts the supplied query parameters — typically
            a required (non-nullable) simple parameter such as a DateTime was omitted. It is a missing-parameter error that
            looks like a 404. — When: date, fromCurrencyID or toCurrencyID missing — returned BEFORE authentication, so a
            request without a token also gets 404 (captured).'
          content:
