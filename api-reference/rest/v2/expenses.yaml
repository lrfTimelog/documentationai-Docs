        and short-lived download URLs for the attached receipts — but, unlike v1, not the approval status. Optional nested
        objects (Project, Currency, ExpenseType, PaymentMethod) are filled only on $expand. The TAF self link points to GET
        /v2/employee-expense/{EmployeeExpenseID}; each entity also carries the expense TAF actions.'
    EmployeeExpenseUpdateV2:
