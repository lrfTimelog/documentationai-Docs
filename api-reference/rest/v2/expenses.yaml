            The project contract the expense is booked on. Send the expense's current contract to keep it, or another contract of ProjectID to move it.

            Refers to `ContractRead.ProjectSubContractID`. Look up valid values with `GET /v1/contract`.

            - omitted or 0 — Written as 0 (non-nullable int, no validator rule); no contract 0 exists on the project → 500 Code 102 / 37042.

            - not a contract of ProjectID — 37042.

            - a prepaid-services contract — 31134 (rest.projectmanagement.expense-contract-prepaid).

            - an inactive (not Active) contract of ProjectID — The active-status rule is skipped on update.

            Requirement is effective, not declared: the C# property is a plain int and the validator has no rule for it.

            Valid values come from `GET /v1/contract`.
