            - omitted — Written as 0 (full replacement).
        IsBillable:
          type: boolean
          default: false
          description: |-
            Whether the expense is billable to the customer.

            - omitted — Written as false (full replacement).

            > **Not yet documented:** behaviour.
        Comment:
          type:
          - string
          - 'null'
          maxLength: 255
          description: |-
            Free-text comment.

            Null: Omitted or null clears the stored comment (full replacement).

            > **Not yet documented:** constraints → max length.
        ExchangeRate:
          type: number
          format: double
          description: |-
            Exchange rate from CurrencyID to the owner's legal-entity currency.

            A suggested value for a date: GET /v2/exchange-rate (`GET /v2/exchange-rate`) — the call the TimeLog expense form makes.

            > **Not yet documented:** constraints → unit.
        CurrencyID:
          type: integer
          format: int32
          x-timelog-identity:
            role: reference
          description: |-
            Currency of Amount and VatAmount.

            Refers to `CurrencyRead.CurrencyID`. Look up valid values with `GET /v1/currency/{status}`.

            Valid values come from `GET /v1/currency/{status}`.
        ExpenseTypeID:
          type: integer
          format: int32
          x-timelog-identity:
            role: reference
          description: |-
            The expense type; must belong to the owner's legal entity.

            Refers to `ExpenseTypeRead.ExpenseTypeID`. Look up valid values with `GET /v1/expense-type/{status}`.

            Valid values come from `GET /v1/expense-type/{status}`.
        PaymentMethodID:
          type: integer
          format: int32
          x-timelog-identity:
            role: reference
          description: |-
            How the employee paid.

            Refers to `PaymentMethodRead.PaymentMethodID`. Look up valid values with `GET /v1/payment-method/{status}`.
        ProjectID:
          type: integer
          format: int32
          x-timelog-identity:
            role: reference
          description: |-
            The project the expense is booked on.

            Refers to `ProjectHeaderRead.ProjectID`. Look up valid values with `GET /v1/project-header/search-for-expense-travel-registration-order-by-recent-registration`.

            - changed — Accepted when ProjectSubContractID is a contract of the NEW project (otherwise 37042).

            - unchanged — Project must not be Completed (38006).

            Valid values come from `GET /v1/project-header/search-for-expense-travel-registration-order-by-recent-registration`.
        ProjectSubContractID:
          type: integer
