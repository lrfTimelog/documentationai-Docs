openapi: 3.1.0
info:
  title: Expenses — REST API v2
  version: v2
  description: |-
    Employee expenses (out-of-pocket costs to reimburse) with their receipts, project expenses (company costs such as supplier invoices booked on projects), mileage (car travel) registrations, expense types, the caller's expense totals, the address helpers of the mobile mileage form, and the lookups behind them (mileage rates, payment methods, product numbers, the product catalogue).

    Enums are strings (member names) in v2 responses.

    **Conventions that apply to every operation in this file:**
    - Property names are PascalCase.
    - Successful bodies use the TAF envelope: one object in `Properties`, lists in `Entities[].Properties`.
    - Some operations succeed without content: HTTP 200 with the literal body `null`, or HTTP 204.
    - `PUT` replaces the whole object: omitted fields are reset.
    - Treat error `Code` 102 as a business-rule violation, whether the HTTP status is 422 or 500.

    > **Not yet documented:** rate limits.
servers:
- url: https://app{server-number}.timelog.com/{account}/api
  description: If your browser shows `https://app.timelog.com`, find your site URL in System Administration > Integrations
    and API > Reporting API settings, under Your TimeLog API URL.
  variables:
    server-number:
      default: '3'
    account:
      default: your-account
security:
- bearer: []
paths:
  /v2/employee-expense:
    get:
      operationId: listEmployeeExpensesV2
      summary: List employee expenses (v2)
      description: |-
        Lists employee expenses, newest first, optionally for one user and a date range, one page at a time (v2 route; no approval status).

        The v2 route of `GET /v1/employee-expense` — same filters (userID, startDate, endDate), paging, ordering, $expand and 15-minute receipt URLs, and the same missing caller scope. Entities have no Status field, so approved expenses cannot be filtered client-side either.

        **Use it to:**

        **Not for:**
        - Pulling approved expenses for payroll / finance — v2 has no approval status; use `GET /v1/employee-expense`
        - One expense by ID — `GET /v2/employee-expense/{employeeExpenseID}` (it enforces the owner check)

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v1/user`

        **Next:** `GET /v2/employee-expense/{employeeExpenseID}`, `PUT /v2/employee-expense`

        **See also:** `GET /v1/employee-expense`

        > **Not yet documented:** request → query params → $expand.
      parameters:
      - name: userID
        in: query
        required: false
        schema:
          type: integer
          format: int32
          x-timelog-filter:
            operators:
            - eq
        description: |-
          Only expenses of this user (a USER ID). Omitted = all employees.

          Filters on `EmployeeExpenseReadV2.EmployeeUserID` (eq).
      - name: startDate
        in: query
        required: false
        schema:
          type: string
          format: date-time
          x-timelog-filter:
            operators:
            - gte
        description: |-
          Inclusive lower bound on the expense date.

          Filters on `EmployeeExpenseReadV2.Date` (gte).
      - name: endDate
        in: query
        required: false
        schema:
          type: string
          format: date-time
          x-timelog-filter:
            operators:
            - lte
        description: |-
          Inclusive upper bound on the expense date (stored values are midnight).

          Filters on `EmployeeExpenseReadV2.Date` (lte).
      - name: $page
        in: query
        required: false
        schema:
          type: integer
          default: 1
        description: Page number.
      - name: $pagesize
        in: query
        required: false
        schema:
          type: integer
          default: 10
        description: Page size. No maximum enforced in the API layer.
      - name: $expand
        in: query
        required: false
        schema:
          type: string
          enum:
          - project
          - currency
          - expenseType
          - paymentMethod
          x-enum-descriptions:
          - Fill Project (and its customer).
          - Fill Currency.
          - Fill ExpenseType.
          - Fill PaymentMethod.
        description: |-
          Comma-separated list of nested objects to embed.

          Several values: one string, separated by `,`.

          Allowed values:

          | Value | Name | Meaning |
          |---|---|---|
          | `project` | project | Fill Project (and its customer). |
          | `currency` | currency | Fill Currency. |
          | `expenseType` | expenseType | Fill ExpenseType. |
          | `paymentMethod` | paymentMethod | Fill PaymentMethod. |
      responses:
        '200':
          description: |-
            A list, wrapped in the TAF list envelope (`Entities[].Properties`). One page of expenses. Properties carry TotalRecord, TotalPage, PageNumber (strings); each entity has a self link and the expense TAF actions.

            Paged with `$page` (default 1) and `$pagesize` (default 10).

            Order: Date descending, then EmployeeExpenseID descending (stable)

            Empty result: 200 with no Entities
          content:
            application/json:
              schema:
                type: object
                description: 'TAF list envelope: each item is in `Entities[].Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/TafListPaging'
                  Entities:
                    type: array
                    description: Omitted (not `[]`) when the list is empty.
                    items:
                      type: object
                      properties:
                        Properties:
                          $ref: '#/components/schemas/EmployeeExpenseReadV2'
                        Links:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafLink'
                        Actions:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafAction'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v2.expenses.employeeexpense.list
    post:
      operationId: createEmployeeExpenseV2
      summary: Create an employee expense (v2)
      description: |-
        Creates an employee expense for the caller or on behalf of another user, and returns it (v2 route).

        The v2 route of `POST /v1/employee-expense` — same body (EmployeeExpenseCreate, UserID and ProjectSubContractID included), same on-behalf rule, same business rules and errors. The response is the created expense in the v2 shape (no Status). Receipts are attached in a second call to the returned EmployeeExpenseID.

        **Use it to:**
        - Receipt-capture app booking a receipt line, then uploading the receipt to the returned ID (v2 client)

        **Not for:**
        - Mileage — `POST /v1/mileage-registration`
        - Company costs on a project — `POST /v1/project-expense`

        **Rules across fields:**
        - R1: ProjectSubContractID, when > 0, must belong to ProjectID, be Active and not be prepaid services.
        - R2: ExpenseTypeID must belong to the owner's (UserID or caller) legal entity.
        - R3: IsBillable must be true when the resolved contract is fixed-price.
        - R4: Date must be inside the owner's employment and not in a closed accounting period.

        **Behaviour:**
        - Not idempotent.
        - Not safe to retry blindly. Each call creates a new expense; nothing deduplicates. After a lost response, list the owner's expenses for the date (GET /v2/employee-expense?userID=&startDate=&endDate=) before retrying.
        - Duplicates: Not deduplicated.
        - Side effect: Creates the employee expense with the conversion rates to the project's and the owner's legal-entity currencies.
        - On failure: No transaction wraps the insert and the follow-up writes: a failure after the insert returns 500 while the expense row stays.
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v1/project-header/search-for-expense-travel-registration-order-by-recent-registration`, `GET /v1/currency/{status}`, `GET /v1/user`, `GET /v1/expense-type/{status}`, `GET /v1/payment-method/{status}`

        **Next:** `POST /v2/employee-expense/{employeeExpenseID}/image`, `POST /v2/employee-expense/{employeeExpenseID}/file`, `GET /v2/employee-expense/{employeeExpenseID}`

        **See also:** `POST /v1/employee-expense`, `POST /v1/project-header/employee-expense`

        > **Not yet documented:** examples.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeExpenseCreate'
      responses:
        '200':
          description: |-
            The object, wrapped in the TAF envelope (`Properties`). The created expense, read back through the v2 GET-by-ID code (attachment lists empty, no Status).

            Order: none

            Empty result: none
          content:
            application/json:
              schema:
                type: object
                description: 'TAF envelope: the object is in `Properties`. Null members are omitted; a null result is `{"Links":
                  [self]}` without `Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/EmployeeExpenseReadV2'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
                  Actions:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafAction'
        '400':
          description: '- **Code 200** — The request body or parameters failed input validation. — When: Body validator: Date
            missing; ExchangeRate ≤ 0; CurrencyID / ExpenseTypeID / PaymentMethodID / ProjectID ≤ 0; UserID ≤ 0 (captured).
            — Fix: Fix every item listed in Details and resend.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '403':
          description: '- **Code 103** — The authenticated user lacks a privilege the operation requires. On time registrations
            this is raised when the caller is not the registration''s owner and has no registration privilege that covers
            the owner. — When: UserID is another user and the caller is not covered by the on-behalf rule.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '500':
          description: |-
            - **Code 100** — Unhandled server error.

            - **Code 37040** — UserID is set, differs from the caller and is not an existing user ID. — Fix: Send a user ID (GET /v1/user), not an employee ID — or omit UserID to register for yourself.

            - **Code 37931** — UserID exists but the user is deactivated. New registrations cannot be created for inactive users. — Fix: Register for an active user.

            - **Code 37042** — ProjectSubContractID (> 0) is not a contract of ProjectID (or does not exist). — Fix: Send a contract of the same project, or 0 / omit it to use the project's default contract.

            - **Code 31132** — The explicitly supplied ProjectSubContractID is not in status Active. — Fix: Choose an active contract of the project.

            - **Code 31134** — The explicitly supplied ProjectSubContractID is a prepaid-services contract. — Fix: Choose a non-prepaid contract, or omit ProjectSubContractID.

            - **Code 37806** — The resolved contract is closed. — Fix: Book on an open contract.

            - **Code 37019** — ExpenseTypeID does not exist. — Fix: Use an expense type ID of the owner's legal entity.

            - **Code 37998** — Fix: Use an expense type of the owner's legal entity anyway; the API will not stop you.

            - **Code 37014** — ProjectID does not exist. — Fix: Use a ProjectID from a project-header search.

            - **Code 37689** — The project is inactive. — Fix: Use an active project.

            - **Code 37691** — The project's default-for-expenses contract (or, when there is none, its main contract) is closed. — Fix: Reopen the contract or send an explicit active ProjectSubContractID.

            - **Code 37690** — The project has no default-for-expenses contract and its main contract is prepaid services. — Fix: Send an explicit non-prepaid ProjectSubContractID.

            - **Code 31140** — The contract the expense is booked on is fixed-price and IsBillable is false. — Fix: Send IsBillable true for fixed-price contracts.

            - **Code 37018** — PaymentMethodID does not exist. — Fix: Use an existing payment method ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v2.expenses.employeeexpense.create
    put:
      operationId: updateEmployeeExpenseV2
      summary: Update an employee expense (v2)
      description: |-
        Replaces the amounts, date, currency, type, payment method, billability, comment, project AND contract of an unapproved employee expense (v2 route).

        A full replacement (PUT), like `PUT /v1/employee-expense`, with one contract difference: v2 also takes ProjectSubContractID, and it must be sent — an omitted contract is 0 and fails with 37042. Because the contract is part of the body, v2 can move an expense to another contract or another project (send a contract of that project); v1 cannot. The owner cannot be changed. The response body is JSON null.

        **Use it to:**
        - Expense app letting an employee correct an expense before approval, including its project / contract
        - Receipt-capture integration filling in amount / VAT / currency after OCR of the uploaded receipt

        **Not for:**
        - Changing the owner — delete and re-create the expense
        - Changing receipts — the attach / delete image and file operations

        **Rules across fields:**
        - R1: ProjectSubContractID must be a contract of ProjectID (0 / omitted included → rejected). To change the project, send a contract of the new project.
        - R2: ProjectSubContractID must not be a prepaid-services contract. An inactive contract is accepted on update.
        - R3: ExpenseTypeID must belong to the owner's legal entity.
        - R4: Date must be inside the owner's employment and not in a closed accounting period.

        **Behaviour:**
        - Idempotent.
        - Same body → same stored values; last write wins (no concurrency token).
        - Safe to retry.
        - Duplicates: n/a
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v2/employee-expense/{employeeExpenseID}`, `GET /v1/contract`

        **Next:** `GET /v2/employee-expense/{employeeExpenseID}`

        **See also:** `PUT /v1/employee-expense`, `DELETE /v2/employee-expense/{employeeExpenseID}`

        > **Not yet documented:** examples; request → cross field rules → R2.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeExpenseUpdateV2'
      responses:
        '200':
          description: |-
            Success without content: HTTP 200 with the literal JSON body `null`. Body is the JSON literal null.

            Order: none

            Empty result: none
          content:
            application/json:
              schema:
                type: 'null'
        '400':
          description: '- **Code 200** — The request body or parameters failed input validation. — When: EmployeeExpenseID
            ≤ 0; Date missing; ExchangeRate ≤ 0; CurrencyID / ExpenseTypeID / PaymentMethodID / ProjectID ≤ 0 (captured).
            ProjectSubContractID has no validator rule. — Fix: Fix every item listed in Details and resend.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '500':
          description: |-
            - **Code 100** — Unhandled server error.

            - **Code 37042** — ProjectSubContractID (> 0) is not a contract of ProjectID (or does not exist). — When: ProjectSubContractID omitted / 0, unknown, or not a contract of ProjectID. — Fix: Send a contract of the same project, or 0 / omit it to use the project's default contract.

            - **Code 31134** — The explicitly supplied ProjectSubContractID is a prepaid-services contract. — When: ProjectSubContractID is a prepaid-services contract. — Fix: Choose a non-prepaid contract, or omit ProjectSubContractID.

            - **Code 37700** — The expense is approved (Status = Approved) and can no longer be changed.

            - **Code 37698** — The expense has been invoiced or vouchered.

            - **Code 38006** — The (new) ProjectID's project has order status Completed.

            - **Code 38007** — The expense's contract has status Completed.

            - **Code 37019** — ExpenseTypeID does not exist. — Fix: Use an expense type ID of the owner's legal entity.

            - **Code 37998** — Fix: Use an expense type of the owner's legal entity anyway; the API will not stop you.

            - **Code 37014** — ProjectID does not exist. — Fix: Use a ProjectID from a project-header search.

            - **Code 37689** — The project is inactive. — Fix: Use an active project.

            - **Code 37018** — PaymentMethodID does not exist. — Fix: Use an existing payment method ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v2.expenses.employeeexpense.update
  /v2/employee-expense/{employeeExpenseID}:
    delete:
      operationId: deleteEmployeeExpenseV2
      summary: Delete an employee expense (v2)
      description: |-
        Deletes an unapproved, uninvoiced employee expense together with all its receipt files (v2 route).

        **Use it to:**
        - Expense app withdrawing a draft expense
        - Integration rolling back an expense it created in error before approval

        **Not for:**
        - Removing only a receipt — `DELETE /v2/employee-expense/{employeeExpenseID}/image` / deletefile

        **Behaviour:**
        - Not idempotent.
        - A second delete of the same ID fails with 500 Code 100 (the expense no longer exists).
        - Safe to retry only under a condition. After a lost response, check with GET that the expense still exists before retrying.
        - Duplicates: n/a
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v2/employee-expense`, `GET /v2/employee-expense/{employeeExpenseID}`

        **See also:** `DELETE /v1/employee-expense/{employeeExpenseID}`, `DELETE /v2/employee-expense/{employeeExpenseID}/image`, `DELETE /v2/employee-expense/{employeeExpenseID}/file`

        > **Not yet documented:** examples.
      parameters:
      - name: employeeExpenseID
        in: path
        required: true
        schema:
          type: integer
          format: int32
        description: The expense's integer ID.
      responses:
        '200':
          description: |-
            Success without content: HTTP 200 with the literal JSON body `null`. Body is the JSON literal null.

            Order: none

            Empty result: none
          content:
            application/json:
              schema:
                type: 'null'
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '404':
          description: '- The URL did not match any route (including a route constraint such as {id:int} receiving a non-integer).
            — When: employeeExpenseID is not an integer (captured).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '500':
          description: |-
            - **Code 100** — Unhandled server error.

            - **Code 37681** — The caller is not the expense's employee and lacks the privilege RegistrationAllRegistrations. Department / legal-entity registration privileges are NOT enough here (unlike create and get). — Fix: Delete as the owner, or with a user holding 'all registrations'.

            - **Code 37703** — The expense is approved (Status = Approved).

            - **Code 37701** — The expense has been invoiced or vouchered.

            - **Code 37702** — The expense date lies in a closed accounting period of the owner's employment.

            - **Code 38004** — The expense's project has order status Completed.

            - **Code 38005** — The expense's contract has status Completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: Approved expense — captured on this route
                  value:
                    Code: 102
                    Details:
                    - Message: This expense is approved by the manager.
                      ErrorCode: 37703
                    Message: Business rules exception.
                    Parameters: 'employeeExpenseID: 1'
                    Url: https://app{server-number}.timelog.com/{account}/api/v2/employee-expense/1
      x-timelog-key: rest.v2.expenses.employeeexpense.delete
    get:
      operationId: getEmployeeExpenseV2
      summary: Get an employee expense (v2)
      description: |-
        Returns one employee expense, including short-lived download URLs for its receipts (v2 route; no approval status).

        The v2 route of `GET /v1/employee-expense/{employeeExpenseID}` — same controller code, owner check, $expand and 15-minute receipt URLs. The one difference is the body: the v2 model has no Status field, so a v2 caller cannot see whether the expense is approved (update / delete answer 37700 / 37703 when it is).

        **Use it to:**
        - Finance / ERP integration fetching an expense and its receipt (v2 clients)
        - Confirming an expense after create or update

        **Not for:**
        - Reading the approval status — use `GET /v1/employee-expense/{employeeExpenseID}` (Status)
        - Searching by employee or date — `GET /v2/employee-expense`

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v2/employee-expense`, `POST /v2/employee-expense`

        **Next:** `PUT /v2/employee-expense`, `POST /v2/employee-expense/{employeeExpenseID}/image`, `DELETE /v2/employee-expense/{employeeExpenseID}/image`

        **See also:** `GET /v1/employee-expense/{employeeExpenseID}`

        > **Not yet documented:** request → query params → $expand.
      parameters:
      - name: employeeExpenseID
        in: path
        required: true
        schema:
          type: integer
          format: int32
        description: The expense's integer ID.
      - name: $expand
        in: query
        required: false
        schema:
          type: string
          enum:
          - project
          - currency
          - expenseType
          - paymentMethod
          x-enum-descriptions:
          - Fill Project (and its customer).
          - Fill Currency.
          - Fill ExpenseType.
          - Fill PaymentMethod.
        description: |-
          Comma-separated list of nested objects to embed.

          Several values: one string, separated by `,`.

          Allowed values:

          | Value | Name | Meaning |
          |---|---|---|
          | `project` | project | Fill Project (and its customer). |
          | `currency` | currency | Fill Currency. |
          | `expenseType` | expenseType | Fill ExpenseType. |
          | `paymentMethod` | paymentMethod | Fill PaymentMethod. |
      responses:
        '200':
          description: |-
            The object, wrapped in the TAF envelope (`Properties`). The expense, with a self link and the expense TAF actions (delete, create, update, attach file / image, delete file / image).

            Order: none

            Empty result: Unknown ID → 500 Code 100 (not 404).
          content:
            application/json:
              schema:
                type: object
                description: 'TAF envelope: the object is in `Properties`. Null members are omitted; a null result is `{"Links":
                  [self]}` without `Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/EmployeeExpenseReadV2'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
                  Actions:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafAction'
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '403':
          description: '- **Code 103** — The authenticated user lacks a privilege the operation requires. On time registrations
            this is raised when the caller is not the registration''s owner and has no registration privilege that covers
            the owner. — When: The caller is not the owner and no registration privilege covers the owner.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '404':
          description: '- The URL did not match any route (including a route constraint such as {id:int} receiving a non-integer).
            — When: employeeExpenseID is not an integer (captured).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v2.expenses.employeeexpense.get
  /v2/employee-expense/{employeeExpenseID}/file:
    delete:
      operationId: deleteEmployeeExpenseFileV2
      summary: Delete receipt files from an employee expense (v2)
      description: |-
        Removes one or more PDF (or other) receipt attachments from an employee expense and deletes the files from storage (v2 route).

        **Use it to:**
        - Integration replacing a PDF receipt: delete the old URL, then attach the new PDF

        **Not for:**
        - Deleting the whole expense — `DELETE /v2/employee-expense/{employeeExpenseID}`

        **Behaviour:**
        - Not idempotent.
        - Repeating a successful call fails with 37684.
        - Safe to retry only under a condition. After a lost response, GET the expense: a URL that is gone was deleted.
        - Duplicates: A URL repeated in one call fails on its second occurrence (37684).
        - Changes are visible to the next read immediately.
        - Batch: partial

        **Call first:** `GET /v2/employee-expense/{employeeExpenseID}`

        **Next:** `POST /v2/employee-expense/{employeeExpenseID}/file`

        **See also:** `DELETE /v1/employee-expense/{employeeExpenseID}/file`, `DELETE /v2/employee-expense/{employeeExpenseID}/image`

        > **Not yet documented:** examples.
      parameters:
      - name: employeeExpenseID
        in: path
        required: true
        schema:
          type: integer
          format: int32
        description: The expense.
      - name: fileUrl
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            format: uri
        description: |-
          An attachment URL of this expense, URL-encoded. Repeat for several. Matched on scheme + host + path; the query string is ignored.

          Default: none — the call then does nothing and returns 200
      responses:
        '200':
          description: |-
            Success without content: HTTP 200 with the literal JSON body `null`. Body is the JSON literal null.

            Order: none

            Empty result: none
          content:
            application/json:
              schema:
                type: 'null'
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '404':
          description: '- The URL did not match any route (including a route constraint such as {id:int} receiving a non-integer).
            — When: employeeExpenseID is not an integer (captured).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
