    post:
      operationId: batchCreateEmployeeCompetence
      summary: Give an employee several competences
      description: |-
        Adds several competences with values to one employee in one call; competences the employee already has are skipped.

        All items are validated first (user, access, every competence exists, CompetenceId > 0); then ONE database statement inserts them. Validation failures and database errors therefore write nothing (all or nothing). Items whose competence the employee already has are skipped silently — their stored value is NOT changed and the response does not report them. The response is the literal `null`: no IDs come back.

        **Use it to:**
        - Initial load of an employee's skills profile from an HR system

        **Not for:**
        - Changing existing values — skipped here; use `PUT /v2/employee-competences`
        - Several employees in one call — one call per employee

        **Rules across fields:**
        - R1: Each CompetenceId may appear only once in EmployeeCompetences — a repeat makes the single INSERT violate the unique constraint and nothing is inserted (500 Code 100).

        **Behaviour:**
        - Idempotent.
        - A repeat of the same body inserts nothing new (existing pairs are skipped) and answers 200 null. Values sent the second time are NOT applied to existing pairs.
        - Safe to retry.
        - Duplicates: Pairs that already exist are skipped (NOT EXISTS); duplicates inside one request fail the whole batch.
        - Side effect: Raises CompetenceValueBatchCreated once, without a domain object (no per-item events) — even when nothing was inserted.
        - Changes are visible to the next read immediately.
        - Batch: Every check runs before the single INSERT ... SELECT; one failing item or a database error writes nothing. Not partial in the error sense — but items for existing pairs are silently skipped, so 'success' does not mean every item was written.

        **Call first:** `GET /v1/user`, `GET /v2/employee-competences/available`

        **Next:** `GET /v2/employee-competences`

        **See also:** `POST /v2/employee-competences`

        > **Not yet documented:** errors; examples.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeCompetenceBatchCreate.create'
      responses:
        '200':
          description: |-
            Success without content: HTTP 200 with the literal JSON body `null`.

            Order: none

            Empty result: none
          content:
            application/json:
              schema:
                type: 'null'
        '400':
          description: '- **Code 200** — The request body or parameters failed input validation. — When: UserId, or an item''s
            CompetenceId / Value, absent from the JSON — Details is [""] (captured for an empty body, EMPV2-4). — Fix: Fix
            every item listed in Details and resend.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: Empty body (captured)
                  value:
                    Code: 200
                    Details:
                    - ''
                    Message: Invalid model state error.
                    Parameters: 'model: {"UserId":0,"EmployeeCompetences":null}'
                    Url: https://app{server-number}.timelog.com/{account}/api/v2/employee-competences/bulk
        '401':
          description: '- Missing, invalid or expired bearer token. — When: No or invalid bearer token (captured). — Fix:
            Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '500':
          description: |-
            - **Code 37040** — UserId (create, batch create) — or, on update, the user the stored competence belongs to — is not an existing user. Also what a missing or 0 UserId produces: the body defaults to 0 and no validator runs first. — When: UserId 0 or unknown. — Fix: Send the employee's UserID (`GET /v1/user`).

            - **Code 37931** — The employee is deactivated. Competences of a deactivated employee can be read and deleted, but not added or changed. — When: Employee deactivated. — Fix: Reactivate the user first, or skip deactivated employees.

            - **Code 38015** — The caller has no 'Employee skills' create/edit privilege (event type 147) that covers the employee: none for all employees, none for employees of the caller's legal entity (when the employee is in the same legal entity), and none for the caller's department (when the employee is in the caller's department or a department directly under it). There is no exception for the caller's own competences. The same text is used on delete. — When: Caller's Employee skills privilege does not cover the employee. — Fix: Grant the integration user a role with the Employee skills create/edit privilege at 'all employees' (or the matching scope).

            - **Code 100** — Unhandled server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v2.employee.employeecompetences.batchcreateemployeecompetence
  /v2/employee-competences/{id}:
    delete:
      operationId: deleteEmployeeCompetence
      summary: Remove a competence from an employee
      description: |-
        Permanently removes one competence (and its value) from an employee.

        Addressed by the employee-competence ID (EmployeeCompetenceItemRead.Id). Hard delete — no history is kept and there is no restore. Unlike create and update, deleting works for a deactivated employee.

        **Use it to:**
        - Remove a skill recorded by mistake

        **Not for:**
        - Removing all of an employee's competences — `DELETE /v2/employee-competences/bulk`

        **Behaviour:**
        - Not idempotent.
        - Safe to retry only under a condition. A repeat after success answers 500 Code 100 (row gone) — treat that as 'already deleted' only after checking with GET.
        - Side effect: Raises CompetenceValueDeleted.
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v2/employee-competences`

        **See also:** `DELETE /v2/employee-competences/bulk`
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
        description: |-
          EmployeeCompetenceItemRead.Id — the employee-competence ID, not the CompetenceId.

          Refers to `EmployeeCompetenceItemRead.Id`. Look up valid values with `GET /v2/employee-competences`.
      responses:
        '204':
          description: |-
            Success without content: HTTP 204 with an empty body. No body (TafSuccessNoContent).

            Order: none

            Empty result: none
        '400':
          description: '- **Code 200** — The request body or parameters failed input validation. — When: id not an integer
            (captured: "The value ''not_an_integer'' is not valid for Int32."). — Fix: Fix every item listed in Details and
            resend.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '401':
          description: '- Missing, invalid or expired bearer token. — When: No or invalid bearer token (captured). — Fix:
            Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '500':
          description: |-
            - **Code 38015** — The caller has no 'Employee skills' create/edit privilege (event type 147) that covers the employee: none for all employees, none for employees of the caller's legal entity (when the employee is in the same legal entity), and none for the caller's department (when the employee is in the caller's department or a department directly under it). There is no exception for the caller's own competences. The same text is used on delete. — When: Caller's privilege does not cover the employee who owns the row. — Fix: Grant the integration user a role with the Employee skills create/edit privilege at 'all employees' (or the matching scope).

            - **Code 100** — Unhandled server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v2.employee.employeecompetences.deleteemployeecompetence
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: |-
        OAuth 2.0 bearer token, sent as `Authorization: Bearer <token>`. JWT and reference tokens are both accepted. The token must carry the required scope (default `tlp`).

        The token's `sub` claim is the acting user. A token WITHOUT `sub` (client-credentials) acts as the system service user. If the `sub` user cannot log in (inactive, locked, deleted), the request is rejected with 401 — it is no longer let through without a user.

        > **Not yet documented:** how to obtain a token.

        > **Not yet documented:** token lifetime.
  schemas:
    CompetenceCreate.create:
      type: object
      properties:
        Name:
          type: string
          maxLength: 255
          minLength: 1
          description: |-
            Competence name. Duplicates are allowed.

            Can be set on create only.

            - Missing, empty or whitespace — 500 Code 102 / 60015 (captured).

            - Longer than 255 characters — Database truncation error → 500 Code 100 (not validated earlier).

            > **Not yet documented:** behaviour.
        GroupId:
          type: integer
          format: int32
          x-timelog-identity:
            role: reference
          description: |-
            ID of the competence group the competence belongs to.

            Can be set on create only.

            Refers to `CompetenceGroupDetailRead.GroupId`. Look up valid values with `GET /v2/competences/by-group`.

            - Missing, 0 or not an existing group — Foreign-key violation in the database → 500 Code 100 (EMPV2-10). Not validated.

            > **Not yet documented:** behaviour.
        IsActive:
          type: boolean
          default: false
          description: |-
            true = the competence is active and can be picked for employees; false = created deactivated.

            Can be set on create only.

            - Omitted — Binds as false: the new competence is INACTIVE and does not appear in the 'available' list. Send true explicitly.
      required:
      - Name
      - GroupId
      description: A new competence in the tenant's competence catalogue.
    CompetenceGroupCreate.create:
      type: object
      properties:
        Name:
          type: string
          maxLength: 255
          minLength: 1
          description: |-
            Group name. Duplicates are allowed.

            Can be set on create only.

            - Missing, empty or whitespace — 500 Code 102 / 60015 'Name must be set on CompetenceGroup' (captured).

            - Longer than 255 characters — Database truncation error → 500 Code 100 (not validated earlier).

            > **Not yet documented:** behaviour.
      required:
      - Name
      description: A new competence group in the tenant's competence catalogue.
    CompetenceGroupDetailItemRead:
      type: object
      properties:
        Id:
          type: integer
          format: int32
          readOnly: true
          x-timelog-identity:
            role: primary_id
            unique_scope: tenant
            uniqueness_enforced: true
            id_format: int
          description: |-
            Competence ID (= CompetenceRead.Id).

            Identifier of this object, unique per TimeLog site.
        Name:
          type: string
          readOnly: true
          maxLength: 255
          description: |-
            Competence name; searchText matches it; items are ordered by it.

            Filterable via `searchText` (contains).
        IsActive:
          type: boolean
          readOnly: true
          description: |-
            false = deactivated competence (see CompetenceRead.IsActive).

            Filterable via `isActive` (eq).
        CanBeDeleted:
          type: boolean
          readOnly: true
          description: true = no employee has this competence (see CompetenceRead.CanBeDeleted).
      description: A competence inside its group (see CompetenceRead for the meaning of each field).
    CompetenceGroupDetailRead:
      type: object
      properties:
        GroupId:
          type: integer
          format: int32
          readOnly: true
          x-timelog-identity:
            role: primary_id
            unique_scope: tenant
            uniqueness_enforced: true
            id_format: int
          description: |-
            Competence group ID.

            Identifier of this object, unique per TimeLog site.
        GroupName:
          type: string
          readOnly: true
          maxLength: 255
          description: Group name. The list is ordered by it.
        GroupCanBeDeleted:
          type: boolean
          readOnly: true
          description: 'true = no employee has any competence of this group. Computed from employee competences only — NOT
            a delete predictor: the group delete refuses any group still containing competences (EMPV2-12, `DELETE /v2/competence-groups/{id}`).'
        Items:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/CompetenceGroupDetailItemRead'
          readOnly: true
          description: |-
            The group's competences that match the filters, ordered by name. OMITTED (not []) when none match.

            Null: Absent from the JSON = no competence of this group matches searchText / groupIds / isActive.
      description: A competence group with its competences. Every group of the tenant appears, even when no competence matches
        the filters.
    CompetenceGroupRead:
      type: object
      properties:
        GroupId:
          type: integer
          format: int32
          readOnly: true
          x-timelog-identity:
            role: primary_id
            unique_scope: tenant
            uniqueness_enforced: true
            id_format: int
          description: |-
            Competence group ID. Used as GroupId on competences, as ID in PUT /v2/competence-groups and as {id} in DELETE /v2/competence-groups/{id}.

            Identifier of this object, unique per TimeLog site.
        GroupName:
          type: string
          readOnly: true
          maxLength: 255
          description: Group name. Not unique. The list is ordered by it.
        CanBeDeleted:
          type: boolean
          readOnly: true
          description: 'true = no employee has a rating on any competence of the group. NOT a reliable predictor of the delete:
            DELETE /v2/competence-groups/{id} refuses (38011) any group that still CONTAINS competences, rated or not — so
            a group with unrated competences shows true and the delete still fails (EMPV2-12). Treat true as "no ratings",
            and check the group''s competences (GET /v2/competences?groupIds=) before deleting.'
      description: A competence group of the tenant's competence catalogue (System administration > Employee competencies).
        Every competence belongs to exactly one group. Groups have no active flag and no other fields over the API.
    CompetenceGroupUpdate.update:
      type: object
      properties:
        ID:
          type: integer
          format: int32
          writeOnly: true
          x-timelog-identity:
            role: reference
          description: |-
            Competence group ID (CompetenceGroupRead.GroupId).

            Refers to `CompetenceGroupRead.GroupId`. Look up valid values with `GET /v2/competence-groups`.

            - Missing, 0 or unknown — The lookup throws → 500 Code 100 (captured for 0, EMPV2-8).
        Name:
          type: string
          maxLength: 255
          minLength: 1
          description: |-
            New name (replaces the old one).

            - Longer than 255 characters — Database truncation error → 500 Code 100.

            > **Not yet documented:** behaviour.
      required:
      - ID
      - Name
      description: Renames an existing competence group. The name is the only changeable property.
    CompetenceRead:
      type: object
      properties:
        Id:
          type: integer
          format: int32
          readOnly: true
          x-timelog-identity:
            role: primary_id
            unique_scope: tenant
            uniqueness_enforced: true
            id_format: int
          description: |-
            Competence ID. Used as CompetenceId in the employee-competence operations, as ID in PUT /v2/competences and as {id} in DELETE /v2/competences/{id}.

            Identifier of this object, unique per TimeLog site.
        Name:
          type: string
          readOnly: true
          maxLength: 255
          description: |-
            Competence name. Not unique (no constraint). Secondary sort key; searchText matches it.

            Filterable via `searchText` (contains).
        GroupId:
          type: integer
          format: int32
          readOnly: true
          x-timelog-identity:
            role: reference
          description: |-
            ID of the competence group the competence belongs to.

            Refers to `CompetenceGroupDetailRead.GroupId`. Look up valid values with `GET /v2/competences/by-group`.

            Filterable via `groupIds` (in).
        GroupName:
          type: string
          readOnly: true
          maxLength: 255
          description: Name of the competence group. Primary sort key of the list.
        IsActive:
          type: boolean
          readOnly: true
          description: |-
            false = deactivated: hidden from the 'available' list (cannot be picked for new employee competences in the UI), but employees keep it and the API still accepts it on create.

            Filterable via `isActive` (eq).
        CanBeDeleted:
          type: boolean
          readOnly: true
          description: true = no employee has this competence, so DELETE /v2/competences/{id} will not be refused with 38008.
      description: A competence (skill) in the tenant's competence catalogue, maintained under System administration > Employee
        competencies. Every competence belongs to one competence group. Employees are given competences with a value (rating)
        through the employee-competences operations.
    CompetenceUpdate.update:
      type: object
      properties:
        ID:
          type: integer
          format: int32
          writeOnly: true
          x-timelog-identity:
            role: reference
          description: |-
            Competence ID (CompetenceRead.Id).

            Refers to `CompetenceRead.Id`. Look up valid values with `GET /v2/competences`.

            - Missing, 0 or unknown — The lookup throws → 500 Code 100 (captured for 0, EMPV2-8).
        Name:
          type: string
          maxLength: 255
          minLength: 1
          description: |-
            New name (replaces the old one).

            - Missing, empty or whitespace — 500 Code 102 / 60015.

            - The competence is in use by employees — Allowed — the defined 38009 'Unable to Edit competence ... Users are attached' is never raised.
        GroupId:
          type: integer
          format: int32
          x-timelog-identity:
            role: reference
          description: |-
            Group the competence belongs to (moving it is allowed).

            Refers to `CompetenceGroupDetailRead.GroupId`. Look up valid values with `GET /v2/competences/by-group`.

            - Missing, 0 or not an existing group — Foreign-key violation → 500 Code 100 (EMPV2-10).
        IsActive:
          type: boolean
          default: false
          description: |-
            New active state. Omitted = false: a PUT without IsActive DEACTIVATES the competence.

            - Omitted — Binds as false and is written (full replace).

            - Set to false on a competence employees have — Employees keep it; it disappears from the 'available' list.
      required:
      - ID
      - Name
      - GroupId
      description: Renames, moves (to another group), activates or deactivates an existing competence.
    EmployeeCompetenceAvailableRead:
      type: object
      properties:
        GroupId:
          type: integer
          format: int32
          readOnly: true
          x-timelog-identity:
            role: reference
          description: |-
            ID of the competence's group.

            Refers to `CompetenceGroupDetailRead.GroupId`. Look up valid values with `GET /v2/competences/by-group`.
        GroupName:
          type: string
          readOnly: true
          maxLength: 255
          description: Name of the competence's group. Primary sort key of the list.
        CompetenceId:
          type: integer
          format: int32
          readOnly: true
          x-timelog-identity:
            role: reference
          description: |-
            ID of the competence — send it as CompetenceId to POST /v2/employee-competences.

            Refers to `CompetenceRead.Id`. Look up valid values with `GET /v2/competences`.
        CompetenceName:
          type: string
          readOnly: true
          maxLength: 255
          description: |-
            Name of the competence. Secondary sort key; the searchText filter matches it.

            Filterable via `searchText` (contains).
