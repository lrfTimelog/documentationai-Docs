        **Not for:**
        - Removing one competence — `DELETE /v2/employee-competences/{id}`

        **Behaviour:**
        - Idempotent.
        - A repeat deletes nothing more and answers 204.
        - Safe to retry.
        - Side effect: Raises CompetenceValueBatchDeleted once, with no domain object (description 'CompetenceValueBatchDeletedForUser<userId>').
        - On failure: 403: nothing deleted (the check runs first).
        - Changes are visible to the next read immediately.
        - Batch: One DELETE statement.

