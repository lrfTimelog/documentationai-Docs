    EmployeeCompetenceBatchCreate.create:
      type: object
      properties:
        UserId:
          type: integer
          format: int32
          x-timelog-identity:
            role: reference
          description: |-
            UserID of the employee who gets every competence in the list.

            Can be set on create only.

            Refers to `UserRead.UserID`. Look up valid values with `GET /v1/user`.

            - Absent from the JSON — 400 Code 200, Details [""] (captured).

            - 0 or not an existing user — 500 Code 102 / 37040.

            - User deactivated — 500 Code 102 / 37931.

            - Caller has no Employee skills privilege covering this employee — 500 Code 102 / 38015 — nothing is written.
        EmployeeCompetences:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeCompetenceBatchItemCreate'
          description: |-
            The competences to give, one item per competence.

            Can be set on create only.

            - An item whose competence the employee already has — Silently skipped by the insert (NOT EXISTS); the stored value is NOT updated; the response does not say which items were skipped.

            - The same CompetenceId twice in the array — Both rows pass the NOT EXISTS check and the second violates the unique constraint → the single INSERT fails → nothing inserted, 500 Code 100.

            > **Not yet documented:** behaviour.
      required:
      - UserId
      - EmployeeCompetences
      description: Several competences for ONE employee in one call.
    EmployeeCompetenceBatchItemCreate:
      type: object
      properties:
        CompetenceId:
          type: integer
          format: int32
          x-timelog-identity:
            role: reference
          description: |-
            ID of the competence to give.

            Can be set on create only.

            Refers to `CompetenceRead.Id`. Look up valid values with `GET /v2/employee-competences/available`.

            - Absent from the item — 400 Code 200 (required member).

            - 0, negative or not an existing competence — The pre-check looks the competence up and the lookup THROWS for an unknown ID → 500 Code 100; the intended 38010 'There is no competence...' is never returned (EMPV2-2). Nothing is written.

            - Competence is inactive — Not checked.
        Value:
          type: integer
          format: int32
          description: |-
            The employee's value (rating) for the competence (see EmployeeCompetenceItemRead.Value).

            Can be set on create only.

            Contains personal data.

            - Absent from the item — 400 Code 200 (required member); 0 is accepted.

            - Below 0 or above 255 — TINYINT overflow at the batch INSERT → 500 Code 100 (EMPV2-9); nothing is written.

            > **Not yet documented:** behaviour.
      description: One competence and value inside a batch create.
    EmployeeCompetenceCreate.create:
      type: object
      properties:
        UserId:
          type: integer
          format: int32
          x-timelog-identity:
            role: reference
          description: |-
            UserID of the employee who gets the competence.

            Can be set on create only.

            Refers to `UserRead.UserID`. Look up valid values with `GET /v1/user`.

            - Missing, 0 or not an existing user — 500 Code 102 / 37040 (captured for a missing value).

            - User deactivated — 500 Code 102 / 37931.

            - Caller has no Employee skills privilege covering this employee — 500 Code 102 / 38015.
        CompetenceId:
          type: integer
          format: int32
          x-timelog-identity:
            role: reference
          description: |-
            ID of the competence to give (`GET /v2/employee-competences/available` lists the ones the employee does not have yet).

            Can be set on create only.

            Refers to `CompetenceRead.Id`. Look up valid values with `GET /v2/employee-competences/available`.

            - Positive but not an existing competence — Foreign-key violation in the database → 500 Code 100. Not checked earlier.

            - The employee already has this competence — Unique constraint (UserID, CompetenceID) → 500 Code 100 (EMPV2-5). Use PUT to change the value.

            - Competence is inactive — Not checked: an inactive competence can be given (the 'available' list hides inactive ones).

            > **Not yet documented:** behaviour.
        Value:
          type: integer
          format: int32
          default: 0
          description: |-
            The employee's value (rating) for the competence. Stored as given; the scale is not defined in the API (see EmployeeCompetenceItemRead.Value).

            Can be set on create only.

            Contains personal data.

            - Omitted — Binds as 0 and is stored as 0.

            - Below 0 or above 255 — TINYINT overflow in the database → 500 Code 100 (EMPV2-9). No range rule in the API.

            > **Not yet documented:** behaviour.
      required:
      - UserId
      - CompetenceId
      description: Gives one employee one competence with a value (rating).
    EmployeeCompetenceGroupRead:
      type: object
      properties:
        GroupId:
          type: integer
          format: int32
          readOnly: true
          x-timelog-identity:
            role: reference
          description: |-
            ID of the competence group.

            Refers to `CompetenceGroupDetailRead.GroupId`. Look up valid values with `GET /v2/competences/by-group`.
        GroupName:
          type: string
          readOnly: true
          maxLength: 255
          description: Name of the competence group.
        Items:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeCompetenceItemRead'
          readOnly: true
          description: The employee's competences in this group. Order not defined.
      description: A competence group and the employee's competences in it.
    EmployeeCompetenceItemRead:
      type: object
      properties:
        Id:
          type: integer
          format: int32
          readOnly: true
          x-timelog-identity:
            role: primary_id
            unique_scope: tenant
            uniqueness_enforced: true
            id_format: int
          description: |-
            ID of the employee competence — NOT the competence. Send it as ID to PUT /v2/employee-competences and as {id} to DELETE /v2/employee-competences/{id}.

            Identifier of this object, unique per TimeLog site.
        CompetenceId:
          type: integer
          format: int32
          readOnly: true
          x-timelog-identity:
            role: reference
          description: |-
            ID of the competence.

            Refers to `CompetenceRead.Id`. Look up valid values with `GET /v2/competences`.
        Name:
          type: string
          readOnly: true
          maxLength: 255
          description: Name of the competence.
        Value:
          type: integer
          format: int32
          readOnly: true
          description: |-
            The employee's value (rating) for the competence, as stored.

            Contains personal data.

            > **Not yet documented:** description.
      description: One competence of the employee and the employee's value (rating) for it.
    EmployeeCompetenceRead:
      type: object
      properties:
        UserId:
          type: integer
          format: int32
          readOnly: true
          x-timelog-identity:
            role: reference
          description: |-
            UserID of the employee — the userId the caller asked for (taken from the first row).

            Refers to `UserRead.UserID`. Look up valid values with `GET /v1/user`.

            Filterable via `userId` (eq).
        CompetenceList:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeCompetenceGroupRead'
          readOnly: true
          description: One entry per competence group the employee has at least one competence in. Order is not defined.
      description: One employee's competences (skills), grouped by competence group. Each item carries the employee-competence
        ID (needed to change or delete that rating), the competence and the employee's value (rating) for it.
    EmployeeCompetenceUpdate.update:
      type: object
      properties:
        ID:
          type: integer
          format: int32
          writeOnly: true
          x-timelog-identity:
            role: reference
          description: |-
            ID of the employee competence — EmployeeCompetenceItemRead.Id from GET /v2/employee-competences, not the CompetenceId.

            Refers to `EmployeeCompetenceItemRead.Id`. Look up valid values with `GET /v2/employee-competences`.

            - Missing, 0 or unknown — The lookup throws → 500 Code 100 (captured for 0, EMPV2-8).
        Value:
          type: integer
          format: int32
          default: 0
          description: |-
            The new value (rating). Full replace of the value; omitted = 0.

            Contains personal data.

            - Omitted — Binds as 0 and OVERWRITES the stored value with 0 — PUT is a full replace.

            - Below 0 or above 255 — TINYINT overflow in the database → 500 Code 100 (EMPV2-9).
      required:
      - ID
      description: Changes the value (rating) of one existing employee competence.
    MessageError:
      type: object
      description: Body of 401 and some framework errors — not the ResponseError shape.
      properties:
        Message:
          type: string
    ResponseError:
      type: object
      description: Error body for validation (400), privilege (403), business-rule (422/500) and other server errors. `Details`
        lists strings for validation errors, or `{ErrorCode, Message}` objects for business-rule violations. `Parameters`
        echoes the request arguments, including the full payload.
      properties:
        Code:
          type: integer
          description: 'TimeLog error class (not the HTTP status): 100 unexpected, 102 business rule, 103 privilege, 200 validation.'
        Message:
          type: string
        Details:
          type: array
          items: {}
        Parameters:
          type:
          - string
          - object
          - 'null'
        Url:
          type: string
    TafAction:
      type: object
      description: A hypermedia action the caller may take on the object. Present only where the operation registers actions.
    TafLink:
      type: object
      properties:
        Href:
          type: string
        Rel:
          type: string
    TafListPaging:
      type: object
      description: 'Paging values. They are returned as STRINGS, for example `"TotalRecord": "12"`.'
      properties:
        TotalRecord:
          type: string
        TotalPage:
          type: string
        PageNumber:
          type: string
