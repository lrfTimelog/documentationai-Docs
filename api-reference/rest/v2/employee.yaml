openapi: 3.1.0
info:
  title: Employee — REST API v2
  version: v2
  description: |-
    Enums are strings (member names) in v2 responses.

    **Conventions that apply to every operation in this file:**
    - Property names are PascalCase.
    - Successful bodies use the TAF envelope: one object in `Properties`, lists in `Entities[].Properties`.
    - Some operations succeed without content: HTTP 200 with the literal body `null`, or HTTP 204.
    - `PUT` replaces the whole object: omitted fields are reset.
    - Treat error `Code` 102 as a business-rule violation, whether the HTTP status is 422 or 500.

    > **Not yet documented:** rate limits.
servers:
- url: https://app{server-number}.timelog.com/{account}/api
  description: 'Your TimeLog site, as in the browser address bar when you are signed in: `https://app[X].timelog.com/[account
    name]`. `server-number` is the number after `app` (for example `3` in `app3.timelog.com`), `account` is the account name
    you use to log in. If your browser shows `https://app.timelog.com`, find your site URL in System Administration > Integrations
    and API > Reporting API settings, under Your TimeLog API URL.'
  variables:
    server-number:
      default: '3'
    account:
      default: your-account
security:
- bearer: []
paths:
  /v2/competence-groups:
    get:
      operationId: getAllCompetenceGroups
      summary: List competence groups
      description: |-
        Lists all competence groups of the tenant, ordered by name.

        The group level of System administration > Employee competencies. Flat: ID, name and a CanBeDeleted flag — the flag only says that no employee is rated on the group's competences, not that DELETE will succeed (EMPV2-12). Unpaged and unfiltered. For groups with their competences use GET /v2/competences/by-group.

        **Use it to:**
        - Look up GroupId values for creating or moving competences
        - Map TimeLog competence groups to an external skills taxonomy

        **Not for:**
        - Groups together with their competences — `GET /v2/competences/by-group`

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **Next:** `PUT /v2/competence-groups`, `DELETE /v2/competence-groups/{id}`, `POST /v2/competences`

        **See also:** `GET /v2/competences/by-group`
      responses:
        '200':
          description: |-
            A list, wrapped in the TAF list envelope (`Entities[].Properties`). No paging properties.

            Order: GroupName ascending (fixed).
          content:
            application/json:
              schema:
                type: object
                description: 'TAF list envelope: each item is in `Entities[].Properties`.'
                properties:
                  Entities:
                    type: array
                    description: Omitted (not `[]`) when the list is empty.
                    items:
                      type: object
                      properties:
                        Properties:
                          $ref: '#/components/schemas/CompetenceGroupRead'
                        Links:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafLink'
                        Actions:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafAction'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
              examples:
                example1:
                  summary: All competence groups (captured)
                  value:
                    Entities:
                    - Properties:
                        GroupId: 1
                        GroupName: Skills
                        CanBeDeleted: true
                    Links:
                    - Href: https://app{server-number}.timelog.com/{account}/api/v2/competence-groups
                      Rel: self
        '401':
          description: '- Missing, invalid or expired bearer token. — When: No or invalid bearer token (captured). — Fix:
            Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v2.employee.competencegroups.getall
    post:
      operationId: createCompetenceGroup
      summary: Create a competence group
      description: |-
        Creates a competence group in the tenant's competence catalogue.

        Adds a group under which competences are then created (POST /v2/competences with GroupId). The response is a literal `null` with no ID: read the new GroupId back with GET /v2/competence-groups. Names are not unique. Every new group gets the five-point rating scale; the scale is not settable over the API.

        **Use it to:**
        - Set up a skills taxonomy from an external HR system

        **Behaviour:**
        - Not idempotent.
        - Not safe to retry blindly. Names are not unique: a retry after a lost response creates a duplicate group. List first.
        - Duplicates: Not deduplicated — no uniqueness on Name.
        - Side effect: Clears the CompetenceGroup cache; raises CompetenceGroupCreated.
        - Changes are visible to the next read immediately.

        **Next:** `GET /v2/competence-groups`, `POST /v2/competences`

        **See also:** `PUT /v2/competence-groups`

        > **Not yet documented:** examples.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompetenceGroupCreate.create'
      responses:
        '200':
          description: |-
            Success without content: HTTP 200 with the literal JSON body `null`. Literal JSON `null` (TafSuccessResult). Update and delete answer 204 — same inconsistency as EMPV2-11.

            Order: none

            Empty result: none
          content:
            application/json:
              schema:
                type: 'null'
        '401':
          description: '- Missing, invalid or expired bearer token. — When: No or invalid bearer token (captured). — Fix:
            Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '500':
          description: |-
            - **Code 38014** — The caller has no access to the system-administration page 'Employee competencies' (role page + the page's licence / module / product / feature policies) — the same check as 38013 on competences. {0} is the group ID — 0 on create. Message text garbled in source. — When: No access to the Employee competencies administration page. Checked before the name. — Fix: Give the integration user's role the Employee competencies administration page.

            - **Code 60015** — Name is missing, empty or whitespace. {0} is 'CompetenceGroup'. — When: Name missing or blank (captured). — Fix: Send a non-blank Name.

            - **Code 100** — Unhandled server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: Empty body (captured)
                  value:
                    Code: 102
                    Details:
                    - Message: Name must be set on CompetenceGroup
                      ErrorCode: 60015
                    Message: Business rules exception.
                    Parameters: 'model: {"Name":null}'
                    Url: https://app{server-number}.timelog.com/{account}/api/v2/competence-groups
      x-timelog-key: rest.v2.employee.competencegroups.create
    put:
      operationId: updateCompetenceGroup
      summary: Rename a competence group
      description: |-
        Renames a competence group.

        The name is the only property that changes; the competences in the group and employees' ratings are untouched. Success is 204 with no body (create answers `null`). Works on groups that contain or are rated on competences.

        **Use it to:**
        - Keep group names in sync with an external skills taxonomy

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Side effect: Clears the Competence cache (not the CompetenceGroup cache) and raises CompetenceUpdated (not CompetenceGroupUpdated) with the group's GUID — EMPV2-13.
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v2/competence-groups`

        **See also:** `POST /v2/competence-groups`, `DELETE /v2/competence-groups/{id}`

        > **Not yet documented:** behaviour → side effects; examples.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompetenceGroupUpdate.update'
      responses:
        '204':
          description: |-
            Success without content: HTTP 204 with an empty body. No body (TafSuccessNoContent).

            Order: none

            Empty result: none
        '401':
          description: '- Missing, invalid or expired bearer token. — When: No or invalid bearer token (captured). — Fix:
            Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '500':
          description: |-
            - **Code 38014** — The caller has no access to the system-administration page 'Employee competencies' (role page + the page's licence / module / product / feature policies) — the same check as 38013 on competences. {0} is the group ID — 0 on create. Message text garbled in source. — When: No access to the Employee competencies administration page. — Fix: Give the integration user's role the Employee competencies administration page.

            - **Code 60015** — Name is missing, empty or whitespace. {0} is 'CompetenceGroup'. — When: Name missing or blank (ID valid). — Fix: Send a non-blank Name.

            - **Code 100** — Unhandled server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: Empty body (captured)
                  value:
                    Code: 100
                    Details: []
                    Message: Unknown error occur in system, please contact system administrator.
                    Parameters: 'model: {"ID":0,"Name":null}'
                    Url: https://app{server-number}.timelog.com/{account}/api/v2/competence-groups
      x-timelog-key: rest.v2.employee.competencegroups.update
  /v2/competence-groups/{id}:
    delete:
      operationId: deleteCompetenceGroup
      summary: Delete a competence group
      description: |-
        Permanently deletes an empty competence group.

        Hard delete. Refused (38011) while the group contains any competence — rated or not, active or not. Nothing is cascaded: empty the group first (move its competences with PUT /v2/competences, or delete them, which in turn requires that no employee has them). Do NOT rely on CompetenceGroupRead.CanBeDeleted: it is true whenever no employee is rated on the group, even if the group still contains competences (EMPV2-12, captured).

        **Use it to:**
        - Remove an empty or mistakenly created group

        **Not for:**
        - Removing a group with its competences in one call — not supported

        **Behaviour:**
        - Not idempotent.
        - Safe to retry only under a condition. A repeat after success answers 500 Code 100 (row gone).
        - Side effect: No competences or ratings are touched — a group that has any is refused.
        - Side effect: Raises CompetenceGroupDeleted.
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v2/competence-groups`, `GET /v2/competences`

        **See also:** `DELETE /v2/competences/{id}`, `PUT /v2/competences`

        > **Not yet documented:** examples.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
        description: |-
          CompetenceGroupRead.GroupId.

          Refers to `CompetenceGroupRead.GroupId`. Look up valid values with `GET /v2/competence-groups`.
      responses:
        '204':
          description: |-
            Success without content: HTTP 204 with an empty body. No body (TafSuccessNoContent).

            Order: none

            Empty result: none
        '400':
          description: '- **Code 200** — The request body or parameters failed input validation. — When: id not an integer
            (captured). — Fix: Fix every item listed in Details and resend.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '401':
          description: '- Missing, invalid or expired bearer token. — When: No or invalid bearer token (captured). — Fix:
            Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '500':
          description: |-
            - **Code 38011** — The group still contains at least one competence (active or not, rated or not). CompetenceGroupRead.CanBeDeleted does NOT predict this (EMPV2-12). — When: The group contains at least one competence (captured). Can arrive together with 38014 in one Details list. — Fix: Move the competences to another group (PUT /v2/competences) or delete them first, then retry.

            - **Code 38014** — The caller has no access to the system-administration page 'Employee competencies' (role page + the page's licence / module / product / feature policies) — the same check as 38013 on competences. {0} is the group ID — 0 on create. Message text garbled in source. — When: No access to the Employee competencies administration page. — Fix: Give the integration user's role the Employee competencies administration page.

            - **Code 100** — Unhandled server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: Group still contains a competence (captured)
                  value:
                    Code: 102
                    Details:
                    - Message: Unable to Delete competence group with ID ='1', because one or more competence are attached
                        to it
                      ErrorCode: 38011
                    Message: Business rules exception.
                    Parameters: 'id: 1'
                    Url: https://app{server-number}.timelog.com/{account}/api/v2/competence-groups/1
      x-timelog-key: rest.v2.employee.competencegroups.delete
  /v2/competences:
    get:
      operationId: competences
      summary: List competences
      description: |-
        Lists the tenant's competences (skills catalogue), flat, optionally filtered by name, groups and active state.

        The flat competence list of System administration > Employee competencies. Each competence shows its group, whether it is active and whether it can be deleted (no employee has it). The complete list is returned — no paging — ordered by group name and then competence name.

        **Use it to:**
        - Map TimeLog competence IDs to an external skills taxonomy
        - Look up CompetenceId values for the employee-competence operations

        **Not for:**
        - Competences grouped under their groups — `GET /v2/competences/by-group`

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **Next:** `PUT /v2/competences`, `DELETE /v2/competences/{id}`, `POST /v2/employee-competences`

        **See also:** `GET /v2/competences/by-group`

        > **Not yet documented:** request → query params.
      parameters:
      - name: searchText
        in: query
        required: false
        schema:
          type: string
          x-timelog-filter:
            operators:
            - contains
        description: |-
          LIKE '%text%' on the competence name (% and _ act as wildcards).

          Filters on `CompetenceRead.Name` (contains).
      - name: groupIds
        in: query
        required: false
        schema:
          type: string
          x-timelog-filter:
            operators:
            - in
        description: |-
          Comma-separated group IDs, e.g. 1,4. Omitted or empty = all groups. A non-integer entry → 500 Code 100; an empty entry ('1,,2') counts as group 0 and matches nothing.

          Several values: one string, separated by `,`.

          Filters on `CompetenceRead.GroupId` (in).
      - name: isActive
        in: query
        required: false
        schema:
          type: boolean
          x-timelog-filter:
            operators:
            - eq
        description: |-
          true = active only, false = deactivated only, omitted = both.

          Filters on `CompetenceRead.IsActive` (eq).
      responses:
        '200':
          description: |-
            A list, wrapped in the TAF list envelope (`Entities[].Properties`). No paging properties.

            Order: GroupName ascending, then Name ascending (fixed).
          content:
            application/json:
              schema:
                type: object
                description: 'TAF list envelope: each item is in `Entities[].Properties`.'
                properties:
                  Entities:
                    type: array
                    description: Omitted (not `[]`) when the list is empty.
                    items:
                      type: object
                      properties:
                        Properties:
                          $ref: '#/components/schemas/CompetenceRead'
                        Links:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafLink'
                        Actions:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafAction'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
              examples:
                example1:
                  summary: All competences (captured)
                  value:
                    Entities:
                    - Properties:
                        Id: 1
                        Name: Frontend
                        GroupId: 1
                        GroupName: Skills
                        IsActive: true
                        CanBeDeleted: true
                    Links:
                    - Href: https://app{server-number}.timelog.com/{account}/api/v2/competences
                      Rel: self
        '400':
          description: '- **Code 200** — The request body or parameters failed input validation. — When: isActive not a boolean
            (model binding). — Fix: Fix every item listed in Details and resend.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '401':
          description: '- Missing, invalid or expired bearer token. — When: No or invalid bearer token (captured). — Fix:
            Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v2.employee.competences.competences
    post:
      operationId: createCompetence
      summary: Create a competence
      description: |-
        Adds a competence to the tenant's competence catalogue, in an existing competence group.

        Administration operation (System administration > Employee competencies). The response is the literal `null`: the new competence's ID is not returned — list the catalogue to find it. Names are not unique, so a retried create makes a second competence with the same name. IsActive defaults to false: send true, or the new competence is inactive and cannot be picked for employees in the UI.

        **Use it to:**
        - Seed the competence catalogue from an external skills taxonomy

        **Behaviour:**
        - Not idempotent.
        - Not safe to retry blindly. Names are not unique: a retry after a lost response creates a duplicate competence. List first.
        - Duplicates: Not deduplicated — no uniqueness on Name.
        - Side effect: Clears the Competence cache; raises CompetenceCreated, and also CompetenceChangeStatus when IsActive is false (a new competence object starts active, so false is a status change).
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v2/competences/by-group`

        **Next:** `GET /v2/competences`

        **See also:** `PUT /v2/competences`

        > **Not yet documented:** examples.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompetenceCreate.create'
      responses:
        '200':
          description: |-
            Success without content: HTTP 200 with the literal JSON body `null`. Literal JSON `null` (TafSuccessResult).

            Order: none

            Empty result: none
          content:
            application/json:
              schema:
                type: 'null'
        '401':
          description: '- Missing, invalid or expired bearer token. — When: No or invalid bearer token (captured). — Fix:
            Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '500':
          description: |-
            - **Code 38013** — The caller has no access to the system-administration page 'Employee competencies' (role page + the page's licence / module / product / feature policies). {0} is the competence ID — 0 on create. The message text is garbled in source ('Unable to competence'). — When: No access to the Employee competencies administration page. — Fix: Give the integration user's role the Employee competencies administration page.

            - **Code 60015** — Name is missing, empty or whitespace. {0} is 'Competence'. — When: Name missing or blank (captured). — Fix: Send a non-blank Name.

            - **Code 100** — Unhandled server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: Empty body (captured)
                  value:
                    Code: 102
                    Details:
                    - Message: Name must be set on Competence
                      ErrorCode: 60015
                    Message: Business rules exception.
                    Parameters: 'model: {"Name":null,"GroupId":0,"IsActive":false}'
                    Url: https://app{server-number}.timelog.com/{account}/api/v2/competences
      x-timelog-key: rest.v2.employee.competences.create
    put:
      operationId: updateCompetence
      summary: Update a competence
      description: |-
        Renames a competence, moves it to another group, or activates / deactivates it (full replace).

        All three of Name, GroupId and IsActive are written. Omitting IsActive DEACTIVATES the competence; omitting GroupId fails (no group 0). Employees who have the competence keep it — deactivating only hides it from the 'available' list. Works on competences in use (the defined 'cannot edit, users attached' rule is not applied). Unlike create, success is 204 with no body.

        **Use it to:**
        - Retire a skill without losing employees' history (IsActive false)
        - Rename or regroup a competence

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Side effect: Clears the Competence cache; raises CompetenceUpdated, plus CompetenceChangeStatus when IsActive changes.
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v2/competences`

        **See also:** `POST /v2/competences`, `DELETE /v2/competences/{id}`

        > **Not yet documented:** examples.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompetenceUpdate.update'
      responses:
        '204':
          description: |-
            Success without content: HTTP 204 with an empty body. No body (TafSuccessNoContent).

            Order: none

            Empty result: none
        '401':
          description: '- Missing, invalid or expired bearer token. — When: No or invalid bearer token (captured). — Fix:
            Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '500':
          description: |-
            - **Code 38013** — The caller has no access to the system-administration page 'Employee competencies' (role page + the page's licence / module / product / feature policies). {0} is the competence ID — 0 on create. The message text is garbled in source ('Unable to competence'). — When: No access to the Employee competencies administration page. — Fix: Give the integration user's role the Employee competencies administration page.

            - **Code 60015** — Name is missing, empty or whitespace. {0} is 'Competence'. — When: Name missing or blank. — Fix: Send a non-blank Name.

            - **Code 100** — Unhandled server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: Empty body (captured)
                  value:
                    Code: 100
                    Details: []
                    Message: Unknown error occur in system, please contact system administrator.
                    Parameters: 'model: {"ID":0,"Name":null,"GroupId":0,"IsActive":false}'
                    Url: https://app{server-number}.timelog.com/{account}/api/v2/competences
      x-timelog-key: rest.v2.employee.competences.update
  /v2/competences/by-group:
    get:
      operationId: competencesGroup
      summary: List competences by group
      description: |-
        Lists every competence group with its competences, optionally filtering the competences.

        The tree view of the competence catalogue. Every group of the tenant is returned, ordered by name, whatever the filters; the filters only decide which competences appear under each group. A group with no matching competence keeps its place but has no Items member. Groups carry GroupCanBeDeleted, competences CanBeDeleted.

        **Use it to:**
        - Render or export the skills catalogue as a tree

        **Not for:**
        - A flat list — `GET /v2/competences`

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **Next:** `POST /v2/competences`

        **See also:** `GET /v2/competences`
      parameters:
      - name: searchText
        in: query
        required: false
        schema:
          type: string
          x-timelog-filter:
            operators:
            - contains
        description: |-
          Filters the competences (not the groups); same LIKE / 50-character behaviour as on the flat list.

          Filters on `CompetenceGroupDetailItemRead.Name` (contains).
      - name: groupIds
        in: query
        required: false
        schema:
          type: string
          x-timelog-filter:
            operators:
            - in
        description: |-
          Comma-separated group IDs. Filters the COMPETENCES only: groups not listed are still returned, with Items omitted. Non-integer entry → 500 Code 100.

          Several values: one string, separated by `,`.

          Filters on `CompetenceRead.GroupId` (in).
      - name: isActive
        in: query
        required: false
        schema:
          type: boolean
          x-timelog-filter:
            operators:
            - eq
        description: |-
          Filters the competences by active state; omitted = both.

          Filters on `CompetenceGroupDetailItemRead.IsActive` (eq).
      responses:
        '200':
          description: |-
            A list, wrapped in the TAF list envelope (`Entities[].Properties`). Entities[].Properties = CompetenceGroupDetailRead (one per group). No paging properties.

            Order: Groups by GroupName ascending; items by name within a group.
          content:
            application/json:
              schema:
                type: object
                description: 'TAF list envelope: each item is in `Entities[].Properties`.'
                properties:
                  Entities:
                    type: array
                    description: Omitted (not `[]`) when the list is empty.
                    items:
                      type: object
                      properties:
                        Properties:
                          $ref: '#/components/schemas/CompetenceGroupDetailRead'
                        Links:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafLink'
                        Actions:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafAction'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
              examples:
                example1:
                  summary: Catalogue by group (captured)
                  value:
                    Entities:
                    - Properties:
                        GroupId: 1
                        GroupName: Skills
                        GroupCanBeDeleted: true
                        Items:
                        - Id: 1
                          Name: Frontend
                          IsActive: true
                          CanBeDeleted: true
                    Links:
                    - Href: https://app{server-number}.timelog.com/{account}/api/v2/competences/by-group
                      Rel: self
        '400':
          description: '- **Code 200** — The request body or parameters failed input validation. — When: isActive not a boolean
            (model binding). — Fix: Fix every item listed in Details and resend.'
          content:
