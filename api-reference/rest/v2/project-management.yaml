    ProjectStatusUpdateV2.update:
      type: object
      properties:
        Status:
          type: integer
          format: int32
          enum:
          - 0
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
          x-enum-descriptions:
          - Quote. Time registration keeps the project's current open/closed flag.
          - Approved. Time registration keeps the project's current open/closed flag.
          - In progress. Opens the project for time registration.
          - On hold. Closes the project for time registration.
          - Completed. Closes time registration, completes open milestones, moves every open contract to Completed. Refused
            (37969) when a multi-customer contract uses the system customer.
          - Archived. Closes time registration, completes open milestones, moves every open contract to Completed.
          - Cancelled. Closes time registration, completes open milestones, moves every open contract to Cancelled.
          writeOnly: true
          description: |-
            The new status, as the OrderStatus integer. Non-nullable: when omitted it arrives as 0 and is APPLIED — {} moves every listed project to Quote.

            - Not one of 0–6 — 400 "Status must be 0 = Quote or 1 = Approved or 2 = InProgress or 3 = OnHold or 4 = Completed or 5 = Archived or 6 = Cancelled."

            - Omitted — 0 = Quote is applied.

            - Quote or Approved — OpenForTimeRegistration is left as the project had it (the controller passes the project's own flag).

            Allowed values:

            | Value | Name | Meaning |
            |---|---|---|
            | `0` | Quote | Quote. Time registration keeps the project's current open/closed flag. |
            | `1` | Approved | Approved. Time registration keeps the project's current open/closed flag. |
            | `2` | InProgress | In progress. Opens the project for time registration. |
            | `3` | OnHold | On hold. Closes the project for time registration. |
            | `4` | Completed | Completed. Closes time registration, completes open milestones, moves every open contract to Completed. Refused (37969) when a multi-customer contract uses the system customer. |
            | `5` | Archived | Archived. Closes time registration, completes open milestones, moves every open contract to Completed. |
            | `6` | Cancelled | Cancelled. Closes time registration, completes open milestones, moves every open contract to Cancelled. |
        Date:
          type:
          - string
          - 'null'
          format: date-time
          writeOnly: true
          description: |-
            Status date to record (date part only). When omitted: the date already stored for that status, or today (ProjectStatusUnitRule).

            Date only — no time component.

            Default: the status's existing date, else today

            - projectsIds has exactly one character — Replaced by today's date.

            - Time part sent — statusDate.Value.Date keeps the date only.
      description: The target project status for every listed project, and optionally the status date.
    ProjectTimeRegistrationRead:
      type: object
      properties:
        TimeRegistrationId:
          type: integer
          format: int32
          readOnly: true
          x-timelog-identity:
            role: primary_id
            unique_scope: tenant
            id_format: int
          description: |-
