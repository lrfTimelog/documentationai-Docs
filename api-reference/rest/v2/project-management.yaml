  /v2/milestones/{id}/status:
    put:
      operationId: updateMilestonesStatus
      summary: Complete or reopen a milestone
      description: |-
        Marks a milestone (or one occurrence of a recurring milestone) as completed or not completed.

        Send the MilestoneId and IsRecurring of a GET /v2/milestones/incomplete entity unchanged. isRecurring=true treats id as a recurring-milestone INSTANCE ID and flips only that occurrence's IsCompleted (no event); isRecurring=false treats id as a milestone ID, sets its completion, refreshes the parent task's status, saves it with the caller as modifier and raises MilestoneChangeStatus. Setting the status it already has does nothing. Answers 200 with body null. The flag is trusted: a wrong isRecurring addresses a different milestone that shares the number.

        **Use it to:**
        - Tick off a milestone from a reminder list

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Side effect: Recurring instance: IsCompleted, LastModifiedBy, LastModified updated (no event).
        - Side effect: Milestone: completion set, parent task status refreshed, milestone saved, MilestoneChangeStatus event, task notified, cache cleared.
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v2/milestones/incomplete`

        > **Not yet documented:** behaviour → side effects; examples.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
        description: 'MilestoneId from the list: a recurring-instance ID when isRecurring is true, otherwise a milestone ID.
          Unknown → 500 (src_only).'
      - name: isCompleted
        in: query
        required: true
        schema:
          type: boolean
        description: true = completed, false = reopen. Omitted → 404 (captured).
      - name: isRecurring
        in: query
        required: true
        schema:
          type: boolean
        description: Which ID space id belongs to — pass MilestoneRead.IsRecurring unchanged. Omitted → 404 (captured).
      responses:
        '200':
          description: |-
            Success without content: HTTP 200 with the literal JSON body `null`. Body is the JSON literal null (TafSuccessResult), also when nothing changed.

            Empty result: Not applicable.
          content:
            application/json:
              schema:
                type: 'null'
        '401':
          description: '- Missing, invalid or expired bearer token. — When: No or invalid bearer token, once the action matched.
            — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '404':
          description: '- The route matched a controller, but no action accepts the supplied query parameters — typically
            a required (non-nullable) simple parameter such as a DateTime was omitted. It is a missing-parameter error that
            looks like a 404. — When: isCompleted or isRecurring omitted (captured: every scenario omitted both).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
