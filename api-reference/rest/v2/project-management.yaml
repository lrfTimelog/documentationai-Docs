    put:
      operationId: updateProjectsStatusV2
      summary: Change the status of several projects
      description: |-
        Moves every listed project to one status (Quote … Cancelled), one project after another.

        For each ID in projectsIds, in the order given: loads the project, changes its status with TimeLog's status processing and saves it. InProgress opens the project for time registration; OnHold / Completed / Archived / Cancelled close it; Quote / Approved keep the project's current flag. Completed, Archived and Cancelled also mark every open milestone completed and move every open contract to Completed (Cancelled for Cancelled) — reopening later does NOT reopen contracts. Answers 200 with an empty TAF list whose Properties.UpdatedProjectsCount is the number of IDs processed. The first failing project aborts the call with 500 and the earlier projects KEEP their new status; there is no per-project result. Always send Status: &#123;&#125; moves every listed project to Quote.

        **Use it to:**
        - Close a batch of finished projects (Completed / Archived) from a portfolio tool

        **Not for:**
        - Opening a Quote / Approved project for time registration — this route keeps the current flag; use `PUT /v1/project/{projectID}/status` (AllowTimeTracking)

        **Rules across fields:**
        - R1: When the projectsIds string is exactly one character long (a single project 1–9), Date is replaced by today.

        **Behaviour:**
        - Idempotent.
        - Same status again re-applies it: status date reset, ProjectStatusChanged raised again, project re-saved.
        - Safe to retry only under a condition. After a 500 re-send the whole list: projects already moved are re-applied harmlessly; closing statuses never reopen contracts, so a retry cannot undo the cascade.
        - Side effect: Per project: status units / status date written and the status stored, OpenForTimeRegistration set by status.
        - Side effect: Completed / Archived / Cancelled: open milestones completed, every open contract moved to Completed / Cancelled.
        - On failure: Projects before the failing one keep their new status; within the failing project the status may already be written before the save fails.
        - Changes are visible to the next read immediately.
        - Batch: Sequential, no transaction, no per-item result: the first failure aborts the rest with 500 and gives no indication which projects were already changed.

        **Call first:** `GET /v2/projects`, `GET /v2/projects/actions`

        **See also:** `PUT /v1/project/{projectID}/status`

