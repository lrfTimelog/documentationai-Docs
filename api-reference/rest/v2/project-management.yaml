          - Quote (offer stage).
          - Approved; time registration open only if the project's own flag says so.
          - In progress; open for time registration.
          - On hold; closed for time registration.
          - Completed; closed for time registration, contracts completed.
          - Archived; closed for time registration, contracts completed.
          - Cancelled; closed for time registration, contracts cancelled.
          readOnly: true
          description: |-
