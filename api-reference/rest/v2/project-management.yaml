  /v2/projects:
    get:
      operationId: getSearchedProjectsBasedOnCriteriaV2
      summary: Search projects by criteria
      description: |-
        Lists every non-template project the caller may see, filtered by up to 15 include/exclude ID lists and a text search, with hour aggregates.

        Returns all matching non-template projects in ONE unpaged TAF list, ordered by project number then name, with list Properties: ProjectsCount, TotalBudgetWorkHours, TotalProjectActualHours, TotalTasksBudgetHours, TotalAllocationsBudgetHours (numbers as en-GB strings) and IsShowingProjectStage / IsShowingProjectCategory (tenant features, booleans). Every filter is an optional comma-separated ID list with an is…Inclusive switch (true = keep projects whose value is in the list, false = drop them); an empty list means no filter; filters AND together. searchText is a LIKE '%text%' over customer number and name, project number, name and description. Rows are limited in SQL to the projects the caller's project privilege package covers: all projects, or the union of projects where the caller is project manager / account manager, projects of the caller's department subtree, restricted to the caller's legal entity when that privilege is set. A caller without project privileges gets an empty list.

        **Use it to:**
        - Project overview / portfolio list with the same filters as the TimeLog project list
        - Find the projectId values to pass to the bulk status / stage / resource-planner / delete operations

        **Not for:**
        - Paging through large tenants — there is no paging; use `GET /v1/project/get-all`
        - A project picker for time registration → `GET /v1/project-header/search-for-time-tracking-order-by-recent-registration`

        **Rules across fields:**
        - R1: Each is…Inclusive switch is used only when its ID list is non-empty.

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v2/filters/list/{pageIdentifier}`

        **Next:** `GET /v2/projects/actions`, `GET /v2/projects/{projectId}/time-registrations`

        **See also:** `GET /v1/project/get-all`, `GET /v2/filters/project-status/content`

        > **Not yet documented:** request → query params → contractStatusIds; response → empty result.
      parameters:
      - name: searchText
        in: query
        required: false
        schema:
          type: string
          x-timelog-filter:
            operators:
            - contains
        description: |-
          LIKE '%text%' on customer number, customer name, project number, project name and project description (OR). Wildcards % and _ are not escaped. Empty = no text filter.

          Filters on `SearchProjectRead.No, Name, Description, CustomerName (+ customer number)` (contains).
