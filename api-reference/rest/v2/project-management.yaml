            Set by TimeLog.

            Date only — no time component.
        ProjectName:
          type: string
          readOnly: true
          description: |-
            Name of the project (the same on every row).

            Set by TimeLog.
        TaskName:
          type: string
          readOnly: true
          description: |-
            Name of the task the registration is on.

            Set by TimeLog.
        EmployeeInitials:
          type: string
          readOnly: true
          description: |-
            Initials of the employee who owns the registration.

            Set by TimeLog.

            Contains personal data.
        EmployeeName:
          type: string
          readOnly: true
          description: |-
            "<first name> <last name>" of the employee.

            Set by TimeLog.

            Contains personal data.
        Comment:
          type: string
          readOnly: true
          description: |-
            The registration comment; "" when empty.

            Set by TimeLog.

            Contains personal data.
        AdditionalText:
          type: string
          readOnly: true
          description: |-
            The registration's additional text field; its tenant label is returned as the list property AdditionalCommentFieldName.

            Set by TimeLog.
        Currency:
          type: string
          readOnly: true
          description: |-
            Currency abbreviation of the registration, e.g. "EUR" (captured). ActualAmount is in this currency.

            Set by TimeLog.
        ActualHours:
          type: number
          format: double
          readOnly: true
          description: |-
            Registered quantity — decimal hours, e.g. 0.2 (captured).

            Set by TimeLog.

            Unit: hours
        HourlyRate:
          type: number
          format: double
          readOnly: true
          description: |-
            The registration's rate. Which currency RegRate is stored in is not established.

            Set by TimeLog.

            Unit: currency (unknown — see gaps)

            Contains financial data.

            > **Not yet documented:** constraints → unit.
        Factor:
          type: number
          format: double
          readOnly: true
          description: |-
            Billable factor in percent.

            Set by TimeLog.

            Unit: percent
        ActualAmount:
          type: number
          format: double
          readOnly: true
          description: |-
            Registered amount in the registration's currency, e.g. 6250 for 5 h × 1250 (captured).

            Set by TimeLog.

            Unit: currency of the Currency field

            Contains financial data.
        NonBillable:
          type: boolean
          readOnly: true
          description: |-
            true when the registration is flagged non-billable.

            Set by TimeLog.
        BillableStatus:
          type: string
          enum:
          - NonBillableRegistrationOnBillableTaskWithZeroHourlyRate
          - BillableRegistrationOnNonBillableTask
          - NonBillableRegistrationOnNonBillableTask
          - BillableRegistrationOnBillableTask
          - NonBillableRegistrationOnBillableTask
          x-enum-descriptions:
          - Billable task; the registration is non-billable and its amount is 0.
          - Non-billable task; the registration is billable (NonBillable = 0).
          - Non-billable task; the registration is non-billable.
          - Billable task; every case not covered by -3 or 2 (captured).
          - Billable task; the adjusted (billable) amount is 0 while the registered amount is > 0 — written off.
          readOnly: true
          description: |-
            Set by TimeLog.

            Allowed values:

            | Value | Name | Meaning |
            |---|---|---|
            | `-3` | NonBillableRegistrationOnBillableTaskWithZeroHourlyRate | Billable task; the registration is non-billable and its amount is 0. |
            | `-2` | BillableRegistrationOnNonBillableTask | Non-billable task; the registration is billable (NonBillable = 0). |
            | `-1` | NonBillableRegistrationOnNonBillableTask | Non-billable task; the registration is non-billable. |
            | `1` | BillableRegistrationOnBillableTask | Billable task; every case not covered by -3 or 2 (captured). |
            | `2` | NonBillableRegistrationOnBillableTask | Billable task; the adjusted (billable) amount is 0 while the registered amount is > 0 — written off. |
        BookingStatus:
          type: string
          enum:
          - Booked
          - Drafted
          - NotBooked
          x-enum-descriptions:
          - On an invoice line (RegInvoiceLineId > 0) of a booked invoice or voucher (BookedInvoiceId / BookedVoucherId >
            0).
          - On an invoice line of a draft invoice or voucher, not booked.
          - Not on an invoice line (or a non-billable registration with status 0).
          readOnly: true
          description: |-
            Invoicing state, computed in the API from the invoice links: Booked when the registration is on an invoice line and that invoice / voucher is booked, Drafted when it is on a draft one, otherwise NotBooked. A non-billable registration with status 0 is always NotBooked. Serialized as the member NAME.

            Set by TimeLog.

            Allowed values:

            | Value | Name | Meaning |
            |---|---|---|
            | `0` | Booked | On an invoice line (RegInvoiceLineId > 0) of a booked invoice or voucher (BookedInvoiceId / BookedVoucherId > 0). |
            | `1` | Drafted | On an invoice line of a draft invoice or voucher, not booked. |
            | `2` | NotBooked | Not on an invoice line (or a non-billable registration with status 0). |
        BookedVoucherId:
          type: integer
          format: int32
          readOnly: true
          x-timelog-identity:
            role: reference
          description: |-
            ID of a booked voucher (invoice type 4, status > 0) that contains the registration; 0 when none.

            Set by TimeLog.

            Refers to `InvoiceID`.
        BookedInvoiceId:
          type: integer
          format: int32
          readOnly: true
          x-timelog-identity:
            role: reference
          description: |-
            ID of a booked invoice (type <= 2, status > 0, creditable) that contains the registration; 0 when none.

            Set by TimeLog.

            Refers to `InvoiceID`.
        DraftVoucherId:
          type: integer
          format: int32
          readOnly: true
          x-timelog-identity:
            role: reference
          description: |-
            ID of a draft voucher (type 4, status 0) that contains the registration; 0 when none.

            Set by TimeLog.

            Refers to `InvoiceID`.
        DraftInvoiceId:
          type: integer
          format: int32
          readOnly: true
          x-timelog-identity:
            role: reference
          description: |-
            ID of a draft invoice (type <= 2, status 0) that contains the registration; 0 when none.

            Set by TimeLog.

            Refers to `InvoiceID`.
        RegInvoiceLineId:
          type: integer
          format: int32
          readOnly: true
          x-timelog-identity:
            role: reference
          description: |-
            The invoice line the registration is on; 0 when none.

            Set by TimeLog.

            Refers to `InvoiceLineID`.
      description: 'One time registration on a project, as shown in the project''s registration drill-down: date, task, employee,
        hours, rate, amount, billability and invoicing (booking) state. Delivered as the Properties of a TAF list entity.'
    ProjectsBulkUpdateResultRead:
