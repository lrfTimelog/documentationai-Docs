openapi: 3.1.0
info:
  title: Projects — REST API v2
  version: v2
  description: |-
    Find the projects a user can register on, and register expenses and mileage on a project.

    Enums are strings (member names) in v2 responses.

    **Conventions that apply to every operation in this file:**
    - Property names are PascalCase.
    - Successful bodies use the TAF envelope: one object in `Properties`, lists in `Entities[].Properties`.
    - Some operations succeed without content: HTTP 200 with the literal body `null`, or HTTP 204.
    - `PUT` replaces the whole object: omitted fields are reset.
    - Treat error `Code` 102 as a business-rule violation, whether the HTTP status is 422 or 500.

    > **Not yet documented:** rate limits.
servers:
- url: https://app{server-number}.timelog.com/{account}/api
  description: 'Your TimeLog site, as in the browser address bar when you are signed in: `https://app[X].timelog.com/[account
    name]`. `server-number` is the number after `app` (for example `3` in `app3.timelog.com`), `account` is the account name
    you use to log in. If your browser shows `https://app.timelog.com`, find your site URL in System Administration > Integrations
    and API > Reporting API settings, under Your TimeLog API URL.'
  variables:
    server-number:
      default: '3'
    account:
      default: your-account
security:
- bearer: []
paths:
  /v2/adjustments/move-hours:
    get:
      operationId: getTimeRegistrationsForMoveHoursProcess
      summary: List time registrations for moving hours
      description: |-
        Lists the project time registrations in a date range that the caller may move, with filters on customer, project, employee, department and more.

        Returns, unpaged, every project time registration whose date lies in [periodStartsAt, periodEndsAt] (both inclusive) on an ACTIVE project the caller can see by project privilege (all projects, or the projects where the caller is project manager / account manager / in the project's department subtree). Twelve ID-list filters each take a comma-separated list and an include (default) / exclude switch; searchText matches customer number and name, project number, name and description, and task name (contains). Each row says whether it is invoiced or in a closed accounting period — those cannot be moved; set hideUnmovableRegistrationsIds to drop them. List Properties: AdditionalCommentFieldName (label of the additional text field, "" when that feature is off), IsShowingProjectNo / IsShowingTaskNo (ProjectNumber / TaskNo features), IsCommentMandatory (MandatoryComment feature) and TotalRegisteredHours (sum of RegisteredHours, a number).

        **Use it to:**
        - Find registrations booked on the wrong task before invoicing, to move them with `PUT /v2/adjustments/move-hours`

        **Not for:**
        - Your own registrations or a paged registration export → `GET /v1/time-registration/{timeRegistrationID}`

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **Next:** `PUT /v2/adjustments/move-hours`

        **See also:** `GET /v2/adjustments/move-hours/projects`, `GET /v2/projects/{projectId}/time-registrations`

        > **Not yet documented:** examples; response → empty result.
      parameters:
      - name: periodStartsAt
        in: query
        required: true
        schema:
          type: string
          format: date-time
          x-timelog-filter:
            operators:
            - gte
        description: |-
          First date (inclusive). Omitted → 404 action not matched (captured).

          Filters on `MoveHoursRead.Date` (gte).
      - name: periodEndsAt
        in: query
        required: true
        schema:
          type: string
          format: date-time
          x-timelog-filter:
            operators:
            - lte
        description: |-
          Last date (inclusive; compared with the registration's date at midnight, so pass the day itself). Omitted → 404 (captured).

          Filters on `MoveHoursRead.Date` (lte).
      - name: searchText
        in: query
        required: false
        schema:
          type: string
          x-timelog-filter:
            operators:
            - contains
        description: |-
          Contains-match (LIKE %x%, OR) on customer number, customer name, project number, project name, project description and task name. Not on employee or comment.

          Filters on `MoveHoursRead.ProjectName` (contains).
      - name: customerIds
        in: query
        required: false
        schema:
          type: string
          x-timelog-filter:
            operators:
            - in
        description: |-
          Customer IDs; with isCustomerInclusive (default true) false = exclude them.

          Several values: one string, separated by `,`.

          Filters on `customer of the project` (in).
      - name: projectIds
        in: query
        required: false
        schema:
          type: string
          x-timelog-filter:
            operators:
            - in
        description: |-
          Project IDs; isProjectInclusive (default true).

          Several values: one string, separated by `,`.

          Filters on `MoveHoursRead.ProjectId` (in).
      - name: projectStatusIds
        in: query
        required: false
        schema:
          type: string
          x-timelog-filter:
            operators:
            - in
        description: |-
          PAGE-FILTER status codes, not StatusId: 1 Quote, 2 Approved, 3 InProgress, 4 OnHold, 5 Completed, 6 Archived, 7 Cancelled; groups -1 active (Quote..OnHold), -2 inactive (Completed, Archived, Cancelled), -3 all. isProjectStatusInclusive (default true).

          Several values: one string, separated by `,`.

          Filters on `project status` (in).
      - name: employeeDepartmentIds
        in: query
        required: false
        schema:
          type: string
          x-timelog-filter:
            operators:
            - in
        description: |-
          Department IDs of the registering employee, sub-departments included; isEmployeeDepartmentInclusive.

          Several values: one string, separated by `,`.

          Filters on `employee department (with sub-departments)` (in).
      - name: employeeIds
        in: query
        required: false
        schema:
          type: string
          x-timelog-filter:
            operators:
            - in
        description: |-
          USER IDs, not employee IDs; isEmployeeInclusive.

          Several values: one string, separated by `,`.

          Filters on `registration owner (USER ID)` (in).
      - name: projectTypeIds
        in: query
        required: false
        schema:
          type: string
          x-timelog-filter:
            operators:
            - in
        description: |-
          isProjectTypeInclusive.

          Several values: one string, separated by `,`.

          Filters on `project type` (in).
      - name: projectCategoryIds
        in: query
        required: false
        schema:
          type: string
          x-timelog-filter:
            operators:
            - in
        description: |-
          isProjectCategoryInclusive.

          Several values: one string, separated by `,`.

          Filters on `project category` (in).
      - name: taskTypeIds
        in: query
        required: false
        schema:
          type: string
          x-timelog-filter:
            operators:
            - in
        description: |-
          Switch is named isProjectTaskTypesInclusive.

          Several values: one string, separated by `,`.

          Filters on `task type` (in).
      - name: employeeTypeIds
        in: query
        required: false
        schema:
          type: string
          x-timelog-filter:
            operators:
            - in
        description: |-
          isEmployeeTypeInclusive.

          Several values: one string, separated by `,`.

          Filters on `employee type (role)` (in).
      - name: projectManagerIds
        in: query
        required: false
        schema:
          type: string
          x-timelog-filter:
            operators:
            - in
        description: |-
          isProjectManagerInclusive.

          Several values: one string, separated by `,`.

          Filters on `project manager (employee ID)` (in).
      - name: accountManagerIds
        in: query
        required: false
        schema:
          type: string
          x-timelog-filter:
            operators:
            - in
        description: |-
          isAccountManagerInclusive.

          Several values: one string, separated by `,`.

          Filters on `account manager (employee ID)` (in).
      - name: projectDepartmentIds
        in: query
        required: false
        schema:
          type: string
          x-timelog-filter:
            operators:
            - in
        description: |-
          isProjectDepartmentInclusive.

          Several values: one string, separated by `,`.

          Filters on `project department (with sub-departments)` (in).
      - name: contractTypeIds
        in: query
        required: false
        schema:
          type: string
          x-timelog-filter:
            operators:
            - in
        description: |-
          Contract MODEL types; isContractTypeInclusive.

          Several values: one string, separated by `,`.

          Filters on `contract model of the task's contract` (in).
      - name: is…Inclusive (13 switches)
        in: query
        required: false
        schema:
          type: boolean
          default: true
          x-timelog-filter:
            operators:
            - in
        description: |-
          One per list above (isCustomerInclusive, isProjectInclusive, isProjectStatusInclusive, isEmployeeDepartmentInclusive, isEmployeeInclusive, isProjectTypeInclusive, isProjectCategoryInclusive, isProjectTaskTypesInclusive, isEmployeeTypeInclusive, isProjectManagerInclusive, isAccountManagerInclusive, isProjectDepartmentInclusive, isContractTypeInclusive): true = keep only matching rows, false = drop matching rows. Ignored when its list is empty.

          Filters on `the ID list it belongs to (include / exclude)` (in).
      - name: hideUnmovableRegistrationsIds
        in: query
        required: false
        schema:
          type: boolean
          default: false
          x-timelog-filter:
            operators:
            - eq
        description: |-
          true = drop invoiced registrations and registrations dated in a closed accounting period. Approval / timesheet state is not considered.

          Filters on `MoveHoursRead.IsInvoiced / IsInClosedAccountingPeriod` (eq).
      - name: hideNonBillableIds
        in: query
        required: false
        schema:
          type: boolean
          default: false
          x-timelog-filter:
            operators:
            - eq
        description: |-
          true = drop non-billable registrations. Ignored unless the BillableOnTime feature is on.

          Filters on `registration NonBillable flag` (eq).
      responses:
        '200':
          description: |-
            A list, wrapped in the TAF list envelope (`Entities[].Properties`). Entities[].Properties = MoveHoursRead; list Properties AdditionalCommentFieldName (string), IsShowingProjectNo, IsShowingTaskNo, IsCommentMandatory (booleans), TotalRegisteredHours (number, hours).

            Order: Registration date, project number, task sort order (ascending).

            Empty result: 200 with no Entities and TotalRegisteredHours 0 (src_only).
          content:
            application/json:
              schema:
                type: object
                description: 'TAF list envelope: each item is in `Entities[].Properties`.'
                properties:
                  Entities:
                    type: array
                    description: Omitted (not `[]`) when the list is empty.
                    items:
                      type: object
                      properties:
                        Properties:
                          $ref: '#/components/schemas/MoveHoursRead'
                        Links:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafLink'
                        Actions:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafAction'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
        '400':
          description: '- **Code 200** — The request body or parameters failed input validation. — When: periodStartsAt /
            periodEndsAt or a boolean switch not parseable (model binding, src_only). — Fix: Fix every item listed in Details
            and resend.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '401':
          description: '- Missing, invalid or expired bearer token. — When: No or invalid bearer token, once the action matched.
            — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '404':
          description: '- The route matched a controller, but no action accepts the supplied query parameters — typically
            a required (non-nullable) simple parameter such as a DateTime was omitted. It is a missing-parameter error that
            looks like a 404. — When: periodStartsAt or periodEndsAt omitted (captured: every scenario sent none).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v2.projectmanagement.adjustments.gettimeregistrationsformovehoursprocess
    put:
      operationId: moveHoursOfTimeRegistrations
      summary: Move time registrations to another task
      description: |-
        Moves one or more project time registrations to another task (of any project), keeping each registration's ID, hours and date.

        For each ID in timeRegistrationIds, in order, the registration is re-pointed to TargetTaskId: the employee is allocated to the target task when not yet allocated, the registration's allocation (and so its rate) changes, billable duration is re-evaluated (billable-hours / rounding features), and the registration is saved in place — same TimeRegistrationId, GUID, hours, date, comment, factor and approval status (a rejected one becomes "rejected and resolved"). Attached mileage keeps its project and only its registration reference is updated; a running time tracker on the registration is notified as deleted. Refused per registration: absence registrations, target project Cancelled / Archived, target task closed or a parent task, invoiced, on a draft invoice, dated in a closed accounting period, outside the employee's employment, missing mandatory comment / additional text, exceeding allocated hours (feature). A closed (approved) timesheet does NOT block a move. Answers 204 when every registration moved, otherwise 422 with a bare array of MoveHoursResultRead (one entry per ID — moved ones included, and they STAY moved). An unknown or non-integer ID aborts the loop with 500 after earlier IDs were moved. The caller's rights over the registrations or projects are NOT checked.

        **Use it to:**
        - Correct registrations booked on the wrong task or project before invoicing

        **Not for:**
        - Changing hours, date or comment → `PUT /v1/time-registration`

        **Behaviour:**
        - Idempotent.
        - Moving a registration to the task it is already on re-saves it unchanged in substance (src_only).
        - Safe to retry only under a condition. Yes after a 422 or 500 — re-read the registrations first (moved ones are already on the target) and resend the rest.
        - Duplicates: A duplicated ID is moved twice (second time a no-op move).
        - Side effect: Per registration: allocation on the target task created when missing; registration re-pointed to it (rate of the target allocation applies); billable duration re-evaluated.
        - Side effect: A running time tracker on the registration is notified as deleted.
        - On failure: Registrations before the failing ID stay moved (422 array, or 500 with no per-item result).
        - On failure: An allocation created on the target task can remain even when the move is then refused by a later rule (src_only).
        - Changes are visible to the next read immediately.
        - Batch: Sequential; each registration in its own transaction; refusals are collected (422), any other error aborts the remainder (500).

        **Call first:** `GET /v2/adjustments/move-hours`, `GET /v2/adjustments/move-hours/projects/{projectId}/tasks`

        **Next:** `GET /v2/adjustments/move-hours`

        **See also:** `PUT /v1/time-registration`

        > **Not yet documented:** behaviour → side effects on failure; examples.
      parameters:
      - name: timeRegistrationIds
        in: query
        required: true
        schema:
          type: string
        description: |-
          Comma-separated integer TimeRegistrationIds, processed in order. Omitted → 404 action not matched (captured). Unknown or non-integer entry → 500 after earlier entries were moved.

          Several values: one string, separated by `,`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveHoursUpdate.update'
      responses:
        '204':
          description: |-
            Success without content: HTTP 204 with an empty body. Every listed registration was moved.

            Empty result: Not applicable.
        '400':
          description: '- **Code 200** — The request body or parameters failed input validation. — When: TargetTaskId missing
            or <= 0. — Fix: Fix every item listed in Details and resend.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '401':
          description: '- Missing, invalid or expired bearer token. — When: No or invalid bearer token, once the action matched.
            — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '404':
          description: '- The route matched a controller, but no action accepts the supplied query parameters — typically
            a required (non-nullable) simple parameter such as a DateTime was omitted. It is a missing-parameter error that
            looks like a 404. — When: timeRegistrationIds omitted (captured: every scenario).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '422':
          description: '- At least one listed registration could not be moved. Rules, per registration: it must be a project
            registration (37555 — not an absence); the target task''s project must not be Cancelled or Archived (37556); the
            target task must not be closed (37557) nor a parent task (37558); then the regular registration rules on the moved
            registration — not invoiced (37537), not on a draft invoice (37549), date not in a closed accounting period (30011),
            within the employee''s employment and after site creation, comment / additional text present when required, allocated
            hours not exceeded (feature). A closed (approved) timesheet does NOT block a move. — When: At least one registration
            refused by a move rule; the others in the array were moved. — Fix: Read every array entry: entries with AreHoursMovedSuccessfully
            true WERE moved; resend only the refused IDs after fixing the target or the registration.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v2.projectmanagement.adjustments.movehoursoftimeregistrations
  /v2/adjustments/move-hours/projects:
    get:
      operationId: getProjectsNamesForMoveHoursProcess
      summary: List projects for moving hours
      description: |-
        Lists the active projects the caller can see by project privilege, as name / ID options for choosing a move target.

        Returns every active (Aktiv), non-template project within the caller's project privileges (all projects, or projects where the caller is project manager / account manager / in the project's department subtree), any order status, as flat DropDownItemRead options: Value = ProjectID, Name = "&lt;number> &lt;name>" with the ProjectNumber feature, otherwise "&lt;name> (&lt;number>)" — a project without number reads "&lt;name> ()" (captured). Unpaged; no defined order.

        **Use it to:**
        - Pick the target project, then its tasks, before PUT /v2/adjustments/move-hours

        **Not for:**
        - Searching projects with filters → `GET /v2/projects`

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **Next:** `GET /v2/adjustments/move-hours/projects/{projectId}/tasks`

        **See also:** `GET /v2/adjustments/move-hours`
      responses:
        '200':
          description: |-
            A list, wrapped in the TAF list envelope (`Entities[].Properties`).

            Order: None defined (SELECT DISTINCT without ORDER BY; captured in ProjectID order).

            Empty result: 200 with no Entities (src_only).
          content:
            application/json:
              schema:
                type: object
                description: 'TAF list envelope: each item is in `Entities[].Properties`.'
                properties:
                  Entities:
                    type: array
                    description: Omitted (not `[]`) when the list is empty.
                    items:
                      type: object
                      properties:
                        Properties:
                          $ref: '#/components/schemas/DropDownItemRead'
                        Links:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafLink'
                        Actions:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafAction'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
        '401':
          description: '- Missing, invalid or expired bearer token. — When: No or invalid bearer token (captured). — Fix:
            Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
      x-timelog-key: rest.v2.projectmanagement.adjustments.getprojectsnamesformovehoursprocess
  /v2/adjustments/move-hours/projects/{projectId}/tasks:
    get:
      operationId: getTasksNamesByProjectIDForMoveHoursProcess
      summary: List a project's tasks for moving hours
      description: |-
        Returns a project's active leaf tasks with their parent tasks, as a nested name / ID tree for choosing a move target.

        Selects the project's ACTIVE leaf tasks (any task status) and adds all their ancestor tasks, then nests them: root tasks are the entities, sub-tasks sit in Items (recursively). Value = TaskID; Name = the task name, plus " (&lt;task number>)" when the TaskNo feature is on and the task has a number. Parent tasks appear only as containers — time cannot be moved onto them (move / split refuse a parent task). Ordered by the project's task sort order. Unpaged. An unknown, 0 or negative projectId answers 200 with no Entities (captured).

        **Use it to:**
        - Pick TargetTaskId for PUT /v2/adjustments/move-hours or the split halves

        **Not for:**
        - Task search across projects → `GET /v1/task/filter`

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v2/adjustments/move-hours/projects`

        **Next:** `PUT /v2/adjustments/move-hours`

        **See also:** `GET /v1/task`
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int32
        description: The project. Not an integer → 404 with empty body (route constraint, captured); unknown / 0 / negative
          → 200 empty list (captured).
      responses:
        '200':
          description: |-
            A list, wrapped in the TAF list envelope (`Entities[].Properties`).

            Order: Project, then task sort order (the task tree order).

            Empty result: 200 with only Links (no Entities key) — captured for projectId 0, 99999999 and -999999.
          content:
            application/json:
              schema:
                type: object
                description: 'TAF list envelope: each item is in `Entities[].Properties`.'
                properties:
                  Entities:
                    type: array
                    description: Omitted (not `[]`) when the list is empty.
                    items:
                      type: object
                      properties:
                        Properties:
                          $ref: '#/components/schemas/DropDownItemRead'
                        Links:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafLink'
                        Actions:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafAction'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
              examples:
                example1:
                  summary: Tasks of project 1
                  value:
                    Entities:
                    - Properties:
                        Name: This is another test (0023)
                        Value: 52
                    - Properties:
                        Name: Task 1
                        Value: 1
                    - Properties:
                        Name: This is a test (0022)
                        Value: 51
                    - Properties:
                        Name: Task 2
                        Value: 2
                    - Properties:
                        Name: test task
                        Value: 16
                    Links:
                    - Href: https://app{server-number}.timelog.com/{account}/api/v2/adjustments/move-hours/projects/1/tasks
                      Rel: self
                example2:
                  summary: Unknown project
                  value:
                    Links:
                    - Href: https://app{server-number}.timelog.com/{account}/api/v2/adjustments/move-hours/projects/99999999/tasks
                      Rel: self
        '401':
          description: '- Missing, invalid or expired bearer token. — When: No or invalid bearer token (captured). — Fix:
            Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '404':
          description: '- The URL did not match any route (including a route constraint such as {id:int} receiving a non-integer).
            — When: projectId not an integer (route constraint {projectId:int}; captured with an empty body).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v2.projectmanagement.adjustments.gettasksnamesbyprojectidformovehoursprocess
  /v2/contract-hourly-rates/dropdown-content:
    get:
      operationId: contractHourlyRateDropdownList
      summary: List the hourly rates a task's contract offers
      description: |-
        Lists the active hourly rates of a task's contract (plus one rate in use), cheapest first, for choosing an allocation's rate.

        Resolves the task's contract and returns its ACTIVE contract hourly rates, ordered by amount then name, plus the rate given in suggestedHourlyRateId even when inactive (only if it belongs to the same contract) — so a rate already in use stays selectable. Unpaged. Amounts are in the rate's price-group currency, which is not returned. A contract with no matching rate answers 200 with the body null instead of an empty list. The caller's access is NOT checked.

        **Use it to:**
        - Offer the rate choices when allocating a person to a task (default = SuggestedHourlyRateId from employee-unallocated)

        **Not for:**
        - Full rate records with currency, GUID and product number → `GET /v1/contract-hourly-rate`

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Consistency: immediate (manager result cached per request — src_only)

        **Call first:** `GET /v2/projects/{projectId}/employee-unallocated`

        **Next:** `POST /v1/task/{taskID}/allocation`

        **See also:** `GET /v1/contract-hourly-rate`, `GET /v2/projects/{projectId}/employee-allocation`

        > **Not yet documented:** description; examples.
      parameters:
      - name: taskId
        in: query
        required: true
        schema:
          type: integer
          format: int32
        description: Task whose contract's rates are listed. Omitted → 404 (captured); unknown → 500 (src_only).
      - name: suggestedHourlyRateId
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
        description: A rate to include even if inactive (ignored when it is on another contract); 0 = none.
      responses:
        '200':
          description: |-
            A list, wrapped in the TAF list envelope (`Entities[].Properties`). When no rate matches, the body is the JSON literal null (TafSuccessResult).

            Order: Amount ascending, then name.

            Empty result: 200 with body null.
          content:
            application/json:
              schema:
                type: object
                description: 'TAF list envelope: each item is in `Entities[].Properties`.'
                properties:
                  Entities:
                    type: array
                    description: Omitted (not `[]`) when the list is empty.
                    items:
                      type: object
                      properties:
                        Properties:
                          $ref: '#/components/schemas/ContractHourlyRateReadV2'
                        Links:
