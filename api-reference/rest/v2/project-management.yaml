        Returns every time registration on a project — all employees, all dates — with hours, rate, amount, billability and invoicing state.

        Runs the time-registration drill-down report for one project with no other filter and no date range: every registration on every task of the project, of every employee, ordered by date, task name, last change and ID, in one unpaged TAF list. List Properties: AdditionalCommentFieldName (the tenant's label of the additional text field, "" when that feature is off), TimeRegistrationsTotalActualHours and TimeRegistrationsTotalActualAmount (sums over the rows, en-GB number strings; the amount sum adds the rows' amounts as they are, in each row's Currency).

        **Use it to:**
        - Show who registered what on a project, and whether it is invoiced

        **Not for:**
        - Your own or a date-bounded list of registrations → `GET /v1/time-registration/{timeRegistrationID}` (scoped, paged)

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v2/projects`

        **See also:** `GET /v1/time-registration/{timeRegistrationID}`

        > **Not yet documented:** response → empty result.
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int32
        description: The project. Not an integer → 400; unknown, 0 or negative → 500.
      responses:
        '200':
          description: |-
            A list, wrapped in the TAF list envelope (`Entities[].Properties`).

            Order: Date, project name, task name, last modified, registration ID (ascending).

            Empty result: 200 with no Entities and totals "0" for a project without registrations (src_only).
          content:
            application/json:
              schema:
                type: object
                description: 'TAF list envelope: each item is in `Entities[].Properties`.'
                properties:
                  Entities:
                    type: array
                    description: Omitted (not `[]`) when the list is empty.
                    items:
                      type: object
                      properties:
                        Properties:
                          $ref: '#/components/schemas/ProjectTimeRegistrationRead'
                        Links:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafLink'
                        Actions:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafAction'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
        '400':
          description: '- **Code 200** — The request body or parameters failed input validation. — When: projectId not an
            integer (captured: Code 200 "The value ''not_an_integer'' is not valid for Int32."). — Fix: Fix every item listed
            in Details and resend.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '401':
          description: '- Missing, invalid or expired bearer token. — When: No or invalid bearer token (captured). — Fix:
            Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: Unknown project
                  value:
                    Code: 100
                    Details: []
                    Message: Unknown error occur in system, please contact system administrator.
                    Parameters: 'projectId: 99999999'
                    Url: https://app{server-number}.timelog.com/{account}/api/v2/projects/99999999/time-registrations
      x-timelog-key: rest.v2.projectmanagement.searchprojects.getprojecttimeregistrationsv2
components:
