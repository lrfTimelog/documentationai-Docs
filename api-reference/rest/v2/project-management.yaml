            Allowed values:

            | Value | Name | Meaning |
            |---|---|---|
            | `0` | Quote | Quote (offer stage). |
            | `1` | Approved | Approved; time registration open only if the project's own flag says so. |
            | `2` | InProgress | In progress; open for time registration. |
            | `3` | OnHold | On hold; closed for time registration. |
            | `4` | Completed | Completed; closed for time registration, contracts completed. |
            | `5` | Archived | Archived; closed for time registration, contracts completed. |
            | `6` | Cancelled | Cancelled; closed for time registration, contracts cancelled. |
