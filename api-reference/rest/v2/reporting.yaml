  /v2/report-project/results/table:
    post:
      operationId: reportProjectTableResultsFromFilter
      summary: Search projects for the POC report table
      description: |-
        Returns up to 100 projects (by name) matching optional include/exclude filters on project, project manager, department and customer — across the whole tenant.

        Filters projects with up to four include/exclude ID filters (ANDed) and returns at most 100 rows, ordered by project name, with project number, project manager (employee ID, name, initials), customer and department. No status filter: templates, closed and cancelled projects are included. NOT scoped to the caller: rows come from all projects of the tenant. The 100-row cap is silent — no paging, no total, no indication that rows were cut. Filterable fields (body → column; every filter is optional and ignored unless its ID list is non-empty AND its is…Inclusive switch is true or false): | Body pair | Matches | true | false | |---|---|---|---| | ProjectIds + IsProjectInclusive | ProjectID | in list | not in list | | ProjectManagerIds + IsProjectManagerInclusive | ProjectManagerID (employee ID) | in list | not in list | | DepartmentIds + IsDepartmentInclusive | DepartmentID (exact, no sub-departments) | in list | not in list — projects WITHOUT a department never match either way | | CustomerIds + IsCustomerInclusive | CustomerID | in list | not in list | Projects whose project-manager employee row or customer row is missing are never returned (inner joins).

        **Use it to:**
        - None for integrators: POC endpoint. Use `GET /v2/projects` (scoped, more filters) instead.

        **Not for:**
        - Listing projects the caller may see — this route ignores project privileges
        - Complete result sets — capped at 100 rows

        **Rules across fields:**
        - Each ID list acts only together with its is…Inclusive switch: list non-empty + switch null → filter silently ignored; switch set + list empty → ignored.
        - Body omitted or JSON null → 500 Code 100. An empty object {} returns the first 100 projects (captured).

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **See also:** `GET /v2/projects`
      tags:
      - Dashboard widgets and reports
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportProjectSearchCreate.create'
      responses:
        '200':
          description: |-
            A list, wrapped in the TAF list envelope (`Entities[].Properties`). No list Properties (no TotalRecord / paging) — captured.

            Order: Project name ascending; only the first 100 rows in that order.
          content:
            application/json:
              schema:
                type: object
                description: 'TAF list envelope: each item is in `Entities[].Properties`.'
                properties:
                  Entities:
                    type: array
                    description: Omitted (not `[]`) when the list is empty.
                    items:
                      type: object
                      properties:
                        Properties:
                          $ref: '#/components/schemas/ReportProjectSearchResultRead'
                        Links:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafLink'
                        Actions:
                          type: array
                          items:
                            $ref: '#/components/schemas/TafAction'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
        '401':
          description: '- Missing, invalid or expired bearer token. — When: No or invalid bearer token (captured). — Fix:
            Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v2.reporting.reportproject.searchresultsbyfilters
  /v2/widget-data/billable-percentage:
    get:
      operationId: getWidgetDataBillablePercentageV2
      summary: Get my billable percentage
      description: |-
        Returns the caller's billable hours as a percentage of norm minus absence (month to date and last month) and their billable amount per registered hour over the last 29 days.

        For the CALLER only: CurrentMonthToDateBillablePercentage and LastMonthBillablePercentage = round(billable hours ÷ (norm hours − absence hours) × 100) as integers, and AverageHourlyRate = billable amount ÷ ALL registered hours over currentDate−29 … currentDate−1, in the system base currency (CurrencyAbb), 2 decimals. Only registrations that already have financial data are counted (written asynchronously after a registration is saved — a just-saved registration may not be reflected yet). The norm and absence definitions differ from the external-percentage route (all absence codes here, holiday only there; no employment-period clipping here). Full definitions on WidgetDataBillablePercentageRead.

        **Use it to:**
        - Show a consultant their billable utilisation this month vs last month

        **Not for:**
        - Utilisation of another employee or a team — always the caller
        - Billable rate per billable hour — AverageHourlyRate divides by all registered hours

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Consistency: eventual

        **See also:** `GET /v2/widget-data/external-percentage`, `GET /v1/time-registration-financial-data/get-by-date-range`

        > **Not yet documented:** examples; purpose → description.
      tags:
      - Dashboard widgets and reports
      parameters:
      - name: currentDate
        in: query
        required: true
        schema:
          type: string
          format: date-time
        description: |-
          The reference day ('today'). Windows: month start … currentDate; previous calendar month; currentDate−29 … currentDate−1 for the rate. Time part dropped. Omitted → 404 action not matched (captured).

          Date only — no time component.
      responses:
        '200':
          description: The object, wrapped in the TAF envelope (`Properties`). Properties = WidgetDataBillablePercentageRead.
          content:
            application/json:
              schema:
                type: object
                description: 'TAF envelope: the object is in `Properties`. Null members are omitted; a null result is `{"Links":
                  [self]}` without `Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/WidgetDataBillablePercentageRead'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
                  Actions:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafAction'
        '400':
          description: '- **Code 200** — The request body or parameters failed input validation. — When: currentDate not parseable
            as a date (model binding; src_only). — Fix: Fix every item listed in Details and resend.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '401':
          description: '- Missing, invalid or expired bearer token. — When: No or invalid bearer token, once the action matched.
            — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '404':
          description: '- The route matched a controller, but no action accepts the supplied query parameters — typically
            a required (non-nullable) simple parameter such as a DateTime was omitted. It is a missing-parameter error that
            looks like a 404. — When: currentDate omitted (captured: every scenario omitted it, incl. the unauthenticated
            one).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v2.reporting.widgetdata.getwidgetdatabillablepercentage
  /v2/widget-data/external-percentage:
    get:
      operationId: getWidgetDataExternalPercentageV2
      summary: Get my external percentage
      description: |-
        Returns the caller's hours on external-customer projects as a percentage of their net norm hours, for month to date, last month and the last 90 days.

        For the CALLER only: percentage = round(hours registered on projects whose customer is not the tenant's own company ÷ (norm hours − holiday hours) × 100), as integers, for three windows relative to currentDate — month to date (today included), the previous calendar month, and a rolling 90 days ending yesterday (not three calendar months). 0 when the net norm is 0. Full definitions on WidgetDataExternalPercentageRead. currentDate's time part is dropped; no timezone conversion — the caller decides which calendar day "today" is.

        **Use it to:**
        - Show a consultant how much of their capacity went to customer (external) work

        **Not for:**
        - Billable share → `GET /v2/widget-data/billable-percentage` (different numerator AND a different norm definition)
        - Another employee or a team — always the caller

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **See also:** `GET /v2/widget-data/billable-percentage`, `GET /v2/widget/all-active-widgets`

