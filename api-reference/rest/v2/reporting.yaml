    get:
      operationId: getActiveWidgetsForUserV2
      summary: List my front-page widgets
      description: |-
        Returns the caller's widgets as WidgetType names, first to last. A widget is included only when one of the caller's ACTIVE roles is mapped to its widget page, the page is enabled for the tenant (system page validation), AND the widget is listed in the caller's personal widget order (front-page setting PersonalWidgetSettings, "pageId:order;…"). New users get that setting from the tenant setting DefaultPersonalWidgetSettingsForNewUsers, whose seed lists 12 widgets — not OverdueInvoices and not BudgetRemaining — so a role-granted widget missing from the user's personal order is not returned. A user with no role-granted widget gets an empty WidgetList. IsReportWidgetActive is always true.

        **Use it to:**
        - Decide which widget-data routes to call for the current user, in display order

        **Not for:**
        - The widgets of another user, or the role ↔ widget mapping (admin) — not in this unit

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

