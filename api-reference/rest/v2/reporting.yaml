    WidgetDataBillablePercentageRead:
      type: object
      properties:
        UserId:
          type: integer
          format: int32
          readOnly: true
          x-timelog-identity:
            role: reference
          description: |-
            The caller's user ID (always the caller).

            Refers to `UserRead.UserID`.
        CurrentMonthToDateBillablePercentage:
          type: integer
          format: int32
          readOnly: true
          description: |-
            Window: first day of currentDate's calendar month through currentDate, both inclusive (today included).

            Unit: percent
        LastMonthBillablePercentage:
          type: integer
          format: int32
          readOnly: true
          description: |-
            Window: the whole calendar month before currentDate's month (1st through EOMONTH).

            Unit: percent
        AverageHourlyRate:
          type: number
          format: double
          readOnly: true
          description: |-
            The denominator is ALL registered hours (billable and non-billable), so this is billable amount per registered hour, not the average billable rate. 0 when there are no hours. Rounded to 2 decimals. Amount in the system base currency (BillableAmount is stored in base currency; no conversion).

            Unit: currency (system base currency — CurrencyAbb) per hour

            Contains financial data.
        CurrencyName:
          type:
          - string
          - 'null'
          readOnly: true
          description: Application value BaseCurrency of the tenant, as stored (the value's format — code or name — is tenant
            data).
        CurrencyAbb:
          type:
          - string
          - 'null'
          readOnly: true
          description: Setting BaseCurrencyAbb — the abbreviation of the currency AverageHourlyRate is in.
      description: |-
        "Billable percentage" of ONE user (the caller): billable hours as a percentage of the user's norm hours minus absence hours, month to date and for the previous month, plus the caller's average billable amount per registered hour over the last 29 days, in the system base currency. Formula, per window: round(BillableHours / (NormHours − AbsenceHours) × 100) as an integer; 0 when the denominator is 0. - BillableHours = SUM of the caller's registrations dated in the window. Only registrations that already have a financial-data row count (inner join; that row is written asynchronously — see TimeRegistrationFinancialDataRead). - NormHours = SUM for the caller in the window (not clipped to the employment period, unlike the external widget). - AbsenceHours = SUM(ActualHours) of the caller's registrations with EntityType 149 (= any absence code, not only holiday) in the window that have a financial-data row. - The denominator can be negative or tiny; the percentage is not capped.

        > **Not yet documented:** description.
    WidgetDataExternalPercentageRead:
      type: object
      properties:
        UserId:
          type: integer
          format: int32
          readOnly: true
          x-timelog-identity:
            role: reference
          description: |-
            The caller's user ID (always the caller).

            Refers to `UserRead.UserID`.
        CurrentMonthPercentage:
          type: integer
          format: int32
          minimum: 0
          readOnly: true
          description: |-
            Window: first day of currentDate's calendar month through currentDate, both inclusive (month to date, today included). Norm is computed over the same window.

            Unit: percent

            Range: min 0, step 1, unit percent.
        LastMonthPercentage:
          type: integer
          format: int32
          minimum: 0
          readOnly: true
          description: |-
            Window: the whole calendar month before currentDate's month (1st to last day). Norm over the same month.

            Unit: percent

            Range: min 0, step 1, unit percent.
        LastThreeMonthsPercentage:
          type: integer
          format: int32
          minimum: 0
          readOnly: true
          description: |-
            Window: currentDate − 90 days through currentDate − 1 day (yesterday), both inclusive — a rolling 90-day window that EXCLUDES today, not three calendar months. Norm over the same window.

            Unit: percent

            Range: min 0, step 1, unit percent.
      description: '"External percentage" of ONE user (the caller): registered hours on projects of external customers as
        a percentage of the user''s norm hours (expected working hours) minus holiday, for three windows relative to currentDate.
        Formula, per window: round(ExternalHours / NetNormHours × 100) as an integer; 0 when NetNormHours = 0. - ExternalHours
        = SUM of the caller''s project time registrations (those linked to a task allocation through a work unit row) on projects
        whose customer is NOT the tenant''s own company (application value FirmaID). Billable and non-billable hours both
        count. Registrations without such a work unit (e.g. absence) are not counted. - NetNormHours = Function_Calulate_Norm_New(employee,
        from, to, SubtractVacation = 1): SUM of the employee''s NormalWorkingHours in the window, clipped to the employment
        period (hire / dismissal date), minus hours registered on absence codes whose system absence code type is 2 (holiday);
        never below 0. - Values can exceed 100 (more external hours than norm).'
    WidgetDataTimeRegistrationAccuracyRead:
      type: object
      properties:
        UserId:
          type: integer
          format: int32
          readOnly: true
          x-timelog-identity:
            role: reference
          description: |-
            The caller's user ID (echo of the user the metric was computed for — always the caller).

            Refers to `UserRead.UserID`.
        StartDate:
          type: string
          format: date-time
          readOnly: true
          description: |-
            Echo of the requested startDate, time part removed (first day of the period, inclusive).

            Date only — no time component.
        EndDate:
          type: string
          format: date-time
          readOnly: true
          description: |-
            Echo of the requested endDate, time part removed (last day of the period, inclusive).

            Date only — no time component.
        LastRegistrationDate:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
          description: |-
            Timestamp of the caller's most recent CHANGE to any project time registration, considering changes made on or before EndDate — regardless of the registration's work date and not limited to the period. Despite the name it is not the latest work date registered. null when the user has no such registration.

            Null: null = no project time registration modified on or before EndDate.

            Time zone: not yet documented.
        AccuracyCurrentPeriod:
          type: number
          format: double
          readOnly: true
          description: |-
            Average delay in DAYS between work date and creation, over the caller's project time registrations whose work date (Date) is in [StartDate, EndDate]: AVG(day of Created − Date), rounded to 2 decimals. Creation is truncated to midnight first (Function_DateRemoveMinutes drops the whole time part), so a same-day registration counts 0 and the value is a whole-day difference averaged. Registrations dated 2 or more days AFTER their creation day (planned ahead) are excluded (Date < Created + 2 days). A NEGATIVE value is possible (registrations dated up to one day ahead). 0 when there are no registrations in the period.

            Unit: days

            Range: step 0.01, unit days.
        AccuracyPreviousPeriod:
          type: number
          format: double
          readOnly: true
          description: |-
            Same metric as AccuracyCurrentPeriod for the period of the same length immediately before StartDate: [StartDate − (EndDate − StartDate) − 1 day, StartDate − 1 day]. Example: startDate 2026-10-01, endDate 2026-10-31 → previous period 2026-08-31 … 2026-09-30 (31 days).

            Unit: days

            Range: step 0.01, unit days.
      description: '"Time registration accuracy" of ONE user (the caller): on average, how many days after the work date the
        user''s project time registrations were created, for a period and for the equally long period just before it. 0 =
        registered on the day (or no registrations); higher = registered later. Only project time counts (registrations of
        EntityType 43 = Allocation, i.e. on a task allocation); absence is excluded.'
