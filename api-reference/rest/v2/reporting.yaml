openapi: 3.1.0
info:
  title: Dashboard widgets and reports — REST API v2
  version: v2
  description: |-
    Enums are strings (member names) in v2 responses.

    **Conventions that apply to every operation in this file:**
    - Property names are PascalCase.
    - Successful bodies use the TAF envelope: one object in `Properties`, lists in `Entities[].Properties`.
    - Some operations succeed without content: HTTP 200 with the literal body `null`, or HTTP 204.
    - `PUT` replaces the whole object: omitted fields are reset.
    - Treat error `Code` 102 as a business-rule violation, whether the HTTP status is 422 or 500.

    > **Not yet documented:** rate limits.
servers:
- url: https://{your-timelog-host}/{tlp-virtual-directory}/api
  description: 'Your TimeLog site. `your-timelog-host` is the host of your TimeLog site (Not yet documented: the production
    host pattern); `tlp-virtual-directory` is the virtual directory your TimeLog site is hosted under.'
  variables:
    your-timelog-host:
      default: your-timelog-host
    tlp-virtual-directory:
      default: your-virtual-directory
security:
- bearer: []
tags:
- name: Dashboard widgets and reports
  description: Enums are strings (member names) in v2 responses.
paths:
  /v2/insights-service/hour-kpi-per-month-hours-only:
    get:
      operationId: getHourKpiPerMonthHoursOnlyWidgetV2
      summary: Get my added value per month, own hours only (Insights widget)
      description: |-
        Insights endpoint hour-kpi-per-month-hours-only-widget-data (widget title 'Added value per month (only My hours)'). Help text: 'Shows the monthly value added for the fiscal year. It displays either the registered or the estimated value. All amounts are in {{currency}}, with invoices in other currencies being converted. Internal hours hold a zero value, and absence hours are omitted … accumulates the year-to-date values …'. Same body shape as hour-kpi-per-month. DIFFERENCE IN TLP from hour-kpi-per-month and hour-kpi-bar-per-month: only the Insights endpoint name and the declared (unenforced) feature — the frontend sends NO filter here, but TLP forwards any query string, so a caller-added ?filter= reaches Insights; whether Insights ignores it on this route is not established. PASS-THROUGH PROXY. Insights' HTTP status, headers and body are returned to the caller unchanged. The controller says it exists only so the React frontend can reach Insights and must not be used for anything else.

        **Use it to:**
        - Show an employee the sales value of their own registered hours per month

        **Not for:**
        - Revenue or invoicing reporting — use the reporting / invoice APIs
        - Anything outside the front-page widget (controller comment)

        **Behaviour:**
        - Read-after-write consistency: not yet documented.

        > **Not yet documented:** behaviour; examples; purpose → description; response → default ordering; response → empty result; response → pagination; response → success.
      tags:
      - Dashboard widgets and reports
      responses:
        '200':
          description: |-
            The object, wrapped in the TAF envelope (`Properties`). Insights body relayed unchanged. As the frontend reads it: a TAF-style object whose properties = InsightsHourKpiPerMonthRead (wire casing not established — the frontend camel-cases keys). Status/headers are Insights’.

            > **Not yet documented:** paging.

            Order: not yet documented.

            Empty result: not yet documented.
          content:
            application/json:
              schema:
                type: object
                description: 'TAF envelope: the object is in `Properties`. Null members are omitted; a null result is `{"Links":
                  [self]}` without `Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/InsightsHourKpiPerMonthRead'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
                  Actions:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafAction'
        '401':
          description: '- Missing, invalid or expired bearer token. — When: No / invalid token (captured: unauthorized scenario).
            — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '500':
          description: |-
            - **Code 100** — Unhandled server error.

            - **Code 499** — Misleading. — When: Insights does not answer within HttpClient's default 100 s. — Fix: Retry later; if persistent, Insights is down or slow — contact TimeLog support.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        default:
          description: '- TLP returns Insights'' HttpResponseMessage as is: same status code, headers and body. http_status
            is therefore whatever Insights sent. — When: Insights answered with a non-2xx status: relayed unchanged (status,
            headers, body in Insights'' own format). — Fix: Inspect the relayed body; a 401/403 here comes from Insights''
            own token validation, not from TLP''s.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v2.reporting.insightsservicewidgetdata.gethourkpipermonthwidgethoursonly
