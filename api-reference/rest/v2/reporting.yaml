    get:
      operationId: getTimeRegistrationAccuracyInPeriodV2
      summary: Get my time-registration accuracy for a period
      description: |-
        Returns how many days, on average, the caller registered project time after the work date — for a period and for the equally long period before it.

        Computes, for the CALLER only, the average delay in days between a project time registration's work date and its creation day, over registrations whose work date lies in [startDate, endDate] (AccuracyCurrentPeriod) and in the equally long period immediately before startDate (AccuracyPreviousPeriod), plus the timestamp of the caller's latest change to a project registration (LastRegistrationDate). Full formula, rounding, exclusions and the previous-period arithmetic are on WidgetDataTimeRegistrationAccuracyRead. Both dates are reduced to calendar days (time part dropped); no timezone conversion. There is no validation that startDate ≤ endDate: with startDate after endDate no registration matches and both values are 0 (src_only).

        **Use it to:**
        - Show a user how promptly they register time, and the trend against the previous period

        **Not for:**
        - Another employee's or a team's registration delay — the route always computes the caller's own

        **Rules across fields:**
        - startDate ≤ endDate is expected but not checked; a reversed range returns 0 for both periods (src_only).

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **See also:** `GET /v2/widget-data/external-percentage`, `GET /v2/widget-data/billable-percentage`

        > **Not yet documented:** errors; examples.
