      summary: Get my UI context (language, sign-up button, segmentation)
      description: |-
        Returns the caller's language, whether to show the trial sign-up button, and the in-app-guidance segmentation of the caller and tenant.

        Everything is about the CALLER or the caller's tenant: profile language (LCID + code), the sign-up-button flag, and two string maps used to segment in-app guidance — the user map (name, user name, e-mail, role flags, department, …) and the account map. Both maps are cached per user id.

        **Use it to:**
        - Client shell choosing the UI language and initialising in-app guidance for the signed-in user

        **Not for:**
        - Tenant time / expense configuration → GET /v1/user-setting (Common service)

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Side effect: Caches both segmentation maps per user id (TimelogCustomerSegmentationUser<id> / …Account<id>); later calls return the cached maps, so changes (role, department, integrations) may show only after the cache entry expires.

        > **Not yet documented:** behaviour → consistency.
