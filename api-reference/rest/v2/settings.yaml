  /v2/settings/frontpage-internal-message:
    get:
      operationId: getFrontPageInternalMessage
      summary: Get the front-page internal message
      description: |-
        Returns the administrator's front-page notice (HTML) and whether the caller may edit it.

        The FrontPageInternalMessage tenant setting: rich-text HTML that an administrator writes for every user's front page. Any Azure-blob image URL in it is re-signed with a fresh 15-minute read token on every call (stored tokens expire), so images uploaded with POST /v2/settings/frontpage-image keep working. IsEditable tells the client whether to offer the editor (front-page privilege). The message is returned even when the feature FrontPageInternalMessage is off — clients should check the feature (GET /v2/features/front-page) before showing the box.

        **Use it to:**
        - Front page rendering the administrator's notice; deciding whether to show the edit button

        **Not for:**
        - Saving the message → `PUT /v2/settings/{settingIdentifier}` (settingIdentifier FrontPageInternalMessage)

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Consistency: immediate on the serving web server (cached system configuration)

        **Call first:** `GET /v2/features/front-page`

        **Next:** `POST /v2/settings/frontpage-image`, `PUT /v2/settings/{settingIdentifier}`

        > **Not yet documented:** response → success.
      tags:
      - Settings
      responses:
        '200':
          description: |-
            The object, wrapped in the TAF envelope (`Properties`).

            Empty result: 200 with Value "" when no message is set (setting default string.Empty).
          content:
            application/json:
              schema:
                type: object
                description: 'TAF envelope: the object is in `Properties`. Null members are omitted; a null result is `{"Links":
                  [self]}` without `Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/SettingRead'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
                  Actions:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafAction'
              examples:
                example1:
                  summary: Example
                  value:
                    Properties:
                      Name: FrontPageInternalMessage
                      Value: <h1 style="">_TIMJenm70519EUR (.0058)<br><br><br>1234567890<br>ABCDEFGHIJKLMNOPQRSTUVWXYZ</h1><p
                        style="">&nbsp;a</p>
                      IsEditable: true
                    Links:
                    - Href: https://{region-node}.timelog.com/{account}/api/v2/settings/frontpage-internal-message
                      Rel: self
        '401':
          description: '- Missing, invalid or expired bearer token. — When: No or invalid bearer token (captured). — Fix:
            Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
