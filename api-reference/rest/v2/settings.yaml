    PageSettingsRead:
      type: object
      properties:
        <PageSettingKey name>:
          type:
          - string
          - 'null'
          readOnly: true
          description: |-
            One entry per stored preference of the caller on that page. Property name = PageSettingKey member name; value = the stored string. The value's real type depends on the key's PageSettingType attribute (String, Boolean as "True"/"False", Int32, Double, approval enums, ";"-style separators, region LCID) — e.g. PersonalWidgetSettings on the front page is "{pageId}:{order};…". Keys are unique (dictionary).

            - property name — A PageSettingKey member name (see the PageSettingKey enum card).

            > **Not yet documented:** nullable.
      description: 'The caller''s OWN stored UI preferences for one page: a JSON object whose property names are PageSettingKey
        names and whose values are the stored strings. Only keys the caller has a stored row for appear; there are no defaults.
        Another user''s preferences cannot be read.'
    ResponseError:
      type: object
      description: Error body for validation (400), privilege (403), business-rule (422/500) and other server errors. `Details`
        lists strings for validation errors, or `{ErrorCode, Message}` objects for business-rule violations. `Parameters`
        echoes the request arguments, including the full payload.
      properties:
        Code:
          type: integer
          description: 'TimeLog error class (not the HTTP status): 100 unexpected, 102 business rule, 103 privilege, 200 validation.'
        Message:
          type: string
        Details:
          type: array
          items: {}
        Parameters:
          type:
          - string
          - object
          - 'null'
        Url:
          type: string
