    SettingRead:
      type: object
      properties:
        Name:
          type: string
          readOnly: true
          x-timelog-identity:
            role: primary_id
            unique_scope: global
            id_format: string
          description: |-
            The setting's mapping key (ISetting.MappingKey) — for the front-page message the string FrontPageInternalMessage.

            Identifier of this object, globally unique.
        Value:
          type:
          - string
          - 'null'
          format: html
          readOnly: true
          description: 'The stored value as a string. For FrontPageInternalMessage: rich-text HTML written by an administrator;
            every Azure blob URL in it is re-signed with a fresh 15-minute read token on each read (URLs that fail to re-sign
            are left as stored). Empty string when no message is set.'
        IsEditable:
          type: boolean
          readOnly: true
      description: One tenant setting's value, plus whether the CALLER may change it. Today only the front-page internal message
        is served this way.
    SettingUpdateV2.update:
      type: object
      properties:
        Value:
          type:
          - string
          - 'null'
          writeOnly: true
          description: |-
            The new value, always as a JSON string whatever the setting's type (numbers, dates, booleans, enums are written as text). The server sanitizes it by the setting's data type before storing. For FrontPageInternalMessage it is the HTML of the message, with images as URLs from POST /v2/settings/frontpage-image.

            > **Not yet documented:** behaviour.
      required:
      - Value
      description: The new value of the tenant setting named in the path, as a string.
    TafAction:
      type: object
      description: A hypermedia action the caller may take on the object. Present only where the operation registers actions.
    TafLink:
      type: object
      properties:
        Href:
          type: string
        Rel:
          type: string
    TafListPaging:
      type: object
      description: 'Paging values. They are returned as STRINGS, for example `"TotalRecord": "12"`.'
      properties:
        TotalRecord:
          type: string
        TotalPage:
          type: string
        PageNumber:
          type: string
    UserLanguageRead:
      type: object
      properties:
        Lcid:
          type: integer
          format: int32
          readOnly: true
          description: |-
            Windows locale id of the caller's profile language (e.g. 2057 = English (United Kingdom), 1030 = Danish).

            > **Not yet documented:** values.
        ShortString:
          type: string
          readOnly: true
          description: Short language code of the same language (e.g. "en", "da").
      description: The caller's own UI language (user profile), as a Windows LCID and a short language code.
    UserSettingsRead:
      type: object
      properties:
        Language:
          $ref: '#/components/schemas/UserLanguageRead'
          readOnly: true
          description: The caller's profile language.
        ShowSignUpButton:
          type: boolean
          readOnly: true
          description: |-
            true when the UI should show the trial "sign up" button: the platform engine says the caller should see sign-up notifications AND (the tenant's product is not Time, OR it is Time and the demo expires within the configured notification window).

            > **Not yet documented:** description.
        CustomerSegmentationUser:
          type: object
          readOnly: true
          description: |-
            String→string map about the CALLER, cached per user id: userId ("<shortName>_<UserId>"), fullName, firstName, userName, userIdentifier, email, userLanguage (LCID), compactTimesheetView ("0"/"1"), defaultTimesheetView, userCreatedYear/Month/Day, role flags "0"/"1" (roleProject, roleContract, roleCustomer, roleApproval, roleEmployee, roleEmployeeModify, roleExpense, roleSystemAdm, roleInvoice, roleMileage, roleMyAccount), "timeLogResponsible " (key has a trailing space), gDPRResponsible, userDepartmentName (level-1 department), moduleCrm, moduleOutlook. Every value is a string.

            Contains personal data.
        CustomerSegmentationAccount:
          type: object
          readOnly: true
          description: 'String→string map about the TENANT, cached per user id: account (the URL short name), customerProductId,
            major/minor/buildVersion of the TimeLog build, database, product, productionStatus, plan, one "0"/"1" flag per
            integration type (intEcn, intExact, intFortnox, intVisma, intNav, intDinero, intUniconta, intBjörnLundén, intDanløn,
            intVismasalary, intHogia, intZenegy, intCrona, intDataloen, intFortnoxLön, intLessorPayroll, intSLS — some keys
            contain non-ASCII letters), mle (multiple legal entities), timelogResponsibleOnSite, resourcePlanner.'
      description: 'The CALLER''s own UI context: profile language, whether to show the trial sign-up button, and the in-app-guidance
        (WalkMe) segmentation of the caller and of the tenant. Everything is about the caller or the caller''s tenant; no
        other user''s data is returned.'
    UserWidgetDisplayOrderUpdate.update:
      type: object
      properties:
        WidgetId:
          type: integer
          format: int32
          writeOnly: true
          x-timelog-identity:
            role: reference
          description: |-
            The widget to move: its page id, as returned in UserWidgetRead.WidgetID.

            Refers to `UserWidgetRead.WidgetID`. Look up valid values with `GET /v2/page-settings/widgets`.

            - omitted, or not in the caller's stored widget order, or not granted by the caller's roles — Nothing is written; the call still returns 204.

            Valid values come from `GET /v2/page-settings/widgets`.
        DisplayOrder:
          type: integer
          format: int32
          writeOnly: true
          description: |-
            The new position, ZERO-based (0 = first). The server adds 1 and stores 1-based positions; the other widgets of the caller shift to make room, and the order is renumbered visible widgets first, then widgets the caller's roles no longer grant.

            - omitted — 0 — moves the widget to the first position.

            - negative or beyond the last position — Not validated; stored as given (+1). Sorting still works but positions are no longer 1..N.
      required:
      - WidgetId
      - DisplayOrder
      description: Moves one of the caller's front-page widgets to a new position in the caller's own widget order.
    UserWidgetListRead:
      type: object
      properties:
        WidgetList:
          type: array
          items:
            $ref: '#/components/schemas/UserWidgetRead'
          readOnly: true
          description: First to last in the caller's display order. A widget appears only when BOTH (a) one of the caller's
            roles grants the widget page and (b) it is listed in the caller's front-page setting PersonalWidgetSettings. Empty
            when the caller's roles grant no widget.
      description: The caller's front-page widgets in the caller's personal display order (a single TAF object).
