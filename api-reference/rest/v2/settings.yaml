        Enabled:
          type: boolean
          readOnly: true
          description: true when the feature is switched on for the tenant (IFeature.IsActive).
        CanUserOverride:
          type:
          - boolean
          - 'null'
          readOnly: true
          description: |-
            IFeature.CanUserOverride of the feature definition.

            Null: Omitted from the JSON when null (NullValueHandling.Ignore).

            > **Not yet documented:** description.
        Value:
          type:
          - number
          - 'null'
          format: double
          readOnly: true
          description: |-
            Always null on this route, so never present in the JSON (the IFeature constructor sets Value = null).

            Null: Always null here; omitted (NullValueHandling.Ignore).
      description: 'The current state of one tenant feature flag: its name, numeric identifier, whether it is on for the tenant
        and whether users may override it.'
    FeatureUpdateV2.update:
      type: object
      properties:
        Enabled:
          type: boolean
          writeOnly: true
          description: |-
            true = switch the feature on for the whole tenant, false = switch it off.

            - omitted (e.g. body {}) — false — the feature is switched OFF; nothing validates the body.

            - equal to the current value — No write, no validation, no events; 200 null.
      required:
      - Enabled
      description: The new on/off state for the feature named in the `identifier` query parameter of PUT /v2/features.
    FrontPageImageRead:
      type: object
      properties:
        location:
          type: string
          format: uri
          readOnly: true
          description: |-
            Absolute URL of the stored image in the tenant's PRIVATE blob container (tlp-<CustomerProductId>, blob FrontPageImage-<GUID><extension of the uploaded file name>) carrying a read-only SAS token valid for 15 minutes (start 15 minutes in the past). It is a bearer link: anyone holding it can read the image until it expires.

            Set by TimeLog.

            Property name is lower-case 'location' (anonymous object), unlike the PascalCase models of the rest of the API.
      description: The uploaded front-page image's read URL, to be inserted into the front-page internal message HTML.
    MessageError:
      type: object
      description: Body of 401 and some framework errors — not the ResponseError shape.
      properties:
        Message:
          type: string
