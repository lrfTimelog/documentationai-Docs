            four image types.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '500':
          description: |-
            - Writing the blob or signing its URL failed; {0} is the raw .NET exception message. — Fix: Retry later; if persistent, blob storage is unavailable for the site.

            - **Code 100** — Unhandled server error.
