openapi: 3.1.0
info:
  title: Settings — REST API v2
  version: v2
  description: |-
    Enums are strings (member names) in v2 responses.

    **Conventions that apply to every operation in this file:**
    - Property names are PascalCase.
    - Successful bodies use the TAF envelope: one object in `Properties`, lists in `Entities[].Properties`.
    - Some operations succeed without content: HTTP 200 with the literal body `null`, or HTTP 204.
    - `PUT` replaces the whole object: omitted fields are reset.
    - Treat error `Code` 102 as a business-rule violation, whether the HTTP status is 422 or 500.

    > **Not yet documented:** rate limits.
servers:
- url: https://{region-node}.timelog.com/{account}/api
  description: 'Your TimeLog site. Copy both values from the address bar when you are signed in to TimeLog: `region-node`
    is the first part of the host name (for example `app3` in `app3.timelog.com`), `account` is the first path segment after
    it.'
  variables:
    region-node:
      default: app3
    account:
      default: your-account
security:
- bearer: []
tags:
- name: Settings
  description: Enums are strings (member names) in v2 responses.
paths:
  /v2/features:
    put:
      operationId: updateFrontPageFeatureV2
      summary: Switch a tenant feature on or off
      description: |-
        Turns one tenant-wide feature flag on or off — any feature, despite the front-page name.

        TENANT-WIDE CONFIGURATION WRITE. The feature is named in the `identifier` query parameter (FeatureIdentifier name or number) and the body carries only `Enabled`. It runs exactly the same manager code as PUT /v1/feature (`PUT /v1/feature`): setting a feature to its current value does nothing and returns 200; a real change is validated, written, and then triggers the feature's side effects, some of which rewrite tenant data (AllocationDates off rewrites every allocation's dates). Unlike v1, there is no internal-client restriction.

        **Use it to:**
        - WidgetPlannedAbsence) on or off

        **Not for:**
        - Reading a feature → `GET /v2/features/{id}`
        - Typed settings (numbers, dates, text) → `PUT /v2/settings/{settingIdentifier}`

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Duplicates: Same value again = no write, no events, 200 null.
        - Side effect: Identical to `PUT /v1/feature`: writes the feature value for the whole tenant, invalidates the cached system configuration, runs the feature's pre / post actions and dependent-settings updates (e.g. AllocationDates OFF rewrites every allocation's dates to its task's dates — not reversible by switching back).
        - Side effect: Post actions run TWICE per call.

        **Call first:** `GET /v2/features/{id}`

        **Next:** `GET /v2/features/front-page`

        **See also:** `PUT /v1/feature`, `PUT /v2/settings/{settingIdentifier}`

        > **Not yet documented:** behaviour → consistency; examples (success); request → query params.
      tags:
      - Settings
      parameters:
      - name: identifier
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/FeatureIdentifier'
        description: |-
          The feature to change: FeatureIdentifier member name (case-insensitive) or its integer value. Omitted → 404 rest.action-not-matched (captured — every captured call omitted it). An integer with no member binds and then fails with 500 (FeatureConfiguration.GetFeature).

          Allowed values: see `FeatureIdentifier`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeatureUpdateV2.update'
      responses:
        '200':
          description: 'Success without content: HTTP 200 with the literal JSON body `null`. Literal JSON `null` (TafSuccessResult)
            — also when the value was already set (no-op).'
          content:
            application/json:
              schema:
                type: 'null'
        '400':
          description: '- **Code 200** — The request body or parameters failed input validation. — When: `identifier` is not
            a FeatureIdentifier name or an integer (model binding; inferred from the captured PUT /v2/settings/{settingIdentifier}
            behaviour, not captured here). — Fix: Fix every item listed in Details and resend.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '401':
          description: '- Missing, invalid or expired bearer token. — When: No or invalid bearer token. — Fix: Obtain a new
            token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '404':
          description: '- The route matched a controller, but no action accepts the supplied query parameters — typically
            a required (non-nullable) simple parameter such as a DateTime was omitted. It is a missing-parameter error that
            looks like a 404. — When: `identifier` query parameter omitted (captured: all scenarios of PUT_features.json).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: identifier omitted
                  value:
                    Message: No HTTP resource was found that matches the request URI 'https://{region-node}.timelog.com/{account}/api/v2/features'.
                    MessageDetail: No action was found on the controller 'Features' that matches the request.
        '500':
          description: |-
            - **Code 100** — Also: a feature defined with a null page list (e.g. CRM, UsePostEvents). — When: ValidateFeatureForUser violations (policies, dependent features, licence type, missing page access). — Fix: Change the feature in the TimeLog UI, where the reason is shown.

            - **Code 100** — Unhandled server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v2.settings.features.updatefrontpagefeatures
  /v2/features/front-page:
    get:
      operationId: getFrontPageFeatureV2
      summary: List the front-page feature flags
      description: |-
        Always the same nine entries, in this order: FrontPageInternalMessage (the administrator's notice box), DesignSevenNotificationCenter, ShowMileStones (with `value` = the tenant setting FrontPageMilestonePeriod), WidgetInvoicedPerMonth, WidgetPlannedAbsence, WidgetProjectEconomyHealth, WidgetAverageHourlyRate, WidgetTimeTrackingDelay (with `value` = the setting FrontPageCompanyTarget) and WidgetVacationCalculation. Tenant configuration only — the same answer for every user of the tenant. Which widgets a given USER sees is decided by roles and personal order (`GET /v2/page-settings/widgets`).

        **Use it to:**
        - Front-page client deciding which boxes and widgets to render for the tenant

        **Not for:**
        - The caller's own widget list → `GET /v2/page-settings/widgets`
        - Any other feature → `GET /v2/features/{id}`

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Consistency: immediate on the serving web server (cached system configuration, invalidated on change)

        **Next:** `GET /v2/page-settings/widgets`, `GET /v2/settings/frontpage-internal-message`

        **See also:** `GET /v2/features/{id}`, `PUT /v2/features`

        > **Not yet documented:** response → success → schema.
      tags:
      - Settings
      responses:
        '200':
          description: |-
            The object, wrapped in the TAF envelope (`Properties`).

            Order: Fixed code order (see description).

            Empty result: Never empty: always nine entries.
          content:
            application/json:
              schema:
                type: object
                description: 'TAF envelope: the object is in `Properties`. Null members are omitted; a null result is `{"Links":
                  [self]}` without `Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/FeatureListRead'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
                  Actions:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafAction'
              examples:
                example1:
                  summary: Example
                  value:
                    Properties:
                      FeatureList:
                      - name: FrontPageInternalMessage
                        identifier: 468
                        enabled: true
                      - name: DesignSevenNotificationCenter
                        identifier: 442
                        enabled: true
                      - name: ShowMileStones
                        identifier: 133
                        enabled: true
                        value: 0.0
                      - name: WidgetInvoicedPerMonth
                        identifier: 446
                        enabled: true
                      - name: WidgetPlannedAbsence
                        identifier: 445
                        enabled: true
                      - name: WidgetProjectEconomyHealth
                        identifier: 448
                        enabled: true
                      - name: WidgetAverageHourlyRate
                        identifier: 449
                        enabled: true
                      - name: WidgetTimeTrackingDelay
                        identifier: 458
                        enabled: true
                        value: 5.0
                      - name: WidgetVacationCalculation
                        identifier: 459
                        enabled: true
                    Links:
                    - Href: https://{region-node}.timelog.com/{account}/api/v2/features/front-page
                      Rel: self
        '401':
          description: '- Missing, invalid or expired bearer token. — When: No or invalid bearer token (captured). — Fix:
            Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v2.settings.features.getfrontpagefeatures
  /v2/features/resource-management:
    get:
      operationId: resourceManagementFeaturePageV2
      summary: List the resource-management feature flags
      description: |-
        Returns the on/off state of the resource-management features — today only Competences.

        A one-entry list: { name: Competences, identifier: 470, enabled }. Tenant configuration only — the same answer for every user. The list is code-defined; new resource-management features appear only when the code adds them.

        **Use it to:**
        - Resource-management client deciding whether to show competence features

        **Not for:**
        - Any other feature → `GET /v2/features/{id}`

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Consistency: immediate on the serving web server (cached system configuration)

        **See also:** `GET /v2/features/{id}`, `GET /v2/features/front-page`
      tags:
      - Settings
      responses:
        '200':
          description: |-
            The object, wrapped in the TAF envelope (`Properties`).

            Order: Single entry.

            Empty result: Never empty.
          content:
            application/json:
              schema:
                type: object
                description: 'TAF envelope: the object is in `Properties`. Null members are omitted; a null result is `{"Links":
                  [self]}` without `Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/FeatureListRead'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
                  Actions:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafAction'
              examples:
                example1:
                  summary: Example
                  value:
                    Properties:
                      FeatureList:
                      - name: Competences
                        identifier: 470
                        enabled: true
                    Links:
                    - Href: https://{region-node}.timelog.com/{account}/api/v2/features/resource-management
                      Rel: self
        '401':
          description: '- Missing, invalid or expired bearer token. — When: No or invalid bearer token (captured). — Fix:
            Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v2.settings.features.resourcemanagementfeatures
  /v2/features/{id}:
    get:
      operationId: getFeatureByIdV2
      summary: Get a feature flag
      description: |-
        Returns whether one tenant feature flag is on, by its integer FeatureIdentifier.

        Looks up any feature of the tenant's configuration — not only front-page ones — and returns its name, number, on/off state and CanUserOverride. 426 CurrencyMatrix, 213 AllocationDates) before calling that operation.

        **Use it to:**
        - Check a tenant feature that changes another operation's behaviour (settings_gates) before calling it

        **Not for:**
        - Changing a feature → `PUT /v2/features`

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Consistency: immediate on the serving web server (cached system configuration, invalidated on change)

        **Next:** `PUT /v2/features`

        **See also:** `GET /v2/features/front-page`, `PUT /v1/feature`
      tags:
      - Settings
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/FeatureIdentifier'
        description: |-
          FeatureIdentifier integer value (see the FeatureIdentifier enum card). Names are NOT accepted ({id:int}: a non-integer is 404 rest.route-not-found).

          Allowed values: see `FeatureIdentifier`.
      responses:
        '200':
          description: |-
            The object, wrapped in the TAF envelope (`Properties`).

            Empty result: Not applicable — an undefined id is a 500, not a 404.
          content:
            application/json:
              schema:
                type: object
                description: 'TAF envelope: the object is in `Properties`. Null members are omitted; a null result is `{"Links":
                  [self]}` without `Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/FeatureRead'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
                  Actions:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafAction'
              examples:
                example1:
                  summary: Feature 1
                  value:
                    Properties:
                      Name: InvoiceDefaultValue_AppendInvoiceHeaderOnCreditNoteHeader
                      Identifier: 1
                      Enabled: true
                      CanUserOverride: false
                    Links:
                    - Href: https://{region-node}.timelog.com/{account}/api/v2/features/1
                      Rel: self
        '401':
          description: '- Missing, invalid or expired bearer token. — When: No or invalid bearer token (captured). — Fix:
            Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '404':
          description: '- The URL did not match any route (including a route constraint such as {id:int} receiving a non-integer).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v2.settings.features.getfeaturebyid
  /v2/page-settings/widgets:
    get:
      operationId: getAllUserWidgets
      summary: List my front-page widgets
      description: |-
        Returns the calling user's front-page widgets in their personal display order.

        The widgets the caller sees on the front page, first to last. A widget is listed only when one of the caller's roles grants the widget page AND it appears in the caller's stored widget order (front-page setting PersonalWidgetSettings, "{pageId}:{position};…"). Each item gives the widget's page id (the id to send to PATCH displayorder) and its PageIdentifier name.

        **Use it to:**
        - Render the caller's front-page widgets in order; get WidgetID values for reordering

        **Not for:**
        - Which widget features the tenant has on → `GET /v2/features/front-page`

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **Next:** `PATCH /v2/page-settings/widgets/displayorder`

        **See also:** `GET /v2/features/front-page`
      tags:
      - Settings
      responses:
        '200':
          description: |-
            The object, wrapped in the TAF envelope (`Properties`).

            Order: Caller's stored display order (ascending position).

            Empty result: 200 with WidgetList [] when the caller's roles grant no widget.
          content:
            application/json:
              schema:
                type: object
                description: 'TAF envelope: the object is in `Properties`. Null members are omitted; a null result is `{"Links":
                  [self]}` without `Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/UserWidgetListRead'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
                  Actions:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafAction'
              examples:
                example1:
                  summary: Example
                  value:
                    Properties:
                      WidgetList:
                      - WidgetID: 1156
                        WidgetName: WidgetTimeTrackingDelay
                      - WidgetID: 1161
                        WidgetName: WidgetBillablePercentage
                      - WidgetID: 1162
                        WidgetName: WidgetExternalPercentage
                      - WidgetID: 1163
                        WidgetName: WidgetPersonalPlan
                      - WidgetID: 1160
                        WidgetName: WidgetHourKPIHoursOnly
                      - WidgetID: 1158
                        WidgetName: WidgetHourKPI
                      - WidgetID: 1159
                        WidgetName: WidgetHourKPIWithBAR
                      - WidgetID: 1152
                        WidgetName: WidgetInvoicedPerMonth
                      - WidgetID: 1155
                        WidgetName: WidgetAverageHourlyRate
                      - WidgetID: 1151
                        WidgetName: WidgetPlannedAbsence
                      - WidgetID: 1154
                        WidgetName: WidgetProjectEconomyHealth
                      - WidgetID: 1157
                        WidgetName: WidgetVacationCalculation
                    Links:
                    - Href: https://{region-node}.timelog.com/{account}/api/v2/page-settings/widgets
                      Rel: self
        '401':
          description: '- Missing, invalid or expired bearer token. — When: No or invalid bearer token (captured). — Fix:
            Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v2.settings.pagesettings.getalluserwidgets
  /v2/page-settings/widgets/displayorder:
    patch:
      operationId: updateUserWidgetDisplayOrder
      summary: Move one of my front-page widgets
      description: |-
        Moves one of the caller's front-page widgets to a new (zero-based) position in the caller's own order.

        Reads the caller's stored order (PersonalWidgetSettings on the FrontPage), renumbers it — widgets the caller's roles grant first, in their current order, then the others — moves the given widget to DisplayOrder + 1 and shifts the widgets in between by one, then saves the caller's order. Only the caller's own front page is affected. When the widget is not in the stored order, not granted, or the caller has no granted widgets, nothing is written and the response is still 204.

        **Use it to:**
        - Persist a drag-and-drop reorder of the caller's front-page widgets

        **Not for:**
        - Switching a widget on / off for the tenant → `PUT /v2/features`

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Duplicates: Repeating the same move gives the same order.
        - Side effect: Rewrites the caller's FrontPage / PersonalWidgetSettings value: every stored widget is renumbered (granted widgets 1..n, then non-granted ones), so positions of widgets the caller no longer has also change.
        - Changes are visible to the next read immediately.

        **Call first:** `GET /v2/page-settings/widgets`

        **Next:** `GET /v2/page-settings/widgets`

        **See also:** `GET /v2/page-settings/{pageIdentifier}`
      tags:
      - Settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserWidgetDisplayOrderUpdate.update'
      responses:
        '204':
          description: 'Success without content: HTTP 204 with an empty body. No body — also when nothing was written.'
        '401':
          description: '- Missing, invalid or expired bearer token. — When: No or invalid bearer token (captured). — Fix:
            Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '500':
          description: '- **Code 100** — Unhandled server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v2.settings.pagesettings.updateuserwidgetdisplayorder
  /v2/page-settings/{pageIdentifier}:
    get:
      operationId: pageSettingsGetAllByPageIdentifierV2
      summary: Get my preferences for a page
      description: |-
        Returns the calling user's own stored UI preferences for one page, as a key → value map.

        Per-user UI state (default view, default filter, load-data-automatically, widget order, import options, …) stored for the CALLER on the given page. Only keys the caller actually has a stored row for are returned — no defaults are filled in. A page the caller has nothing stored for, or any page number with no PageIdentifier member, returns an empty object. Never returns another user's preferences.

        **Use it to:**
        - UI restoring a page's remembered view / filter for the signed-in user

        **Not for:**
        - Tenant settings → `GET /v2/settings/frontpage-internal-message` / `GET /v2/features/{id}`
        - Front-page widget order as a list → `GET /v2/page-settings/widgets`

        **Behaviour:**
        - Idempotent.
        - Safe to retry.
        - Changes are visible to the next read immediately.

        **See also:** `GET /v2/page-settings/widgets`

        > **Not yet documented:** response → default ordering.
      tags:
      - Settings
      parameters:
      - name: pageIdentifier
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/PageIdentifier'
        description: |-
          The page: PageIdentifier member name or integer value. An unknown name → 400 Code 200 (captured: 'test'); an integer with no member binds and returns {} (captured: 12345).

          Allowed values: see `PageIdentifier`.
      responses:
        '200':
          description: |-
            The object, wrapped in the TAF envelope (`Properties`).

            Order: not yet documented.

            Empty result: 200 with Properties {} (captured for page 12345) — also when the read fails.
          content:
            application/json:
              schema:
                type: object
                description: 'TAF envelope: the object is in `Properties`. Null members are omitted; a null result is `{"Links":
                  [self]}` without `Properties`.'
                properties:
                  Properties:
                    $ref: '#/components/schemas/PageSettingsRead'
                  Links:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafLink'
                  Actions:
                    type: array
                    items:
                      $ref: '#/components/schemas/TafAction'
              examples:
                example1:
                  summary: Page number with no member
                  value:
                    Properties: {}
                    Links:
                    - Href: https://{region-node}.timelog.com/{account}/api/v2/page-settings/12345
                      Rel: self
        '400':
          description: '- **Code 200** — The request body or parameters failed input validation. — When: pageIdentifier is
            not a PageIdentifier name or an integer (captured: ''test''). — Fix: Fix every item listed in Details and resend.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: Unknown page name
                  value:
                    Code: 200
                    Details:
                    - The value 'test' is not valid for PageIdentifier.
                    Message: Invalid model state error.
                    Parameters: 'pageIdentifier: null'
                    Url: https://{region-node}.timelog.com/{account}/api/v2/page-settings/test
        '401':
          description: '- Missing, invalid or expired bearer token. — When: No or invalid bearer token (captured). — Fix:
            Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '404':
          description: '- The URL did not match any route (including a route constraint such as {id:int} receiving a non-integer).
            — When: pageIdentifier missing (captured: /v2/page-settings/).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
      x-timelog-key: rest.v2.settings.pagesettings.getallbypageidentifier
  /v2/settings/frontpage-image:
    post:
      operationId: uploadFrontPageImage
      summary: Upload an image for the front-page internal message
      description: |-
        Stores one image (JPEG, PNG, GIF, WebP, ≤ 2 MB) in the tenant's blob storage and returns a 15-minute read URL to embed in the front-page internal message.

        Used by the front-page message editor: the image is uploaded here, the returned URL is inserted into the HTML, and the HTML is then saved as the FrontPageInternalMessage setting (a separate PUT). Only users whose role has the front-page privilege may upload. Send multipart/form-data; only the FIRST part is used, and its own Content-Type header decides whether it is accepted — the bytes are not inspected. The image is stored under a new random name; nothing is ever overwritten, and nothing deletes it later.

        **Use it to:**
        - Front-page message editor inserting a picture into the administrator's notice to all users

        **Not for:**
        - Expense receipts — `POST /v1/employee-expense/{employeeExpenseID}/image` / `POST /v1/project-expense/{expenseID}/file`
        - Embedding images as data: URIs — the setting PUT refuses them (413)

        **Behaviour:**
        - Not idempotent.
        - Safe to retry. Each call stores a new blob under a new random name; a retry only leaves an unused copy behind.
        - Duplicates: Not deduplicated: the same image uploaded twice becomes two blobs.
        - Side effect: Writes the bytes to the tenant blob container (tlp-<CustomerProductId>) as FrontPageImage-<random GUID><extension of the uploaded file name>; no Content-Type is set on the blob (only .pdf blobs get one).
        - Side effect: Does NOT change the FrontPageInternalMessage setting — the caller must insert the URL into the HTML and save it.
        - On failure: 403 / 400 / 415 / 413: nothing is stored.
        - On failure: A failure while signing the URL after the write leaves an orphan blob (src_only).
        - Changes are visible to the next read immediately.

        > **Not yet documented:** behaviour → batch semantics; examples.
      tags:
      - Settings
      responses:
        '200':
          description: |-
            The body is returned without the TAF envelope. A bare object {"location": "<blob URL with a 15-minute read SAS token>"} — no TAF envelope.

            Order: none

            Empty result: none
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrontPageImageRead'
        '400':
          description: '- The multipart body has no parts. — Fix: Send one part with the image bytes.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '401':
          description: '- Missing, invalid or expired bearer token. — Fix: Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '403':
          description: '- The caller''s role lacks the area privilege AccountAndGeneralSettingFrontPageGrantPermission (29).
            Checked before the body is read. — Fix: Use a user whose role grants the front-page privilege.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '413':
          description: '- The first part is larger than 2 097 152 bytes (checked after the whole request is buffered; requests
