  /v2/settings/{settingIdentifier}:
    put:
      operationId: updateSettingValue
      summary: Change a tenant setting
      description: |-
        Sets the value of one tenant setting — any setting, for users with the front-page privilege.

        TENANT-WIDE CONFIGURATION WRITE. 200 with a JSON null body.

        **Use it to:**
        - Front-page editor saving the administrator's notice (FrontPageInternalMessage)

        **Not for:**
        - Feature flags (on/off) → `PUT /v2/features`
        - Embedding images → upload with `POST /v2/settings/frontpage-image` and reference the URL

        **Behaviour:**
        - Duplicates: Not deduplicated: the same value is written again and the events re-raised.
        - Side effect: FlexTruncationDate creates / deletes today's flex postings), invalidates the cached system configuration and runs post-invalidation work — always, even when the value is unchanged.

        **Call first:** `GET /v2/settings/frontpage-internal-message`, `POST /v2/settings/frontpage-image`

        **Next:** `GET /v2/settings/frontpage-internal-message`

        **See also:** `PUT /v1/setting`, `PUT /v2/features`

        > **Not yet documented:** behaviour → idempotent; behaviour → safe to retry; examples (success); request → body.
      tags:
      - Settings
      parameters:
      - name: settingIdentifier
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/SettingIdentifier'
        description: |-
          The setting: SettingIdentifier member name or integer value (e.g. FrontPageInternalMessage). An unknown name → 400 Code 200 (captured); an integer with no member binds and fails later with 500 (captured: 12345).

          Allowed values: see `SettingIdentifier`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingUpdateV2.update'
      responses:
        '200':
          description: 'Success without content: HTTP 200 with the literal JSON body `null`. Literal JSON `null` (TafSuccessResult).'
          content:
            application/json:
              schema:
                type: 'null'
        '400':
          description: '- **Code 200** — The request body or parameters failed input validation. — When: settingIdentifier
            is not a SettingIdentifier name (captured: ''test''). — Fix: Fix every item listed in Details and resend.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
              examples:
                example1:
                  summary: Unknown setting name
                  value:
                    Code: 200
                    Details:
                    - The value 'test' is not valid for SettingIdentifier.
                    Message: Invalid model state error.
                    Parameters: 'setting: {"Value":null}'
                    Url: https://{region-node}.timelog.com/{account}/api/v2/settings/test
        '401':
          description: '- Missing, invalid or expired bearer token. — When: No or invalid bearer token (captured). — Fix:
            Obtain a new token and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageError'
        '403':
          description: '- The caller''s role lacks the area privilege AccountAndGeneralSettingFrontPageGrantPermission. {0}
            = the caller''s initials, {1} = the privilege name. This one privilege gates writing EVERY setting through this
            route, not only the front-page message. — When: Caller''s role lacks AccountAndGeneralSettingFrontPageGrantPermission.
            — Fix: Use a user whose role grants the front-page privilege (IsEditable = true on GET /v2/settings/frontpage-internal-message).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '404':
          description: '- The URL did not match any route (including a route constraint such as {id:int} receiving a non-integer).
            — When: settingIdentifier missing (captured: /v2/settings/).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '413':
          description: '- Value contains the text "data:image" (an embedded base64 image). — When: Value contains ''data:image''
            — any setting, checked before the privilege. — Fix: Upload the image with POST /v2/settings/frontpage-image and
            reference the returned URL instead.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        '500':
          description: |-
            - **Code 100** — When: ValidateSettingForUser violations (policies incl. InsightsServiceUrl on a non-TLP product, missing page access, setting-specific rules). — Fix: Change the setting in the TimeLog UI, where the reason is shown.

            - **Code 100** — Unhandled server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
